<!DOCTYPE html>
<html lang="de">
<head>

<title>KELLERBRUT – Roguelite</title>

  #wrap{display:flex;align-items:center;justify-content:center;height:100vh}
  /* Kein image-rendering:pixelated mehr: gezeichnet wird nicht in Pixeln,
     sondern in Pfaden. Die Leinwand bekommt stattdessen so viele echte
     Bildpunkte wie der Bildschirm hergibt (siehe leinwandAnpassen), damit
     nichts hochskaliert und dadurch weich wird. */
  canvas{background:#000;display:block;
         width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16))}
</style>

<body>
<div id="wrap"><canvas id="cv" width="640" height="360"></canvas></div>
<script>
'use strict';
/* =============================================================
   KELLERBRUT — ein 2D-Twin-Stick-Roguelite
   Ein einzelnes HTML-File, Canvas 2D, 60 FPS fester Timestep.
   Alle Grafiken werden prozedural gezeichnet (eigene Pixel-Art),
   alle Namen/Items/Gegner sind Eigenkreationen.

   AUFBAU DES CODES (Suche nach "====" springt durch die Sektionen):
     1. Konfiguration & Utilities (RNG mit Seed, Mathe)
     2. Audio (WebAudio-Chiptune-Synth + Mini-Musik)
     3. Input (Tastatur + Gamepad)
     4. DATEN: Items / Pillen / Karten / Charaktere / Etagen
     5. DATEN: Gegner / Bosse / Raum-Templates
     6. Etagen-Generierung (prozedural, seedbar)
     7. Raum-Laufzeit (Türen, Spawns, Objekte)
     8. Spieler, Tränen, Strahlen, Familiars, Bomben, Pickups
     9. Gegner-KI, Boss-KI, Kollisionen
    10. Rendering (Raum, Sprites, HUD, Automap, Banner)
    11. Menüs, Screens, Savegame, Hauptschleife

   NEUE INHALTE HINZUFÜGEN:
     - Neues Item     -> Eintrag in ITEMS (Sektion 4)
     - Neuer Gegner   -> Eintrag in ENEMY_TYPES (Sektion 5)
     - Neuer Boss     -> Eintrag in BOSS_TYPES (Sektion 5)
     - Neues Raumlayout -> String in TEMPLATES (Sektion 5)
     - Neue Etage     -> Eintrag in FLOORS (Sektion 4)
   ============================================================= */

/* ==== 1. KONFIGURATION & UTILITIES ==== */
const W=640, H=360;              // Basisauflösung (wird per CSS skaliert)
const TILE=40, COLS=13, ROWS=7;  // Raumraster 13x7 Kacheln
const RX=(W-COLS*TILE)/2;        // Raum-Ursprung X (=60)
const RY=50;                     // Raum-Ursprung Y (so, dass auch die untere
                                 // Wand samt Tür noch vollständig ins Bild passt)
const cv=document.getElementById('cv');
/* Nicht const: für das Vorbacken des Raumhintergrunds wird kurzzeitig auf
   einen Nebenkontext umgeschaltet (siehe raumBildBacken). Alle Zeichen-
   helfer schreiben in ctx, deshalb genügt das Umhängen dieser einen
   Variablen — sie brauchen den Kontext nicht als Parameter. */
let ctx=cv.getContext('2d');
const HAUPTCTX=ctx;

/* --- Auflösung ------------------------------------------------------------
   Gerechnet und gezeichnet wird immer in 640x360. Die Leinwand selbst hat
   aber so viele echte Bildpunkte, wie der Bildschirm an dieser Stelle
   darstellen kann — sonst würde ein 640x360-Bild auf Full HD dreifach
   hochskaliert und alles sähe verwaschen aus. SKALA ist der Faktor dazwischen;
   die Grundtransformation des Kontexts trägt ihn, damit im ganzen Spiel
   weiterhin in 640x360 gerechnet werden kann.                              */
let SKALA=1;
function leinwandAnpassen(){
  const kasten=cv.getBoundingClientRect();
  const breite=kasten.width||W;
  const neu=clamp(Math.ceil(breite/W*(window.devicePixelRatio||1)),1,4);
  if(neu===SKALA&&cv.width===W*neu) return false;
  SKALA=neu;
  cv.width=W*SKALA; cv.height=H*SKALA;   // setzt den Kontext zurück
  ctx=HAUPTCTX;
  ctx.imageSmoothingEnabled=false;
  return true;                            // Aufrufer muss den Vorrat verwerfen
}
function grundTransform(){ ctx.setTransform(SKALA,0,0,SKALA,0,0); }
ctx.imageSmoothingEnabled=false;

const MAX_HERZEN=12;              // mehr rote Herzcontainer gibt es nicht
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const ang=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);
const TAU=Math.PI*2;

// Kachel <-> Pixel
const tx=c=>RX+c*TILE+TILE/2;      // Kachelspalte -> Pixelmitte
const ty=r=>RY+r*TILE+TILE/2;
const pc=x=>Math.floor((x-RX)/TILE); // Pixel -> Spalte
const pr=y=>Math.floor((y-RY)/TILE);

/* Seeded RNG (mulberry32). gleicher Seed => gleiche Etagen.
   G.rng  = deterministisch (Weltgenerierung)
   frand  = nicht-deterministisch (Effekte, Kampf-Zufall)      */
function RNG(seed){
  let s=seed>>>0;
  const f=()=>{ s|=0; s=(s+0x6D2B79F5)|0;
    let t=Math.imul(s^(s>>>15),1|s);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296; };
  f.int=(n)=>Math.floor(f()*n);
  f.range=(a,b)=>a+f()*(b-a);
  f.pick=(arr)=>arr[Math.floor(f()*arr.length)];
  f.chance=(p)=>f()<p;
  return f;
}
function hashSeed(str){ // Seed-String -> Zahl
  let h=1779033703; for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=(h<<13)|(h>>>19);}
  return h>>>0;
}
function seedToStr(n){ // Zahl -> anzeigbarer Seed-Code
  const A='ABCDEFGHJKLMNPQRSTVWXYZ123456789'; let s=''; n=n>>>0;
  for(let i=0;i<7;i++){s+=A[n%A.length]; n=Math.floor(n/A.length);}
  return s;
}
const frand=RNG((Math.random()*4294967296)>>>0); // "echter" Zufall

/* ==== 2. AUDIO — Chiptune-Synth via WebAudio ==== */
const Sfx=(()=>{
  let ac=null, master=null, musGain=null, muted=false;
  function init(){ if(ac) return;
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain(); master.gain.value=0.35; master.connect(ac.destination);
    musGain=ac.createGain(); musGain.gain.value=0.16; musGain.connect(master);
  }
  // Grundbaustein: Oszillator mit Frequenz-/Lautstärke-Hüllkurve
  function tone(type,f0,f1,dur,vol=0.5,delay=0){
    if(!ac||muted) return;
    const t=ac.currentTime+delay;
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);
  }
  function noise(dur,vol=0.4,fc=1200,delay=0){ // Rausch-Baustein (Explosion/Treffer)
    if(!ac||muted) return;
    const t=ac.currentTime+delay, n=ac.sampleRate*dur;
    const buf=ac.createBuffer(1,n,ac.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=ac.createBufferSource(); src.buffer=buf;
    const flt=ac.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value=fc;
    const g=ac.createGain(); g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    src.connect(flt); flt.connect(g); g.connect(master); src.start(t);
  }
  const S={
    init, toggleMute(){muted=!muted; return muted;}, get muted(){return muted;},
    /* Lautstärke in Zehnteln, damit sie sich mit den Pfeiltasten einstellen
       und als ganze Zahl im Spielstand ablegen lässt. */
    setzeLautstaerke(ton,musik){
      if(!ac) return;
      if(ton!==undefined)   master.gain.value=clamp(ton,0,10)/10*0.7;
      if(musik!==undefined) musGain.gain.value=clamp(musik,0,10)/10*0.32;
    },
    shoot(){tone('square',720,320,0.07,0.12);},
    laser(){tone('sawtooth',1200,180,0.18,0.2);},
    beam(){tone('sawtooth',90,70,0.12,0.22);},
    hit(){noise(0.05,0.18,2500);},
    hurt(){tone('square',200,70,0.25,0.5); noise(0.15,0.3,900);},
    edeath(){noise(0.18,0.3,1400); tone('triangle',300,60,0.2,0.3);},
    pickup(){tone('square',660,990,0.09,0.25); tone('square',990,1320,0.09,0.2,0.07);},
    coin(){tone('square',1046,1568,0.08,0.22);},
    key(){tone('triangle',1200,1600,0.1,0.25);},
    heart(){tone('sine',523,784,0.15,0.3);},
    bombset(){tone('square',300,200,0.08,0.25);},
    boom(){noise(0.5,0.8,700); tone('sine',120,30,0.4,0.6);},
    door(){tone('triangle',150,90,0.25,0.35);},
    doorOpen(){tone('triangle',90,150,0.25,0.35);},
    item(){[523,659,784,1046].forEach((f,i)=>tone('square',f,f,0.16,0.22,i*0.09));},
    active(){tone('sawtooth',400,900,0.2,0.25);},
    pill(){tone('sine',400,700,0.15,0.3); tone('sine',700,500,0.15,0.25,0.1);},
    bossroar(){tone('sawtooth',110,40,0.7,0.6); noise(0.6,0.4,500);},
    stairs(){[400,300,220,160].forEach((f,i)=>tone('triangle',f,f*0.8,0.14,0.3,i*0.1));},
    charge(){tone('sine',300,1200,0.4,0.15);},
    error(){tone('square',180,120,0.14,0.3);},
    splash(){noise(0.1,0.2,600);},
    tick(){tone('square',880,880,0.03,0.12);},
  };
  /* Mini-Musik: pro Etage eine kleine Bass-/Melodie-Schleife.
     Notenwerte in Halbtönen relativ zu A2 (110 Hz), -1 = Pause. */
  const PATTERNS=[
    {bpm:96, bass:[0,-1,0,-1,3,-1,0,-1,5,-1,5,-1,3,-1,2,-1], mel:[12,-1,15,-1,-1,12,-1,10,12,-1,15,17,-1,-1,15,-1]},
    {bpm:104,bass:[0,0,-1,0,-3,-1,-3,-1,-5,-1,-5,-1,-3,-1,0,-1], mel:[7,-1,-1,10,-1,7,-1,5,3,-1,-1,5,-1,7,-1,-1]},
    {bpm:112,bass:[0,-1,7,-1,0,-1,7,-1,-2,-1,5,-1,-2,-1,5,-1], mel:[12,10,-1,12,-1,-1,15,-1,10,8,-1,10,-1,-1,12,-1]},
    {bpm:90, bass:[0,-1,-1,-1,-4,-1,-1,-1,-5,-1,-1,-1,-7,-1,-2,-1], mel:[5,-1,3,-1,0,-1,3,-1,5,-1,7,-1,8,-1,7,-1]},
  ];
  let musTimer=0, musStep=0, musPat=0, musOn=true;
  S.setPattern=(i)=>{musPat=i%PATTERNS.length; musStep=0; musTimer=0;};
  S.toggleMusic=()=>{musOn=!musOn; return musOn;};
  S.updateMusic=(dt,active)=>{ // wird aus der Hauptschleife getickt
    if(!ac||muted||!musOn||!active) return;
    const P=PATTERNS[musPat], stepDur=60/P.bpm/4;
    musTimer+=dt;
    while(musTimer>=stepDur){
      musTimer-=stepDur;
      const b=P.bass[musStep], m=P.mel[musStep];
      if(b>=-24&&b!==-1){const f=110*Math.pow(2,b/12);
        const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';
        o.frequency.value=f;g.gain.setValueAtTime(0.5,ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+stepDur*0.9);
        o.connect(g);g.connect(musGain);o.start();o.stop(ac.currentTime+stepDur);}
      if(m!==-1&&musStep%1===0){const f=220*Math.pow(2,m/12);
        const o=ac.createOscillator(),g=ac.createGain();o.type='square';
        o.frequency.value=f;g.gain.setValueAtTime(0.14,ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+stepDur*0.8);
        o.connect(g);g.connect(musGain);o.start();o.stop(ac.currentTime+stepDur);}
      musStep=(musStep+1)%16;
    }
  };
  return S;
})();

/* ==== 3. INPUT — Tastatur + Gamepad ==== */
const Input=(()=>{
  const down={}, pressed={};
  let typing=null; // Seed-Eingabe-Modus
  addEventListener('keydown',e=>{
    // Der Browser erlaubt Audio erst nach einer Eingabe. Danach müssen die
    // gespeicherten Lautstärken einmal nachgezogen werden.
    Sfx.init(); if(typeof einstellungenAnwenden==='function') einstellungenAnwenden();
    if(typing){ typing(e); e.preventDefault(); return; }
    if(!down[e.code]) pressed[e.code]=true;
    down[e.code]=true;
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyW','KeyA','KeyS','KeyD'].includes(e.code)) e.preventDefault();
  });
  addEventListener('keyup',e=>{down[e.code]=false;});
  addEventListener('blur',()=>{for(const k in down) down[k]=false;});

  let padMove={x:0,y:0}, padShoot={x:0,y:0}, padPrev=[], padBtn=[];
  function pollPad(){
    padMove.x=padMove.y=padShoot.x=padShoot.y=0;
    const gp=(navigator.getGamepads&&navigator.getGamepads()[0])||null;
    padPrev=padBtn; padBtn=[];
    if(!gp) return;
    const dz=v=>Math.abs(v)>0.3?v:0;
    padMove.x=dz(gp.axes[0]||0); padMove.y=dz(gp.axes[1]||0);
    padShoot.x=dz(gp.axes[2]||0); padShoot.y=dz(gp.axes[3]||0);
    gp.buttons.forEach((b,i)=>padBtn[i]=b.pressed);
    // D-Pad als Bewegung
    if(padBtn[12]) padMove.y=-1; if(padBtn[13]) padMove.y=1;
    if(padBtn[14]) padMove.x=-1; if(padBtn[15]) padMove.x=1;
  }
  const padHit=i=>padBtn[i]&&!padPrev[i];
  return {
    down, // roher Zustand
    pollPad,
    setTyping(fn){typing=fn;},
    // Bewegungsvektor (WASD oder linker Stick)
    move(){
      let x=(down.KeyD?1:0)-(down.KeyA?1:0), y=(down.KeyS?1:0)-(down.KeyW?1:0);
      if(x===0&&y===0){x=padMove.x;y=padMove.y;}
      const l=Math.hypot(x,y); if(l>1){x/=l;y/=l;}
      return {x,y};
    },
    // Schussrichtung (Pfeile 4/8-Richtungen oder rechter Stick)
    aim(){
      let x=(down.ArrowRight?1:0)-(down.ArrowLeft?1:0), y=(down.ArrowDown?1:0)-(down.ArrowUp?1:0);
      if(x===0&&y===0){x=padShoot.x;y=padShoot.y;}
      if(x===0&&y===0) return null;
      const l=Math.hypot(x,y); return {x:x/l,y:y/l};
    },
    hit(code){ if(pressed[code]){pressed[code]=false; return true;} return false; },
    /* Nur für die automatischen Tests: einen Tastendruck vortäuschen, ohne
       ein echtes Tastaturereignis zu brauchen. */
    press(code){ pressed[code]=true; },
    peek(code){ return !!pressed[code]; },
    clear(){ for(const k in pressed) pressed[k]=false; },
    bomb(){ return this.hit('Space')||padHit(0); },
    useActive(){ return this.hit('KeyE')||padHit(1); },
    usePocket(){ return this.hit('KeyQ')||padHit(2); },
    pause(){ return this.hit('Escape')||this.hit('KeyP')||padHit(9); },
    confirm(){ return this.hit('Enter')||this.hit('Space')||padHit(0); },
  };
})();

/* ==== 6. ETAGEN-GENERIERUNG (prozedural, deterministisch per Seed) ==== */
let G={}; // globaler Spielzustand — befüllt in startRun()

const DIRS={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
const OPP={u:'d',d:'u',l:'r',r:'l'};
const roomKey=(x,y)=>x+','+y;

// Türposition (Pixelmitte) je Richtung
function doorXY(dir){
  if(dir==='u') return {x:RX+COLS*TILE/2, y:RY-12};
  if(dir==='d') return {x:RX+COLS*TILE/2, y:RY+ROWS*TILE+12};
  if(dir==='l') return {x:RX-12, y:RY+ROWS*TILE/2};
  return {x:RX+COLS*TILE+12, y:RY+ROWS*TILE/2};
}

function genFloor(depth){
  const rng=RNG((G.seedNum ^ Math.imul(depth+1,2654435761))>>>0);
  /* Der Fluch fällt als Erstes, weil das Labyrinth die Raumzahl mitbestimmt.
     Etage 1 bleibt immer ungeflucht — der Einstieg soll sauber sein. */
  let fluch=null;
  if(depth>=2&&rng.chance(0.16+depth*0.035)) fluch=rng.pick(FLUECHE).id;
  const cells={}; cells['0,0']=true; const list=['0,0'];
  const target=Math.round((8+depth*2+rng.int(3))*(fluch==='labyrinth'?1.8:1));
  let tries=0;
  const nbCount=(x,y)=>['u','d','l','r'].reduce((n,d)=>n+(cells[roomKey(x+DIRS[d][0],y+DIRS[d][1])]?1:0),0);
  while(list.length<target&&tries++<600){
    const k=rng.pick(list), [x,y]=k.split(',').map(Number);
    const d=rng.pick(['u','d','l','r']);
    const nx=x+DIRS[d][0], ny=y+DIRS[d][1], nk=roomKey(nx,ny);
    if(Math.abs(nx)>4||Math.abs(ny)>3||cells[nk]) continue;
    if(nbCount(nx,ny)>1&&rng.chance(0.75)) continue; // meist baumartig
    cells[nk]=true; list.push(nk);
  }
  // Distanzen vom Start (BFS)
  const distMap={'0,0':0}; const q=['0,0'];
  while(q.length){const k=q.shift(),[x,y]=k.split(',').map(Number);
    for(const d in DIRS){const nk=roomKey(x+DIRS[d][0],y+DIRS[d][1]);
      if(cells[nk]&&distMap[nk]===undefined){distMap[nk]=distMap[k]+1;q.push(nk);}}}
  // Sackgassen finden (genau 1 Nachbar, nicht Start)
  let deadends=list.filter(k=>{const [x,y]=k.split(',').map(Number);
    return k!=='0,0'&&nbCount(x,y)===1;}).sort((a,b)=>distMap[b]-distMap[a]);
  // Notfalls neue Sackgasse anbauen
  const growDeadend=()=>{
    for(const k of list){const [x,y]=k.split(',').map(Number);
      for(const d of ['u','d','l','r']){
        const nx=x+DIRS[d][0],ny=y+DIRS[d][1],nk=roomKey(nx,ny);
        if(Math.abs(nx)>5||Math.abs(ny)>4||cells[nk]) continue;
        if(nbCount(nx,ny)!==1) continue;
        cells[nk]=true;list.push(nk);distMap[nk]=(distMap[k]||0)+1;return nk;}}
    return null;};
  const types={'0,0':'start'};
  const takeDeadend=()=>deadends.shift()||growDeadend();
  const bossK=takeDeadend(); if(bossK) types[bossK]='boss';
  const treasK=takeDeadend(); if(treasK) types[treasK]='treasure';
  const shopK=takeDeadend(); if(shopK) types[shopK]='shop';
  if(rng.chance(0.6)){const k=deadends.shift(); if(k) types[k]='curse';}
  if(rng.chance(0.4)){const k=deadends.shift(); if(k) types[k]='sacrifice';}
  if(depth>=2&&rng.chance(0.4)){const k=deadends.shift(); if(k) types[k]='arcade';}
  /* Herausforderungsraum und Bibliothek: beide in Sackgassen, beide erst ab
     Etage 2 — auf Etage 1 hat man weder die Ausrüstung noch die Übersicht. */
  if(depth>=2&&rng.chance(0.35)){const k=deadends.shift(); if(k) types[k]='arena';}
  if(depth>=2&&rng.chance(0.32)){const k=deadends.shift(); if(k) types[k]='library';}
  /* Wer das Labyrinth aushält, findet einen zweiten Schatzraum darin. */
  if(fluch==='labyrinth'){const k=deadends.shift(); if(k) types[k]='treasure';}
  /* Teufelskammer: hängt als Sackgasse am Bossraum und wird immer mitgebaut,
     damit der Platz garantiert frei ist. Ob sie sich öffnet, entscheidet erst
     der Bosskampf — bis dahin ist ihre Tür unsichtbar. Sie darf nur den
     Bossraum berühren, sonst entstünde eine Abkürzung um den Boss herum. */
  if(bossK){
    const [bx,by]=bossK.split(',').map(Number), richtungen=['u','d','l','r'];
    const start=rng.int(4);
    for(let i=0;i<4;i++){
      const d=richtungen[(start+i)%4];
      const nx=bx+DIRS[d][0], ny=by+DIRS[d][1], nk=roomKey(nx,ny);
      if(Math.abs(nx)>5||Math.abs(ny)>4||cells[nk]) continue;
      let n=0; for(const dd in DIRS) if(cells[roomKey(nx+DIRS[dd][0],ny+DIRS[dd][1])]) n++;
      if(n!==1) continue;
      cells[nk]=true; list.push(nk); types[nk]='devil'; distMap[nk]=99;
      break;
    }
  }

  // Geheimraum: leere Zelle mit möglichst vielen Raum-Nachbarn
  let best=null,bestN=0;
  for(let x=-5;x<=5;x++)for(let y=-4;y<=4;y++){
    const k=roomKey(x,y); if(cells[k]) continue;
    let n=0,touchesBoss=false;
    for(const d in DIRS){const nk=roomKey(x+DIRS[d][0],y+DIRS[d][1]);
      /* Weder Bossraum noch Teufelskammer dürfen einen Geheimgang bekommen:
         der wäre eine Abkürzung an genau dem Kampf vorbei, der beide
         überhaupt erst freischaltet. */
      if(cells[nk]){n++; if(types[nk]==='boss'||types[nk]==='devil')touchesBoss=true;}}
    if(n>=2&&!touchesBoss&&n>bestN){bestN=n;best=k;}}
  if(!best){ // Fallback: irgendeine Zelle mit 1 Nachbarn, aber nicht am Boss
    for(let x=-5;x<=5&&!best;x++)for(let y=-4;y<=4&&!best;y++){
      const k=roomKey(x,y); if(cells[k]||nbCount(x,y)<1) continue;
      let verboten=false;
      for(const d in DIRS){const nk=roomKey(x+DIRS[d][0],y+DIRS[d][1]);
        if(cells[nk]&&(types[nk]==='boss'||types[nk]==='devil')) verboten=true;}
      if(!verboten) best=k;}}
  if(best){cells[best]=true;list.push(best);types[best]='secret';distMap[best]=99;}

  // Räume bauen
  const rooms={}, doors={};
  const edgeKey=(x,y,d)=>{const nx=x+DIRS[d][0],ny=y+DIRS[d][1];
    return (d==='u'||d==='d')?`${x},${Math.min(y,ny)}v`:`${Math.min(x,nx)},${y}h`;};
  for(const k of list){
    const [x,y]=k.split(',').map(Number);
    const type=types[k]||'normal';
    rooms[k]=buildRoom(x,y,type,depth,rng);
  }
  // Türen als geteilte Objekte je Kante
  for(const k of list){
    const [x,y]=k.split(',').map(Number); const room=rooms[k];
    for(const d in DIRS){
      const nk=roomKey(x+DIRS[d][0],y+DIRS[d][1]);
      if(!cells[nk]) continue;
      const ek=edgeKey(x,y,d);
      if(!doors[ek]){
        const a=types[k]||'normal', b=types[nk]||'normal';
        let kind='normal', locked=false;
        if(a==='secret'||b==='secret'){kind='secret';}
        /* Die Kammer hinter dem Boss: Art und Sichtbarkeit entscheiden sich
           erst, wenn der Boss fällt (siehe kammerOeffnen). */
        else if(a==='devil'||b==='devil'){kind='devil';}
        else if(a==='boss'||b==='boss'){kind='boss';}
        /* Shop und Schatzraum bekommen eigene Türarten, damit man sie von
           außen auseinanderhält. Schatzräume sind nur zu etwa der Hälfte
           verschlossen — die anderen stehen offen, damit man nie ganz ohne
           Schatz dasteht, bloß weil kein Schlüssel gefallen ist. */
        else if(a==='shop'||b==='shop'){kind='shop';locked=true;}
        else if(a==='treasure'||b==='treasure'){kind='schatz';locked=rng.chance(0.55);}
        else if(a==='curse'||b==='curse'){kind='curse';}
        else if(a==='arena'||b==='arena'){kind='arena';}
        else if(a==='library'||b==='library'){kind='bibliothek';}
        doors[ek]={kind,locked,revealed:kind!=='secret'&&kind!=='devil'};
      }
      room.doors[d]={to:nk,edge:doors[ek]};
    }
  }
  const floor={depth,rooms,doors,startKey:'0,0',bossKey:bossK,fluch,
               data:FLOORS[Math.min(depth-1,FLOORS.length-1)]};
  platziereSchluessel(floor,rng);
  platziereMuenzen(floor,rng);
  return floor;
}

/* Garantierte Schlüssel: 1–2 pro Etage, damit man nie ohne Schatzraum
   dasteht. Sie dürfen nur in Räumen liegen, die man OHNE Schlüssel und
   OHNE Bombe erreicht — sonst bräuchte man einen Schlüssel, um an den
   Schlüssel zu kommen. Verschlossene und geheime Türen bleiben bei der
   Erreichbarkeitssuche deshalb außen vor. */
function ohneSchluesselErreichbar(floor){
  const erreichbar=new Set([floor.startKey]), q=[floor.startKey];
  while(q.length){
    const k=q.shift();
    for(const d in floor.rooms[k].doors){
      const tuer=floor.rooms[k].doors[d];
      if(tuer.edge.locked||tuer.edge.kind==='secret') continue;
      if(!tuer.edge.revealed) continue;      // verborgene Kammer zählt nicht
      if(!erreichbar.has(tuer.to)){ erreichbar.add(tuer.to); q.push(tuer.to); }
    }
  }
  return erreichbar;
}

function platziereSchluessel(floor,rng){
  const erreichbar=ohneSchluesselErreichbar(floor);
  // Normale Räume bevorzugen; der Bossraum scheidet aus, dort nützt der
  // Schlüssel nichts mehr. Notfalls landet er im Startraum.
  let kandidaten=[...erreichbar].filter(k=>floor.rooms[k].type==='normal');
  if(!kandidaten.length) kandidaten=[...erreichbar].filter(k=>floor.rooms[k].type==='start');
  for(let i=kandidaten.length-1;i>0;i--){const j=rng.int(i+1);
    [kandidaten[i],kandidaten[j]]=[kandidaten[j],kandidaten[i]];}

  const anzahl=Math.min(kandidaten.length,1+rng.int(2));
  for(let i=0;i<anzahl;i++){
    const room=floor.rooms[kandidaten[i]];
    const platz=freierBodenplatz(room,rng);
    // garantiert:true kennzeichnet die Etagen-Schlüssel gegenüber Shop-Ware
    // und Zufallsbeute — der Smoke-Test prüft gezielt diese hier.
    room.drops.push({x:platz.x,y:platz.y,type:'key',garantiert:true});
  }
}

/* Garantierter Münzfund: eine Handvoll Geld je Etage, damit man vor dem
   Laden nicht mit leeren Taschen steht. Ohne ihn kommen auf Etage 1 im
   Schnitt fünf Münzen zusammen — der Artikel auf dem Podest kostet fünfzehn.
   Wie die Schlüssel liegt er nur in Räumen, die man ohne Schlüssel und ohne
   Bombe erreicht, und nie im Bossraum. */
function platziereMuenzen(floor,rng){
  /* Nicht auf jeder Etage. Die ersten beiden bekommen ihn immer — dort ist
     die Not am größten —, danach etwa jede zweite. */
  if(floor.depth>2&&!rng.chance(0.45)) return;
  const erreichbar=ohneSchluesselErreichbar(floor);
  let kandidaten=[...erreichbar].filter(k=>floor.rooms[k].type==='normal');
  if(!kandidaten.length) kandidaten=[...erreichbar].filter(k=>floor.rooms[k].type==='start');
  if(!kandidaten.length) return;
  const room=floor.rooms[rng.pick(kandidaten)];
  const platz=freierBodenplatz(room,rng);
  room.drops.push({x:platz.x,y:platz.y,type:'bigcoin',muenzfund:true});
  /* Manchmal noch eine einzelne Münze daneben — ein Häufchen liest sich
     freundlicher als eine einzelne große Münze. */
  const dazu=rng.int(2);
  for(let i=0;i<dazu;i++){
    const q=freierBodenplatz(room,rng);
    room.drops.push({x:q.x,y:q.y,type:'coin',muenzfund:true});
  }
}

/* Freies Bodenfeld suchen. Es genügt nicht, dass die Kachel selbst leer ist —
   sie muss auch vom Raumeingang aus zu Fuß erreichbar sein, sonst liegt der
   Schlüssel womöglich in einer von Steinen umschlossenen Nische. Deshalb wird
   von den Türen (und der Raummitte) aus geflutet. */
function freierBodenplatz(room,rng){
  const gesehen=randVerbundeneFelder(room);
  const plaetze=[];
  for(let r=1;r<ROWS-1;r++) for(let c=1;c<COLS-1;c++)
    if(!room.grid[r][c]&&gesehen[r][c]) plaetze.push({x:tx(c),y:ty(r)});
  return plaetze.length?rng.pick(plaetze):{x:tx(6),y:ty(3)};
}

/* Raumobjekt erzeugen: Template auflösen, Spawns & Inhalte festlegen */
function buildRoom(gx,gy,type,depth,rng){
  const room={gx,gy,type,doors:{},cleared:false,visited:false,seen:false,
    grid:Array.from({length:ROWS},()=>Array(COLS).fill(null)),
    spawns:[],drops:[],pedestals:[],machines:[],trapdoor:false,bossId:null,
    sacrificeCount:0};
  const clearedByDefault=['start','treasure','shop','secret','curse','sacrifice',
                          'arcade','devil','angel','arena','library'];
  if(clearedByDefault.includes(type)) room.cleared=true;

  let tmpl=null;
  if(type==='normal') tmpl=rng.pick(TEMPLATES.normal);
  if(type==='boss')   tmpl=rng.pick(TEMPLATES.boss);
  const spawnPts=[];
  if(tmpl) for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const ch=tmpl[r][c];
    if(ch==='R') room.grid[r][c]={t:'rock'};
    else if(ch==='r'){if(rng.chance(0.5))room.grid[r][c]={t:'rock'};}
    else if(ch==='P') room.grid[r][c]={t:'pit'};
    else if(ch==='S') room.grid[r][c]={t:'spike'};
    else if(ch==='F') room.grid[r][c]={t:'fire',hp:4,red:depth>=3&&rng.chance(0.3)};
    else if(ch==='C') room.grid[r][c]={t:'poop',hp:3};
    else if(ch==='e') spawnPts.push({x:tx(c),y:ty(r)});
  }
  if(type==='normal'){
    const n=Math.min(spawnPts.length,2+Math.ceil(depth*0.8)+rng.int(3));
    const pts=spawnPts.slice(); // mischen
    for(let i=pts.length-1;i>0;i--){const j=rng.int(i+1);[pts[i],pts[j]]=[pts[j],pts[i]];}
    const pool=FLOORS[Math.min(depth-1,FLOORS.length-1)].pool;
    for(let i=0;i<n;i++){
      const t=rng.pick(pool);
      let champ=null;
      if(!ENEMY_TYPES[t].noChamp&&rng.chance(0.08+depth*0.015))
        champ=rng.pick([{tint:'#ff5a5a',hpMul:1.7},{tint:'#5aa8ff',spdMul:1.4},{tint:'#ffd75a',gold:true}]);
      room.spawns.push({x:pts[i].x,y:pts[i].y,type:t,champ});
    }
  }
  if(type==='boss'){
    const bosses=FLOORS[Math.min(depth-1,FLOORS.length-1)].bosses;
    room.bossId=rng.pick(bosses);
  }
  if(type==='treasure'){
    room.pedestals.push({x:tx(6),y:ty(3),itemId:pickFromPool('treasure',rng)});
    if(rng.chance(0.2)) room.drops.push({x:tx(9),y:ty(3),type:'goldchest'});
  }
  if(type==='shop'){
    room.pedestals.push({x:tx(6),y:ty(2),itemId:pickFromPool('shop',rng),price:15});
    const wares=['heart','bomb','key','soulheart','pill','card'];
    const prices={heart:3,bomb:5,key:5,soulheart:8,pill:4,card:4};
    const w1=rng.pick(wares),w2=rng.pick(wares);
    room.drops.push({x:tx(4),y:ty(4),type:w1,price:prices[w1]});
    room.drops.push({x:tx(8),y:ty(4),type:w2,price:prices[w2]});
  }
  if(type==='secret'){
    const opts=['coin','coin','bomb','key','heart','soulheart','pill','card'];
    const n=2+rng.int(2);
    for(let i=0;i<n;i++) room.drops.push({x:tx(5+i*2),y:ty(3),type:rng.pick(opts)});
    if(rng.chance(0.2)) room.pedestals.push({x:tx(6),y:ty(1),itemId:pickFromPool('secret',rng)});
  }
  if(type==='curse'){
    room.drops.push({x:tx(6),y:ty(3),type:'redchest'});
    if(rng.chance(0.5)) room.drops.push({x:tx(4),y:ty(3),type:'blackheart'});
  }
  if(type==='sacrifice'){
    room.grid[3][6]={t:'spike'};
  }
  if(type==='arcade'){
    room.machines.push({x:tx(4),y:ty(2),kind:'slot',broken:false,cd:0});
    room.machines.push({x:tx(8),y:ty(2),kind:'orakel',broken:false,cd:0});
    room.drops.push({x:tx(6),y:ty(5),type:'coin'});
  }
  /* Herausforderungsraum: eine Druckplatte in der Mitte, ringsum frei. Wer
     darauftritt, schließt die Türen hinter sich und ficht drei Wellen aus;
     der Lohn steht schon fest, damit er nach dem Kampf verlässlich da ist. */
  if(type==='arena'){
    room.platte={x:tx(6),y:ty(3)};
    room.wellen=3;
    room.arenaFertig=false;
    room.lohn=pickFromPool('treasure',rng);
    for(const [c,r] of [[2,1],[10,1],[2,5],[10,5]]) room.grid[r][c]={t:'rock'};
  }
  /* Bibliothek: drei Fundstücke auf Pulten, nehmen darf man genau eines.
     Das Feld `wahl` markiert sie; collectPickup räumt die anderen weg. */
  if(type==='library'){
    for(let i=0;i<3;i++)
      room.drops.push({x:tx(4+i*2),y:ty(3),
                       type:rng.chance(0.5)?'card':'pill',wahl:true});
  }
  return room;
}

/* Item aus Pool ziehen — pro Run keine Doppel (solange möglich) */
function pickFromPool(pool,rngf){
  const r=rngf||frand;
  let cand=POOLS[pool].filter(id=>!G.itemsSeen.has(id));
  if(!cand.length) cand=POOLS[pool];
  const id=r.pick(cand);
  G.itemsSeen.add(id);
  return id;
}

/* ==== 7. RAUM-LAUFZEIT: Betreten/Verlassen, Türen, Reroll, Teleport ==== */
function enterRoom(key,fromDir){
  // fromDir = Richtung der Tür, durch die wir REINkommen (Seite des neuen Raums)
  const room=G.floor.rooms[key];
  saveRoomState();
  if(G.roomKey) laufSpeichern();      // Zwischenstand bei jedem Raumwechsel
  G.roomKey=key; G.room=room;
  room.visited=true; room.seen=true;
  if(room.type==='secret') unlock('geheim');
  for(const d in room.doors){const nb=G.floor.rooms[room.doors[d].to];
    if(room.doors[d].edge.revealed) nb.seen=true;}
  // Entities zurücksetzen
  G.tears=[];G.eshots=[];G.enemies=[];G.bombs=[];G.pickups=[];G.fx=[];
  G.beams=[];G.creeps=[];G.texts=[];G.lasers=[];G.einschlaege=[];
  const p=G.player;
  p.roomDmgBonus=0; recomputeStats();
  // Spieler platzieren
  if(fromDir){
    const dp=doorXY(fromDir);
    const inX={u:0,d:0,l:34,r:-34}[fromDir], inY={u:34,d:-34,l:0,r:0}[fromDir];
    p.x=dp.x+inX; p.y=dp.y+inY;
  } else { const lp=teleportLandeplatz(room); p.x=lp.x; p.y=lp.y; }
  p.vx=p.vy=0;
  // Persistente Pickups & Podeste laden
  for(const d of room.drops) G.pickups.push({...d});
  // Gegner spawnen, falls Raum nicht geschafft
  if(!room.cleared){
    if(room.type==='boss'&&room.bossId){ spawnBoss(room.bossId); }
    else for(const s of room.spawns) spawnEnemy(s.type,s.x,s.y,s.champ);
  }
  /* Würfel und Reroll-Stein greifen beim Betreten: der eine würfelt die
     Fundstücke neu, der andere die Items auf den Podesten. */
  if(p.flags.has('wuerfel')){
    const sorten=['coin','bomb','key','heart','soulheart','pill','card'];
    for(const q of G.pickups) if(!q.price&&!q.type.includes('chest')) q.type=frand.pick(sorten);
  }
  if(p.flags.has('reroll')){
    for(const pd of room.pedestals) if(!pd.taken&&!pd.price){
      pd.itemId=pickFromPool(room.type==='shop'?'shop':(room.type==='boss'?'boss':'treasure'));
    }
  }
  /* Herausforderungsraum: Zustand zurücksetzen. Ein bereits bestandener
     Raum bleibt bestanden, seine Platte ist dann nur noch Bodenschmuck. */
  G.arena=(room.type==='arena'&&!room.arenaFertig)
    ? {laeuft:false,welle:0,max:room.wellen||3,pause:0} : null;
  spawnFamiliars();
  G.roomFresh=0.5; // kurze Schonfrist beim Betreten
  updateDoorsOpen(true);
  // Türen stehen beim Betreten sofort richtig, sie schwingen nicht erst auf
  for(const d in room.doors) room.doors[d].anim=doorPassable(room.doors[d])?1:0;
}

/* Landeplatz beim Teleport (Karten, Raumfalter, rote Truhe). Die Raummitte
   kann von Steinen völlig umschlossen sein — wer dort abgesetzt wird, säße
   ohne Bombe fest und der Run wäre verloren. Gewählt wird deshalb das der
   Mitte nächstgelegene Feld, das mit dem Raumrand und damit mit den Türen
   verbunden ist. */
/* Alle Felder, die zu Fuß mit dem Raumrand verbunden sind — und damit mit
   den Türen, denn der Rand ist in allen Layouts frei. Wichtig: die Suche darf
   NICHT in der Raummitte starten. Manche Layouts umschließen die Mitte mit
   Steinen; sie ist dann zwar frei, aber von außen unerreichbar. */
function randVerbundeneFelder(room){
  const blockiert=(r,c)=>{ const z=room.grid[r][c];
    return !!z&&(z.t==='rock'||z.t==='poop'||z.t==='fire'||z.t==='pit'); };
  const gesehen=Array.from({length:ROWS},()=>Array(COLS).fill(false));
  const q=[];
  const saat=(r,c)=>{ if(!blockiert(r,c)&&!gesehen[r][c]){gesehen[r][c]=true;q.push([r,c]);} };
  for(let c=0;c<COLS;c++){ saat(0,c); saat(ROWS-1,c); }
  for(let r=0;r<ROWS;r++){ saat(r,0); saat(r,COLS-1); }
  while(q.length){
    const [r,c]=q.shift();
    for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nr=r+dr, nc=c+dc;
      if(nr<0||nr>=ROWS||nc<0||nc>=COLS||gesehen[nr][nc]||blockiert(nr,nc)) continue;
      gesehen[nr][nc]=true; q.push([nr,nc]);
    }
  }
  return gesehen;
}

function teleportLandeplatz(room){
  const mr=(ROWS-1)>>1, mc=(COLS-1)>>1;
  const gesehen=randVerbundeneFelder(room);
  let best=null, bestD=Infinity;
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if(!gesehen[r][c]) continue;
    const d=(r-mr)*(r-mr)+(c-mc)*(c-mc);
    if(d<bestD){ bestD=d; best={r,c}; }
  }
  return best?{x:tx(best.c),y:ty(best.r)}:{x:tx(mc),y:ty(mr)};
}

function saveRoomState(){
  const room=G.room; if(!room) return;
  // Pickups (ohne aufgehobene) zurückschreiben. pillId/cardId müssen mit,
  // sonst wird eine abgelegte Pille beim Wiederbetreten zu einer anderen.
  room.drops=G.pickups.filter(q=>!q.dead).map(q=>({x:q.x,y:q.y,type:q.type,
    price:q.price,pillId:q.pillId,cardId:q.cardId,itemId:q.itemId,
    garantiert:q.garantiert,muenzfund:q.muenzfund,wahl:q.wahl}));
}

/* Solange die Arena läuft, gilt der Raum nicht als geschafft — die Türen
   bleiben also zu, bis die letzte Welle liegt. */
function roomIsClear(){
  if(G.arena&&G.arena.laeuft) return false;
  return G.enemies.length===0;
}

/* --- HERAUSFORDERUNGSRAUM -------------------------------------------------
   Wer die Platte betritt, schließt die Türen hinter sich und ficht drei
   Wellen aus. Jede Welle ist größer als die vorige, die letzte bringt einen
   Champion mit. Danach fährt der Lohn aus dem Boden: das vorher festgelegte
   Item und eine Goldtruhe.                                              */
function updateArena(dt){
  const a=G.arena; if(!a) return;
  const room=G.room, p=G.player;
  if(!a.laeuft){
    if(room.platte&&dist(p,room.platte)<15){
      a.laeuft=true; a.welle=0; a.pause=0.8;
      room.cleared=false;
      G.banner={title:'Herausforderung',desc:'Drei Wellen — dann gehört dir der Lohn',t:2.4};
      G.shake=Math.max(G.shake,6); Sfx.doorOpen(); Sfx.bossroar();
      schockwelle(room.platte.x,room.platte.y,70,'#c8823a',0.6,4);
    }
    return;
  }
  a.pause=Math.max(0,a.pause-dt);
  if(G.enemies.length||a.pause>0) return;
  if(a.welle>=a.max){                       // geschafft
    a.laeuft=false; G.arena=null;
    room.arenaFertig=true; room.platte=null;
    room.pedestals.push({x:tx(6),y:ty(2),itemId:room.lohn,cd:0.8});
    room.drops.push({x:tx(6),y:ty(4),type:'goldchest'});
    G.pickups.push({x:tx(6),y:ty(4),type:'goldchest',cd:0.8});
    schockwelle(tx(6),ty(3),110,'#ffd75a',0.8,5);
    blitz(tx(6),ty(2),26,'#ffd75a',0.5);
    G.banner={title:'Bestanden',desc:'Der Lohn steht bereit',t:2.4};
    Sfx.item(); updateDoorsOpen();
    return;
  }
  arenaWelle(++a.welle,a.max);
  a.pause=0.5;
}

/* Eine Welle aufstellen: Gegner aus dem Etagenpool, im Kreis um die Mitte,
   mit kurzer Ankündigung an jedem Erscheinungspunkt. */
function arenaWelle(nr,max){
  const pool=G.floor.data.pool;
  const n=2+nr+Math.floor(G.depth*0.5);
  for(let i=0;i<n;i++){
    const w=i*TAU/n+nr*0.7;
    const x=clamp(tx(6)+Math.cos(w)*(70+frand.range(0,26)),RX+24,RX+COLS*TILE-24);
    const y=clamp(ty(3)+Math.sin(w)*(52+frand.range(0,18)),RY+24,RY+ROWS*TILE-24);
    /* Die letzte Welle bringt Champions mit. */
    const champ=(nr>=max&&frand.chance(0.5))
      ? frand.pick([{tint:'#ff5a5a',hpMul:1.7},{tint:'#5aa8ff',spdMul:1.4}]) : null;
    const typ=frand.pick(pool);
    if(ENEMY_TYPES[typ].noChamp&&champ) spawnEnemy(typ,x,y,null);
    else spawnEnemy(typ,x,y,champ);
    blitz(x,y,18,'#c8823a',0.35);
    schockwelle(x,y,26,'#c8823a',0.35,3);
  }
  /* Angesagt wird die Welle nur oben am Zählwerk (drawArenaPlatte) —
     ein zweiter schwebender Text daneben wäre bloß Lärm. */
  G.shake=Math.max(G.shake,4); Sfx.bossroar();
}

/* Türblätter schwingen weich auf und zu, statt umzuspringen. */
function updateDoorAnim(dt){
  if(!G.room) return;
  for(const d in G.room.doors){
    const door=G.room.doors[d], ziel=doorPassable(door)?1:0;
    if(door.anim===undefined) door.anim=ziel;
    else door.anim=lerp(door.anim,ziel,1-Math.pow(0.0008,dt));
  }
}

function updateDoorsOpen(silent){
  const room=G.room; const clear=roomIsClear();
  if(clear&&!room.cleared&&room.type!=='start'){
    room.cleared=true;
    if(G.player.active){G.player.active.charge=Math.min(G.player.active.max,G.player.active.charge+1);}
    /* Das Mooskind wächst nach: ein halbes Herz je geräumtem Raum, aber nur
       bis zu den eigenen Containern — geheilt wird nicht über die Grenze. */
    if(G.player.flags.has('moos')&&G.player.red<G.player.redMax){
      G.player.red++; Sfx.heart(); addText(G.player.x,G.player.y-18,'+½','#8ac86a');
    }
    /* Schlüsselherz: ein geräumter Raum lässt hin und wieder einen
       Schlüssel liegen — man steht nie wieder vor verschlossenen Türen. */
    if(G.player.flags.has('schluesselherz')
       &&frand.chance(0.3+G.player.stats.luck*0.02)){
      G.player.keys++; Sfx.key(); addText(G.player.x,G.player.y-18,'+Schlüssel','#e8c030');
    }
    if(!silent) Sfx.doorOpen();
    // kleine Raum-Belohnung
    if(room.type==='normal'&&frand.chance(0.25+G.player.stats.luck*0.03))
      spawnPickup(tx(6),ty(3),randomDrop());
    if(room.type==='boss') onBossRoomCleared();
  }
}

function randomDrop(){
  const l=G.player.stats.luck*0.01;
  const r=frand();
  /* Geld fällt etwas öfter, und jeder achte Fund ist ein Fünferstück —
     so lohnt sich der Weg zum Laden wieder. */
  if(r<0.32+l+(G.player.flags.has('muenzbeutel')?0.25:0))
    return frand.chance(0.08+G.player.stats.luck*0.012)?'bigcoin':'coin';
  if(r<0.5) return 'heart';
  if(r<0.65) return 'bomb';
  if(r<0.8) return 'key';
  if(r<0.9) return 'pill';
  return 'card';
}

function onBossRoomCleared(){
  const room=G.room;
  /* Fluchherz: der Boss nimmt sich ein blaues Herz als Wegzoll. */
  if(G.player.flags.has('fluchherz')&&G.player.soul.length){
    G.player.soul.pop(); G.player.soul.pop();
    addText(G.player.x,G.player.y-22,'Der Fluch nimmt sich eins','#7a3ac8');
    burst(G.player.x,G.player.y,'#7a3ac8',12);
  }
  room.pedestals.push({x:tx(4),y:ty(3),itemId:pickFromPool('boss')});
  /* Jeder Boss lässt außerdem etwas Dauerhaftes liegen: entweder eine
     Herzerweiterung oder mehr Schaden. Damit ist ein Bosskampf immer
     spürbar wert, auch wenn das Item vom Podest nicht zum Aufbau passt.
     Wer schon bei zwölf Herzen ist, bekommt statt des Containers Kraft —
     ausgerechnet dort soll die Belohnung nicht verpuffen. */
  const p=G.player;
  const voll=p.redMax>=MAX_HERZEN*2;
  const lohn=(voll||frand.chance(0.5))?'schadenshoch':'container';
  /* Nicht auf Feld 8|3 — dort liegt die Falltür, man würde beim Aufheben
     hindurchfallen. Feld 6|4 ist in allen Boss-Grundrissen frei. */
  spawnPickup(tx(6),ty(4),lohn);
  room.trapdoor=true;
  Sfx.item();
  kammerOeffnen();
  // Freischaltungen
  if(G.depth>=2) unlock('floor3');
  if(G.depth>=3) unlock('floor4');
  if(G.depth>=4) unlock('floor5');
}

/* --- TEUFELS- UND ENGELSRAUM --------------------------------------------
   Hinter jedem Bossraum liegt eine Kammer, die erst der erlegte Boss
   aufschließt. Wer die Etage ohne einen einzigen Treffer übersteht, bekommt
   sie sicher; sonst entscheidet der Zufall. Damit lohnt sich vorsichtiges
   Spielen, ohne dass man je ganz leer ausgeht.

   Der Engel zeigt sich nur, solange man noch keinen Handel mit dem Teufel
   geschlossen hat. Wer einmal mit Herzen bezahlt hat, sieht ihn nie wieder —
   das ist die eigentliche Entscheidung des Durchlaufs.                     */
function kammerOeffnen(){
  const room=G.room;
  let tuer=null, ziel=null;
  for(const d in room.doors){
    const nb=G.floor.rooms[room.doors[d].to];
    if(nb.type==='devil'||nb.type==='angel'){ tuer=room.doors[d]; ziel=nb; }
  }
  if(!tuer||tuer.edge.revealed) return;
  if(!frand.chance(G.floorHit?0.25:1)) return;

  const engel=G.deals===0&&frand.chance(0.4);
  ziel.type=engel?'angel':'devil';
  tuer.edge.kind=ziel.type;
  tuer.edge.revealed=true;
  ziel.seen=true;
  kammerFuellen(ziel,engel);
  raumBildNeu();                 // die neue Tür gehört ins vorgebackene Bild
  G.shake=Math.max(G.shake,9);
  Sfx.doorOpen();
  G.banner={title:engel?'Ein Lichtschein':'Ein Riss im Boden',
            desc:engel?'Nebenan wartet etwas Gütiges':'Nebenan wartet etwas Hungriges',
            t:2.8};
}

function kammerFuellen(room,engel){
  room.pedestals.length=0; room.drops.length=0;
  const liste=engel?KAMMERN.engel:KAMMERN.teufel;
  const kammer=frand.pick(liste);
  room.kammerId=kammer.id;               // bleibt beim Wiederbetreten dieselbe
  kammer.bauen(room);
  if(!engel&&frand.chance(0.5)) room.drops.push({x:tx(6),y:ty(5),type:'blackheart'});
}
/* Möblierung der aktuellen Kammer, oder null in jedem anderen Raum. */
function kammerBild(){
  const r=G.room;
  if(!r||!r.kammerId) return null;
  return KAMMERN.teufel.concat(KAMMERN.engel).find(k=>k.id===r.kammerId)||null;
}

/* Ein Teufelshandel kostet einen ganzen roten Herzcontainer. Wer keinen
   entbehren kann, zahlt ersatzweise mit drei Seelen- oder schwarzen Herzen.
   Reicht beides nicht, bleibt das Angebot einfach stehen — daran sterben
   soll niemand. */
function herzPreisZahlen(container){
  const p=G.player, kosten=container*2;      // Herzen zählen in Hälften
  if(p.redMax-kosten>=2&&p.red-kosten>=1){
    p.redMax-=kosten; p.red-=kosten; Sfx.hurt(); return true;
  }
  if(p.soul.length>=3){ p.soul.splice(-3,3); Sfx.hurt(); return true; }
  return false;
}

function doorPassable(d){
  const e=d.edge;
  if(!e.revealed) return false;          // Geheimgang oder verborgene Kammer
  if(e.locked) return false;
  return G.room.cleared||roomIsClear();
}

function tryUnlockDoor(d){
  const p=G.player, e=d.edge;
  if(!e.locked) return;
  /* Die Rosenbraut trägt eine Tür im Gesicht — vor ihr geht jedes Schloss
     ohne Schlüssel auf. Das ist ihre ganze Eigenheit, dafür ist sie zart. */
  if(p.flags.has('tuerkind')){
    e.locked=false; Sfx.key(); addText(p.x,p.y-18,'aufgetan','#e8d8d0'); return;
  }
  if(p.keys<=0){ Sfx.error(); return; }
  // Dietrichfinger spart den Schlüssel manchmal ein
  if(!(p.flags.has('keysaver')&&frand.chance(0.25))) p.keys--;
  e.locked=false; Sfx.key();
}

function openAllDoors(){
  const room=G.room;
  for(const d in room.doors){const e=room.doors[d].edge;
    e.locked=false; if(e.kind==='secret'){e.revealed=true;}
    if(e.revealed) G.floor.rooms[room.doors[d].to].seen=true;}
  Sfx.doorOpen();
}

/* Schatzkarte: legt die ganze Etage offen. Geheimräume bleiben verborgen —
   die will man selbst finden. */
function etageAufdecken(){
  for(const k in G.floor.rooms)
    if(G.floor.rooms[k].type!=='secret') G.floor.rooms[k].seen=true;
}

function teleportRandom(){
  const keys=Object.keys(G.floor.rooms).filter(k=>G.floor.rooms[k].type!=='secret'&&k!==G.roomKey);
  if(!keys.length) return;
  enterRoom(frand.pick(keys),null); G.shake=4; Sfx.active();
}
function teleportToType(t){
  const k=Object.keys(G.floor.rooms).find(k=>G.floor.rooms[k].type===t);
  if(!k||k===G.roomKey){Sfx.error();return;}
  enterRoom(k,null); G.shake=4; Sfx.active();
}

/* Würfelkiste: Pickups + Podest-Items im Raum neu auswürfeln */
function rerollRoom(){
  const kinds=['coin','bomb','key','heart','soulheart','pill','card'];
  for(const q of G.pickups){ if(!q.price&&!q.type.includes('chest')) q.type=frand.pick(kinds); }
  for(const pd of G.room.pedestals){ if(!pd.taken){
    const pool=G.room.type==='shop'?'shop':(G.room.type==='boss'?'boss':'treasure');
    pd.itemId=pickFromPool(pool);} }
  G.shake=3; Sfx.active();
}

/* ==== 8. SPIELER, TRÄNEN, STRAHLEN, FAMILIARS, BOMBEN, PICKUPS ==== */

/* Statwerte neu berechnen: Basis des Charakters + alle Item-Mods */
function recomputeStats(){
  const p=G.player; if(!p) return;
  const c=p.char;
  const s={speed:c.speed+p.permSpeed, tps:c.tps, dmg:c.dmg+p.permDmg+p.roomDmgBonus,
           range:c.range+p.permRange, shot:c.shot, luck:c.luck, tpsMul:1, dmgMul:1};
  for(const id of p.items){const it=ITEMS[id]; if(it.mod) it.mod(s);}
  s.tps=clamp(s.tps,0.6,7)*s.tpsMul;
  /* dmgMul sammelt die prozentualen Aufschläge. Additive Boni zuerst, dann
     die Prozente — sonst würde ein früh gefundenes Prozent-Item später
     gefundene Punkte mit vervielfachen. */
  s.dmg=Math.max(0.5,s.dmg*s.dmgMul);
  s.speed=clamp(s.speed,0.8,3.6);
  s.shot=clamp(s.shot,2,7.5);
  s.range=clamp(s.range,80,420);
  p.stats=s;
}

/* --- Kollision Kreis vs. Hindernis-Raster --- */
function tileBlocks(cell,mode){ // mode: 'walk','fly','tear','tearSpectral'
  if(!cell) return false;
  if(mode==='walk') return cell.t==='rock'||cell.t==='poop'||cell.t==='fire'||cell.t==='pit';
  if(mode==='fly')  return cell.t==='rock'||cell.t==='poop'||cell.t==='fire';
  if(mode==='tear') return cell.t==='rock'||cell.t==='poop'||cell.t==='fire';
  if(mode==='tearSpectral') return false;
  return false;
}
function circleHitsGrid(x,y,r,mode){
  const c0=Math.max(0,pc(x-r)),c1=Math.min(COLS-1,pc(x+r));
  const r0=Math.max(0,pr(y-r)),r1=Math.min(ROWS-1,pr(y+r));
  for(let rr=r0;rr<=r1;rr++)for(let cc=c0;cc<=c1;cc++){
    const cell=G.room.grid[rr][cc];
    if(!tileBlocks(cell,mode)) continue;
    const cx=clamp(x,RX+cc*TILE,RX+cc*TILE+TILE), cy=clamp(y,RY+rr*TILE,RY+rr*TILE+TILE);
    if((x-cx)*(x-cx)+(y-cy)*(y-cy)<r*r) return {cell,rr,cc};
  }
  return null;
}
/* Bewegung mit Achsentrennung; liefert true bei Wandkontakt */
function moveEntity(e,dx,dy,mode){
  let hitWall=false;
  const minX=RX+e.r, maxX=RX+COLS*TILE-e.r, minY=RY+e.r, maxY=RY+ROWS*TILE-e.r;
  // X-Achse
  e.x+=dx;
  if(circleHitsGrid(e.x,e.y,e.r,mode)){e.x-=dx;hitWall=true;}
  if(e.x<minX){e.x=minX;hitWall=true;} if(e.x>maxX){e.x=maxX;hitWall=true;}
  // Y-Achse
  e.y+=dy;
  if(circleHitsGrid(e.x,e.y,e.r,mode)){e.y-=dy;hitWall=true;}
  if(e.y<minY){e.y=minY;hitWall=true;} if(e.y>maxY){e.y=maxY;hitWall=true;}
  return hitWall;
}

/* --- Spieler-Update --- */
function updatePlayer(dt){
  const p=G.player, s=p.stats;
  if(p.itemGet){ p.itemGet.t-=dt; if(p.itemGet.t<=0)p.itemGet=null; return; }
  p.iframes=Math.max(0,p.iframes-dt);
  p.shield=Math.max(0,p.shield-dt);
  p.hitFlash=Math.max(0,p.hitFlash-dt); // steuert den aufgerissenen Mund
  p.anim+=dt;

  // Bewegung
  const mv=Input.move();
  // Im Netz bleibt nur ein Drittel Tempo; die Ringwelle des Glockenmauls
  // lässt kurz taumeln, dann greift die Steuerung nur gedämpft.
  p.taumeln=Math.max(0,(p.taumeln||0)-dt);
  p.gepackt=Math.max(0,(p.gepackt||0)-dt);
  p.rausch=Math.max(0,(p.rausch||0)-dt);
  p.unsichtbar=Math.max(0,(p.unsichtbar||0)-dt);
  p.steinCd=Math.max(0,(p.steinCd||0)-dt);
  /* Doppelherz: wer unversehrt ist, trägt ein Schild vor sich her. Es geht
     beim ersten Treffer und wächst nach, sobald man wieder voll ist. */
  if(p.flags.has('vollschild')&&p.red>=p.redMax&&!p.vollschild){
    p.vollschild=true; p.shield=Math.max(p.shield,0.1);
  }
  /* Blutpumpe: ein Treffer blutet ein paar Sekunden nach. */
  if(p.blutung>0){
    p.blutung-=dt;
    p.blutT=(p.blutT||0)-dt;
    if(p.blutT<=0){ p.blutT=1.4;
      burst(p.x,p.y,'#a01828',4);
      hurtPlayer(1,true);
    }
  }
  /* Lebenskristall: in Not einmal je Raum ein halbes Herz zurück. */
  if(p.flags.has('lebenskristall')&&!G.room.kristallGenutzt
     &&p.red>0&&p.red<=p.redMax*0.25){
    G.room.kristallGenutzt=true;
    if(heileSpieler(1)){ Sfx.heart(); addText(p.x,p.y-20,'+½','#3ac87a');
      schockwelle(p.x,p.y,34,'#3ac87a',0.5,3); }
  }
  const netz=p.imNetz&&!p.flags.has('flight')?0.34:1;
  /* Griff = wie gut die Steuerung greift. Der Fingerbaum nimmt sie ganz,
     die Ringwelle des Glockenmauls dämpft sie. */
  const griff=p.gepackt>0?0:(p.taumeln>0?0.25:1);
  /* Auf der nassen Spur des Häutlings rutscht man: die Reibung greift kaum
     noch, man trägt seinen Schwung mit. */
  const fric=Math.pow(p.aufGlatt&&!p.flags.has('flight')?0.24:0.0001,dt);
  p.vx+=(mv.x*s.speed*60*netz-p.vx)*(1-fric)*griff;
  p.vy+=(mv.y*s.speed*60*netz-p.vy)*(1-fric)*griff;
  const mode=p.flags.has('flight')?'fly':'walk';
  const nearDoor=doorLane(p);
  moveEntityPlayer(p,p.vx*dt,p.vy*dt,mode,nearDoor);

  // Türen: berühren/durchgehen
  handleDoors(p);

  // Schießen
  const aim=Input.aim();
  if(aim) p.aimDir=aim;
  if(p.flags.has('beam')){
    if(aim){ p.beamCharge=Math.min(1,p.beamCharge+dt*s.tps*0.55);
      if(p.beamCharge>=1&&!p.beamReady){p.beamReady=true;Sfx.charge();} }
    else if(p.beamCharge>=1){ fireBeam(p.aimDir); p.beamCharge=0; p.beamReady=false; }
    else p.beamCharge=Math.max(0,p.beamCharge-dt*2);
  } else {
    p.fireTimer-=dt;
    if(aim&&p.fireTimer<=0){ p.fireTimer=1/s.tps; fireShot(aim); }
  }

  // Bombe legen
  if(Input.bomb()&&p.bombs>0&&!G.trans){
    p.bombs--; G.bombs.push({x:p.x,y:p.y,t:1.5,r:10}); Sfx.bombset();
  }
  // Aktives Item
  if(Input.useActive()&&p.active){
    const it=ITEMS[p.active.id];
    if(p.active.charge>=p.active.max){
      if(it.use(p)!==false){p.active.charge=0;}
    } else Sfx.error();
  }
  // Pille / Karte
  if(Input.usePocket()&&p.pocket){
    usePocket();
  }

  // Gefahren am Boden
  groundHazards(p,dt);
  // Pickups, Podeste, Truhen, Automaten, Falltür
  touchThings(p,dt);
}

/* Türgassen: erlaubt das Verlassen des Spielfelds an offenen Türen */
function doorLane(p){
  const res={};
  for(const d in G.room.doors){
    const dp=doorXY(d);
    if(d==='u'||d==='d'){ if(Math.abs(p.x-dp.x)<16) res[d]=true; }
    else { if(Math.abs(p.y-dp.y)<16) res[d]=true; }
  }
  return res;
}
function moveEntityPlayer(p,dx,dy,mode,lanes){
  const doors=G.room.doors;
  const pass=d=>doors[d]&&doorPassable(doors[d])&&lanes[d];
  const minX=pass('l')?RX-30:RX+p.r, maxX=pass('r')?RX+COLS*TILE+30:RX+COLS*TILE-p.r;
  const minY=pass('u')?RY-30:RY+p.r, maxY=pass('d')?RY+ROWS*TILE+30:RY+ROWS*TILE-p.r;
  p.x+=dx; if(circleHitsGrid(p.x,p.y,p.r,mode))p.x-=dx;
  p.x=clamp(p.x,minX,maxX);
  p.y+=dy; if(circleHitsGrid(p.x,p.y,p.r,mode))p.y-=dy;
  p.y=clamp(p.y,minY,maxY);
}
function handleDoors(p){
  for(const d in G.room.doors){
    const door=G.room.doors[d], dp=doorXY(d);
    /* Verschlossene Türen springen auf, sobald man mit einem Schlüssel in der
       Türgasse davorsteht. Die Wand hält den Spieler auf, er kommt nur bis auf
       21 Pixel an die Türmitte heran — die Schwelle muss darüber liegen, sonst
       lässt sich die Tür nie öffnen. Die Gassenprüfung verhindert, dass man
       beim Streifen einer Ecke unabsichtlich einen Schlüssel verbraucht. */
    const inGasse=(d==='u'||d==='d')?Math.abs(p.x-dp.x)<18:Math.abs(p.y-dp.y)<18;
    if(door.edge.locked&&inGasse&&dist(p,dp)<30&&roomIsClear()) tryUnlockDoor(door);
    // durchgegangen?
    let through=false;
    if(d==='u'&&p.y<RY-14) through=true;
    if(d==='d'&&p.y>RY+ROWS*TILE+14) through=true;
    if(d==='l'&&p.x<RX-14) through=true;
    if(d==='r'&&p.x>RX+COLS*TILE+14) through=true;
    if(through&&doorPassable(door)&&!G.trans){
      if(door.edge.kind==='curse') hurtPlayer(1,true);
      G.trans={t:0.35,half:false,to:door.to,dir:OPP[d]};
      Sfx.door();
    }
  }
}

/* --- Schuss abfeuern (Tränen / Laser, mit allen Modifikatoren) --- */
function fireShot(aim){
  const p=G.player, s=p.stats, f=p.flags;
  let angles=[0];
  if(f.has('quad')) angles=[-0.28,-0.1,0.1,0.28];
  else if(f.has('triple')) angles=[-0.22,0,0.22];
  /* Doppelgeschoss hängt einen weiteren Lauf an und schwächt dafür alle:
     mehr Deckung im Raum, weniger Wucht je Treffer. */
  let schwaeche=1;
  if(f.has('doppelgeschoss')){
    angles=angles.concat([angles[angles.length-1]+0.19]);
    schwaeche=0.7;
  }
  const s2=schwaeche===1?s:{...s,dmg:s.dmg*schwaeche};
  const base=Math.atan2(aim.y,aim.x);
  for(const off of angles){
    const a=base+off;
    if(f.has('laser')){ fireLaser(a,s2.dmg); continue; }
    spawnTear(p.x,p.y-4,a,s2,f,false);
  }
  if(!f.has('laser')) Sfx.shoot(); else Sfx.laser();
  // Schatten-Familiar schießt mit
  for(const fam of G.familiars) if(fam.kind==='shadow'){
    if(f.has('laser')) fireLaser(base,1.5,fam);
    else spawnTear(fam.x,fam.y-4,base,{...s,dmg:1.5},f,true);
  }
  /* Schattenorb gibt jeden Schuss mit: gleiche Richtung, gleiche
     Sonderwirkungen, halbe Wucht. */
  for(const fam of G.familiars) if(fam.kind==='schattenorb'){
    fam.blitzT=0.12;
    if(f.has('laser')) fireLaser(base,s.dmg*0.5,fam);
    else spawnTear(fam.x,fam.y-4,base,{...s,dmg:s.dmg*0.5},f,true);
  }
}
function spawnTear(x,y,a,s,f,fromFam){
  const p=G.player;
  const spd=s.shot*60;
  let r=5+s.dmg*0.35;
  if(f.has('bigshot')) r*=1.5;
  if(f.has('needle')) r*=0.6;
  r=clamp(r,3,14);
  const t={x,y,z:9,r,
    vx:Math.cos(a)*spd+(fromFam?0:p.vx*0.25),
    vy:Math.sin(a)*spd+(fromFam?0:p.vy*0.25),
    dmg:fromFam?s.dmg:s.dmg, life:s.range/(s.shot*60),
    homing:f.has('homing'),pierce:f.has('pierce'),spectral:f.has('spectral'),
    bounce:f.has('bounce')?2:0,split:f.has('split'),
    poison:f.has('poison'),burn:f.has('burn'),frost:f.has('frost'),
    heavy:f.has('heavyknock'),crit:f.has('crit'),fam:fromFam,hit:new Set()};
  G.tears.push(t);
  return t;
}
/* Blitzfaden: sofortiger Linien-Laser */
function fireLaser(a,dmg,src){
  const p=src||G.player;
  const dx=Math.cos(a),dy=Math.sin(a);
  let len=0,x=p.x,y=p.y;
  const spectral=G.player.flags.has('spectral');
  while(len<520){
    x+=dx*8;y+=dy*8;len+=8;
    if(x<RX||x>RX+COLS*TILE||y<RY||y>RY+ROWS*TILE) break;
    if(!spectral&&circleHitsGrid(x,y,3,'tear')){hitGridTile(x,y,dmg);break;}
  }
  G.lasers.push({x1:p.x,y1:p.y-4,x2:x,y2:y,t:0.12});
  blitz(p.x,p.y-4,5,'#bfe8ff',0.1);                    // Mündungsblitz
  funken(x,y,a+Math.PI,'#bfe8ff',4,1.0);               // Einschlagfunken
  // Alle Gegner auf der Linie treffen
  for(const e of [...G.enemies]){
    const t=((e.x-p.x)*dx+(e.y-p.y)*dy);
    if(t<0||t>len) continue;
    const px=p.x+dx*t,py=p.y+dy*t;
    if(Math.hypot(e.x-px,e.y-py)<e.r+4) hitEnemyWithMods(e,dmg,a,false);
  }
}
/* Höllenstrahl: aufgeladener, kurzer Dauerstrahl */
function fireBeam(aim){
  const p=G.player,s=p.stats;
  G.beams.push({x:p.x,y:p.y-4,dx:aim.x,dy:aim.y,t:0.7,tick:0,dmg:s.dmg*0.6,w:10+s.dmg});
  Sfx.beam(); G.shake=4;
  blitz(p.x,p.y-4,14,'#ff8a6a',0.22);                  // Entfesselung
  schockwelle(p.x,p.y-4,26,'#ff5a3a',0.3,3);
}
function updateBeams(dt){
  for(const b of G.beams){
    b.t-=dt; b.tick-=dt;
    const p=G.player; b.x=p.x; b.y=p.y-4; // Strahl folgt dem Spieler
    if(b.tick<=0){ b.tick=0.09;
      let len=0,x=b.x,y=b.y;
      const spectral=p.flags.has('spectral');
      while(len<520){ x+=b.dx*8;y+=b.dy*8;len+=8;
        if(x<RX-10||x>RX+COLS*TILE+10||y<RY-10||y>RY+ROWS*TILE+10) break;
        if(!spectral&&circleHitsGrid(x,y,3,'tear')){hitGridTile(x,y,b.dmg);break;} }
      b.len=len;
      // Der Strahl bebt und wirft am Auftreffpunkt Funken
      G.shake=Math.max(G.shake,2.5);
      funken(b.x+b.dx*len,b.y+b.dy*len,Math.atan2(-b.dy,-b.dx),'#ffb07a',3,1.1);
      for(const e of [...G.enemies]){
        const t=((e.x-b.x)*b.dx+(e.y-b.y)*b.dy);
        if(t<0||t>len) continue;
        const px=b.x+b.dx*t,py=b.y+b.dy*t;
        if(Math.hypot(e.x-px,e.y-py)<e.r+b.w*0.5) hitEnemyWithMods(e,b.dmg,Math.atan2(b.dy,b.dx),false);
      }
    }
  }
  G.beams=G.beams.filter(b=>b.t>0);
}

/* Treffer inkl. Statuseffekte/Krit/Rückstoß anwenden */
function hitEnemyWithMods(e,dmg,a,isTear){
  const p=G.player,f=p.flags;
  let d=dmg;
  /* Was erst beim Treffer feststeht: Wut hängt am aktuellen Leben, der
     Elitebonus am getroffenen Gegner, Chaos und Rausch am Zufall. */
  if(f.has('wut')&&p.redMax>0)
    d*=1+0.5*(1-clamp(p.red/p.redMax,0,1));
  if(f.has('elitebrecher')&&(e.isBoss||e.champ)) d*=1.35;
  if(f.has('chaos')) d*=frand.range(0.7,1.6);
  if(p.rausch>0) d*=2;
  if(f.has('donner')){
    p.donnerZaehler=(p.donnerZaehler||0)+1;
    if(p.donnerZaehler>=8){
      p.donnerZaehler=0;
      const ziele=G.enemies.filter(x=>!x.dead);
      if(ziele.length){
        const z=frand.pick(ziele);
        damageEnemy(z,Math.max(4,p.stats.dmg*1.5));
        blitz(z.x,z.y,z.r+14,'#ffe07a',0.25);
        schockwelle(z.x,z.y,z.r+22,'#ffd75a',0.3,3);
        addText(z.x,z.y-16,'Blitz!','#ffd75a'); Sfx.laser();
      }
    }
  }
  if(f.has('crit')&&frand.chance(0.1+p.stats.luck*0.02)){
    d*=3; addText(e.x,e.y-14,'KRIT!','#ffd75a');
    blitz(e.x,e.y,e.r+8,'#ffe07a',0.2); schockwelle(e.x,e.y,e.r+18,'#ffd75a',0.28,2.5);
    burst(e.x,e.y,'#ffd75a',8); G.shake=Math.max(G.shake,3);
  }
  if(f.has('poison')) e.poison=Math.max(e.poison||0,3);
  if(f.has('burn'))   e.burn=Math.max(e.burn||0,3);
  if(f.has('frost'))  e.frost=Math.max(e.frost||0,2);
  const kb=f.has('heavyknock')?220:80;
  e.kx=(e.kx||0)+Math.cos(a)*kb; e.ky=(e.ky||0)+Math.sin(a)*kb;
  damageEnemy(e,d,a);
}
function hitGridTile(x,y,dmg){
  const hit=circleHitsGrid(x,y,4,'tear');
  if(!hit) return;
  const cell=hit.cell;
  if(cell.t==='poop'||cell.t==='fire'){
    cell.hp-=Math.max(1,dmg*0.5);
    raumBildNeu();                      // angeschlagen sieht anders aus
    if(cell.hp<=0){
      G.room.grid[hit.rr][hit.cc]=null;
      burst(tx(hit.cc),ty(hit.rr),cell.t==='poop'?'#7a5b3a':'#e8862a',8);
      if(cell.t==='poop') kothaufenAufgebrochen(tx(hit.cc),ty(hit.rr));
      Sfx.hit();
    }
  }
}

/* --- Tränen-Update --- */
function updateTears(dt){
  for(const t of G.tears){
    t.life-=dt;
    /* Spur hinter besonderen Schüssen: erst dadurch sieht man im Getümmel,
       welches Item gerade wirkt. Der Takt ist begrenzt, damit auch ein
       Vierfachschuss mit Dauerfeuer die Bildrate nicht drückt. */
    t.spur=(t.spur||0)-dt;
    if(t.spur<=0&&(t.poison||t.burn||t.frost||t.explosive||t.homing)){
      t.spur=0.045;
      if(t.burn)          schweber(t.x,t.y,'#ff9a3a',-frand.range(10,30),0.22);
      else if(t.poison)   schweber(t.x,t.y,'#8ac850',-frand.range(4,16),0.28);
      else if(t.frost)    schweber(t.x,t.y,'#bfe8ff',frand.range(-6,6),0.25);
      else if(t.explosive)schweber(t.x,t.y,'#8a8276',-frand.range(6,18),0.3);
      else                schweber(t.x,t.y,'#7fb4d8',frand.range(-4,4),0.16);
    }
    if(t.homing){
      let best=null,bd=1e9;
      for(const e of G.enemies){const d=dist(t,e); if(d<bd){bd=d;best=e;}}
      if(best&&bd<160){
        const a=ang(t,best),sp=Math.hypot(t.vx,t.vy);
        const ca=Math.atan2(t.vy,t.vx);
        let diff=a-ca; while(diff>Math.PI)diff-=TAU; while(diff<-Math.PI)diff+=TAU;
        const na=ca+clamp(diff,-6*dt,6*dt);
        t.vx=Math.cos(na)*sp; t.vy=Math.sin(na)*sp;
      }
    }
    t.x+=t.vx*dt; t.y+=t.vy*dt;
    if(t.life<0.15) t.z=Math.max(0,t.z-60*dt); // Tropfen fällt am Ende
    // Wände & Hindernisse
    let dead=false;
    const inX=t.x>RX+t.r&&t.x<RX+COLS*TILE-t.r, inY=t.y>RY+t.r&&t.y<RY+ROWS*TILE-t.r;
    if(!inX||!inY){
      if(t.bounce>0){ t.bounce--;
        if(!inX) t.vx*=-1; if(!inY) t.vy*=-1;
        t.x=clamp(t.x,RX+t.r,RX+COLS*TILE-t.r); t.y=clamp(t.y,RY+t.r,RY+ROWS*TILE-t.r);
      } else dead=true;
    }
    if(!dead&&!t.spectral){
      const hit=circleHitsGrid(t.x,t.y,t.r*0.7,'tear');
      if(hit){
        hitGridTile(t.x,t.y,t.dmg);
        if(t.bounce>0){t.bounce--;t.vx*=-1;t.vy*=-1;} else dead=true;
      }
    }
    // Gegner treffen
    if(!dead) for(const e of G.enemies){
      if(t.hit.has(e)) continue;
      if(e.ghosted) continue; // ausgeblendete Schleicher
      if(dist(t,e)<t.r+e.r){
        hitEnemyWithMods(e,t.dmg,Math.atan2(t.vy,t.vx),true);
        Sfx.hit();
        if(t.split&&!t.isSplit){
          const a0=Math.atan2(t.vy,t.vx);
          for(const off of [Math.PI/2,-Math.PI/2]){
            const nt=spawnTear(t.x,t.y,a0+off,{...G.player.stats,dmg:t.dmg*0.5,range:90,shot:G.player.stats.shot},G.player.flags,true);
            nt.isSplit=true; nt.split=false;
          }
        }
        // Einschlag: Funken entgegen der Flugrichtung, in Elementfarbe
        funken(t.x,t.y,Math.atan2(-t.vy,-t.vx),schussFarbe(t),t.pierce?3:6,0.9);
        if(t.pierce){t.hit.add(e); t.dmg*=0.85;} else {dead=true;}
        break;
      }
    }
    if(t.life<=0){dead=true;}
    if(dead){t.dead=true; splashFx(t);}
  }
  G.tears=G.tears.filter(t=>!t.dead);
  for(const l of G.lasers) l.t-=dt;
  G.lasers=G.lasers.filter(l=>l.t>0);
}
/* Zerplatzender Schuss. Elementare Schüsse hinterlassen dabei ihre Spur:
   Gift eine Pfütze, Feuer eine Stichflamme, Frost einen Eissplitter — so ist
   an der Wirkung zu sehen, welches Item gerade arbeitet. */
function splashFx(t){
  const farbe=schussFarbe(t);
  burst(t.x,t.y,farbe,t.explosive?0:4);
  if(t.explosive){                 // Bombenvogel: die Kugel geht wirklich hoch
    explode(t.x,t.y,42,14,false);
    return;
  }
  if(t.burn){ blitz(t.x,t.y,7,'#ffd07a',0.16);
    for(let i=0;i<3;i++) schweber(t.x,t.y,'#ff8a3a',-frand.range(20,45),0.3); }
  else if(t.poison){ if(frand.chance(0.35)) G.creeps.push({x:t.x,y:t.y,r:9,t:1.6,feindlich:false}); }
  else if(t.frost){ blitz(t.x,t.y,6,'#dff4ff',0.14); }
}

/* --- Familiars --- */
function spawnFamiliars(){
  G.familiars=[];
  const p=G.player; let chain=1;
  for(const id of p.items){
    const it=ITEMS[id]; if(!it.famil) continue;
    const f={kind:it.famil,x:p.x,y:p.y,angle:frand()*TAU,fireT:0,chain:chain++,wx:p.x,wy:p.y,cd:0};
    G.familiars.push(f);
  }
}
function updateFamiliars(dt){
  const p=G.player;
  for(const f of G.familiars){
    if(f.kind==='shadow'||f.kind==='rat'){
      // hinterherlaufen
      const tx0=p.x-p.vx*0.08*f.chain, ty0=p.y-p.vy*0.08*f.chain;
      const d=dist(f,{x:tx0,y:ty0});
      if(d>18*f.chain){ f.x=lerp(f.x,tx0,6*dt); f.y=lerp(f.y,ty0,6*dt); }
      if(f.kind==='rat'){
        for(const q of G.pickups){ if(q.price||q.type.includes('chest')) continue;
          const dd=dist(p,q); if(dd<95&&dd>12){const a=ang(q,p);q.x+=Math.cos(a)*70*dt;q.y+=Math.sin(a)*70*dt;} }
      }
    }
    if(f.kind==='orbit'){
      f.angle+=3.2*dt;
      f.x=p.x+Math.cos(f.angle)*30; f.y=p.y+Math.sin(f.angle)*30;
      for(const sh of G.eshots){ if(dist(f,sh)<10) sh.dead=true; }
      f.cd-=dt;
      for(const e of G.enemies){ if(dist(f,e)<e.r+7&&f.cd<=0){f.cd=0.35;damageEnemy(e,3);Sfx.hit();} }
    }
    if(f.kind==='bug'){
      f.cd-=dt;
      if(!f.tgtT||f.tgtT<=0){f.tgtT=frand.range(0.6,1.5);
        f.wx=RX+30+frand()*(COLS*TILE-60); f.wy=RY+30+frand()*(ROWS*TILE-60);}
      f.tgtT-=dt;
      const a=Math.atan2(f.wy-f.y,f.wx-f.x);
      f.x+=Math.cos(a)*70*dt; f.y+=Math.sin(a)*70*dt;
      for(const e of G.enemies){ if(dist(f,e)<e.r+7&&f.cd<=0){f.cd=0.5;e.poison=3;damageEnemy(e,2);} }
    }
    if(f.kind==='bird'){
      f.x=lerp(f.x,p.x+14,4*dt); f.y=lerp(f.y,p.y-22,4*dt);
      f.fireT-=dt;
      if(f.fireT<=0&&G.enemies.length){
        f.fireT=5;
        const e=frand.pick(G.enemies), a=ang(f,e);
        const t=spawnTear(f.x,f.y,a,{...p.stats,dmg:6,range:240,shot:4},new Set(),true);
        t.explosive=true;
      }
    }

    /* Frostgeist: schwebt seitlich mit und vereist regelmäßig den nächsten
       Gegner — hält also die Gefahr auf Abstand, statt Schaden zu machen. */
    if(f.kind==='frostgeist'){
      f.angle+=1.4*dt;
      f.x=lerp(f.x,p.x-20+Math.cos(f.angle)*8, 4*dt);
      f.y=lerp(f.y,p.y-16+Math.sin(f.angle*1.3)*5, 4*dt);
      f.cd-=dt;
      if(f.cd<=0&&G.enemies.length){
        let nah=null,bd=150;
        for(const e of G.enemies){const d=dist(f,e); if(d<bd){bd=d;nah=e;}}
        if(nah){ f.cd=2.4; nah.frost=Math.max(nah.frost||0,3); damageEnemy(nah,2);
          blitz(nah.x,nah.y,nah.r+5,'#bfe8ff',0.25);
          funken(f.x,f.y,ang(f,nah),'#dff4ff',5,0.35); }
      }
    }

    /* Glutmotte: flattert eigene Bahnen und lässt Glut fallen, die Gegner
       in Brand setzt. Die Glut liegt als eigene Pfütze auf dem Boden. */
    if(f.kind==='motte'){
      if(!f.tgtT||f.tgtT<=0){ f.tgtT=frand.range(0.5,1.1);
        f.wx=clamp(p.x+frand.range(-70,70),RX+20,RX+COLS*TILE-20);
        f.wy=clamp(p.y+frand.range(-60,60),RY+20,RY+ROWS*TILE-20); }
      f.tgtT-=dt;
      const a=Math.atan2(f.wy-f.y,f.wx-f.x);
      f.x+=Math.cos(a)*95*dt; f.y+=Math.sin(a)*95*dt;
      f.cd-=dt;
      if(f.cd<=0){ f.cd=0.5;
        G.creeps.push({x:f.x,y:f.y,r:11,t:2.6,feindlich:false,glut:true});
        schweber(f.x,f.y,'#ff9a3a',-frand.range(15,35),0.35);
      }
    }

    /* Panzerling: stellt sich in Blickrichtung vor den Spieler und fängt
       gegnerische Geschosse ab. Kein Schaden, aber ein wandernder Schild. */
    if(f.kind==='panzer'){
      const a=p.aimDir;
      const zx=p.x+a.x*22, zy=p.y+a.y*22+4;
      f.x=lerp(f.x,zx,7*dt); f.y=lerp(f.y,zy,7*dt);
      for(const sh of G.eshots){
        if(sh.arc) continue;                       // Bogenwürfe fliegen darüber
        if(dist(f,sh)<11){ sh.dead=true; f.blockT=0.15;
          funken(sh.x,sh.y,Math.atan2(-sh.vy,-sh.vx),'#d8d0c0',4,0.8); Sfx.hit(); }
      }
      f.blockT=Math.max(0,(f.blockT||0)-dt);
    }

    /* Späherauge: fliegt dem nächsten Gegner entgegen und feuert durch-
       schlagende Schüsse — greift also selbstständig an. */
    if(f.kind==='spaeher'){
      let ziel=null,bd=1e9;
      for(const e of G.enemies){const d=dist(f,e); if(d<bd){bd=d;ziel=e;}}
      if(ziel){
        const a=ang(f,ziel);
        if(bd>60){ f.x+=Math.cos(a)*110*dt; f.y+=Math.sin(a)*110*dt; }
        f.fireT-=dt;
        if(f.fireT<=0){ f.fireT=1.1;
          const t=spawnTear(f.x,f.y,a,{...p.stats,dmg:3.5,range:200,shot:5},new Set(),true);
          t.pierce=true; Sfx.shoot();
        }
      } else { // kein Ziel: zum Spieler zurück
        f.x=lerp(f.x,p.x-16,3*dt); f.y=lerp(f.y,p.y-20,3*dt);
      }
    }

    /* ---- Die zehn Begleiter ------------------------------------------ */

    /* Messerfliege: schwirrt beim Spieler, stürzt sich in kurzen Sätzen auf
       den nächsten Gegner und schneidet im Vorbeiflug. Zwischen den Sätzen
       kehrt sie zurück, damit sie nicht im Raum feststeckt. */
    if(f.kind==='messerfliege'){
      f.cd-=dt; f.sturz=Math.max(0,(f.sturz||0)-dt);
      const ziel=naechsterGegner(f,170);
      if(f.sturz>0&&f.zielA!==undefined){
        f.x+=Math.cos(f.zielA)*230*dt; f.y+=Math.sin(f.zielA)*230*dt;
        f.winkel=f.zielA;
      } else if(ziel&&f.cd<=0){
        f.zielA=ang(f,ziel); f.sturz=0.42; f.cd=1.0; Sfx.shoot();
      } else {
        const zx=p.x-18-f.chain*4, zy=p.y-24;
        f.x=lerp(f.x,zx+Math.cos(performance.now()/260+f.chain)*7,4*dt);
        f.y=lerp(f.y,zy+Math.sin(performance.now()/210+f.chain)*5,4*dt);
      }
      f.schnittT=Math.max(0,(f.schnittT||0)-dt);
      for(const e of G.enemies){
        if(dist(f,e)<e.r+8&&f.schnittT<=0){
          f.schnittT=0.28; damageEnemy(e,f.sturz>0?5:2.5);
          funken(e.x,e.y,f.zielA||0,'#e8f0ff',5,0.9); Sfx.hit();
        }
      }
    }

    /* Feuerschädel: hängt hinter dem Spieler und spuckt Feuerbälle. Die
       Bälle setzen in Brand — Schaden über Zeit statt harter Treffer. */
    if(f.kind==='feuerschaedel'){
      f.x=lerp(f.x,p.x-22,3.5*dt); f.y=lerp(f.y,p.y-20,3.5*dt);
      f.fireT-=dt; f.spuck=Math.max(0,(f.spuck||0)-dt);
      const ziel=naechsterGegner(f,260);
      if(ziel&&f.fireT<=0){
        f.fireT=1.8; f.spuck=0.3;
        const t=spawnTear(f.x,f.y,ang(f,ziel),{...p.stats,dmg:3,range:230,shot:5},new Set(),true);
        t.burn=true; Sfx.shoot();
        for(let i=0;i<3;i++) schweber(f.x,f.y,'#ff9a3a',-frand.range(10,30),0.3);
      }
    }

    /* Engelsflügel: hält sich über dem Kopf und fängt je Raum genau einen
       Treffer ab. Verbraucht sind sie erst beim nächsten Raum wieder da —
       spawnFamiliars() stellt bei jedem Betreten neu auf. */
    if(f.kind==='engelsfluegel'){
      f.x=lerp(f.x,p.x,9*dt); f.y=lerp(f.y,p.y-26,9*dt);
      if(f.frei===undefined) f.frei=true;
    }

    /* Schattenorb: schwebt seitlich mit. Geschossen wird nicht hier,
       sondern in fireShot() — er gibt jeden Schuss des Spielers ab. */
    if(f.kind==='schattenorb'){
      f.angle+=1.1*dt;
      f.x=lerp(f.x,p.x+20+Math.cos(f.angle)*6,5*dt);
      f.y=lerp(f.y,p.y-18+Math.sin(f.angle*1.4)*4,5*dt);
    }

    /* Stichling: rollt sich zusammen, rammt den nächsten Gegner und prallt
       danach zurück zum Spieler. Reiner Nahkämpfer, dafür kräftig. */
    if(f.kind==='stichling'){
      f.cd-=dt; f.roll=(f.roll||0)+dt*(f.rammt>0?18:5);
      f.rammt=Math.max(0,(f.rammt||0)-dt);
      if(f.rammt>0){
        f.x+=Math.cos(f.rammA)*260*dt; f.y+=Math.sin(f.rammA)*260*dt;
        for(const e of G.enemies){
          if(dist(f,e)<e.r+9&&!f.getroffen){
            f.getroffen=true; damageEnemy(e,7); f.rammt=0;
            const a=ang(f,e); e.kx=(e.kx||0)+Math.cos(a)*180; e.ky=(e.ky||0)+Math.sin(a)*180;
            burst(e.x,e.y,'#dfe4c8',8); G.shake=Math.max(G.shake,3); Sfx.hit();
          }
        }
      } else {
        const ziel=naechsterGegner(f,150);
        if(ziel&&f.cd<=0){ f.rammA=ang(f,ziel); f.rammt=0.45; f.cd=1.5; f.getroffen=false; }
        else { f.x=lerp(f.x,p.x-14,4.5*dt); f.y=lerp(f.y,p.y+12,4.5*dt); }
      }
    }

    /* Augapfel: schwebt mit und schießt mit deinen eigenen Werten, nur
       schwächer — er erbt also Reichweite, Tempo und Sonderwirkungen. */
    if(f.kind==='augapfel'){
      f.x=lerp(f.x,p.x+16,4*dt); f.y=lerp(f.y,p.y-22,4*dt);
      f.fireT-=dt;
      const ziel=naechsterGegner(f,280);
      if(ziel&&f.fireT<=0){
        f.fireT=Math.max(0.35,1/Math.max(0.5,p.stats.tps*0.6));
        f.blickA=ang(f,ziel);
        spawnTear(f.x,f.y,f.blickA,{...p.stats,dmg:p.stats.dmg*0.55},p.flags,true);
        Sfx.shoot();
      }
      if(ziel) f.blickA=ang(f,ziel);
    }

    /* Bombenfreund: trottet hinterher und legt alle paar Sekunden eine
       eigene Bombe. Sie tut dem Spieler nichts — sonst wäre der Begleiter
       eine Strafe statt einer Hilfe. */
    if(f.kind==='bombenfreund'){
      const zx=p.x-p.vx*0.1-16, zy=p.y-p.vy*0.1+14;
      if(dist(f,{x:zx,y:zy})>20){ f.x=lerp(f.x,zx,4*dt); f.y=lerp(f.y,zy,4*dt); }
      f.cd-=dt;
      if(f.cd<=0&&G.enemies.length){
        f.cd=4.5;
        G.bombs.push({x:f.x,y:f.y+4,t:1.6,r:10,freundlich:true});
        Sfx.bombset();
      }
    }

    /* Kreuzbot: bleibt beim Spieler und feuert in Salven nach oben, unten,
       links und rechts. Deckt also Gänge ab, zielt aber nie. */
    if(f.kind==='kreuzbot'){
      f.x=lerp(f.x,p.x-2,3.5*dt); f.y=lerp(f.y,p.y+16,3.5*dt);
      f.dreh=(f.dreh||0)+dt*1.2;
      f.fireT-=dt;
      if(f.fireT<=0&&G.enemies.length){
        f.fireT=2.2;
        for(let i=0;i<4;i++){
          const a=f.dreh+i*Math.PI/2;
          spawnTear(f.x,f.y,a,{...p.stats,dmg:2.5,range:200,shot:5},new Set(),true);
        }
        Sfx.shoot();
      }
    }

    /* Klingenring: drei Klingen auf einer gemeinsamen Kreisbahn. Sie
       schneiden alles, was sie streifen, und schlagen Geschosse weg. */
    if(f.kind==='klingenring'){
      f.angle+=2.6*dt;
      f.x=p.x; f.y=p.y;
      f.trefferT=f.trefferT||{};
      for(let i=0;i<3;i++){
        const a=f.angle+i*TAU/3;
        const kx=p.x+Math.cos(a)*38, ky=p.y+Math.sin(a)*38;
        for(const sh of G.eshots){ if(!sh.arc&&Math.hypot(sh.x-kx,sh.y-ky)<10) sh.dead=true; }
        for(const e of G.enemies){
          if(Math.hypot(e.x-kx,e.y-ky)<e.r+7){
            const k=e.id||(e.id=++KLINGEN_ID);
            if(!(f.trefferT[k]>0)){
              f.trefferT[k]=0.4; damageEnemy(e,3.5);
              funken(kx,ky,a+1.57,'#e8f0ff',4,0.9); Sfx.hit();
            }
          }
        }
      }
      for(const k in f.trefferT) f.trefferT[k]=Math.max(0,f.trefferT[k]-dt);
    }

    /* Beschwörung: die gerufenen Geister jagen selbstständig und lösen
       sich nach vierzehn Sekunden wieder auf. */
    if(f.kind==='geist'){
      f.leben-=dt;
      if(f.leben<=0){ f.weg=true;
        for(let i=0;i<8;i++) schweber(f.x,f.y,'#a8c8ff',-frand.range(20,50),0.6);
        continue;
      }
      const ziel=naechsterGegner(f,1e9);
      if(ziel){
        const a=ang(f,ziel);
        f.x+=Math.cos(a)*120*dt; f.y+=Math.sin(a)*120*dt;
        f.cd-=dt;
        if(dist(f,ziel)<ziel.r+8&&f.cd<=0){
          f.cd=0.45; damageEnemy(ziel,5+G.depth);
          funken(ziel.x,ziel.y,a,'#a8c8ff',5,0.9); Sfx.hit();
        }
      } else {
        f.x=lerp(f.x,p.x+Math.cos(f.angle)*24,3*dt);
        f.y=lerp(f.y,p.y+Math.sin(f.angle)*24,3*dt);
      }
    }

    /* Seelenvogel: flattert über dem Spieler und sammelt die Seelen der
       Erlegten. Alle acht Seelen gibt er ein halbes Herz zurück; der
       Zähler steht in G.seelen, killEnemy() füllt ihn. */
    if(f.kind==='seelenvogel'){
      f.x=lerp(f.x,p.x+Math.cos(performance.now()/500)*16,3.5*dt);
      f.y=lerp(f.y,p.y-30+Math.sin(performance.now()/380)*4,3.5*dt);
      if((G.seelen||0)>=8){
        G.seelen-=8;
        if(heileSpieler(1)>0){
          addText(p.x,p.y-30,'Seele','#bfe0f4');
          schockwelle(f.x,f.y,26,'#bfe0f4',0.4,3); Sfx.heart();
        }
      }
    }
  }
  if(G.familiars.some(f=>f.weg)) G.familiars=G.familiars.filter(f=>!f.weg);
}
let KLINGEN_ID=0;   // laufende Nummer, damit der Klingenring Treffer merken kann

/* Nächster Gegner innerhalb von `weite` — die Begleiter brauchen das
   ständig, deshalb einmal zentral. */
function naechsterGegner(von,weite){
  let ziel=null,bd=weite||1e9;
  for(const e of G.enemies){ const d=dist(von,e); if(d<bd){bd=d;ziel=e;} }
  return ziel;
}

/* --- Bomben & Explosionen --- */
function updateBombs(dt){
  for(const b of G.bombs){
    b.t-=dt;
    if(b.t<=0){ b.dead=true; explode(b.x,b.y,62,24,!b.freundlich); }
  }
  G.bombs=G.bombs.filter(b=>!b.dead);
}
function explode(x,y,rad,dmg,hurtsPlayer){
  Sfx.boom(); G.shake=Math.max(G.shake,9);
  burst(x,y,'#ffb347',18); burst(x,y,'#ff6b35',12);
  G.fx.push({kind:'boom',x,y,t:0.35,r:rad});
  blitz(x,y,rad*0.55,'#fff0c0',0.16);
  schockwelle(x,y,rad*1.25,'#ffd08a',0.4,4);
  for(let i=0;i<10;i++) schweber(x+frand.range(-rad*0.4,rad*0.4),y+frand.range(-8,8),
    '#6a6058',-frand.range(18,46),frand.range(0.5,0.9));
  // Gegner
  for(const e of G.enemies){ if(dist(e,{x,y})<rad+e.r){ damageEnemy(e,dmg);
    const a=ang({x,y},e); e.kx=(e.kx||0)+Math.cos(a)*200; e.ky=(e.ky||0)+Math.sin(a)*200; } }
  // Spieler
  const p=G.player;
  if(hurtsPlayer&&!p.flags.has('bombimmun')&&dist(p,{x,y})<rad+p.r) hurtPlayer(2);
  // Hindernisse
  const c0=Math.max(0,pc(x-rad)),c1=Math.min(COLS-1,pc(x+rad));
  const r0=Math.max(0,pr(y-rad)),r1=Math.min(ROWS-1,pr(y+rad));
  for(let rr=r0;rr<=r1;rr++)for(let cc=c0;cc<=c1;cc++){
    const cell=G.room.grid[rr][cc]; if(!cell) continue;
    if(Math.hypot(tx(cc)-x,ty(rr)-y)>rad+14) continue;
    if(cell.t==='rock'||cell.t==='poop'||cell.t==='fire'){
      G.room.grid[rr][cc]=null; raumBildNeu();
      burst(tx(cc),ty(rr),'#8a7a66',6);
      if(cell.t==='rock'&&frand.chance(0.1)) spawnPickup(tx(cc),ty(rr),randomDrop());
      if(cell.t==='poop') kothaufenAufgebrochen(tx(cc),ty(rr));
    }
  }
  // Geheimtüren aufsprengen
  for(const d in G.room.doors){
    const door=G.room.doors[d], dp=doorXY(d);
    if(door.edge.kind==='secret'&&!door.edge.revealed&&dist(dp,{x,y})<rad+20){
      door.edge.revealed=true; Sfx.doorOpen(); addText(dp.x,dp.y,'Geheimgang!','#c9a8e8');
      G.floor.rooms[door.to].seen=true;
    }
  }
  // Kettenreaktion
  for(const b of G.bombs){ if(!b.dead&&dist(b,{x,y})<rad){ b.t=Math.min(b.t,0.1); } }
}

/* Ein aufgebrochener Kothaufen gibt entweder Beute her — oder es krabbelt
   ein Kotkrabbler heraus. Die Chance darauf steigt mit der Etagentiefe.
   Räume, die bereits geschafft sind, bleiben geschafft: updateDoorsOpen
   setzt cleared nie zurück, man wird also nicht nachträglich eingesperrt. */
function kothaufenAufgebrochen(x,y){
  if(frand.chance(0.18)) spawnPickup(x,y,randomDrop());
  else if(frand.chance(0.10+G.depth*0.03)){
    spawnEnemy('kotkrabbler',x,y,null);
    burst(x,y,'#63492e',6); Sfx.splash();
  }
}

/* --- Bodengefahren: Stacheln, Feuer, Pfützen --- */
function groundHazards(p,dt){
  if(p.flags.has('flight')) return;
  const cell=G.room.grid[clamp(pr(p.y),0,ROWS-1)]?.[clamp(pc(p.x),0,COLS-1)];
  if(cell&&cell.t==='spike'&&!p.flags.has('spikeimmun')){
    if(hurtPlayer(1)&&G.room.type==='sacrifice') sacrificeReward();
  }
  const fh=circleHitsGrid(p.x,p.y,p.r,'fly'); // Feuer ist solide; Berührung prüfen
  if(fh&&fh.cell.t==='fire') hurtPlayer(1);
  p.imNetz=false; p.inSporen=false; p.aufGlatt=false;
  for(const c of G.creeps){
    if(!c.feindlich||dist(p,c)>=c.r) continue;
    if(c.netz){ p.imNetz=true; continue; }        // bremst, verletzt aber nicht
    if(c.sporen){ p.inSporen=true; continue; }    // nimmt die Sicht
    if(c.glatt){ p.aufGlatt=true; continue; }     // Häutlingsspur: man rutscht
    if(!p.flags.has('spikeimmun')) hurtPlayer(1);
  }
}
function sacrificeReward(){
  const room=G.room; room.sacrificeCount++;
  if(room.sacrificeCount>=3&&!room.sacRewarded){
    room.sacRewarded=true;
    room.pedestals.push({x:tx(6),y:ty(1),itemId:pickFromPool('secret')});
    addText(tx(6),ty(2),'Das Opfer wurde angenommen','#ffd75a'); Sfx.item();
  } else if(frand.chance(0.4)) spawnPickup(tx(6)+frand.range(-20,20),ty(4),randomDrop());
}

/* --- Pickups --- */
function spawnPickup(x,y,type){ G.pickups.push({x,y,type}); }
function touchThings(p,dt){
  // Pickups. Über eine Kopie laufen: beim Aufheben können neue Pickups
  // entstehen (Truheninhalt, getauschte Pille), die sonst noch im selben
  // Frame wieder eingesammelt würden — beim Tausch endlos.
  for(const q of [...G.pickups]){
    if(q.dead) continue;
    if(q.cd>0){ q.cd-=dt; continue; }
    if(dist(p,q)>p.r+9) continue;
    if(q.price){ // Shopware
      if(p.coins>=q.price){ p.coins-=q.price; q.price=0; collectPickup(q); }
      continue;
    }
    collectPickup(q);
  }
  G.pickups=G.pickups.filter(q=>!q.dead);
  // Item-Podeste. Kopie + Sperre: ein getauschtes Aktivitem landet wieder auf
  // dem Podest, auf dem man noch steht — ohne Sperre tauscht man endlos hin und her.
  for(const pd of [...G.room.pedestals]){
    if(pd.taken) continue;
    if(pd.cd>0){ pd.cd-=dt; continue; }
    if(dist(p,pd)>p.r+11) continue;
    if(pd.price&&p.coins<pd.price) continue;
    if(pd.herzPreis){                        // Teufelshandel: bezahlt wird mit Leben
      if(!herzPreisZahlen(pd.herzPreis)) continue;
      G.deals++;                             // ab jetzt kein Engel mehr
      unlock('teufel');
      G.shake=Math.max(G.shake,7);
      addText(pd.x,pd.y-20,'Handel besiegelt','#c03a5a');
    }
    if(pd.price){p.coins-=pd.price;}
    pd.taken=true; acquireItem(pd.itemId,pd);
  }
  // Automaten
  for(const m of G.room.machines){
    m.cd=Math.max(0,m.cd-dt);
    if(m.broken||m.cd>0) continue;
    if(dist(p,m)>p.r+13) continue;
    useMachine(m);
  }
  // Falltür
  if(G.room.trapdoor&&dist(p,{x:tx(8),y:ty(3)})<14&&!G.trans){
    nextFloor();
  }
}
/* Herzcontainer dazugeben. Gibt zurück, wie viele halbe Container wirklich
   Platz hatten — bei zwölf Herzen ist Schluss, der Rest verfällt. Alles, was
   redMax erhöht, muss durch diese Tür. */
/* Heilung an einer Stelle bündeln, damit das Stahlherz überall greift. */
function heileSpieler(halbe){
  const p=G.player;
  /* Stahlherz und Fluch des Hungers halbieren beide — zusammen bleibt es
     bei der Hälfte, sie stapeln sich nicht zu null. */
  const halbiert=p.flags.has('halbheilung')||fluchAktiv('hunger');
  const wirkung=halbiert?Math.max(1,Math.round(halbe*0.5)):halbe;
  const vorher=p.red;
  p.red=Math.min(p.redMax,p.red+wirkung);
  return p.red-vorher;
}
function containerDazu(halbe,heilen){
  const p=G.player, grenze=MAX_HERZEN*2;
  const platz=Math.max(0,grenze-p.redMax);
  const dazu=Math.min(halbe,platz);
  p.redMax+=dazu;
  if(heilen==='voll') p.red=p.redMax;
  else p.red=Math.min(p.redMax,p.red+(heilen===undefined?dazu:heilen));
  return dazu;
}

function collectPickup(q){
  const p=G.player;
  /* Bibliothek: die drei Pulte sind ein Angebot, keine Beute. Wer eines
     nimmt, sieht die anderen beiden zerfallen. */
