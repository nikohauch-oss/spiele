    ctx.fillStyle=dunkel;ctx.beginPath();ctx.arc(0,0,2,0,TAU);ctx.fill(); }
  else if(form===5){ for(let i=0;i<5;i++){const a=-Math.PI/2+i*TAU/5;
      ctx.beginPath();ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(a)*5,Math.sin(a)*5);
      ctx.lineTo(Math.cos(a+0.6)*2,Math.sin(a+0.6)*2);ctx.fill();} }
  else if(form===6){ ctx.fillRect(-4.5,-4.5,4,4); ctx.fillRect(0.5,-4.5,4,4);
    ctx.fillRect(-4.5,0.5,4,4); ctx.fillRect(0.5,0.5,4,4); }
  else { ctx.beginPath();ctx.moveTo(-4.5,3.5);ctx.quadraticCurveTo(0,-6,4.5,3.5);ctx.closePath();ctx.fill(); }
  ctx.restore();
  // Glanzpunkt
  rrect(x-5*s,y-5*s,2*s,2*s,'rgba(255,255,255,0.45)');
}

/* --- Raum zeichnen --- */
function drawRoom(){
  const F=G.floor.data;
  // Boden (Schachbrett)
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)
    rrect(RX+c*TILE,RY+r*TILE,TILE,TILE,(r+c)%2?F.fa:F.fb);
  // Spezialraum-Bodenfärbung
  if(G.room.type==='treasure') { ctx.fillStyle='rgba(212,175,55,0.05)'; ctx.fillRect(RX,RY,COLS*TILE,ROWS*TILE); }
  if(G.room.type==='curse')    { ctx.fillStyle='rgba(160,30,30,0.08)';  ctx.fillRect(RX,RY,COLS*TILE,ROWS*TILE); }
  if(G.room.type==='secret')   { ctx.fillStyle='rgba(120,80,200,0.06)'; ctx.fillRect(RX,RY,COLS*TILE,ROWS*TILE); }
  // Wände
  ctx.fillStyle=F.wall;
  ctx.fillRect(RX-26,RY-26,COLS*TILE+52,26);
  ctx.fillRect(RX-26,RY+ROWS*TILE,COLS*TILE+52,26);
  ctx.fillRect(RX-26,RY-26,26,ROWS*TILE+52);
  ctx.fillRect(RX+COLS*TILE,RY-26,26,ROWS*TILE+52);
  ctx.strokeStyle=F.accent;ctx.lineWidth=2;
  ctx.strokeRect(RX-1,RY-1,COLS*TILE+2,ROWS*TILE+2);
  // Ziegel-Struktur
  ctx.fillStyle='rgba(0,0,0,0.15)';
  for(let i=0;i<COLS+2;i+=2){ctx.fillRect(RX-26+i*TILE,RY-26,2,10);ctx.fillRect(RX-26+i*TILE+TILE,RY+ROWS*TILE+14,2,10);}
  // Türen
  for(const d in G.room.doors) drawDoor(d,G.room.doors[d]);
  // Pfützen: gegnerische violett, eigene giftgrün — damit man auf einen Blick
  // sieht, welche einem schadet und welche für einen arbeitet.
  for(const c of G.creeps){
    const a=clamp(c.t/2,0.15,0.5);
    const unten=c.feindlich?`rgba(120,60,160,${a})`:(c.glut?`rgba(210,90,20,${a})`:`rgba(120,200,60,${a})`);
    const oben =c.feindlich?`rgba(170,110,210,${a*0.7})`:(c.glut?`rgba(255,180,60,${a*0.8})`:`rgba(180,240,120,${a*0.7})`);
    ctx.fillStyle=unten;
    ctx.beginPath();ctx.ellipse(c.x,c.y,c.r,c.r*0.6,0,0,TAU);ctx.fill();
    ctx.fillStyle=oben;
    ctx.beginPath();ctx.ellipse(c.x-c.r*0.2,c.y-c.r*0.12,c.r*0.5,c.r*0.28,0,0,TAU);ctx.fill();
  }
  // Raster-Objekte
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const cell=G.room.grid[r][c]; if(!cell) continue;
    const x=RX+c*TILE,y=RY+r*TILE,cx=x+TILE/2,cy=y+TILE/2;
    if(cell.t==='rock'){
      rrect(x+4,y+6,TILE-8,TILE-10,'#55504a');
      rrect(x+6,y+8,TILE-12,TILE-14,'#6e675e');
      rrect(x+9,y+10,8,5,'#8a8276');
    } else if(cell.t==='pit'){
      rrect(x+2,y+2,TILE-4,TILE-4,'#08080c');
      ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.strokeRect(x+2.5,y+2.5,TILE-5,TILE-5);
    } else if(cell.t==='spike'){
      rrect(x+3,y+3,TILE-6,TILE-6,'rgba(0,0,0,0.15)');
      ctx.fillStyle='#9a9a9a';
      for(let i=0;i<3;i++)for(let j=0;j<3;j++){
        const sx=x+8+i*10,sy=y+8+j*10;
        ctx.beginPath();ctx.moveTo(sx,sy+6);ctx.lineTo(sx+3,sy-2);ctx.lineTo(sx+6,sy+6);ctx.fill();}
    } else if(cell.t==='fire'){
      shadow(cx,cy+10,10);
      rrect(x+12,y+22,16,8,'#4a3a2a');
      const fl=Math.sin(performance.now()/90+c*3)*3;
      disc(cx,cy+2+fl*0.3,8,cell.red?'#d43a4a':'#e8862a');
      disc(cx,cy-2+fl*0.5,5,cell.red?'#ff8a6a':'#ffc84a');
      disc(cx,cy-6+fl*0.7,2.5,'#fff2a8');
    } else if(cell.t==='poop'){
      shadow(cx,cy+10,10);
      drawKot(cx,cy+3,10,'#8a6b46','#63492e'); // gleiche Form wie die Kotgegner
      if(cell.hp<2){ctx.strokeStyle='#3d2c19';ctx.lineWidth=1.2; // angeschlagen
        ctx.beginPath();ctx.moveTo(cx-5,cy-3);ctx.lineTo(cx-1,cy+2);
        ctx.lineTo(cx-4,cy+6);ctx.stroke();}
    }
  }
  // Falltür
  if(G.room.trapdoor){
    const x=tx(8),y=ty(3);
    rrect(x-14,y-11,28,22,'#0a0a0a');
    ctx.strokeStyle='#6e675e';ctx.lineWidth=2;ctx.strokeRect(x-14,y-11,28,22);
    txt('▼',x,y,'#6e675e',10);
  }
  // Podeste
  for(const pd of G.room.pedestals){
    if(pd.taken) continue;
    shadow(pd.x,pd.y+8,12);
    rrect(pd.x-10,pd.y,20,8,'#55504a');rrect(pd.x-8,pd.y-4,16,6,'#6e675e');
    const bob=Math.sin(performance.now()/300)*2;
    drawItemIcon(pd.itemId,pd.x,pd.y-14+bob,1.2);
    if(pd.price) txt(pd.price+'¢',pd.x,pd.y+16,'#ffd75a',9);
  }
  // Automaten
  for(const m of G.room.machines){
    shadow(m.x,m.y+14,12);
    const col=m.broken?'#4a4a4a':(m.kind==='slot'?'#b0684a':'#6a4ab0');
    rrect(m.x-12,m.y-16,24,30,col);
    rrect(m.x-9,m.y-12,18,10,'#111');
    txt(m.broken?'X':(m.kind==='slot'?'?':'★'),m.x,m.y-7,m.broken?'#666':'#ffd75a',9);
    rrect(m.x-8,m.y+2,16,4,'#222');
  }
}

/* --- TÜREN ---------------------------------------------------------------
   Gezeichnet wird immer in lokalen Koordinaten, in denen -y nach außen
   (aus dem Raum heraus) zeigt; die Wandseite ergibt sich allein aus der
   Drehung. Aufbau: dunkler Durchgang, davor zwei Türblätter, die beim
   Öffnen zur Seite wegschwenken, darüber der Rahmen in leichter
   Aufsichtsperspektive (außen breiter als innen).                        */
const DOOR_ROT={u:0, d:Math.PI, l:-Math.PI/2, r:Math.PI/2};

function doorStyle(kind){
  switch(kind){
    case 'boss':   return {rahmen:'#4a4038',hell:'#6d5f52',dunkel:'#241e1a',
                           blatt:'#5c4c44',blattTief:'#33292410',schein:'#c03a5a'};
    case 'locked': return {rahmen:'#8a6f2a',hell:'#d4af41',dunkel:'#54410f',
                           blatt:'#b08d33',blattTief:'#7a6021'};
    case 'curse':  return {rahmen:'#5a2424',hell:'#833636',dunkel:'#331313',
                           blatt:'#6a2a2a',blattTief:'#431a1a',schein:'#c03a5a'};
    case 'secret': return {rahmen:'#4a4a52',hell:'#65656f',dunkel:'#2b2b31',
                           blatt:'#4a4a52',blattTief:'#2b2b31'};
    default:       return {rahmen:'#6b5b47',hell:'#8d7862',dunkel:'#42382c',
                           blatt:'#7a6448',blattTief:'#4e3f2c'};
  }
}
function poly(pts,color){
  ctx.fillStyle=color; ctx.beginPath();
  ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath(); ctx.fill();
}
// Rahmen als Ring: äußeres Polygon minus Öffnung
function polyRing(aussen,innen,color){
  ctx.fillStyle=color; ctx.beginPath();
  ctx.moveTo(aussen[0][0],aussen[0][1]);
  for(let i=1;i<aussen.length;i++) ctx.lineTo(aussen[i][0],aussen[i][1]);
  ctx.closePath();
  ctx.moveTo(innen[0][0],innen[0][1]);
  for(let i=innen.length-1;i>=1;i--) ctx.lineTo(innen[i][0],innen[i][1]);
  ctx.closePath();
  ctx.fill('evenodd');
}

function drawDoor(d,door){
  const e=door.edge;
  if(e.kind==='secret'&&!e.revealed) return; // steckt unsichtbar in der Wand
  const dp=doorXY(d), st=doorStyle(e.kind);
  const a=clamp(door.anim===undefined?(doorPassable(door)?1:0):door.anim,0,1);

  // Rahmenform: außen (-14) breiter als innen (+13)
  const AUSSEN=[[-24,-14],[24,-14],[20,13],[-20,13]];
  const OEFFN =[[-16,-11],[16,-11],[13,12],[-13,12]];

  ctx.save();
  ctx.translate(dp.x,dp.y);
  ctx.rotate(DOOR_ROT[d]);

  // Durchgang
  poly(OEFFN,'#07070a');
  // Bossräume glühen rot aus dem Spalt
  if(st.schein&&a>0.05){
    const g=ctx.createLinearGradient(0,-11,0,12);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(1,`rgba(192,58,90,${0.30*a})`);
    ctx.fillStyle=g; ctx.beginPath();
    ctx.moveTo(-16,-11);ctx.lineTo(16,-11);ctx.lineTo(13,12);ctx.lineTo(-13,12);
    ctx.closePath(); ctx.fill();
  }

  // Türblätter — schwenken beim Öffnen nach außen zur Seite weg
  if(a<0.98){
    const b=14*(1-a*0.88);        // sichtbare Blattbreite
    const weg=a*2.5;              // Versatz nach außen
    for(const s of [-1,1]){
      const x0=s*(0.8+weg), x1=s*(0.8+weg+b), x2=s*(0.8+weg+b*0.84);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(x0,-10.5); ctx.lineTo(x1,-11); ctx.lineTo(x2,11.5); ctx.lineTo(x0,11.5);
      ctx.closePath(); ctx.clip();
      ctx.fillStyle=st.blatt; ctx.fillRect(-30,-12,60,26);
      // Maserung / Beschläge
      ctx.fillStyle=st.blattTief;
      for(let y=-7;y<11;y+=6) ctx.fillRect(-30,y,60,1.2);
      ctx.fillStyle='rgba(255,255,255,0.10)';
      ctx.fillRect(-30,-11,60,1.5);
      ctx.restore();
      // Außenkante des Blattes betonen
      ctx.strokeStyle=st.blattTief; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x1,-11); ctx.lineTo(x2,11.5); ctx.stroke();
    }
    // Vorhängeschloss bei verschlossenen Türen
    if(e.locked){
      ctx.strokeStyle='#c8a032'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,-2.5,3.2,Math.PI,0); ctx.stroke();
      rrect(-4.5,-1,9,8,'#d4af37');
      rrect(-4.5,-1,9,2,'#f0d98a');
      disc(0,3,1.6,'#4a3a10');
      ctx.fillStyle='#4a3a10'; ctx.fillRect(-0.7,3,1.4,3);
    }
  }

  // Rahmen über die Blätter legen
  polyRing(AUSSEN,OEFFN,st.rahmen);
  // Lichtkante oben, Schattenkante unten
  poly([[-24,-14],[24,-14],[22,-11],[-22,-11]],st.hell);
  poly([[-20,11],[20,11],[20,13],[-20,13]],st.dunkel);
  // Steinfugen im Rahmen
  ctx.fillStyle=st.dunkel;
  ctx.fillRect(-21,-6,4.5,1.2); ctx.fillRect(16.5,-6,4.5,1.2);
  ctx.fillRect(-20,2,4,1.2);    ctx.fillRect(16,2,4,1.2);

  /* Typ-Verzierungen. Alles bleibt innerhalb von y >= -12: die untere
     Raumwand endet knapp am Bildrand, nach außen ragende Zierrat würde
     dort abgeschnitten. */
  if(e.kind==='boss'){                       // Schädel im Türsturz
    disc(0,-8,4.2,'#d8d0c0');
    rrect(-3,-6.5,6,2.6,'#d8d0c0');
    disc(-1.7,-8.5,1.2,'#241e1a'); disc(1.7,-8.5,1.2,'#241e1a');
    ctx.fillStyle='#241e1a';
    ctx.fillRect(-1.7,-5.2,0.9,1.8); ctx.fillRect(0.8,-5.2,0.9,1.8);
    disc(-18,-12,1.8,'#8a7a66'); disc(18,-12,1.8,'#8a7a66'); // Nieten
  } else if(e.kind==='locked'){               // goldene Nieten
    for(const nx of [-18,-9,9,18]) disc(nx,-12,1.5,'#f0d98a');
  } else if(e.kind==='curse'){                // Zähne, die in die Öffnung ragen
    ctx.fillStyle='#b0b0b8';
    for(let i=-2;i<=2;i++){ const x=i*7;
      ctx.beginPath(); ctx.moveTo(x-2.6,-11.5); ctx.lineTo(x,-5.5); ctx.lineTo(x+2.6,-11.5);
      ctx.closePath(); ctx.fill(); }
  } else if(e.kind==='secret'){               // aufgesprengter Mauerriss
    ctx.strokeStyle='#1c1c22'; ctx.lineWidth=1.4;
    ctx.beginPath();
    ctx.moveTo(-21,-11); ctx.lineTo(-13,-7); ctx.lineTo(-17,-1); ctx.lineTo(-9,4);
    ctx.moveTo(21,-11);  ctx.lineTo(14,-6);  ctx.lineTo(18,0);   ctx.lineTo(10,5);
    ctx.stroke();
    for(const bx of [-19,-8,9,19]) disc(bx,10,1.3,'#1c1c22'); // Schutt
  }
  ctx.restore();
}

/* --- Spielfigur -----------------------------------------------------------
   Großer runder Kopf auf kleinem Körper, Beine treten im Laufen abwechselnd,
   die Pupillen folgen der Schussrichtung. Die Frisur unterscheidet die
   Charaktere und wird über `frisur` in CHARS gewählt.
   Die Funktion wird auch von der Charakterauswahl benutzt, damit Vorschau
   und Spielfigur garantiert gleich aussehen.                                */
function zeichneFrisur(c,x,ky,schritt){
  const haar=c.haar||c.hood;
  ctx.fillStyle=haar;
  if(c.frisur==='stachel'){                       // kurze Stacheln
    for(let i=-2;i<=2;i++){
      const bx=x+i*3.0;
      ctx.beginPath();
      ctx.moveTo(bx-2.3, ky-5.0);
      ctx.lineTo(bx+i*0.6, ky-11.0+Math.abs(i)*1.7);
      ctx.lineTo(bx+2.3, ky-5.0);
      ctx.closePath(); ctx.fill();
    }
    ctx.beginPath(); ctx.ellipse(x,ky-4.8,8.2,3.8,0,0,TAU); ctx.fill();
  } else if(c.frisur==='zotteln'){                // Zotteln mit wippenden Büscheln
    ctx.beginPath(); ctx.ellipse(x,ky-4.4,8.7,4.6,0,0,TAU); ctx.fill();
    for(const s of [-1,1]){
      ctx.beginPath();
      ctx.ellipse(x+s*7.8, ky-1.0+schritt*s*0.9, 2.7, 4.6, s*0.32, 0, TAU);
      ctx.fill();
    }
    ctx.fillStyle='rgba(0,0,0,0.18)';             // Ponyfransen
    for(let i=-2;i<=2;i++) ctx.fillRect(x+i*3.1-0.6, ky-7.4, 1.2, 3.2);
  } else if(c.frisur==='schleier'){               // geisterhafte Schleier
    ctx.globalAlpha=0.8;
    ctx.beginPath(); ctx.ellipse(x,ky-4.8,8.5,4.2,0,0,TAU); ctx.fill();
    for(const s of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(x+s*7.4, ky-4);
      ctx.quadraticCurveTo(x+s*11.2, ky+2, x+s*6.8, ky+7.5);
      ctx.quadraticCurveTo(x+s*5.8, ky+1, x+s*5.4, ky-3);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha=1;
  } else {                                        // Kapuze
    ctx.beginPath(); ctx.arc(x,ky-0.6,8.7,Math.PI*1.00,Math.PI*2.00); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x,ky-6.0,8.3,3.6,0,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(x,ky-4.6,8.0,2.0,0,0,TAU); ctx.fill();
  }
}

function zeichneCharakter(c,x,y,z){
  const schritt=z.schritt||0, aim=z.aim||{x:0,y:1};
  const ky=y-9-(z.hub||0);          // Kopfmitte
  const by=y+1-(z.hub||0)*0.4;      // Körpermitte

  if(!z.schwebt){                   // Beine
    ctx.fillStyle=c.hood;
    for(const s of [-1,1]){
      const versatz=(s>0?schritt:-schritt)*1.7;
      ctx.beginPath(); ctx.ellipse(x+s*3.3, y+7+versatz, 2.5, 3.1, 0,0,TAU); ctx.fill();
    }
  } else {                          // Schweif statt Beine
    ctx.fillStyle=c.hood; ctx.globalAlpha=0.55;
    ctx.beginPath();
    ctx.moveTo(x-5, by+2);
    ctx.quadraticCurveTo(x-3, y+10, x, y+8);
    ctx.quadraticCurveTo(x+3, y+10, x+5, by+2);
    ctx.closePath(); ctx.fill(); ctx.globalAlpha=1;
  }

  // Körper
  ctx.fillStyle=c.hood;
  ctx.beginPath(); ctx.ellipse(x, by+2, 5.3, 5.7, 0,0,TAU); ctx.fill();
  // Arme
  if(z.armeHoch){
    ctx.fillStyle=c.color;
    for(const s of [-1,1]){
      ctx.beginPath(); ctx.ellipse(x+s*5.4, by-4.5, 2.0, 4.2, s*0.45, 0, TAU); ctx.fill();
    }
  } else {
    disc(x-5.6, by+1.5, 2.1, c.color);
    disc(x+5.6, by+1.5, 2.1, c.color);
  }

  // Kopf mit weicher Schattierung
  disc(x, ky, 8.5, c.color);
  ctx.fillStyle='rgba(0,0,0,0.10)';
  ctx.beginPath(); ctx.ellipse(x, ky+3.6, 7.4, 4.0, 0,0,TAU); ctx.fill();

  // Augen: Pupillen folgen der Schussrichtung
  const px0=clamp(aim.x,-1,1)*1.8, py0=clamp(aim.y,-1,1)*1.5;
  for(const s of [-1,1]){
    const ex=x+s*3.5, ey=ky-0.4;
    if(z.blinzelt){ ctx.fillStyle='#2a2028'; ctx.fillRect(ex-2.3, ey-0.4, 4.6, 1.3); }
    else {
      disc(ex, ey, 2.7, '#f6f0f2');
      disc(ex+px0, ey+py0, 1.5, '#241c22');
      disc(ex+px0-0.5, ey+py0-0.6, 0.55, '#ffffff');
    }
  }
  // Mund: normal ein Strich, bei Schaden aufgerissen
  if(z.wehklagt){ disc(x, ky+4.8, 2.0, '#2a2028'); }
  else { ctx.fillStyle='#2a2028'; ctx.fillRect(x-1.7, ky+4.5, 3.4, 1.1); }

  zeichneFrisur(c,x,ky,schritt);
}

function drawPlayer(p){
  if(p.dead) return;
  if(p.iframes>0&&Math.floor(p.iframes*12)%2===0&&!p.itemGet) return; // Blinken
  const c=p.char;
  const geht=Math.hypot(p.vx,p.vy)>12;
  const takt=p.anim*11;
  const schwebt=c.id==='schemen'||p.flags.has('flight');
  const hub=schwebt?Math.sin(p.anim*3)*1.6:(geht?Math.abs(Math.sin(takt))*1.3:0);
  // gelegentliches Blinzeln
  const bz=(p.anim*0.8)%5;
  shadow(p.x,p.y+10,schwebt?6:7.5);
  zeichneCharakter(c,p.x,p.y,{
    schritt:geht?Math.sin(takt):0, hub, aim:p.aimDir, schwebt,
    armeHoch:!!p.itemGet, wehklagt:p.hitFlash>0, blinzelt:bz<0.12});

  if(p.shield>0) ring(p.x,p.y-5,15,`rgba(120,200,255,${0.4+Math.sin(p.anim*12)*0.2})`,2);
  // Höllenstrahl-Ladeanzeige
  if(p.flags.has('beam')&&p.beamCharge>0){
    rrect(p.x-8,p.y-24,16,3,'#222');
    rrect(p.x-8,p.y-24,16*p.beamCharge,3,p.beamCharge>=1?'#ff5a3a':'#e8862a');
  }
  if(p.itemGet) drawItemIcon(p.itemGet.id,p.x,p.y-28,1.3);
}

function drawFamiliar(f){
  shadow(f.x,f.y+7,5);
  if(f.kind==='shadow'){ disc(f.x,f.y-3,6,'#2a2a3a'); disc(f.x-2,f.y-4,1.2,'#8ab4e8'); disc(f.x+2,f.y-4,1.2,'#8ab4e8'); }
  if(f.kind==='orbit'){ disc(f.x,f.y,5,'#8ab4e8'); ring(f.x,f.y,5,'#3a5a8a',1.5); }
  if(f.kind==='bug'){ disc(f.x,f.y,5,'#5a7a2a'); disc(f.x-2,f.y-2,1,'#111'); disc(f.x+2,f.y-2,1,'#111'); }
  if(f.kind==='rat'){ disc(f.x,f.y-2,5,'#8a8276'); disc(f.x+4,f.y-4,2,'#8a8276'); disc(f.x-2,f.y-3,1,'#111'); }
  if(f.kind==='bird'){ const fl=Math.sin(performance.now()/80)*2;
    disc(f.x,f.y+fl,5,'#b0684a'); ctx.fillStyle='#8a4a2a';
    ctx.beginPath();ctx.moveTo(f.x-5,f.y+fl);ctx.lineTo(f.x-10,f.y-3+fl);ctx.lineTo(f.x-4,f.y-3+fl);ctx.fill();
    disc(f.x+2,f.y-1+fl,1,'#111'); }
  if(f.kind==='frostgeist'){                    // schwebender Eisgeist
    const fl=Math.sin(performance.now()/300)*1.5;
    ctx.globalAlpha=0.85;
    disc(f.x,f.y-3+fl,6,'#bfe8ff');
    ctx.fillStyle='#bfe8ff';                    // ausgefranster Schweif
    ctx.beginPath(); ctx.moveTo(f.x-6,f.y-2+fl);
    ctx.lineTo(f.x-4,f.y+6+fl); ctx.lineTo(f.x,f.y+3+fl);
    ctx.lineTo(f.x+4,f.y+6+fl); ctx.lineTo(f.x+6,f.y-2+fl); ctx.fill();
    ctx.globalAlpha=1;
    disc(f.x-2,f.y-4+fl,1.1,'#2a4a6a'); disc(f.x+2,f.y-4+fl,1.1,'#2a4a6a');
  }
  if(f.kind==='motte'){                         // Glutmotte mit Flügelschlag
    const w=Math.sin(performance.now()/45)*3;
    ctx.fillStyle='rgba(255,190,110,0.55)';
    ctx.beginPath(); ctx.ellipse(f.x-5,f.y-2-w*0.3,4.5,2.6,-0.5,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(f.x+5,f.y-2+w*0.3,4.5,2.6, 0.5,0,TAU); ctx.fill();
    disc(f.x,f.y,3.6,'#c8681f'); disc(f.x,f.y-2,2.4,'#ff9a3a');
    disc(f.x-1.2,f.y-2.6,0.8,'#2a1a0a'); disc(f.x+1.2,f.y-2.6,0.8,'#2a1a0a');
  }
  if(f.kind==='panzer'){                        // Schildpanzer, blitzt beim Block
    const hell=f.blockT>0;
    disc(f.x,f.y,7.5,hell?'#ffffff':'#8a8276');
    disc(f.x,f.y-1,6,hell?'#e8e0d0':'#a9a294');
    ctx.strokeStyle=hell?'#ffffff':'#6a6459'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(f.x,f.y-1,6,0,TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(f.x,f.y-7); ctx.lineTo(f.x,f.y+5); ctx.stroke();
    disc(f.x-2.5,f.y+1,1,'#3a3630'); disc(f.x+2.5,f.y+1,1,'#3a3630');
  }
  if(f.kind==='spaeher'){                       // fliegendes Auge
    const fl=Math.sin(performance.now()/200)*1.2;
    disc(f.x,f.y+fl,6,'#e8e0d8');
    const p=G.player, a=Math.atan2(f.vy||0,f.vx||1);
    disc(f.x,f.y+fl,3.2,'#6a9ac0'); disc(f.x,f.y+fl,1.6,'#111');
    ctx.strokeStyle='rgba(200,220,240,0.6)'; ctx.lineWidth=1.2;   // Flügelchen
    const w=Math.sin(performance.now()/50)*2.5;
    ctx.beginPath(); ctx.moveTo(f.x-5,f.y-3+fl); ctx.lineTo(f.x-10,f.y-6-w+fl);
    ctx.moveTo(f.x+5,f.y-3+fl); ctx.lineTo(f.x+10,f.y-6-w+fl); ctx.stroke();
  }
}

/* Gestapelte Wülste mit Spitze — Grundform für Kotkrabbler, Kotspritzer
   und den Kloakenfürsten. r ist der Radius des untersten Wulstes. */
function drawKot(x,y,r,hell,dunkel){
  // Jeder Wulst: dunkle Grundscheibe, darüber die hellere versetzt — der
  // stehenbleibende dunkle Rand unten trennt die Wülste sichtbar voneinander.
  disc(x, y+r*0.46, r,       dunkel);
  disc(x, y+r*0.31, r*0.90,  hell);
  disc(x, y-r*0.14, r*0.74,  dunkel);
  disc(x, y-r*0.28, r*0.65,  hell);
  disc(x, y-r*0.62, r*0.48,  dunkel);
  disc(x, y-r*0.74, r*0.40,  hell);
  ctx.fillStyle=dunkel;                     // umgeknickte Spitze
  ctx.beginPath();
  ctx.moveTo(x-r*0.26, y-r*0.96);
  ctx.quadraticCurveTo(x+r*0.14, y-r*1.66, x+r*0.36, y-r*1.02);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle=hell;
  ctx.beginPath();
  ctx.moveTo(x-r*0.16, y-r*1.00);
  ctx.quadraticCurveTo(x+r*0.12, y-r*1.52, x+r*0.28, y-r*1.06);
  ctx.closePath(); ctx.fill();
  // Glanzlicht oben links
  ctx.fillStyle='rgba(255,255,255,0.16)';
  ctx.beginPath(); ctx.ellipse(x-r*0.30,y-r*0.80,r*0.16,r*0.10,-0.5,0,TAU); ctx.fill();
}

function drawEnemy(e){
  const alpha=e.ghosted?0.25:1;
  ctx.save(); ctx.globalAlpha=alpha;
  if(!e.fly&&!e.ghosted) shadow(e.x,e.y+e.r*0.8,e.r*0.8);
  else if(e.fly) shadow(e.x,e.y+e.r+6,e.r*0.6);
  const y=e.y-(e.z||0);
  let body='#a05a5a';
  const T=e.type;
  const flash=e.flash>0;
  const tint=e.champ?e.champ.tint:null;
  const col=c=>flash?'#ffffff':(tint||c);
  switch(T){
    case 'blobling': case 'miniblob':
      disc(e.x,y,e.r,col('#7a9a3f'));disc(e.x,y-2,e.r*0.7,col('#94b455'));
      disc(e.x-e.r*0.35,y-2,1.5,'#111');disc(e.x+e.r*0.35,y-2,1.5,'#111');break;
    case 'huepfer':
      disc(e.x,y,e.r,col('#5a7a9a'));
      rrect(e.x-e.r,y+2,4,5,col('#4a6a8a'));rrect(e.x+e.r-4,y+2,4,5,col('#4a6a8a'));
      disc(e.x-3,y-3,1.8,'#111');disc(e.x+3,y-3,1.8,'#111');break;
    case 'spucker':
      disc(e.x,y,e.r,col('#9a6a4a'));
      disc(e.x,y+2,4,'#3a1a1a'); // offenes Maul
      disc(e.x-4,y-4,1.8,'#111');disc(e.x+4,y-4,1.8,'#111');break;
    case 'wanderauge':
      disc(e.x,y,e.r,col('#d8d0c8'));disc(e.x,y,5,'#8a2a2a');disc(e.x,y,2.5,'#111');
      ring(e.x,y,e.r,'#8a8276',1);break;
    case 'mauerkriecher':
      rrect(e.x-e.r,y-6,e.r*2,12,col('#6a5a8a'));
      for(let i=-1;i<=1;i++){disc(e.x+i*6,y+6,2.5,col('#5a4a7a'));}
      disc(e.x-3,y-2,1.5,'#e8d75a');disc(e.x+3,y-2,1.5,'#e8d75a');break;
    case 'rennratte':
      disc(e.x,y,e.r,col('#8a8276'));disc(e.x+(e.vx>0?5:-5),y-2,4,col('#9a927f'));
      disc(e.x-3,y-3,1.5,'#c03a5a');disc(e.x+3,y-3,1.5,'#c03a5a');break;
    case 'sporling':
      disc(e.x,y,e.r*0.8,col('#b0a8d0'));
      disc(e.x,y-6,e.r,col('#8a4ab0'));disc(e.x-3,y-7,2,col('#b07ad0'));
      disc(e.x-2,y,1.3,'#111');disc(e.x+2,y,1.3,'#111');break;
    case 'knochenwurf':
      disc(e.x,y,e.r,col('#cfc9b8'));
      rrect(e.x-5,y-2,10,2,'#8a8276');
      disc(e.x-3.5,y-4,2,'#111');disc(e.x+3.5,y-4,2,'#111');break;
    case 'zuckfliege': {
      disc(e.x,y,e.r,col('#4a4a4a'));
      const flap=Math.sin(performance.now()/40)*3;
      ctx.strokeStyle='rgba(200,200,220,0.7)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(e.x-3,y-3);ctx.lineTo(e.x-8,y-6-flap);ctx.moveTo(e.x+3,y-3);ctx.lineTo(e.x+8,y-6-flap);ctx.stroke();
      disc(e.x-2,y-1,1.3,'#c03a5a');disc(e.x+2,y-1,1.3,'#c03a5a');break; }
    case 'steinmaul':
      rrect(e.x-e.r,y-e.r+3,e.r*2,e.r*2-4,col('#55504a'));
      rrect(e.x-e.r+3,y-e.r+6,e.r*2-6,e.r*2-10,col('#6e675e'));
      disc(e.x,y,4.5,'#111');
      disc(e.x-6,y-6,1.8,'#c03a5a');disc(e.x+6,y-6,1.8,'#c03a5a');break;
    case 'doppelding':
      disc(e.x-4,y,e.r*0.75,col('#5a7a9a'));disc(e.x+4,y,e.r*0.75,col('#5a7a9a'));
      disc(e.x-5,y-2,1.5,'#111');disc(e.x+3,y-2,1.5,'#111');break;
    case 'schleicher':
      disc(e.x,y,e.r,col('#b8c4d8'));
      ctx.fillStyle=col('#b8c4d8');
      ctx.beginPath();ctx.moveTo(e.x-e.r,y+2);ctx.lineTo(e.x-e.r,y+8);ctx.lineTo(e.x,y+4);ctx.lineTo(e.x+e.r,y+8);ctx.lineTo(e.x+e.r,y+2);ctx.fill();
      disc(e.x-3,y-2,2,'#111');disc(e.x+3,y-2,2,'#111');break;
    case 'brutmutter':
      disc(e.x,y,e.r,col('#b06a8a'));disc(e.x,y+3,e.r*0.6,col('#d08aaa'));
      disc(e.x-4,y-5,1.8,'#111');disc(e.x+4,y-5,1.8,'#111');
      for(let i=0;i<3;i++)disc(e.x-5+i*5,y+3,1.5,'#8a4a6a');break;
    case 'stachelkugel':
      disc(e.x,y,e.r,col('#7a7a8a'));
      ctx.fillStyle=col('#9a9aaa');
      for(let i=0;i<8;i++){const a=i*TAU/8+performance.now()/400;
        ctx.beginPath();ctx.moveTo(e.x+Math.cos(a)*e.r*0.7,y+Math.sin(a)*e.r*0.7);
        ctx.lineTo(e.x+Math.cos(a)*(e.r+5),y+Math.sin(a)*(e.r+5));
        ctx.lineTo(e.x+Math.cos(a+0.4)*e.r*0.7,y+Math.sin(a+0.4)*e.r*0.7);ctx.fill();}
      disc(e.x-3,y-2,1.5,'#c03a5a');disc(e.x+3,y-2,1.5,'#c03a5a');break;
    case 'pulsqualle':
      disc(e.x,y,e.r,col('#6ab0c0'));
      ctx.fillStyle='rgba(106,176,192,0.4)';
      for(let i=-2;i<=2;i++){const sw=Math.sin(performance.now()/200+i)*3;
        ctx.fillRect(e.x+i*4-1,y+e.r-2,2,8+sw);}
      disc(e.x-3,y-2,1.5,'#111');disc(e.x+3,y-2,1.5,'#111');break;
    case 'kotkrabbler': {
      drawKot(e.x,y,e.r*0.95,col('#8a6b46'),col('#63492e'));
      disc(e.x-2.8,y-2,1.7,'#f0ece0'); disc(e.x+2.8,y-2,1.7,'#f0ece0');
      disc(e.x-2.8,y-2,0.9,'#111');    disc(e.x+2.8,y-2,0.9,'#111');
      ctx.fillStyle='#111'; ctx.fillRect(e.x-1.8,y+2.5,3.6,1); break; }
    case 'kotspritzer': {
      drawKot(e.x,y,e.r*0.95,col('#7a5b3a'),col('#553d24'));
      disc(e.x-4,y-3,2.2,'#f0ece0'); disc(e.x+4,y-3,2.2,'#f0ece0');
      disc(e.x-4,y-3,1.1,'#111');    disc(e.x+4,y-3,1.1,'#111');
      disc(e.x,y+3.5,3,'#2e2114');   // offenes Maul zum Spucken
      break; }
    case 'grabgraeber':
      if(e.ghosted){ // Erdhügel
        ctx.globalAlpha=1;
        disc(e.x,e.y+4,7,'#5a4a3a');disc(e.x,e.y+2,5,'#6a5a4a');
      } else {
        disc(e.x,y,e.r,col('#8a6a4a'));
        rrect(e.x-6,y+2,12,4,col('#6a4a2a'));
        disc(e.x-3,y-3,1.8,'#e8d75a');disc(e.x+3,y-3,1.8,'#e8d75a');
        ctx.fillStyle='#d8d0c8'; // Krallen
        ctx.beginPath();ctx.moveTo(e.x-8,y+4);ctx.lineTo(e.x-11,y+8);ctx.lineTo(e.x-6,y+6);ctx.fill();
        ctx.beginPath();ctx.moveTo(e.x+8,y+4);ctx.lineTo(e.x+11,y+8);ctx.lineTo(e.x+6,y+6);ctx.fill();
      }
      break;
    default: // Bosse
      drawBossSprite(e,y,col);
  }
  /* Statuseffekte: Vergiftete blubbern grün, Brennende lodern, Erfrorene
     bekommen einen Eispanzer. Deutlich sichtbar, damit man die Wirkung der
     Items im Kampf tatsächlich mitbekommt. */
  const takt=performance.now()/1000;
  if(e.poison>0){
    ctx.fillStyle='rgba(120,200,60,0.55)';
    for(let i=0;i<3;i++){
      const ph=(takt*1.5+i*0.37)%1;
      disc(e.x+Math.sin(takt*3+i*2)*e.r*0.6, y-e.r*0.3-ph*(e.r+9), 1.6*(1-ph)+0.7, 'rgba(140,220,80,0.6)');
    }
    ctx.globalAlpha=0.20; disc(e.x,y,e.r+1,'#7ac040'); ctx.globalAlpha=alpha;
  }
  if(e.burn>0){
    for(let i=0;i<3;i++){
      const ph=(takt*2.2+i*0.33)%1;
      const fx0=e.x+Math.sin(takt*7+i*2.1)*e.r*0.5;
      disc(fx0, y-e.r*0.4-ph*(e.r+11), (1-ph)*2.6+0.6, ph<0.45?'rgba(255,214,120,0.75)':'rgba(240,110,40,0.5)');
    }
    ctx.globalAlpha=0.22; disc(e.x,y,e.r+1,'#ff7a2a'); ctx.globalAlpha=alpha;
  }
  if(e.frost>0){
    ctx.globalAlpha=0.32; disc(e.x,y,e.r+1.5,'#9fd8ff'); ctx.globalAlpha=alpha;
    ctx.fillStyle='rgba(220,245,255,0.85)';            // Eiszacken
    for(let i=0;i<4;i++){ const a=i*TAU/4+0.5;
      const bx=e.x+Math.cos(a)*e.r*0.85, by=y+Math.sin(a)*e.r*0.85;
      ctx.beginPath();
      ctx.moveTo(bx-1.6,by+1.2); ctx.lineTo(bx+Math.cos(a)*3.6,by+Math.sin(a)*3.6); ctx.lineTo(bx+1.6,by-1.2);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
}

function drawBossSprite(e,y,col){
  const d=e.def, base=col(d.color);
  if(e.ai==='matsch'){
    disc(e.x,y,e.r,base);disc(e.x,y-4,e.r*0.75,col('#94b455'));
    disc(e.x-7,y-4,3,'#111');disc(e.x+7,y-4,3,'#111');
    ctx.fillStyle='#3a4a1f';ctx.fillRect(e.x-8,y+6,16,3); // Maul
    // Krone (eigene Erfindung: Schlammklumpen-Krone)
    ctx.fillStyle=col('#d4af37');
    ctx.beginPath();ctx.moveTo(e.x-10,y-e.r+2);ctx.lineTo(e.x-10,y-e.r-6);ctx.lineTo(e.x-5,y-e.r);
    ctx.lineTo(e.x,y-e.r-8);ctx.lineTo(e.x+5,y-e.r);ctx.lineTo(e.x+10,y-e.r-6);ctx.lineTo(e.x+10,y-e.r+2);ctx.fill();
  } else if(e.ai==='auge'){
    disc(e.x,y,e.r,col('#d8d0c8'));
    disc(e.x,y,e.r*0.55,base);disc(e.x,y,e.r*0.25,'#111');
    disc(e.x-3,y-3,2,'#fff');
    for(let i=0;i<6;i++){const a=i*TAU/6+performance.now()/600;
      ctx.strokeStyle='#8a5a5a';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(e.x+Math.cos(a)*e.r,y+Math.sin(a)*e.r);
      ctx.lineTo(e.x+Math.cos(a)*(e.r+7),y+Math.sin(a)*(e.r+7));ctx.stroke();}
  } else if(e.ai==='knochen'){
    disc(e.x,y-6,e.r*0.7,col('#cfc9b8')); // Schädel
    rrect(e.x-e.r*0.7,y+2,e.r*1.4,e.r*0.8,col('#b8b2a2'));
    disc(e.x-5,y-8,3,'#111');disc(e.x+5,y-8,3,'#111');
    rrect(e.x-6,y-2,12,2,'#8a8276');
    rrect(e.x-e.r-4,y-2,5,14,col('#cfc9b8')); // Schulterknochen
    rrect(e.x+e.r-1,y-2,5,14,col('#cfc9b8'));
  } else if(e.ai==='gift'){
    disc(e.x,y,e.r,base);disc(e.x,y-4,e.r*0.7,col('#aa6ad0'));
    for(let i=0;i<4;i++){const a=i*TAU/4+performance.now()/500;
      disc(e.x+Math.cos(a)*e.r*0.8,y+Math.sin(a)*e.r*0.8,4,col('#7a3aa0'));}
    disc(e.x-6,y-5,2.5,'#c8ff5a');disc(e.x+6,y-5,2.5,'#c8ff5a');
  } else if(e.ai==='herz'){
    ctx.save();ctx.translate(e.x,y);ctx.scale(e.r/6,e.r/6);
    const pulse=1+Math.sin(performance.now()/(e.enraged?120:250))*0.08;
    ctx.scale(pulse,pulse);
    ctx.fillStyle=e.flash>0?'#fff':(e.variant?'#8a3a5a':'#c03a5a');
    heartPath(0,0);ctx.fill();
    ctx.restore();
    disc(e.x-4,y-2,2,'#111');disc(e.x+4,y-2,2,'#111');
  } else if(e.ai==='kloake'){
    const hell=e.flash>0?'#ffffff':'#7a5b3a', dunkel=e.flash>0?'#e8e8e8':'#553d24';
    drawKot(e.x,y,e.r,hell,dunkel);
    // Augen folgen dem Spieler
    const p=G.player, ax=clamp((p.x-e.x)/70,-1,1), ay=clamp((p.y-e.y)/70,-1,1);
    disc(e.x-8,y-5,4.2,'#f0ece0'); disc(e.x+8,y-5,4.2,'#f0ece0');
    disc(e.x-8+ax*1.6,y-5+ay*1.6,2.1,'#111');
    disc(e.x+8+ax*1.6,y-5+ay*1.6,2.1,'#111');
    // grinsendes Maul
    ctx.strokeStyle='#2e2114'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(e.x,y+2,6,0.25,Math.PI-0.25); ctx.stroke();
    // Fliegenschwarm als Krone — hell genug, um sich vom Boden abzuheben
    for(let i=0;i<5;i++){ const a=performance.now()/280+i*TAU/5;
      const fx=e.x+Math.cos(a)*e.r*0.9, fy=y-e.r*1.2+Math.sin(a*1.7)*5;
      ctx.strokeStyle='rgba(210,210,225,0.55)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(fx-2.5,fy-1.5); ctx.lineTo(fx+2.5,fy-1.5); ctx.stroke();
      disc(fx,fy,1.7,'#1a1a1e');
    }
    // Ab Phase 2 tropft der Fürst
    if(e.phase===2){
      for(let i=0;i<3;i++){
        const dx=(i-1)*e.r*0.55, t=(performance.now()/620+i*0.4)%1;
        disc(e.x+dx, y+e.r*0.5+t*10, 2.2*(1-t*0.5), dunkel);
      }
    }
  } else if(e.ai==='vater'){
    // Endboss: vermummte Riesengestalt
    ctx.fillStyle=e.flash>0?'#fff':d.color;
    ctx.beginPath();ctx.moveTo(e.x-e.r,y+e.r*0.8);ctx.quadraticCurveTo(e.x-e.r,y-e.r,e.x,y-e.r);
    ctx.quadraticCurveTo(e.x+e.r,y-e.r,e.x+e.r,y+e.r*0.8);ctx.fill();
    disc(e.x,y-e.r*0.5,e.r*0.5,e.flash>0?'#fff':'#26263d');
    disc(e.x-6,y-e.r*0.5,3,'#e8d75a');disc(e.x+6,y-e.r*0.5,3,'#e8d75a');
    for(let i=0;i<3;i++){const sw=Math.sin(performance.now()/300+i*2)*4;
      disc(e.x-e.r*0.6+i*e.r*0.6,y+e.r*0.8+4,5+sw*0.3,e.flash>0?'#fff':'#26263d');}
  } else {
    disc(e.x,y,e.r,base);
    disc(e.x-5,y-4,2.5,'#111');disc(e.x+5,y-4,2.5,'#111');
  }
}

function drawPickup(q){
  const bob=Math.sin(performance.now()/300+q.x)*1.5;
  const y=q.y+bob*0.5;
  shadow(q.x,q.y+7,6);
  switch(q.type){
    case 'coin': disc(q.x,y,5,'#ffd75a');ring(q.x,y,5,'#a8862a',1);txt('¢',q.x,y+0.5,'#a8862a',7);break;
    case 'bigcoin': disc(q.x,y,7,'#ffe88a');ring(q.x,y,7,'#a8862a',1.5);txt('5',q.x,y+0.5,'#a8862a',8);break;
    case 'bomb': disc(q.x,y,6,'#2a2a2e');disc(q.x-2,y-2,1.5,'#5a5a6a');
      ctx.strokeStyle='#8a6a2a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(q.x+2,y-5);ctx.quadraticCurveTo(q.x+6,y-9,q.x+4,y-11);ctx.stroke();break;
    case 'key': rrect(q.x-1.5,y-6,3,10,'#ffd75a');disc(q.x,y-6,3.5,'#ffd75a');disc(q.x,y-6,1.5,'#3a2a0a');
      rrect(q.x+1,y+1,3,2,'#ffd75a');rrect(q.x+1,y+4,4,2,'#ffd75a');break;
    case 'heart': ctx.save();ctx.translate(q.x,y);drawHeart(0,0,'full','red');ctx.restore();break;
    case 'halfheart': ctx.save();ctx.translate(q.x,y);ctx.scale(0.7,0.7);drawHeart(0,0,'half','red');ctx.restore();break;
    case 'soulheart': ctx.save();ctx.translate(q.x,y);drawHeart(0,0,'full','soul');ctx.restore();break;
    case 'blackheart': ctx.save();ctx.translate(q.x,y);drawHeart(0,0,'full','black');ctx.restore();break;
    case 'pill': ctx.save();ctx.translate(q.x,y);ctx.rotate(0.5);
      rrect(-6,-3,6,6,'#e85a8a');rrect(0,-3,6,6,'#f0f0f0');ctx.restore();break;
    case 'card': rrect(q.x-5,y-7,10,14,'#e8e0d0');ctx.strokeStyle='#8a7a5a';ctx.strokeRect(q.x-5,y-7,10,14);
      txt('★',q.x,y,'#8a5aa8',8);break;
    case 'chest': drawChest(q.x,y,'#8a6a3a','#6a4a2a');break;
    case 'goldchest': drawChest(q.x,y,'#d4af37','#a8862a');break;
    case 'redchest': drawChest(q.x,y,'#a03a3a','#701a1a');break;
  }
  if(q.price) txt(q.price+'¢',q.x,q.y+16,'#ffd75a',9);
}
function drawChest(x,y,c1,c2){
  rrect(x-9,y-4,18,10,c1);rrect(x-9,y-8,18,5,c2);
  rrect(x-2,y-4,4,5,'#3a2a0a');rrect(x-9,y-4,18,1,'#00000044');
}

function drawTear(t){
  shadow(t.x,t.y+t.z+4,t.r*0.7);
  const y=t.y-t.z+9;
  let c1='#9fd4ef',c2='#5a9ec4';
  if(t.poison){c1='#a8e07a';c2='#5a9a3a';}
  if(t.burn){c1='#ffb347';c2='#e8762a';}
  if(t.frost){c1='#c8f0ff';c2='#7ac4e8';}
  if(t.explosive){c1='#ffb347';c2='#a05a2a';}
  disc(t.x,y,t.r,c2);disc(t.x-t.r*0.25,y-t.r*0.25,t.r*0.6,c1);
}
function drawEshot(s){
  const y=s.y-(s.z||0);
  if(s.arc) shadow(s.x,s.y+3,4);
  disc(s.x,y,s.r,'#c04a4a');disc(s.x-1,y-1,s.r*0.5,'#e88a8a');
}
function drawBeam(b){
  const len=b.len||520;
  const grad=ctx.createLinearGradient(b.x,b.y,b.x+b.dx*len,b.y+b.dy*len);
  grad.addColorStop(0,'rgba(255,80,60,0.95)');grad.addColorStop(1,'rgba(200,30,30,0.7)');
  ctx.strokeStyle=grad;ctx.lineCap='round';
  ctx.lineWidth=b.w*(0.8+Math.sin(performance.now()/30)*0.2);
  ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+b.dx*len,b.y+b.dy*len);ctx.stroke();
  ctx.strokeStyle='rgba(255,220,200,0.9)';ctx.lineWidth=b.w*0.35;
  ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+b.dx*len,b.y+b.dy*len);ctx.stroke();
  ctx.lineCap='butt';
}
function drawLaser(l){
  ctx.strokeStyle=`rgba(120,220,255,${l.t/0.12})`;ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(l.x1,l.y1);ctx.lineTo(l.x2,l.y2);ctx.stroke();
  ctx.strokeStyle=`rgba(255,255,255,${l.t/0.12*0.8})`;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(l.x1,l.y1);ctx.lineTo(l.x2,l.y2);ctx.stroke();
}
function drawBombEnt(b){
  shadow(b.x,b.y+7,7);
  const blink=b.t<0.5&&Math.floor(b.t*10)%2===0;
  disc(b.x,b.y,8,blink?'#c05a4a':'#2a2a2e');
  disc(b.x-2,b.y-2,2,'#5a5a6a');
  ctx.strokeStyle='#8a6a2a';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(b.x+2,b.y-7);ctx.quadraticCurveTo(b.x+7,b.y-12,b.x+5,b.y-14);ctx.stroke();
  disc(b.x+5+frand.range(-1,1),b.y-14+frand.range(-1,1),1.5,'#ffd75a');
}

/* --- HUD --- */
function drawHUD(){
  const p=G.player;
  // Herzen: erst rote Container, dann Seelen-/schwarze Herzen.
  // Umbruch nach 6 pro Reihe, damit sie bei vielen Containern nicht
  // quer über den Bildschirm laufen.
  const PRO_REIHE=6, MAX_REIHEN=3;
  const herzen=[];
  for(let i=0;i<p.redMax/2;i++){
    const v=p.red-i*2;
    herzen.push({fill:v>=2?'full':(v===1?'half':'empty'),type:'red'});
  }
  for(let i=0;i<Math.ceil(p.soul.length/2);i++){
    const idx=i*2;
    herzen.push({fill:p.soul.length-idx===1?'half':'full',
                 type:p.soul[idx]==='B'?'black':'soul'});
  }
  const sichtbar=Math.min(herzen.length,PRO_REIHE*MAX_REIHEN);
  for(let i=0;i<sichtbar;i++){
    drawHeart(14+(i%PRO_REIHE)*14, 14+Math.floor(i/PRO_REIHE)*13, herzen[i].fill, herzen[i].type);
  }
  if(herzen.length>sichtbar)
    txt('+'+(herzen.length-sichtbar),14+PRO_REIHE*14,14+(MAX_REIHEN-1)*13,'#8a8276',8,'left');
  // Münzen/Bomben/Schlüssel — unterhalb des Herzblocks
  const reihen=Math.ceil(sichtbar/PRO_REIHE);
  let cy=14+reihen*13+8;
  disc(20,cy,4.5,'#ffd75a');ring(20,cy,4.5,'#a8862a',1);
  txt(String(p.coins).padStart(2,'0'),34,cy,'#e8e0d0',10,'left');
  cy+=14; disc(20,cy,5,'#2a2a2e');disc(18.5,cy-1.5,1.2,'#5a5a6a');
  txt(String(p.bombs).padStart(2,'0'),34,cy,'#e8e0d0',10,'left');
  cy+=14; rrect(19,cy-5,2,8,'#ffd75a');disc(20,cy-5,2.5,'#ffd75a');rrect(21,cy+1,3,1.5,'#ffd75a');
  txt(String(p.keys).padStart(2,'0'),34,cy,'#e8e0d0',10,'left');
  // Aktives Item mit Ladebalken — schließt an die Ressourcenspalte an
  const ay0=cy+26;
  if(p.active){
    const ax=20,ay=ay0;
    rrect(ax-11,ay-11,22,22,'#1a1a20');
    ctx.strokeStyle='#4a4a55';ctx.strokeRect(ax-11.5,ay-11.5,23,23);
    drawItemIcon(p.active.id,ax,ay,1.1);
    for(let i=0;i<p.active.max;i++){
      const filled=i<p.active.charge;

    }

      ring(ax,ay,13,'#5ad75a',1);
  }
  // Pocket (Pille/Karte)
  if(p.pocket){
    const px2=20,py2=ay0+(p.active?34:0);
    rrect(px2-9,py2-9,18,18,'#1a1a20');
    ctx.strokeStyle='#4a4a55';ctx.strokeRect(px2-9.5,py2-9.5,19,19);
    if(p.pocket.kind==='pill'){
      rrect(px2-6,py2-3,6,6,'#e85a8a');rrect(px2,py2-3,6,6,'#f0f0f0');
      const known=G.pillsKnown.has(p.pocket.id);
      txt(known?PILLS[p.pocket.id].name:'??? Pille',px2+16,py2,'#9a9aa8',8,'left');
    } else {
      rrect(px2-5,py2-7,10,14,'#e8e0d0');txt('★',px2,py2,'#8a5aa8',8);
      txt(CARDS[p.pocket.id].name,px2+16,py2,'#9a9aa8',8,'left');
    }
    txt('[Q]',px2,py2+15,'#5a5a66',7);
  }
  drawMinimap();
  // Boss-Balken
  const bb=bossBarInfo();
  if(bb&&!G.bossIntro){
    const bw=200,bx=W/2-bw/2,by=H-16;
    rrect(bx-2,by-5,bw+4,10,'#1a1a20');
    rrect(bx,by-3,bw*clamp(bb.hp/bb.max,0,1),6,'#c03a5a');
    ctx.strokeStyle='#4a4a55';ctx.strokeRect(bx-2.5,by-5.5,bw+5,11);
    txt(bb.name,W/2,by-11,'#e8e0d0',9);
  }
  // Etage & Seed
  txt(`E${G.depth} ${G.floor.data.name}`,10,H-8,'#5a5a66',8,'left');

  for(const t of G.texts) txt(t.str,t.x,t.y-(1.2-t.t)*20,t.color,9);
}

/* Automap oben rechts */
function drawMinimap(){
  const cw=9,ch=7, mx=W-12, my=12;
  const cur=G.room;
  ctx.globalAlpha=0.85;
  for(const k in G.floor.rooms){
    const r=G.floor.rooms[k];
    if(!r.seen&&!r.visited) continue;
    const dx=r.gx-cur.gx, dy=r.gy-cur.gy;
    const x=mx-cw*4.5+dx*cw, y=my+ch*2+dy*ch;
    if(x<W-110||x>W-4||y<4||y>80) continue;
    let fill=r.visited?'#8a8276':'#3a3a42';
    if(k===G.roomKey) fill='#e8e0d0';
    rrect(x,y,cw-1,ch-1,fill);
    // Icons
    let icon=null,icol='#111';
    if(r.type==='treasure'){icon='◆';icol='#d4af37';}
    if(r.type==='shop'){icon='¢';icol='#d4af37';}
    if(r.type==='boss'){icon='☠';icol='#c03a5a';}
    if(r.type==='secret'){icon='?';icol='#8a5aa8';}
    if(r.type==='curse'){icon='!';icol='#c03a5a';}
    if(r.type==='sacrifice'){icon='†';icol='#555';}
    if(r.type==='arcade'){icon='★';icol='#5a5ac0';}
    if(icon) txt(icon,x+cw/2-0.5,y+ch/2,icol,7);
  }
  ctx.globalAlpha=1;
}

/* --- Savegame (localStorage): Freischaltungen & Statistik --- */
let saveData={unlocks:[],wins:0,deaths:0,bestFloor:1};
function loadSave(){
  try{ const s=localStorage.getItem('kellerbrut_v1');
    if(s) saveData={...saveData,...JSON.parse(s)}; }catch(e){}
}
function saveSave(){
  try{ localStorage.setItem('kellerbrut_v1',JSON.stringify(saveData)); }catch(e){}
}
function unlock(key){
  if(saveData.unlocks.includes(key)) return;
  saveData.unlocks.push(key); saveSave();
  const c=CHARS.find(c=>c.unlock===key);
  if(c&&G.state==='game') G.banner={title:'Freigeschaltet: '+c.name,desc:c.desc,t:3};
}
function charUnlocked(c){ return !c.unlock||saveData.unlocks.includes(c.unlock); }

/* --- Run starten --- */
let menu={idx:0,charIdx:0,seedInput:'',typingSeed:false};
function startRun(charIdx,seedStr){
  const char=CHARS[charIdx];
  const seed=seedStr&&seedStr.length?seedStr.toUpperCase():seedToStr((Math.random()*4294967296)>>>0);
  G={state:'game',seedStr:seed,seedNum:hashSeed(seed),depth:1,
    charIdx,itemsSeen:new Set(),runItems:[],pillsKnown:new Set(),
    kills:0,time:0,stats:{kills:0,dmgDealt:0,dmgTaken:0},
    shake:0,banner:null,bossIntro:null,trans:null,result:null,
    tears:[],eshots:[],enemies:[],bombs:[],pickups:[],fx:[],beams:[],
    lasers:[],creeps:[],familiars:[],texts:[],
    deathTimer:0,roomFresh:0,bossName:'',room:null,roomKey:null,
    floorRooms:()=>G.floor.rooms};
  const p={char,x:0,y:0,vx:0,vy:0,r:9,
    red:char.red,redMax:char.red,soul:[...char.soul],
    coins:char.coins,bombs:char.bombs,keys:char.keys,
    items:[],flags:new Set(),active:null,pocket:null,
    permDmg:0,permSpeed:0,permRange:0,roomDmgBonus:0,
    fireTimer:0,iframes:0,shield:0,beamCharge:0,beamReady:false,
    aimDir:{x:0,y:1},anim:0,itemGet:null,dead:false,hitFlash:0,stats:{}};
  G.player=p;
  // Startitem ohne Animation
  if(char.item){ const it=ITEMS[char.item];
    G.itemsSeen.add(char.item); G.runItems.push(char.item);
    if(it.type==='active') p.active={id:char.item,charge:it.charge,max:it.charge};
    else { p.items.push(char.item);
      if(it.flags) for(const f of it.flags) p.flags.add(f);
      if(it.pickup) it.pickup(p); } }
  if(char.pocket) p.pocket={kind:char.pocket.kind,
    id:char.pocket.kind==='pill'?frand.int(PILLS.length):frand.int(CARDS.length)};
  recomputeStats();
  G.floor=genFloor(1);
  Sfx.setPattern(G.floor.data.mus);
  enterRoom(G.floor.startKey,null);
  G.banner={title:G.floor.data.name,desc:'Etage 1  ·  Seed '+seed,t:3};
}
function winRun(){
  G.state='postrun'; G.result='win';
  saveData.wins++; saveSave(); unlock('win');
  Sfx.item();
}

/* --- Effekte/Partikel-Update --- */
function updateFx(dt){
  for(const f of G.fx){
    f.t-=dt;
    if(f.kind==='p'){ f.x+=f.vx*dt; f.y+=f.vy*dt; f.vx*=0.92; f.vy*=0.92; }
  }
  G.fx=G.fx.filter(f=>f.t>0);
  // Obergrenze: bei extremen Kombinationen (Vierfachschuss mit Gift, Feuer und
  // Frost) sollen die Partikel die Bildrate auch auf schwachen Rechnern nicht
  // drücken. Die ältesten fallen zuerst weg.
  if(G.fx.length>700) G.fx.splice(0,G.fx.length-700);
  for(const t of G.texts) t.t-=dt;
  G.texts=G.texts.filter(t=>t.t>0);
  if(G.banner) G.banner.t-=dt;
  G.shake=Math.max(0,G.shake-30*dt);
}

/* --- Spiel-Update (fester Timestep) --- */
function updateGame(dt){
  const p=G.player;
  if(G.bossIntro){
    G.bossIntro.t-=dt;
    if(G.bossIntro.t<=0||Input.hit('Enter')) G.bossIntro=null;
    updateFx(dt);
    return;
  }
  if(G.trans){
    G.trans.t-=dt;
    if(!G.trans.half&&G.trans.t<=0.17){ G.trans.half=true; enterRoom(G.trans.to,G.trans.dir); }
    if(G.trans.t<=0) G.trans=null;
    return;
  }
  G.time+=dt;
  G.roomFresh=Math.max(0,G.roomFresh-dt);
  if(!p.dead){
    updatePlayer(dt);
    if(Input.pause()){ G.state='pause'; return; }
  } else {
    G.deathTimer-=dt;
    if(G.deathTimer<=0){ G.state='postrun'; G.result='dead'; }
  }
  updateTears(dt);
  updateBeams(dt);
  updateFamiliars(dt);
  updateBombs(dt);
  updateEnemies(dt);
  updateEshots(dt);
  updateCreeps(dt);
  updateFx(dt);
  updateDoorsOpen(false);
  updateDoorAnim(dt);
  // Sieg: Endboss auf der letzten Etage besiegt (kurze Pause für den Todeseffekt)
  if(G.depth>=FLOORS.length&&G.room.type==='boss'&&G.room.cleared&&!G.winQueued){
    G.winQueued=true; G.winTimer=2.5;
  }
  if(G.winQueued){ G.winTimer-=dt; if(G.winTimer<=0) winRun(); }
}

/* --- Rendering-Verteiler --- */
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle=G&&G.floor?G.floor.data.bg:'#0a0a0f';
  ctx.fillRect(0,0,W,H);
  if(!G||!G.state||G.state==='menu'){ drawMenu(); return; }
  if(G.state==='charsel'){ drawCharSel(); return; }
  if(G.state==='postrun'){ drawPostRun(); return; }
  // Spielwelt (auch als Hintergrund für Pause)
  if(G.shake>0.5) ctx.translate(frand.range(-G.shake,G.shake)*0.5,frand.range(-G.shake,G.shake)*0.5);
  drawRoom();
  for(const q of G.pickups) drawPickup(q);
  for(const b of G.bombs) drawBombEnt(b);
  const sorted=[...G.enemies].sort((a,b)=>a.y-b.y);
  let playerDrawn=false;
  for(const e of sorted){
    if(!playerDrawn&&G.player.y<e.y){ drawPlayer(G.player); playerDrawn=true; }
    drawEnemy(e);
  }
  if(!playerDrawn) drawPlayer(G.player);
  for(const f of G.familiars) drawFamiliar(f);
  for(const b of G.beams) drawBeam(b);
  for(const l of G.lasers) drawLaser(l);
  for(const t of G.tears) drawTear(t);
  for(const s of G.eshots) drawEshot(s);
  for(const f of G.fx){
    if(f.kind==='p'){ ctx.globalAlpha=clamp(f.t*2,0,1); rrect(f.x,f.y,f.size,f.size,f.color); ctx.globalAlpha=1; }
    else if(f.kind==='boom'){ ctx.globalAlpha=f.t/0.35;
      ring(f.x,f.y,f.r*(1-f.t/0.35+0.3),'#ffb347',4); ctx.globalAlpha=1; }
    else if(f.kind==='welle'){                 // aufziehender Ring
      const p0=1-f.t/f.max;
      ctx.globalAlpha=Math.pow(f.t/f.max,0.7);
      ring(f.x,f.y,Math.max(1,f.r*p0),f.color,f.w*(1-p0*0.7)+0.5);
      ctx.globalAlpha=1;
    } else if(f.kind==='glanz'){               // kurzer Lichtblitz
      const a=f.t/f.max;
      ctx.globalAlpha=a*0.85;
      disc(f.x,f.y,f.r*(0.5+a*0.5),f.color);
      ctx.globalAlpha=a;
      disc(f.x,f.y,f.r*0.45*a,'#ffffff');
      ctx.globalAlpha=1;
    }
  }
  ctx.setTransform(1,0,0,1,0,0);
  drawHUD();
  if(G.bossIntro) drawBossIntro();
  if(G.trans){ // Übergangs-Fade
    const t=G.trans.t, a=t>0.17?(0.35-t)/0.18:t/0.17;
    ctx.fillStyle=`rgba(0,0,0,${clamp(a,0,1)})`; ctx.fillRect(0,0,W,H);
  }
  if(G.player.dead){
    ctx.fillStyle=`rgba(40,0,0,${clamp((1.2-G.deathTimer)*0.5,0,0.6)})`;
    ctx.fillRect(0,0,W,H);
  }
  if(G.state==='pause') drawPause();
}

/* --- Menü-Screens --- */
function drawMenu(){
  ctx.fillStyle='#0a0a0f';ctx.fillRect(0,0,W,H);
  // Titelgrafik: tropfender Schriftzug
  txt('K E L L E R B R U T',W/2,70,'#c03a5a',30);
  txt('K E L L E R B R U T',W/2+1,71,'rgba(255,255,255,0.15)',30);
  for(let i=0;i<5;i++){ const x=W/2-90+i*45, len=8+((i*37)%14);
    rrect(x,84,3,len,'#c03a5a'); disc(x+1.5,84+len,2,'#c03a5a'); }
  txt('Ein Roguelite über das, was unter dem Haus wohnt',W/2,116,'#8a8276',10);
  txt('ENTER — Abstieg beginnen',W/2,170,'#e8e0d0',13);
  txt('WASD bewegen · Pfeile schießen · SPACE Bombe · E Item · Q Pille/Karte',W/2,200,'#6a6a76',9);
  txt('P Pause · M Musik · N Ton · Gamepad wird unterstützt',W/2,214,'#6a6a76',9);
  txt(`Siege: ${saveData.wins}   Tode: ${saveData.deaths}   Beste Etage: ${saveData.bestFloor}`,W/2,258,'#8a8276',9);
  const locked=CHARS.filter(c=>!charUnlocked(c)).length;
  if(locked) txt(locked+' Charakter(e) noch nicht freigeschaltet',W/2,274,'#5a5a66',8);
  txt('v1.0 — komplett eigene Grafiken & Items',W/2,H-12,'#3a3a42',7);
}
function drawCharSel(){
  ctx.fillStyle='#0a0a0f';ctx.fillRect(0,0,W,H);
  txt('WER STEIGT HINAB?',W/2,40,'#e8e0d0',16);
  const n=CHARS.length, cw=130;
  for(let i=0;i<n;i++){
    const c=CHARS[i], x=W/2+(i-menu.charIdx)*cw, sel=i===menu.charIdx;
    if(x<-70||x>W+70) continue;
    const un=charUnlocked(c);
    ctx.globalAlpha=sel?1:0.45;
    rrect(x-52,70,104,150,sel?'#1a1a24':'#12121a');
    if(sel){ctx.strokeStyle='#8a7a5a';ctx.strokeRect(x-52.5,70.5,105,149);}
    // Portrait: dieselbe Zeichenfunktion wie im Spiel, nur vergrößert —
    // so entspricht die Vorschau immer genau der späteren Spielfigur.
    if(un){
      const t=performance.now()/1000;
      shadow(x,134,9);
      ctx.save(); ctx.translate(x,118); ctx.scale(1.5,1.5); ctx.translate(-x,-118);
      zeichneCharakter(c,x,118,{
        schritt:sel?Math.sin(t*5)*0.7:0,
        hub:sel?Math.abs(Math.sin(t*5))*0.9:0,
        aim:{x:Math.sin(t*1.3)*0.8,y:0.5},
        schwebt:c.id==='schemen',
        blinzelt:((t*0.8)%5)<0.12});
      ctx.restore();
      txt(c.name,x,150,'#e8e0d0',12);
      txt(c.desc,x,164,'#8a8276',8);
      txt(`♥${c.red/2+c.soul.length/2} Tempo ${c.speed} DMG ${c.dmg}`,x,180,'#6a6a76',7);
      if(c.item) txt('Start: '+ITEMS[c.item].name,x,192,'#6a6a76',7);
    } else {
      disc(x,110,10,'#222');txt('?',x,110,'#555',12);
      txt('Gesperrt',x,150,'#555',10);
      txt(c.unlockText||'',x,164,'#444',7);
    }
    ctx.globalAlpha=1;
  }
  txt('◄ ► wählen · ENTER start',W/2,244,'#8a8276',10);
  if(menu.typingSeed) txt('Seed: '+menu.seedInput+'_',W/2,270,'#ffd75a',11);
  else txt(menu.seedInput?('Seed: '+menu.seedInput+'  (S ändern)'):'S — Seed eingeben (gleicher Seed = gleiche Etagen)',W/2,270,'#5a5a66',9);
}
function drawPause(){
  ctx.fillStyle='rgba(5,5,10,0.93)';ctx.fillRect(0,0,W,H);
  txt('PAUSE',W/2,50,'#e8e0d0',22);
  const p=G.player,s=p.stats;
  txt(`Seed ${G.seedStr} · Etage ${G.depth} (${G.floor.data.name})`,W/2,80,'#8a8276',10);
  const stats=[
    ['Tempo',s.speed.toFixed(2)],['Feuerrate',s.tps.toFixed(2)],['Schaden',s.dmg.toFixed(2)],
    ['Reichweite',(s.range|0)+''],['Schussgeschw.',s.shot.toFixed(1)],['Glück',s.luck+'']];
  stats.forEach((st,i)=>{
    txt(st[0],W/2-60,110+i*14,'#6a6a76',9,'right');
    txt(st[1],W/2-46,110+i*14,'#e8e0d0',9,'left');});
  // Eingesammelte Items
  txt('Items:',W/2+30,110,'#6a6a76',9,'left');
  G.runItems.slice(0,24).forEach((id,i)=>{
    drawItemIcon(id,W/2+40+(i%8)*20,128+Math.floor(i/8)*20,1);});
  txt('ESC/P weiter · X Run aufgeben',W/2,H-40,'#8a8276',10);
}
function drawPostRun(){
  ctx.fillStyle='#0a0a0f';ctx.fillRect(0,0,W,H);
  const win=G.result==='win';
  txt(win?'DU HAST ÜBERLEBT':'GESTORBEN',W/2,46,win?'#5ad75a':'#c03a5a',24);
  txt(win?'Die Wurzel des Kellers ist bezwungen.':('Etage '+G.depth+' — '+G.floor.data.name),W/2,72,'#8a8276',10);
  const mm=Math.floor(G.time/60),ss=Math.floor(G.time%60);
  const lines=[
    ['Zeit',`${mm}:${String(ss).padStart(2,'0')}`],
    ['Kills',G.stats.kills+''],
    ['Schaden ausgeteilt',(G.stats.dmgDealt|0)+''],
    ['Schaden erlitten',(G.stats.dmgTaken/2)+' Herzen'],
    ['Items gefunden',G.runItems.length+''],
    ['Seed',G.seedStr]];
  lines.forEach((l,i)=>{
    txt(l[0],W/2-16,104+i*16,'#6a6a76',10,'right');
    txt(l[1],W/2,104+i*16,'#e8e0d0',10,'left');});
  txt('Gesammelte Items:',W/2,212,'#6a6a76',9);
  G.runItems.slice(0,32).forEach((id,i)=>{
    drawItemIcon(id,W/2-((Math.min(G.runItems.length,16))*10)+10+(i%16)*20,230+Math.floor(i/16)*22,1);});
  txt('ENTER — zurück ins Menü',W/2,H-28,'#e8e0d0',11);
}

/* --- Menü-Steuerung --- */
function updateMenu(){
  if(G.state==='menu'){
    if(Input.confirm()){ G.state='charsel'; Sfx.pickup(); }
  } else if(G.state==='charsel'){
    if(menu.typingSeed) return;
    if(Input.hit('ArrowLeft')||Input.hit('KeyA')){ menu.charIdx=(menu.charIdx+CHARS.length-1)%CHARS.length; Sfx.tick(); }
    if(Input.hit('ArrowRight')||Input.hit('KeyD')){ menu.charIdx=(menu.charIdx+1)%CHARS.length; Sfx.tick(); }
    if(Input.hit('KeyS')){
      menu.typingSeed=true; Input.clear();
      Input.setTyping(e=>{
        if(e.code==='Enter'||e.code==='Escape'){ menu.typingSeed=false; Input.setTyping(null); }
        else if(e.code==='Backspace') menu.seedInput=menu.seedInput.slice(0,-1);
        else if(/^[a-zA-Z0-9]$/.test(e.key)&&menu.seedInput.length<10) menu.seedInput+=e.key.toUpperCase();
      });
    }
    if(Input.confirm()){
      const c=CHARS[menu.charIdx];
      if(charUnlocked(c)){ startRun(menu.charIdx,menu.seedInput); Sfx.doorOpen(); }
      else Sfx.error();
    }
    if(Input.hit('Escape')) G.state='menu';
  } else if(G.state==='pause'){
    if(Input.pause()||Input.hit('Escape')) G.state='game';
    if(Input.hit('KeyX')){ G.state='postrun'; G.result='dead'; saveData.deaths++; saveSave(); }
  } else if(G.state==='postrun'){
    if(Input.confirm()){ G.state='menu'; menu.seedInput=''; }
  }
}

/* --- Hauptschleife: fester 60-Hz-Timestep --- */
const DT=1/60;
let acc=0, last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  acc+=Math.min(0.1,(now-last)/1000); last=now;
  Input.pollPad();
  while(acc>=DT){
    acc-=DT;
    if(Input.hit('KeyM')) Sfx.toggleMusic();
    if(Input.hit('KeyN')) Sfx.toggleMute();
    if(G.state==='game') updateGame(DT);
    else updateMenu();
    // Tastendrücke gelten genau einen Tick lang, sonst würde z.B. ein im Spiel
    // gedrücktes Enter den danach erscheinenden Post-Run-Screen sofort wegklicken.
    Input.clear();
  }
  Sfx.updateMusic(DT,G.state==='game'||G.state==='pause');
  render();
}

/* --- Boot --- */
loadSave();
G={state:'menu',floor:null};
requestAnimationFrame(frame);

/* Test-Hooks (für automatisierte Smoke-Tests) */
window.KB={ get G(){return G;}, startRun, genFloor, hashSeed, Input, Sfx,
  CHARS, ITEMS, ENEMY_TYPES, BOSS_TYPES, PILLS, CARDS, FLOORS };
</script>
