  if(q.wahl){
    for(const r of G.pickups) if(r.wahl&&r!==q){
      r.dead=true;
      burst(r.x,r.y,'#8a76a0',10);
      for(let i=0;i<5;i++) schweber(r.x,r.y,'#6a5880',-frand.range(20,50),0.7);
    }
    if(G.room) G.room.drops=(G.room.drops||[]).filter(d=>!d.wahl);
    addText(q.x,q.y-20,'gewählt','#c9a8e8');
  }
  switch(q.type){
    case 'coin': p.coins++; Sfx.coin(); break;
    case 'bigcoin': p.coins+=5; Sfx.coin(); break;
    case 'bomb': p.bombs++; Sfx.pickup(); break;
    case 'key': p.keys++; Sfx.key(); break;
    case 'heart': if(p.red>=p.redMax) return; heileSpieler(2); Sfx.heart(); break;
    case 'halfheart': if(p.red>=p.redMax) return; heileSpieler(1); Sfx.heart(); break;
    case 'soulheart': p.soul.push('S','S'); Sfx.heart(); break;
    case 'blackheart': p.soul.push('B','B'); Sfx.heart(); break;
    case 'pill': givePocket('pill',q.pillId); break;
    case 'card': givePocket('card',q.cardId); break;
    case 'chest': openChest(q,'normal'); return;
    case 'goldchest': {
      if(p.keys<=0){return;}
      if(!(p.flags.has('keysaver')&&frand.chance(0.25))) p.keys--;
      openChest(q,'gold'); return; }
    case 'redchest': openChest(q,'red'); return;
    case 'item': q.dead=true; acquireItem(q.itemId,null); return;
    case 'container': {                       // Herzerweiterung vom Boss
      const dazu=containerDazu(2,'voll');
      if(dazu){ addText(p.x,p.y-20,'+1 Herzcontainer','#d43a4a'); Sfx.heart(); }
      else {                                  // schon bei zwölf Herzen? dann Kraft
        p.permDmg+=0.8; recomputeStats();
        addText(p.x,p.y-20,'Herz voll — dafür Kraft','#e8862a'); Sfx.item();
      }
      schockwelle(p.x,p.y,46,'#d43a4a',0.6,3);
      break; }
    case 'schadenshoch':                      // dauerhafter Schadensbonus
      p.permDmg+=0.8; recomputeStats();
      addText(p.x,p.y-20,'Schaden dauerhaft hoch','#e8862a');
      schockwelle(p.x,p.y,46,'#e8862a',0.6,3); Sfx.item();
      break;
  }
  q.dead=true;
}
function givePocket(kind,fixedId){
  const p=G.player;
  const id=fixedId!==undefined?fixedId:(kind==='pill'?frand.int(PILLS.length):frand.int(CARDS.length));
  if(p.pocket){ // Tausch: alte Pille/Karte fällt zu Boden.
    // Kurze Sperre, sonst hebt man sie sofort wieder auf und tauscht endlos.
    const old=p.pocket;
    G.pickups.push({x:p.x+14,y:p.y+10,type:old.kind==='pill'?'pill':'card',
      pillId:old.kind==='pill'?old.id:undefined,cardId:old.kind==='card'?old.id:undefined,cd:0.8});
  }
  p.pocket={kind,id}; Sfx.pickup();
}
function usePocket(){
  const p=G.player, pk=p.pocket; p.pocket=null;
  if(pk.kind==='pill'){
    const pill=PILLS[pk.id];
    G.pillsKnown.add(pk.id);
    addText(p.x,p.y-18,pill.name,'#e8a8c9'); Sfx.pill();
    pill.use(p);
  } else {
    const card=CARDS[pk.id];
    addText(p.x,p.y-18,card.name,'#c9a8e8'); Sfx.pill();
    card.use(p);
  }
}
function openChest(q,kind){
  q.dead=true; Sfx.pickup(); burst(q.x,q.y,'#d4af37',8);
  if(kind==='normal'){
    const n=1+frand.int(3);
    for(let i=0;i<n;i++) spawnPickup(q.x+frand.range(-16,16),q.y+frand.range(-12,12),randomDrop());
  } else if(kind==='gold'){
    if(frand.chance(0.35)){ G.room.pedestals.push({x:q.x,y:q.y,itemId:pickFromPool('treasure')}); }
    else { const n=2+frand.int(3);
      for(let i=0;i<n;i++) spawnPickup(q.x+frand.range(-16,16),q.y+frand.range(-12,12),frand.pick(['coin','coin','bigcoin','soulheart','key','bomb'])); }
  } else { // rote Truhe: Risiko!
    const r=frand();
    if(r<0.4){ const n=1+frand.int(2);
      for(let i=0;i<n;i++) spawnPickup(q.x+frand.range(-16,16),q.y+frand.range(-12,12),frand.pick(['blackheart','soulheart','bomb','card']));}
    else if(r<0.75){ for(let i=0;i<2;i++) spawnEnemy('zuckfliege',q.x+frand.range(-20,20),q.y+frand.range(-20,20),null); Sfx.error(); }
    else teleportRandom();
  }
}
function useMachine(m){
  const p=G.player;
  if(p.coins<1){ return; }
  m.cd=0.6;
  if(m.kind==='slot'){
    p.coins--; Sfx.coin(); m.anim=0.4;
    const r=frand();
    if(r<0.35){/* Niete */ addText(m.x,m.y-20,'Niete...','#888');}
    else if(r<0.5) spawnPickup(m.x,m.y+22,'coin');
    else if(r<0.6) spawnPickup(m.x,m.y+22,'bigcoin');
    else if(r<0.72) spawnPickup(m.x,m.y+22,'heart');
    else if(r<0.82) spawnPickup(m.x,m.y+22,'bomb');
    else if(r<0.92) spawnPickup(m.x,m.y+22,'key');
    else { spawnPickup(m.x,m.y+22,'pill'); }
    if(frand.chance(0.06)){ m.broken=true; explode(m.x,m.y,40,10,true); }
  } else { // Orakel
    if(p.coins<2) return;
    p.coins-=2; Sfx.coin(); m.anim=0.4;
    spawnPickup(m.x,m.y+22,'card');
  }
}

/* --- Item erwerben (mit Hochhalte-Animation) --- */
function acquireItem(id,pedestal){
  const p=G.player, it=ITEMS[id];
  G.runItems.push(id);
  if(it.type==='active'){
    if(p.active){
      // Altes Aktivitem zurücklegen: auf das Podest, oder — wenn das Item am
      // Boden lag — daneben ablegen. Sonst ginge es kommentarlos verloren.
      if(pedestal){pedestal.taken=false;pedestal.itemId=p.active.id;pedestal.price=0;pedestal.cd=1.5;}
      else G.pickups.push({x:p.x+18,y:p.y+10,type:'item',itemId:p.active.id,cd:1.2});
    }
    p.active={id,charge:0,max:it.charge};
  } else {
    p.items.push(id);
    if(it.flags) for(const f of it.flags) p.flags.add(f);
    if(it.pickup) it.pickup(p);
    if(it.famil) spawnFamiliars();
    recomputeStats();
  }
  p.itemGet={id,t:1.4};
  G.banner={title:it.name,desc:it.desc,t:2.6};
  // Lichtausbruch beim Aufheben, eingefärbt wie das Item selbst
  const farbe=itemColor(id);
  blitz(p.x,p.y-20,22,farbe,0.45);
  schockwelle(p.x,p.y-14,54,farbe,0.6,4);
  for(let i=0;i<18;i++) schweber(p.x+frand.range(-14,14),p.y+frand.range(-4,8),farbe,-frand.range(40,95),0.9);
  Sfx.item();
}

/* --- Spieler-Schaden --- */
function hurtPlayer(halves,force){
  const p=G.player;
  if(p.dead) return false;
  if(!force&&(p.iframes>0||p.shield>0||G.roomFresh>0)) return false;
  /* Engelsflügel: der erste Treffer je Raum verpufft in einem Federstoß.
     Der Begleiter wird bei jedem Raumwechsel neu aufgestellt, die Feder
     also auch. */
  /* Teleportstein: statt getroffen zu werden, blitzt man ein Stück weiter.
     Alle sechs Sekunden einmal — Notausgang, kein Dauerschutz. */
  if(!force&&p.flags.has('teleportstein')&&(p.steinCd||0)<=0){
    p.steinCd=6;
    blitz(p.x,p.y,20,'#b8a8e8',0.25);
    for(let i=0;i<10;i++){ const a=frand()*TAU;
      G.fx.push({kind:'p',x:p.x,y:p.y,vx:Math.cos(a)*120,vy:Math.sin(a)*120,
                 t:0.3,color:'#b8a8e8',size:2.4}); }
    for(let v=0;v<12;v++){                  // freien Platz in der Nähe suchen
      const a=frand()*TAU, d0=frand.range(44,80);
      const nx=clamp(p.x+Math.cos(a)*d0,RX+p.r,RX+COLS*TILE-p.r);
      const ny=clamp(p.y+Math.sin(a)*d0,RY+p.r,RY+ROWS*TILE-p.r);
      if(!circleHitsGrid(nx,ny,p.r,p.flags.has('flight')?'fly':'walk')){
        p.x=nx; p.y=ny; break; }
    }
    p.iframes=0.6; blitz(p.x,p.y,20,'#b8a8e8',0.25);
    addText(p.x,p.y-24,'weg!','#b8a8e8');
    return false;
  }
  if(!force){
    const fl=G.familiars.find(f=>f.kind==='engelsfluegel'&&f.frei!==false);
    if(fl){
      fl.frei=false; fl.blitzT=0.5; p.iframes=1.2;
      schockwelle(p.x,p.y-6,44,'#fdf6e0',0.5,4); Sfx.heart();
      addText(p.x,p.y-26,'abgefangen','#fdf6e0');
      for(let i=0;i<8;i++) schweber(p.x+frand.range(-10,10),p.y-8,'#fdf6e0',-frand.range(10,30),0.7);
      return false;
    }
  }
  p.vollschild=false;                     // Doppelherz-Schild ist verbraucht
  if(p.flags.has('blutpumpe')){ p.blutung=3.2; p.blutT=1.4; }
  // Seelen-/schwarze Herzen zuerst
  for(let i=0;i<halves;i++){
    if(p.soul.length){
      const h=p.soul.pop();
      if(h==='B'){ // schwarzes Herz: Rache!
        G.enemies.forEach(e=>damageEnemy(e,40));
        G.shake=8; burst(p.x,p.y,'#6a3aa5',16);
      }
      /* Geisterherz: jedes verlorene blaue Herz kann zerplatzen. */
      if(p.flags.has('geisterherz')&&frand.chance(0.5)){
        explode(p.x,p.y,64,0);
        addText(p.x,p.y-20,'zerplatzt','#9ad4f0');
      }
    } else p.red--;
  }
  /* Opferkelch: was an Leben verlorengeht, kommt als Schaden zurück. */
  if(p.flags.has('opferkelch')){
    p.permDmg+=0.3*halves; recomputeStats();
    addText(p.x,p.y-30,'+'+(0.3*halves).toFixed(1)+' Schaden','#b8a038');
  }
  p.iframes=1.1; p.hitFlash=0.3;
  G.shake=Math.max(G.shake,5); Sfx.hurt();
  G.stats.dmgTaken++;
  G.floorHit=true;                 // kostet die Kammer hinter dem Boss
  if(p.red<=0&&p.soul.length===0){ playerDie(); }
  return true;
}
function playerDie(){
  const p=G.player;
  /* Die Flickenpuppe wird einmal je Lauf wieder zusammengenäht. Sie steht
     mit einem halben Herzen und kurzer Unverwundbarkeit auf, damit der
     nächste Treffer sie nicht sofort erneut umwirft. */
  /* Unsterbliches Herz: einmal je Lauf bleibt man mit einem halben Herzen
     stehen. Wirkt vor der Flickenpuppe, damit sich beides nicht aufhebt. */
  if(p.flags.has('unsterblich')&&!p.unsterblichGenutzt){
    p.unsterblichGenutzt=true; p.red=1; p.iframes=2.4;
    G.shake=Math.max(G.shake,9); Sfx.heart();
    schockwelle(p.x,p.y,60,'#e8b830',0.7,4);
    addText(p.x,p.y-22,'noch nicht','#e8b830');
    return;
  }
  if(p.flags.has('flicken')&&!p.geflickt){
    p.geflickt=true; p.red=Math.max(1,Math.min(2,p.redMax)); p.iframes=2.4;
    G.shake=Math.max(G.shake,9); Sfx.heart();
    schockwelle(p.x,p.y,54,'#e4d8c4',0.7,4);
    addText(p.x,p.y-20,'wieder zusammengenäht','#e4d8c4');
    return;
  }
  p.dead=true;
  burst(p.x,p.y,'#c03a5a',24);
  G.deathTimer=1.2;
  saveData.deaths++; laufVerwerfen(); saveSave();
  if(saveData.deaths>=10) unlock('tode10');
}
function addText(x,y,str,color){ G.texts.push({x,y,str,color,t:1.2}); }
function burst(x,y,color,n){
  for(let i=0;i<n;i++){const a=frand()*TAU,sp=frand.range(30,130);
    G.fx.push({kind:'p',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:frand.range(0.25,0.6),color,size:frand.range(1.5,3.5)});}
}

/* --- Effekt-Bausteine -----------------------------------------------------
   Damit Item-Wirkungen sichtbar werden und nicht nur in den Zahlen stehen. */

// Aufziehender Ring — für Explosionen, Schockwellen, Aktivitems
/* --- Angekündigte Einschläge ---------------------------------------------
   Ein Schlag der Kammermutter oder des Bittenden füllt ein Viertel des
   Raumes. Ohne Vorwarnung wäre ihm nicht auszuweichen, mit Vorwarnung ist
   er fair: erst zieht sich ein Ring auf der Stelle zusammen, dann schlägt
   es ein. Auch Gegner nehmen Schaden — wer klug steht, lässt den Boss seine
   eigene Brut zerschlagen.                                               */
function einschlagSetzen(x,y,radius,vorlauf,schaden,farbe){
  G.einschlaege.push({x,y,r:radius,t:vorlauf,max:vorlauf,
                      dmg:schaden||1,farbe:farbe||'#c03a5a',aus:false});
}
function updateEinschlaege(dt){
  for(const s of G.einschlaege){
    if(s.aus){ s.t-=dt; continue; }
    s.t-=dt;
    if(s.t>0) continue;
    s.aus=true; s.t=0.25;
    G.shake=Math.max(G.shake,7);
    schockwelle(s.x,s.y,s.r,s.farbe,0.35,4);
    funken(s.x,s.y,-Math.PI/2,s.farbe,10,2.4);
    Sfx.boom();
    if(dist(G.player,s)<s.r) hurtPlayer(s.dmg);
    for(const e of G.enemies) if(!e.isBoss&&dist(e,s)<s.r) damageEnemy(e,8);
  }
  G.einschlaege=G.einschlaege.filter(s=>!s.aus||s.t>0);
}
function drawEinschlaege(){
  const merk=tuscheAn; tuscheAn=false;
  for(const s of G.einschlaege){
    if(s.aus) continue;
    const p0=1-s.t/s.max;                      // 0 = eben gesetzt, 1 = gleich
    ctx.save();
    ctx.globalAlpha=0.18+p0*0.22;
    ctx.fillStyle=s.farbe;
    ctx.beginPath(); ctx.ellipse(s.x,s.y,s.r,s.r*0.62,0,0,TAU); ctx.fill();
    ctx.globalAlpha=0.55+p0*0.45;
    ctx.strokeStyle=s.farbe; ctx.lineWidth=1.6+p0*1.6;
    ctx.beginPath(); ctx.ellipse(s.x,s.y,s.r*(1.5-p0*0.5),s.r*0.62*(1.5-p0*0.5),0,0,TAU);
    ctx.stroke();
    ctx.restore();
  }
  tuscheAn=merk;
}

function schockwelle(x,y,radius,color,dauer,breite){
  G.fx.push({kind:'welle',x,y,r:radius,t:dauer||0.4,max:dauer||0.4,color,w:breite||3});
}
// Gerichteter Funkenkegel — für Einschläge
function funken(x,y,winkel,color,n,streuung){
  for(let i=0;i<n;i++){
    const a=winkel+frand.range(-(streuung||0.7),(streuung||0.7));
    const sp=frand.range(60,190);
    G.fx.push({kind:'p',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      t:frand.range(0.15,0.35),color,size:frand.range(1,2.5)});
  }
}
// Langsam aufsteigendes Teilchen — Gift, Rauch, Heilung
function schweber(x,y,color,steigen,lebensdauer){
  G.fx.push({kind:'p',x,y,vx:frand.range(-14,14),vy:steigen,
    t:lebensdauer||frand.range(0.4,0.8),color,size:frand.range(1.5,3)});
}
// Kurzer Lichtblitz an einer Stelle
function blitz(x,y,radius,color,dauer){
  G.fx.push({kind:'glanz',x,y,r:radius,t:dauer||0.18,max:dauer||0.18,color});
}
// Farbe passend zum Element eines Schusses
function schussFarbe(t){
  if(t.poison) return '#a8e07a';
  if(t.burn)   return '#ffb347';
  if(t.frost)  return '#c8f0ff';
  if(t.explosive) return '#ffb347';
  return '#9fd4ef';
}

/* Nächste Etage betreten */
/* Das Laternenkind sieht die ganze Etage, sobald es sie betritt — nur
   Geheimräume bleiben verborgen, die muss auch es aufsprengen. */
function laterneLeuchtet(){
  if(!G.player||!G.player.flags.has('laterne')||!G.floor) return;
  for(const k in G.floor.rooms)
    if(G.floor.rooms[k].type!=='secret') G.floor.rooms[k].seen=true;
}

function nextFloor(){
  Sfx.stairs();
  G.depth++;
  saveData.bestFloor=Math.max(saveData.bestFloor,G.depth); saveSave();
  if(G.depth>FLOORS.length){ winRun(); return; }
  G.floorHit=false;                // neue Etage, neue Chance auf die Kammer
  G.room=null;
  G.floor=genFloor(G.depth);
  if(G.player.flags.has('karte')) etageAufdecken();   // Schatzkarte bleibt gültig
  Sfx.setPattern(G.floor.data.mus);
  G.banner=G.floor.fluch
    ? {title:FLUCH[G.floor.fluch].name,desc:FLUCH[G.floor.fluch].desc,t:3.4,fluch:true}
    : {title:G.floor.data.name,desc:'Etage '+G.depth,t:2.5};
  if(G.floor.fluch) Sfx.error();
  laterneLeuchtet();
  enterRoom(G.floor.startKey,null);
}

/* ==== 9. GEGNER-KI, BOSS-KI, KOLLISIONEN ==== */

function spawnEnemy(type,x,y,champ){
  const def=ENEMY_TYPES[type];
  const hpMul=(1+0.22*(G.depth-1))*(champ&&champ.hpMul?champ.hpMul:1);
  const e={type,def,name:def.name,x,y,r:def.r,vx:0,vy:0,kx:0,ky:0,
    hp:def.hp*hpMul,maxHp:def.hp*hpMul,
    spd:def.spd*(champ&&champ.spdMul?champ.spdMul:1),
    fly:!!def.fly,ai:def.ai,t:frand.range(0,1),state:0,phase:1,
    flash:0,champ,poison:0,burn:0,frost:0,dotT:0,ghosted:false,z:0,
    shotCd:def.shotCd||2,cd:frand.range(0.5,1.5),spawned:0};
  G.enemies.push(e);
  return e;
}

function spawnBoss(id){
  const def=BOSS_TYPES[id];
  const mk=(x,y,variant)=>{
    const e={type:id,def,name:def.name,x,y,r:def.r,vx:0,vy:0,kx:0,ky:0,
      hp:def.hp,maxHp:def.hp,spd:60,fly:!!def.fly,ai:def.ai,t:0,state:0,phase:1,
      flash:0,poison:0,burn:0,frost:0,dotT:0,z:0,cd:1.5,isBoss:true,variant:variant||0,
      spawned:0,patT:0,pat:0,enraged:false};
    G.enemies.push(e); return e;
  };
  if(def.twin){ mk(tx(3),ty(3),0); mk(tx(9),ty(3),1); }
  else mk(tx(6),ty(2),0);
  G.bossName=def.name;
  G.bossIntro={name:def.name,t:2.2};
  Sfx.bossroar();
}
function bossBarInfo(){
  const bs=G.enemies.filter(e=>e.isBoss);
  if(!bs.length) return null;
  let hp=0,max=0; for(const b of bs){hp+=Math.max(0,b.hp);max+=b.maxHp;}
  return {hp,max,name:G.bossName};
}

function damageEnemy(e,d,winkel){
  if(e.dead) return;
  /* Die Nagelbraut ist gespickt: jeder Treffer schlägt ein paar Nägel
     heraus, die im Raum liegen bleiben und selbst verletzen. Sie zu
     erlegen macht den Raum also gefährlicher, nicht sicherer. */
  if(e.ai==='nagel'&&frand.chance(0.55)){
    const a=frand()*TAU, d0=e.r+8+frand()*14;
    G.creeps.push({x:e.x+Math.cos(a)*d0,y:e.y+Math.sin(a)*d0,
                   r:7,t:9,feindlich:true,nagel:true});
    Sfx.tick();
  }
  /* Steinrücken: Treffer aus dem vorderen Halbkreis prallen ab. Der Winkel
     ist die Flugrichtung des Geschosses; trifft sie den Panzer frontal,
     zeigt sie ungefähr entgegen der Blickrichtung. */
  if(e.ai==='panzer'&&winkel!==undefined){
    let diff=(winkel+Math.PI)-e.blick;
    while(diff>Math.PI)diff-=TAU; while(diff<-Math.PI)diff+=TAU;
    if(Math.abs(diff)<Math.PI*0.5){
      e.flash=0.08; funken(e.x,e.y,winkel+Math.PI,'#d8d0c0',4,0.7);
      addText(e.x,e.y-e.r-6,'klong','#9a8b7c');
      return;
    }
    d*=2;                                  // von hinten trifft es doppelt
  }
  if(e.ai==='sporen') e.sporenSchuld=(e.sporenSchuld||0)+1;
  e.hp-=d; e.flash=0.12;
  G.stats.dmgDealt+=d;
  if(e.hp<=0) killEnemy(e);
}
function killEnemy(e){
  if(e.dead) return;
  /* Aschgeist zerstiebt beim ersten Tod und sammelt sich nach drei Sekunden
     wieder. Feuer und Frost verhindern das — die Asche findet nicht zusammen. */
  if(e.ai==='asche'&&!e.wiederbelebt&&!(e.burn>0||e.frost>0)){
    e.wiederbelebt=true; e.sammelt=3; e.hp=1; e.ghosted=true;
    burst(e.x,e.y,'#4a414e',14); Sfx.edeath();
    return;
  }
  e.dead=true;
  Sfx.edeath();
  burst(e.x,e.y,e.isBoss?'#c03a5a':'#a05a5a',e.isBoss?26:10);
  G.kills++; G.stats.kills++;
  /* Seelenvogel: jeder Erlegte lässt eine Seele zurück. */
  if(G.familiars.some(f=>f.kind==='seelenvogel')) G.seelen=(G.seelen||0)+1;
  /* Seelenschlitzer: ein Kill kann kurz rasend machen. */
  if(G.player.flags.has('rausch')&&frand.chance(0.18+G.player.stats.luck*0.02)){
    G.player.rausch=Math.max(G.player.rausch||0,4);
    addText(G.player.x,G.player.y-22,'Rausch!','#c8283a');
    schockwelle(G.player.x,G.player.y,40,'#c8283a',0.4,3);
  }
  saveData.kills++;                        // zählt über alle Läufe hinweg
  if(saveData.kills>=500) unlock('kills500');
  if(saveData.kills%25===0) saveSave();    // nicht bei jedem Tod schreiben
  if(e.def.onDeath&&e.def.onDeath.split){
    const [t,n]=e.def.onDeath.split;
    for(let i=0;i<n;i++){
      const c=spawnEnemy(t,e.x+frand.range(-12,12),e.y+frand.range(-12,12),null);
      c.cd=0.4;
    }
  }
  if(e.beute){                                  // verschluckte Beute fällt heraus
    G.pickups.push({x:e.x,y:e.y,type:e.beute,cd:0.4,
                    pillId:e.beutePille,cardId:e.beuteKarte});
    e.beute=null; burst(e.x,e.y,'#ffd75a',10);
  }
  if(e.isBoss){ G.shake=Math.max(G.shake,10); }
  else {
    /* Seltener Item-Abwurf. Champions haben die deutlich besseren Chancen —
       damit lohnt es sich, sie zu jagen, statt sie zu umgehen. */
    const itemP=(e.champ?0.09:0.012)+G.player.stats.luck*0.004;
    if(frand.chance(itemP)) spawnItemAbwurf(e.x,e.y);
    else {
      const dropP=0.13+(G.player.stats.luck*0.02)+(G.player.flags.has('greed')?0.07:0);
      if(e.champ&&e.champ.gold) spawnPickup(e.x,e.y,randomDrop());
      else if(frand.chance(dropP)) spawnPickup(e.x,e.y,G.player.flags.has('greed')&&frand.chance(0.5)?'coin':randomDrop());
    }
  }
}

/* Ein gefallenes Item liegt am Boden statt auf einem Podest. Es zählt in
   denselben Pool wie Schatzräume, damit es keine Doppelfunde gibt. */
function spawnItemAbwurf(x,y){
  const id=pickFromPool('treasure');
  G.pickups.push({x,y,type:'item',itemId:id,cd:0.5});
  blitz(x,y,20,itemColor(id),0.5);
  schockwelle(x,y,44,itemColor(id),0.6,3);
  Sfx.item();
}

/* Gegnergeschoss */
function fireEshot(x,y,a,spd,opts){
  /* Wer dich nicht sieht, schießt auch nicht auf dich. */
  if(G.player.unsichtbar>0&&!(opts&&opts.egal)) return {x,y,vx:0,vy:0,r:0,life:0,dead:true};
  const sh={x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:4.5,life:4,...(opts||{})};
  G.eshots.push(sh);
  return sh;
}

function updateEshots(dt){
  const p=G.player;
  if(G.zeitstopp>0) return;              // im Stillstand fliegt nichts
  for(const sh of G.eshots){
    sh.life-=dt;
    sh.x+=sh.vx*dt; sh.y+=sh.vy*dt;
    if(sh.arc){ // Bogenwurf (Giftglob)
      sh.zt+=dt; sh.z=Math.max(0,Math.sin(Math.PI*sh.zt/sh.zdur)*26);
      if(sh.zt>=sh.zdur){ sh.dead=true;
        G.creeps.push({x:sh.x,y:sh.y,r:20,t:5,feindlich:true}); Sfx.splash(); burst(sh.x,sh.y,'#8a4ab0',6);}
    } else {
      if(sh.x<RX||sh.x>RX+COLS*TILE||sh.y<RY||sh.y>RY+ROWS*TILE) sh.dead=true;
      else if(circleHitsGrid(sh.x,sh.y,3,'tear')) sh.dead=true;
    }
    if(sh.life<=0) sh.dead=true;
    if(!sh.dead&&!sh.arc&&!p.dead&&dist(sh,p)<sh.r+p.r-2){
      sh.dead=true;
      hurtPlayer(1);
    }
  }
  G.eshots=G.eshots.filter(s=>!s.dead);
}
function updateCreeps(dt){
  // Eigene Pfützen wirken auf Gegner, die hineinlaufen: Gift vergiftet,
  // die Glut der Glutmotte setzt in Brand.
  for(const c of G.creeps){
    if(c.feindlich) continue;
    c.tick=(c.tick||0)-dt;
    if(c.tick<=0){ c.tick=0.4;
      for(const e of G.enemies) if(dist(e,c)<c.r+e.r*0.6){
        if(c.glut){ e.burn=Math.max(e.burn||0,2.5); damageEnemy(e,1); }
        else e.poison=Math.max(e.poison||0,2);
      }
    }
  }
  for(const c of G.creeps) c.t-=dt;
  G.creeps=G.creeps.filter(c=>c.t>0);
}

/* --- zentrales Gegner-Update --- */
function updateEnemies(dt){
  const p=G.player;
  for(const e of G.enemies){
    if(e.dead) continue;
    e.flash=Math.max(0,e.flash-dt);
    // Statuseffekte
    e.dotT-=dt;
    if(e.dotT<=0){ e.dotT=0.5;
      if(e.poison>0) damageEnemy(e,1.2);
      if(e.burn>0) damageEnemy(e,1.6);
    }
    e.poison=Math.max(0,e.poison-dt);
    e.burn=Math.max(0,e.burn-dt);
    e.frost=Math.max(0,e.frost-dt);
    /* Zeituhr verlangsamt dauerhaft, der Zeitstopp hält alles ganz an. */
    let slow=e.frost>0?0.45:1;
    if(p.flags.has('zeituhr')) slow*=0.75;
    if(G.zeitstopp>0){
      e.t+=dt*0.05;                       // nur ein Hauch Eigenleben
      continue;
    }
    const mode=e.fly?'fly':'walk';
    e.t+=dt; e.cd-=dt*slow;

    if(e.isBoss) updateBossAI(e,dt,slow);
    else updateEnemyAI(e,dt,slow,mode);

    // Rückstoß ausklingen lassen
    e.kx*=Math.pow(0.002,dt); e.ky*=Math.pow(0.002,dt);
    if(Math.abs(e.kx)>1||Math.abs(e.ky)>1) moveEntity(e,e.kx*dt,e.ky*dt,mode);

    // Kontaktschaden
    if(!p.dead&&!e.ghosted&&e.z<8&&dist(e,p)<e.r+p.r-2){
      if(hurtPlayer(1)){}
      if(p.flags.has('thorns')&&(!e.thornCd||e.thornCd<=0)){e.thornCd=0.5;damageEnemy(e,4);}
    }
    if(e.thornCd) e.thornCd-=dt;
  }
  G.enemies=G.enemies.filter(e=>!e.dead);
}

function chaseMove(e,dt,slow,mode,speedMul){
  const p=G.player;
  /* Unsichtbar: die Gegner wissen nicht mehr, wohin, und irren umher. */
  if(p.unsichtbar>0){ wanderMove(e,dt,slow,mode); return; }
  const a=ang(e,p);
  const sp=e.spd*slow*(speedMul||1);
  e.vx=lerp(e.vx,Math.cos(a)*sp,4*dt); e.vy=lerp(e.vy,Math.sin(a)*sp,4*dt);
  moveEntity(e,e.vx*dt,e.vy*dt,mode);
}
function wanderMove(e,dt,slow,mode){
  if(!e.wt||e.wt<=0){e.wt=frand.range(0.7,1.6);e.wa=frand()*TAU;}
  e.wt-=dt;
  const sp=e.spd*slow;
  if(moveEntity(e,Math.cos(e.wa)*sp*dt,Math.sin(e.wa)*sp*dt,mode)) e.wt=0;
}

function updateEnemyAI(e,dt,slow,mode){
  const p=G.player;
  switch(e.ai){
    case 'chase': chaseMove(e,dt,slow,mode); break;

    case 'hop': // Hüpfer: warten, dann Sprung Richtung Spieler
      if(e.state===0){ e.z=0;
        if(e.cd<=0){ e.state=1; e.t=0;
          const a=ang(e,p)+frand.range(-0.3,0.3);
          e.vx=Math.cos(a)*170; e.vy=Math.sin(a)*170; }
      } else {
        const dur=0.55;
        e.z=Math.sin(Math.PI*Math.min(1,e.t/dur))*18;
        moveEntity(e,e.vx*dt*slow,e.vy*dt*slow,'fly');
        if(e.t>=dur){ e.state=0; e.t=0; e.z=0; e.cd=frand.range(0.6,1.2); Sfx.tick(); }
      }
      break;

    case 'shoot': // Spucker
      wanderMove(e,dt,slow,mode);
      if(e.cd<=0&&dist(e,p)<260){ e.cd=e.shotCd*frand.range(0.85,1.2);
        fireEshot(e.x,e.y,ang(e,p),130); }
      break;

    case 'wall': { // Mauerkriecher: umrundet den Raum am Rand entlang.
      // Position wird als Strecke auf dem Raumumfang geführt (im Uhrzeigersinn ab
      // oben links), damit der Lauf an den Ecken sauber umknickt.
      const m=e.r+2, L=RX+m, R=RX+COLS*TILE-m, TP=RY+m, B=RY+ROWS*TILE-m;
      const w=R-L, h=B-TP, per=2*(w+h);
      if(e.perim===undefined){ // an die nächstgelegene Wand schnappen
        const dl=e.x-L, dr=R-e.x, du=e.y-TP, dd=B-e.y;
        const closest=Math.min(dl,dr,du,dd);
        if(closest===du)      e.perim=clamp(e.x-L,0,w);
        else if(closest===dr) e.perim=w+clamp(e.y-TP,0,h);
        else if(closest===dd) e.perim=w+h+clamp(R-e.x,0,w);
        else                  e.perim=2*w+h+clamp(B-e.y,0,h);
        e.dirn=frand.chance(0.5)?1:-1;
      }
      e.perim=(e.perim+e.spd*slow*e.dirn*dt+per)%per;
      const t0=e.perim;
      if(t0<w)            { e.x=L+t0;         e.y=TP; }
      else if(t0<w+h)     { e.x=R;            e.y=TP+(t0-w); }
      else if(t0<2*w+h)   { e.x=R-(t0-w-h);   e.y=B; }
      else                { e.x=L;            e.y=B-(t0-2*w-h); }
      break; }

    case 'charge': { // Rennratte
      if(e.state===0){ wanderMove(e,dt,slow,mode);
        if(e.cd<=0){
          if(Math.abs(e.x-p.x)<14){ e.state=1; e.vx=0; e.vy=Math.sign(p.y-e.y)*250; Sfx.tick(); }
          else if(Math.abs(e.y-p.y)<14){ e.state=1; e.vy=0; e.vx=Math.sign(p.x-e.x)*250; Sfx.tick(); }
        }
      } else {
        if(moveEntity(e,e.vx*dt*slow,e.vy*dt*slow,mode)){ e.state=0; e.cd=frand.range(0.8,1.4); }
      }
      break; }

    case 'creeper': // Sporling: hinterlässt Pfützen
      wanderMove(e,dt,slow,mode);
      if(e.cd<=0){ e.cd=0.55; G.creeps.push({x:e.x,y:e.y,r:13,t:3.2,feindlich:true}); }
      break;

    case 'spread': // Knochenwurf: 3er-Fächer
      wanderMove(e,dt,slow,mode);
      if(e.cd<=0&&dist(e,p)<300){ e.cd=e.shotCd*frand.range(0.9,1.15);
        const a=ang(e,p);
        for(const off of [-0.3,0,0.3]) fireEshot(e.x,e.y,a+off,120); }
      break;

    case 'spray': // Kotspritzer: lobt Klumpen im Bogen, die als Pfütze zerplatzen
      wanderMove(e,dt,slow,mode);
      if(e.cd<=0&&dist(e,p)<280){ e.cd=e.shotCd*frand.range(0.85,1.2);
        const weite=Math.max(60,dist(e,p));
        const sh=fireEshot(e.x,e.y,ang(e,p),weite/0.9,{arc:true,z:0,zt:0,zdur:0.9});
        sh.life=1.0; Sfx.splash(); }
      break;

    case 'dart': // Zuckfliege: ruckartige Sprints
      if(e.cd<=0){ e.cd=frand.range(0.25,0.6);
        const a=frand.chance(0.6)?ang(e,p)+frand.range(-0.8,0.8):frand()*TAU;
        e.vx=Math.cos(a)*e.spd; e.vy=Math.sin(a)*e.spd; }
      e.vx*=Math.pow(0.05,dt); e.vy*=Math.pow(0.05,dt);
      moveEntity(e,e.vx*dt*slow,e.vy*dt*slow,'fly');
      break;

    case 'turret': // Steinmaul: abwechselnd gezielt / 4 Richtungen
      if(e.cd<=0){ e.cd=e.shotCd;
        e.state=1-e.state;
        if(e.state){ fireEshot(e.x,e.y,ang(e,p),140); }
        else for(let i=0;i<4;i++) fireEshot(e.x,e.y,i*Math.PI/2,110);
      }
      break;

    case 'ghost': { // Schleicher: blendet sich aus
      const cyc=(e.t%2.8);
      e.ghosted=cyc>1.6;
      if(!e.ghosted) chaseMove(e,dt,slow,'fly');
      else chaseMove(e,dt,slow,'fly',1.4);
      break; }

    case 'spawner': // Brutmutter
      wanderMove(e,dt,slow,mode);
      if(e.cd<=0&&e.spawned<4&&G.enemies.length<14){
        e.cd=e.shotCd; e.spawned++;
        spawnEnemy(e.def.spawn,e.x,e.y+10,null); Sfx.tick(); }
      break;

    case 'bounce': { // Stachelkugel: Abpraller
      if(!e.bvx){ const a=frand.pick([1,3,5,7])*Math.PI/4; e.bvx=Math.cos(a)*e.spd; e.bvy=Math.sin(a)*e.spd; }
      const oldx=e.x,oldy=e.y;
      e.x+=e.bvx*dt*slow;
      if(circleHitsGrid(e.x,e.y,e.r,'walk')||e.x<RX+e.r||e.x>RX+COLS*TILE-e.r){e.x=oldx;e.bvx*=-1;}
      e.y+=e.bvy*dt*slow;
      if(circleHitsGrid(e.x,e.y,e.r,'walk')||e.y<RY+e.r||e.y>RY+ROWS*TILE-e.r){e.y=oldy;e.bvy*=-1;}
      break; }

    case 'ring': // Pulsqualle
      chaseMove(e,dt,slow,'fly',0.8);
      if(e.cd<=0){ e.cd=e.shotCd;
        for(let i=0;i<8;i++) fireEshot(e.x,e.y,i*TAU/8+e.t,95); }
      break;

    /* Talgwicht: zieht Brandspur. Unter 40% Leben erlischt die Flamme — dann
       sieht er nichts mehr und rennt blind doppelt so schnell in die zuletzt
       wahrgenommene Richtung weiter. */
    case 'talg': {
      const aus=e.hp<e.maxHp*0.4;
      if(!aus){
        e.blindA=ang(e,p);
        chaseMove(e,dt,slow,mode);
      } else {
        if(e.blindA===undefined) e.blindA=ang(e,p);
        const sp=e.spd*slow*2;
        if(moveEntity(e,Math.cos(e.blindA)*sp*dt,Math.sin(e.blindA)*sp*dt,mode))
          e.blindA=frand()*TAU;                       // an der Wand neu orientieren
      }
      e.cd-=0; e.gcd=(e.gcd||0)-dt;
      if(e.gcd<=0&&!aus){ e.gcd=0.42;
        G.creeps.push({x:e.x,y:e.y,r:10,t:2.4,feindlich:true,glut:true}); }
      break; }

    /* Spinnwirt: hängt an der Decke, bis der Spieler darunter steht. Beim
       Aufschlag bleibt ein Netz liegen, das bremst. */
    case 'decke': {
      if(e.state===0){
        e.ghosted=false; e.anDerDecke=true;
        e.z=42+Math.sin(e.t*1.6)*2;
        if(Math.abs(p.x-e.x)<44&&Math.abs(p.y-e.y)<52){ e.state=1; e.t=0; Sfx.tick(); }
      } else if(e.state===1){                         // Fall
        e.anDerDecke=false;
        e.z=Math.max(0,e.z-260*dt);
        if(e.z<=0){ e.state=2; e.t=0; G.shake=3; Sfx.splash();
          G.creeps.push({x:e.x,y:e.y,r:22,t:6,feindlich:true,netz:true});
          burst(e.x,e.y,'#d8d8e4',8); }
      } else {
        if(e.t<0.6) break;                            // kurz verharren
        chaseMove(e,dt,slow,'fly');
      }
      break; }

    /* Glockenmaul: schlägt an und schickt eine Ringwelle, die den Spieler
       zurückwirft. Bewegt sich sonst kaum. */
    case 'glocke':
      wanderMove(e,dt,slow*0.5,mode);
      if(e.cd<=0){ e.cd=e.shotCd;
        e.welle={r:0,t:0.75}; Sfx.door(); G.shake=5;
        schockwelle(e.x,e.y,190,'#d9a94e',0.7,5);
      }
      if(e.welle){
        const vorher=e.welle.r;
        e.welle.r+=300*dt; e.welle.t-=dt;
        const d=dist(e,p);
        if(d>vorher&&d<=e.welle.r&&!e.welle.traf){    // Welle überstreicht den Spieler
          e.welle.traf=true;
          const a=ang(e,p);
          p.vx+=Math.cos(a)*420; p.vy+=Math.sin(a)*420;
          p.taumeln=0.7; G.shake=Math.max(G.shake,5);
        }
        if(e.welle.t<=0) e.welle=null;
      }
      break;

    /* Schlundling: rennt zur nächsten Beute, verschluckt sie und sucht dann
       den Ausgang. Beim Tod fällt alles wieder heraus. */
    case 'dieb': {
      if(!e.beute){
        let ziel=null,bd=1e9;
        for(const q of G.pickups){ if(q.price||q.dead) continue;
          const d=dist(e,q); if(d<bd){bd=d;ziel=q;} }
        if(ziel){
          const a=ang(e,ziel);
          moveEntity(e,Math.cos(a)*e.spd*slow*dt,Math.sin(a)*e.spd*slow*dt,mode);
          if(bd<e.r+8){ e.beute=ziel.type; e.beutePille=ziel.pillId; e.beuteKarte=ziel.cardId;
            ziel.dead=true; Sfx.pickup(); burst(e.x,e.y,'#ffd75a',8); }
        } else chaseMove(e,dt,slow,mode,0.6);
      } else {
        // mit voller Beute Richtung nächster Tür
        let dp=null,bd=1e9;
        for(const d in G.room.doors){ const q=doorXY(d); const dd=dist(e,q);
          if(dd<bd){bd=dd;dp=q;} }
        if(dp){ const a=ang(e,dp);
          moveEntity(e,Math.cos(a)*e.spd*slow*1.2*dt,Math.sin(a)*e.spd*slow*1.2*dt,mode);
          if(bd<26){ e.dead=true; burst(e.x,e.y,'#6e3330',10); Sfx.error(); } }
      }
      break; }

    /* Aschgeist: schwebt heran. Stirbt er das erste Mal, sammelt er sich nach
       drei Sekunden mit halber Kraft wieder — Feuer und Frost verhindern das. */
    case 'asche':
      if(e.sammelt>0){
        e.sammelt-=dt; e.ghosted=true;
        if(e.sammelt<=0){ e.ghosted=false; e.hp=e.maxHp*0.5;
          burst(e.x,e.y,'#6e6270',12); Sfx.edeath(); }
        break;
      }
      chaseMove(e,dt,slow,'fly');
      break;

    /* Sporenwirt: rührt sich nicht. Jeder Treffer presst eine Sporenwolke
       heraus, die stehen bleibt und die Sicht nimmt. */
    case 'sporen':
      if(e.sporenSchuld>0){ e.sporenSchuld--;
        G.creeps.push({x:e.x+frand.range(-8,8),y:e.y+frand.range(-8,8),
                       r:30,t:5,feindlich:true,sporen:true});
        Sfx.splash();
      }
      break;

    /* Klingenrad: umrundet den Raum und legt mit jeder Runde zu. */
    case 'wandlauf': {
      const m=e.r+2, L=RX+m, R=RX+COLS*TILE-m, TP=RY+m, B=RY+ROWS*TILE-m;
      const w=R-L, h=B-TP, per=2*(w+h);
      if(e.perim===undefined){
        const dl=e.x-L, dr=R-e.x, du=e.y-TP, dd=B-e.y;
        const nah=Math.min(dl,dr,du,dd);
        if(nah===du)      e.perim=clamp(e.x-L,0,w);
        else if(nah===dr) e.perim=w+clamp(e.y-TP,0,h);
        else if(nah===dd) e.perim=w+h+clamp(R-e.x,0,w);
        else              e.perim=2*w+h+clamp(B-e.y,0,h);
        e.runden=0; e.tempo=e.spd;
      }
      const vor=e.perim;
      e.perim=(e.perim+e.tempo*slow*dt)%per;
      if(e.perim<vor){ e.runden++; e.tempo=Math.min(210,e.spd+e.runden*30); }
      const t0=e.perim;
      if(t0<w)          { e.x=L+t0;       e.y=TP; }
      else if(t0<w+h)   { e.x=R;          e.y=TP+(t0-w); }
      else if(t0<2*w+h) { e.x=R-(t0-w-h); e.y=B; }
      else              { e.x=L;          e.y=B-(t0-2*w-h); }
      break; }

    /* Laternenfisch: schwebt und zieht den Spieler mit seiner Lampe heran.
       Ist die Lampe aus (unter 35% Leben), hört der Sog auf. */
    case 'laterne': {
      chaseMove(e,dt,slow,'fly',0.5);
      e.lampeAn=e.hp>e.maxHp*0.35;
      if(e.lampeAn){
        const d=dist(e,p);
        if(d<170&&d>14){ const a=ang(p,e);
          p.vx+=Math.cos(a)*150*dt*60*0.02; p.vy+=Math.sin(a)*150*dt*60*0.02; }
      }
      break; }

    /* Kettenhund: an seinen Spawnpunkt gekettet, stürzt darin vor. */
    case 'kette': {
      if(e.anker===undefined){ e.ankerX=e.x; e.ankerY=e.y; e.anker=true; e.kette=86; }
      const zumAnker=Math.hypot(e.x-e.ankerX,e.y-e.ankerY);
      if(e.state===0){
        if(zumAnker>4){ const a=Math.atan2(e.ankerY-e.y,e.ankerX-e.x);  // zurückschleichen
          moveEntity(e,Math.cos(a)*50*slow*dt,Math.sin(a)*50*slow*dt,mode); }
        if(e.cd<=0&&dist(e,p)<e.kette){ e.state=1; e.t=0;
          const a=ang(e,p); e.vx=Math.cos(a)*240; e.vy=Math.sin(a)*240; Sfx.tick(); }
      } else {
        moveEntity(e,e.vx*dt*slow,e.vy*dt*slow,mode);
        if(Math.hypot(e.x-e.ankerX,e.y-e.ankerY)>e.kette||e.t>0.7){
          e.state=0; e.cd=frand.range(0.8,1.4); }
      }
      break; }

    /* Schimmelherz: heilt regelmäßig alle verletzten Gegner im Raum und
       schlägt schneller, je weniger davon übrig sind. */
    case 'heiler': {
      wanderMove(e,dt,slow*0.7,mode);
      const uebrig=Math.max(1,G.enemies.length-1);
      if(e.cd<=0){ e.cd=Math.max(1.1,3.4-(4-Math.min(4,uebrig))*0.6);
        let geheilt=0;
        for(const a of G.enemies){
          if(a===e||a.hp>=a.maxHp) continue;
          a.hp=Math.min(a.maxHp,a.hp+a.maxHp*0.18); geheilt++;
          blitz(a.x,a.y,a.r+5,'#a8c46a',0.3);
        }
        if(geheilt){ schockwelle(e.x,e.y,90,'#8ac850',0.5,3); Sfx.heart(); }
      }
      break; }

    /* Steinrücken: dreht sich stetig zum Spieler. Treffer von vorn prallen ab,
       nur die ungeschützte Rückseite nimmt Schaden. */
    /* --- Nabelkind: pendelt an der Schnur, bis man sie durchtrennt ---- */
    case 'nabel': {
      if(e.ankerX===undefined){ e.ankerX=e.x; e.ankerY=RY+8; e.schwung=frand()*TAU; }
      if(e.hp>e.maxHp*0.5){                       // hängt noch
        e.schwung+=dt*slow*1.5;
        e.x=e.ankerX+Math.sin(e.schwung)*74;
        e.y=e.ankerY+70+Math.cos(e.schwung*2)*10;
        e.fly=true;
      } else {                                    // abgerissen: kriecht weiter
        if(!e.gefallen){ e.gefallen=true; e.fly=false; e.spd=54;
          burst(e.x,e.y,'#8a3a44',10); Sfx.splash(); }
        chaseMove(e,dt,slow,mode);
      }
      break; }

    /* --- Häutling: rennt und hinterlässt eine nasse, glatte Spur ------ */
    case 'haeutling': {
      chaseMove(e,dt,slow,mode,1.0);
      e.gcd=(e.gcd||0)-dt;
      if(e.gcd<=0){ e.gcd=0.3;
        G.creeps.push({x:e.x,y:e.y,r:13,t:4,feindlich:true,glatt:true}); }
      break; }

    /* --- Vielauge: schießt dorthin, wo gerade die meisten Augen offen
       sind — für den Spieler heißt das: unvorhersehbare Fächer.        */
    case 'vielauge': {
      chaseMove(e,dt,slow,mode,0.6);
      if(e.cd<=0){
        e.cd=e.def.shotCd||1.6;
        const a=ang(e,p);
        const n=2+frand.int(3);
        for(let i=0;i<n;i++) fireEshot(e.x,e.y,a+frand.range(-0.7,0.7),120);
      }
      break; }

    /* --- Zwillingsbalg: zwei Köpfe, die sich abwechseln, nie gleichzeitig */
    case 'zwilling': {
      chaseMove(e,dt,slow,mode,0.7);
      if(e.cd<=0){
        e.cd=e.def.shotCd||1.1;
        e.kopf=e.kopf?0:1;                        // Wechsel — sichtbar am Glühen
        const a=ang(e,p), seite=(e.kopf?1:-1)*0.28;
        fireEshot(e.x+(e.kopf?7:-7),e.y-6,a+seite,140);
      }
      break; }

    /* --- Schlundmutter: der Bauch klappt auf und entlässt Spinnlinge -- */
    case 'schlundmutter': {
      chaseMove(e,dt,slow,mode,0.5);
      e.bauch=Math.max(0,(e.bauch||0)-dt);
      if(e.cd<=0){
        e.cd=frand.range(2.6,3.6); e.bauch=1.0;
        const wie=G.enemies.filter(x=>x.type==='spinnling').length;
        if(wie<6) for(let i=0;i<2;i++)
          spawnEnemy('spinnling',e.x+frand.range(-12,12),e.y+12,null);
        Sfx.splash();
      }
      break; }

    /* --- Fingerbaum: wächst fest, greift zu. Wer gepackt wird, steht --- */
    case 'finger': {
      e.greif=Math.max(0,(e.greif||0)-dt);
      if(e.cd<=0&&dist(e,p)<78){
        e.cd=3.2; e.greif=0.5;
        einschlagSetzen(p.x,p.y,26,0.5,0,'#d8c6ac');   // nur Vorwarnung, kein Schaden
        e.zielX=p.x; e.zielY=p.y;
      }
      if(e.greif>0&&e.greif<0.02&&dist(p,{x:e.zielX,y:e.zielY})<30){
        p.gepackt=2.0; p.vx*=0.2; p.vy*=0.2;
        addText(p.x,p.y-18,'gepackt!','#d8c6ac'); Sfx.hit();
      }
      break; }

    /* --- Grabhusten: wirft einen Kegel aus Sporen vor sich ------------ */
    case 'husten': {
      if(e.state===0){
        chaseMove(e,dt,slow,mode,0.8);
        if(e.cd<=0&&dist(e,p)<150){ e.state=1; e.t=0; e.hustA=ang(e,p); }
      } else {
        if(e.t>0.35){
          for(let i=-2;i<=2;i++){
            const a=e.hustA+i*0.22, d=34+Math.abs(i)*6;
            G.creeps.push({x:e.x+Math.cos(a)*d,y:e.y+Math.sin(a)*d,
                           r:22,t:3.4,feindlich:true,sporen:true});
          }
          Sfx.splash(); e.state=0; e.cd=3.0;
        }
      }
      break; }

    /* --- Nagelbraut: jeder Treffer schlägt Nägel heraus, die liegen
       bleiben. Das Ausschlagen steckt in damageEnemy.                  */
    case 'nagel': {
      chaseMove(e,dt,slow,mode,0.9);
      break; }

    /* --- Kriechkiefer: beißt im Vorbeilaufen und dreht sofort ab ------ */
    case 'kiefer': {
      if(e.state===0){                            // anschleichen
        chaseMove(e,dt,slow,mode,0.7);
        if(e.cd<=0&&dist(e,p)<120){
          e.state=1; e.t=0; const a=ang(e,p);
          e.vx=Math.cos(a)*260; e.vy=Math.sin(a)*260; Sfx.tick();
        }
      } else if(e.state===1){                     // Biss im Vorbeilauf
        moveEntity(e,e.vx*dt*slow,e.vy*dt*slow,mode);
        if(e.t>0.42){ e.state=2; e.t=0;
          const a=ang(e,p)+Math.PI+frand.range(-0.5,0.5);
          e.vx=Math.cos(a)*170; e.vy=Math.sin(a)*170; }
      } else {                                    // wegdrehen
        moveEntity(e,e.vx*dt*slow,e.vy*dt*slow,mode);
        if(e.t>0.5){ e.state=0; e.cd=frand.range(0.5,1.0); }
      }
      break; }

    /* --- Wachslicht: schmilzt im Laufen, die Pfütze brennt ----------- */
    case 'wachs': {
      chaseMove(e,dt,slow,mode,0.8);
      e.gcd=(e.gcd||0)-dt;
      if(e.gcd<=0){
        e.gcd=0.55;
        G.creeps.push({x:e.x,y:e.y,r:11,t:3.0,feindlich:true,glut:true});
        e.r=Math.max(6,e.r-0.35);                 // wird kleiner, bis nur der Docht bleibt
        e.hp=Math.max(1,e.hp-0.5);
      }
      break; }

    /* --- Ohrwurm: fährt durch die Wand, nur draußen ist er zu treffen - */
    case 'ohrwurm': {
      if(e.state===0){                            // in der Wand
        e.ghosted=true;
        e.x=lerp(e.x,clamp(p.x,RX+30,RX+COLS*TILE-30),0.9*dt);
        e.y=lerp(e.y,RY-6,2.2*dt);
        if(e.cd<=0){ e.state=1; e.t=0; e.cd=frand.range(2.4,3.4); }
      } else {                                    // herausgeschoben
        e.ghosted=false;
        const raus=Math.sin(Math.min(1,e.t/1.6)*Math.PI);
        e.y=RY-6+raus*96;
        if(e.cd<=1.8&&e.cd>1.72){
          const a=ang(e,p);
          for(const off of [-0.2,0,0.2]) fireEshot(e.x,e.y,a+off,130);
        }
        if(e.t>1.6){ e.state=0; e.ghosted=true; }
      }
      break; }

    /* --- Spiegelbalg: macht jeden Schritt spiegelverkehrt mit. Man
       bekommt ihn nur in einer Ecke zu fassen.                        */
    case 'spiegel': {
      const mx=RX+COLS*TILE/2, my=RY+ROWS*TILE/2;
      const zx=mx-(p.x-mx), zy=my-(p.y-my);
      e.x=lerp(e.x,zx,3.2*dt*slow); e.y=lerp(e.y,zy,3.2*dt*slow);
      break; }

    case 'panzer': {
      if(e.blick===undefined) e.blick=ang(e,p);
      const ziel=ang(e,p);
      let diff=ziel-e.blick; while(diff>Math.PI)diff-=TAU; while(diff<-Math.PI)diff+=TAU;
      e.blick+=clamp(diff,-1.6*dt,1.6*dt);            // langsam, aber ohne Pause
      chaseMove(e,dt,slow,mode,0.7);
      break; }

    case 'burrow': // Grabgräber
      if(e.state===0){ // unter der Erde: auf Spieler zubewegen
        e.ghosted=true;
        chaseMove(e,dt,slow,'fly',1.3);
        if(e.cd<=0){ e.state=1; e.t=0; }
      } else if(e.state===1){ // Auftauch-Telegraf
        if(e.t>0.45){ e.state=2; e.t=0; e.ghosted=false; Sfx.splash(); burst(e.x,e.y,'#8a7a66',8); }
      } else { // an der Oberfläche
        chaseMove(e,dt,slow,mode,0.5);
        if(e.t>1.4){ e.state=0; e.t=0; e.cd=frand.range(1.2,2); }
      }
      break;
  }
}

/* --- BOSS-KI: mehrere Patterns + Phasenwechsel bei 50% --- */
function updateBossAI(e,dt,slow){
  const p=G.player;
  if(e.phase===1&&e.hp<e.maxHp*0.5){ e.phase=2; e.flash=0.4; G.shake=8; Sfx.bossroar();
    burst(e.x,e.y,'#ffffff',20); }
  e.patT-=dt*slow;

  switch(e.ai){
    case 'matsch': { // Matschkönig: Sprünge + Schussfächer
      const hopSpd=e.phase===2?200:150;
      if(e.state===0){ e.z=0;
        if(e.cd<=0){ e.state=1; e.t=0;
          const a=ang(e,p);
          e.vx=Math.cos(a)*hopSpd; e.vy=Math.sin(a)*hopSpd; }
      } else if(e.state===1){
        const dur=0.6; e.z=Math.sin(Math.PI*Math.min(1,e.t/dur))*26;
        moveEntity(e,e.vx*dt*slow,e.vy*dt*slow,'fly');
        if(e.t>=dur){ e.state=0; e.t=0; e.z=0; G.shake=4; Sfx.splash();
          e.hops=(e.hops||0)+1;
          if(e.phase===2) for(let i=0;i<8;i++) fireEshot(e.x,e.y,i*TAU/8,110);
          if(e.hops%3===0){ e.state=2; e.t=0; } else e.cd=0.5; }
      } else { // Fächer spucken
        if(e.t>0.4){
          const a=ang(e,p);
          for(const off of [-0.4,-0.2,0,0.2,0.4]) fireEshot(e.x,e.y,a+off,130);
          if(e.phase===2&&G.enemies.filter(x=>x.type==='blobling').length<2)
            spawnEnemy('blobling',e.x+frand.range(-20,20),e.y+20,null);
          e.state=0; e.cd=0.8; }
      }
      break; }

    case 'auge': { // Augenwächter: Schwebeflug + Salven
      e.hovA=(e.hovA||0)+dt*1.2;
      const tx0=p.x+Math.cos(e.hovA)*90, ty0=RY+70+Math.sin(e.hovA*1.7)*30;
      e.x=lerp(e.x,tx0,1.5*dt); e.y=lerp(e.y,ty0,1.5*dt);
      if(e.phase===1){
        if(e.cd<=0){ e.cd=1.6;
          const a=ang(e,p);
          for(const off of [-0.18,0,0.18]) fireEshot(e.x,e.y,a+off,150);
          if(G.enemies.filter(x=>x.type==='wanderauge').length<3&&frand.chance(0.4))
            spawnEnemy('wanderauge',e.x,e.y,null); }
      } else { // Spiralfeuer
        e.spiral=(e.spiral||0)+dt*5;
        if(e.cd<=0){ e.cd=0.16;
          fireEshot(e.x,e.y,e.spiral,130); fireEshot(e.x,e.y,e.spiral+Math.PI,130); }
      }
      break; }

    case 'knochen': { // Knochengeneral: Würfe + Rammattacken
      if(e.state===0){
        chaseMove(e,dt,slow,'walk',0.5);
        if(e.cd<=0){
          if(Math.abs(e.x-p.x)<18||Math.abs(e.y-p.y)<18){ e.state=1;
            const a=Math.abs(e.x-p.x)<18?(p.y>e.y?Math.PI/2:-Math.PI/2):(p.x>e.x?0:Math.PI);
            e.vx=Math.cos(a)*(e.phase===2?300:230); e.vy=Math.sin(a)*(e.phase===2?300:230); Sfx.tick(); }
          else { const a=ang(e,p);
            for(const off of [-0.35,0,0.35]) fireEshot(e.x,e.y,a+off,140);
            e.cd=e.phase===2?1.0:1.6; }
        }
      } else {
        if(moveEntity(e,e.vx*dt*slow,e.vy*dt*slow,'walk')){
          e.state=0; e.cd=0.8; G.shake=5; Sfx.splash();
          if(e.phase===2) for(let i=0;i<8;i++) fireEshot(e.x,e.y,i*TAU/8+0.4,120); }
      }
      break; }

    case 'gift': { // Giftbrut: Bogenwürfe + Giftspur
      chaseMove(e,dt,slow,'walk',e.phase===2?0.85:0.55);
      if(e.gcd===undefined) e.gcd=0;
      e.gcd-=dt;
      if(e.gcd<=0){ e.gcd=0.4; G.creeps.push({x:e.x,y:e.y,r:14,t:3,feindlich:true}); }
      if(e.cd<=0){ e.cd=e.phase===2?1.1:1.8;
        for(let i=0;i<(e.phase===2?3:2);i++){
          const a=ang(e,p)+frand.range(-0.5,0.5), d0=dist(e,p);
          const sh=fireEshot(e.x,e.y,a,d0/1.1,{arc:true,z:0,zt:0,zdur:1.1});
          sh.life=1.2; }
      }
      if(e.phase===2&&e.cd<=0.2&&G.enemies.filter(x=>x.type==='sporling').length<2&&frand.chance(0.3))
        spawnEnemy('sporling',e.x,e.y,null);
      break; }

    case 'herz': { // Doppelherz: zwei Hälften, unterschiedliches Verhalten
      const twinAlive=G.enemies.some(x=>x.isBoss&&x!==e&&!x.dead);
      if(!twinAlive&&!e.enraged){ e.enraged=true; e.flash=0.4; Sfx.bossroar(); }
      const rage=e.enraged?1.6:1;
      if(e.variant===0){ // Jäger-Herz
        chaseMove(e,dt,slow,'fly',0.9*rage);
        if(e.cd<=0){ e.cd=2.2/rage;
          const a=ang(e,p);
          for(const off of [-0.25,0.25]) fireEshot(e.x,e.y,a+off,140); }
      } else { // Wächter-Herz
        e.hovA=(e.hovA||0)+dt;
        e.x=lerp(e.x,tx(9)+Math.cos(e.hovA)*40,1.2*dt);
        e.y=lerp(e.y,ty(3)+Math.sin(e.hovA*1.4)*40,1.2*dt);
        if(e.cd<=0){ e.cd=2.4/rage;
          for(let i=0;i<10;i++) fireEshot(e.x,e.y,i*TAU/10+e.t,105); }
      }
      break; }

    case 'kloake': { // Der Kloakenfürst: Sprünge, Klumpenregen, ab Phase 2 Rutschattacke
      if(e.state===0){                       // Anlauf zum Sprung
        e.z=0;
        if(e.cd<=0){ e.state=1; e.t=0;
          const a=ang(e,p), sp=e.phase===2?210:165;
          e.vx=Math.cos(a)*sp; e.vy=Math.sin(a)*sp; Sfx.tick(); }
      } else if(e.state===1){                // Sprung
        const dur=0.62;
        e.z=Math.sin(Math.PI*Math.min(1,e.t/dur))*30;
        moveEntity(e,e.vx*dt*slow,e.vy*dt*slow,'fly');
        if(e.t>=dur){                        // Aufschlag: Pfütze + Klumpenring
          e.state=0; e.t=0; e.z=0; G.shake=6; Sfx.splash();
          G.creeps.push({x:e.x,y:e.y,r:24,t:4,feindlich:true});
          const n=e.phase===2?12:8;
          for(let i=0;i<n;i++) fireEshot(e.x,e.y,i*TAU/n+frand()*0.3,120);
          e.spruenge=(e.spruenge||0)+1;
          if(e.phase===2&&e.spruenge%3===0){ // Rutschattacke quer durch den Raum
            e.state=2; e.t=0; e.cd=0;
            const a=frand.pick([0,Math.PI/2,Math.PI,-Math.PI/2]);
            e.rvx=Math.cos(a)*260; e.rvy=Math.sin(a)*260;
          } else if(e.spruenge%2===0){ e.state=3; e.t=0; e.cd=0; }
          else e.cd=frand.range(0.5,0.9);
        }
      } else if(e.state===2){                // rutscht und prallt von Wänden ab
        e.gcd=(e.gcd||0)-dt;
        if(e.gcd<=0){ e.gcd=0.12; G.creeps.push({x:e.x,y:e.y,r:16,t:3,feindlich:true}); }
        const ox=e.x, oy=e.y;
        e.x+=e.rvx*dt*slow;
        if(circleHitsGrid(e.x,e.y,e.r,'walk')||e.x<RX+e.r||e.x>RX+COLS*TILE-e.r){
          e.x=ox; e.rvx*=-1; G.shake=4; Sfx.splash(); }
        e.y+=e.rvy*dt*slow;
        if(circleHitsGrid(e.x,e.y,e.r,'walk')||e.y<RY+e.r||e.y>RY+ROWS*TILE-e.r){
          e.y=oy; e.rvy*=-1; G.shake=4; Sfx.splash(); }
        if(e.t>2.6){ e.state=0; e.t=0; e.cd=0.6; }
      } else {                               // Klumpenregen im Bogen
        if(e.cd<=0){ e.cd=0.28;
          const a=ang(e,p)+frand.range(-0.6,0.6);
          const weite=Math.max(60,dist(e,p)*frand.range(0.7,1.2));
          const sh=fireEshot(e.x,e.y,a,weite/0.9,{arc:true,z:0,zt:0,zdur:0.9});
          sh.life=1.0;
        }
        if(e.t>1.5){ e.state=0; e.t=0; e.cd=0.5;
          // In Phase 2 krabbeln Diener aus dem Dreck
          if(e.phase===2&&G.enemies.filter(x=>x.type==='kotkrabbler').length<4)
            for(let i=0;i<2;i++)
              spawnEnemy('kotkrabbler',e.x+frand.range(-24,24),e.y+frand.range(-16,16),null);
        }
      }
      break; }

    case 'vater': { // Der Kellervater: Endboss, 3 Phasen
      if(e.phase===2&&e.hp<e.maxHp*0.28) e.phase=3;
      if(e.state===0){ // schweben + Muster
        e.hovA=(e.hovA||0)+dt*0.8;
        e.x=lerp(e.x,tx(6)+Math.cos(e.hovA)*70,1.4*dt);
        e.y=lerp(e.y,ty(2)+Math.sin(e.hovA*1.3)*26,1.4*dt);
        if(e.cd<=0){
          e.pat=(e.pat+1)%4;
          if(e.pat===0){ // Radialring
            const n=e.phase>=2?14:10;
            for(let i=0;i<n;i++) fireEshot(e.x,e.y,i*TAU/n+e.t,115);
            e.cd=1.4;
          } else if(e.pat===1){ // gezielte Salve
            const a=ang(e,p);
            for(const off of [-0.3,-0.15,0,0.15,0.3]) fireEshot(e.x,e.y,a+off,160);
            e.cd=1.2;
          } else if(e.pat===2){ // Diener rufen
            const pool=FLOORS[5].pool;
            if(G.enemies.length<6) for(let i=0;i<2;i++)
              spawnEnemy(frand.pick(pool),tx(3+frand.int(7)),ty(1+frand.int(5)),null);
            e.cd=2.0;
          } else if(e.pat===3&&e.phase>=2){ // rotierende Doppelspirale
            e.state=1; e.t=0; e.spiral=frand()*TAU; e.cd=0.1;
          } else e.cd=0.6;
          if(e.phase>=3) e.cd*=0.65;
        }
      } else { // Spiralphase
        e.spiral+=dt*4.2;
        if(e.cd<=0){ e.cd=0.11;
          for(let i=0;i<(e.phase>=3?3:2);i++)
            fireEshot(e.x,e.y,e.spiral+i*TAU/3,125); }
        if(e.t>2.2){ e.state=0; e.cd=1.2; }
      }
      break; }

    /* --- Die Kammermutter: sechs Arme, die nacheinander einschlagen ----
       Sie bewegt sich kaum. Gefährlich ist nicht sie selbst, sondern der
       Ring aus Einschlägen um sie herum — und die Brut, die aus ihrem Leib
       fällt, sobald man sie trifft. */
    case 'mutter': {
      e.x=lerp(e.x,clamp(p.x,RX+70,RX+COLS*TILE-70),0.5*dt);
      e.y=lerp(e.y,ty(2),0.5*dt);
      if(e.cd<=0){
        e.pat=(e.pat+1)%3;
        if(e.pat===0){                       // Armschlag auf den Spieler
          const n=e.phase===2?3:2;
          for(let i=0;i<n;i++)
            einschlagSetzen(p.x+frand.range(-30,30)*i,p.y+frand.range(-24,24)*i,
                            38,0.85,1,'#c8705a');
          e.cd=e.phase===2?1.1:1.7;
        } else if(e.pat===1){                // Ring aus Schlägen um sie herum
          const n=e.phase===2?8:6, dreh=frand()*TAU;
          for(let i=0;i<n;i++){
            const a=dreh+i*TAU/n;
            einschlagSetzen(e.x+Math.cos(a)*88,e.y+Math.sin(a)*62,34,1.0,1,'#c8705a');
          }
          e.cd=e.phase===2?1.4:2.0;
        } else {                             // Brut aus dem Leib
          const wie=G.enemies.filter(x=>!x.isBoss).length;
          if(wie<7) for(let i=0;i<(e.phase===2?3:2);i++)
            spawnEnemy(frand.pick(['miniblob','zuckfliege']),
                       e.x+frand.range(-24,24),e.y+26,null);
          if(e.phase===2) for(let i=0;i<10;i++) fireEshot(e.x,e.y+20,i*TAU/10+e.t,105);
          e.cd=1.6;
        }
      }
      break; }

    /* --- Der Schlundvater: ein Maul im Boden, das saugt --------------
       Er steht fest. Der Sog zieht einen ständig zu ihm, die Zunge peitscht
       heraus, und wer zu nah kommt, wird gebissen. Man muss dagegen an. */
    case 'schlund': {
      e.x=tx(6); e.y=ty(3);
      const d=dist(p,e), a=ang(p,e);
      const sog=(e.phase===2?46:30)*(1-clamp(d/300,0,1));
      p.vx+=Math.cos(a)*sog*dt*60*0.06; p.vy+=Math.sin(a)*sog*dt*60*0.06;
      if(e.cd<=0){
        e.pat=(e.pat+1)%3;
        if(e.pat===0){                       // Zunge peitscht heraus
          e.state=1; e.t=0;
          e.zungeA=ang(e,p);
          einschlagSetzen(e.x+Math.cos(e.zungeA)*90,e.y+Math.sin(e.zungeA)*90,
                          30,0.7,1,'#c85a66');
          e.cd=1.3;
        } else if(e.pat===1){                // Speiring
          const n=e.phase===2?12:8;
          for(let i=0;i<n;i++) fireEshot(e.x,e.y,i*TAU/n+e.t*0.7,120);
          e.cd=1.5;
        } else {                             // Biss: alles nah am Maul
          einschlagSetzen(e.x,e.y,58,0.9,1,'#a03a48');
          if(e.phase===2){
            const wie=G.enemies.filter(x=>!x.isBoss).length;
            if(wie<6) for(let i=0;i<2;i++)
              spawnEnemy('kotkrabbler',e.x+frand.range(-40,40),e.y+40,null);
          }
          e.cd=1.8;
        }
      }
      if(e.state===1&&e.t>0.5){ e.state=0; }
      break; }

    /* --- Der Gehängte: schwingt am Strick quer durch den Raum --------
       Er lässt sich nicht verfolgen, man muss seinem Bogen ausweichen. An
       den Umkehrpunkten regnet es Finger. */
    case 'haenger': {
      e.schwung=(e.schwung||0)+dt*slow*(e.phase===2?1.5:1.0);
      const bogen=Math.sin(e.schwung);
      e.x=tx(6)+bogen*(COLS*TILE*0.34);
      e.y=ty(2)+Math.abs(bogen)*22;
      if(Math.abs(bogen)>0.985&&e.cd<=0){    // Umkehrpunkt
        e.cd=0.9;
        const n=e.phase===2?7:5;
        for(let i=0;i<n;i++)
          einschlagSetzen(e.x+(i-(n-1)/2)*34,ty(4)+frand.range(-14,14),
                          24,0.8,1,'#cfc2a4');
        Sfx.tick();
      }
      if(e.phase===2&&e.cd<=0.35&&frand.chance(0.06))
        fireEshot(e.x,e.y,ang(e,p),135);
      break; }

    /* --- Die Fleischmade: wühlt sich durch den Raum ------------------
       Unter dem Boden ist sie unverwundbar, dafür sieht man die Spur. Bei
       halber Kraft speit sie zwei Brutmaden aus, die weiterfressen. */
    case 'made': {
      if(e.phase===2&&!e.geteilt){
        e.geteilt=true;
        for(let i=0;i<2;i++) spawnEnemy('myzelwurm',e.x+(i?30:-30),e.y,null);
        G.shake=9; burst(e.x,e.y,'#c8a288',20);
      }
      if(e.state===0){                       // eingegraben
        e.ghosted=true;
        chaseMove(e,dt,slow,'fly',e.phase===2?1.5:1.1);
        if(frand.chance(0.5)) burst(e.x,e.y,'#6a5038',1);
        if(e.cd<=0){                         // auftauchen
          e.state=1; e.t=0; e.ghosted=false;
          einschlagSetzen(e.x,e.y,44,0.6,1,'#c8a288');
          e.cd=e.phase===2?2.2:2.8;
        }
      } else {                               // aufgetaucht, schießt
        if(e.t<0.2) { e.vx*=0.9; e.vy*=0.9; }
        moveEntity(e,e.vx*dt*0.3,e.vy*dt*0.3,'walk');
        if(e.cd<=0.9&&e.cd>0.85){
          const a=ang(e,p);
          for(const off of [-0.5,-0.25,0,0.25,0.5]) fireEshot(e.x,e.y,a+off,125);
        }
        if(e.t>1.6){ e.state=0; e.ghosted=true; }
      }
      break; }

    /* --- Der Bittende: wächst mit jedem Viertel, das er verliert ------
       Er kniet und rührt sich nicht vom Fleck. Mit jeder Stufe schlägt ein
       weiteres Händepaar zu — am Ende hagelt es aus vier Richtungen. */
    case 'bittend': {
      e.x=lerp(e.x,tx(6),0.6*dt); e.y=lerp(e.y,ty(3),0.6*dt);
      const stufe=Math.min(3,Math.floor((1-e.hp/e.maxHp)*4));
      if(stufe>(e.stufe||0)){
        e.stufe=stufe; e.r=44+stufe*5; e.flash=0.4;
        G.shake=8; Sfx.bossroar(); schockwelle(e.x,e.y,120,'#ffe08a',0.6,5);
      }
      if(e.cd<=0){
        e.pat=(e.pat+1)%2;
        if(e.pat===0){                       // Hände schlagen zu
          const n=1+(e.stufe||0);
          for(let i=0;i<n;i++)
            einschlagSetzen(p.x+frand.range(-40,40),p.y+frand.range(-32,32),
                            34,0.75,1,'#cfc0ae');
          e.cd=1.5-(e.stufe||0)*0.2;
        } else {                             // Gebetswelle
          const n=10+(e.stufe||0)*3;
          for(let i=0;i<n;i++) fireEshot(e.x,e.y,i*TAU/n+e.t*0.5,100+(e.stufe||0)*12);
          schockwelle(e.x,e.y,90,'#ffe08a',0.5,3);
          e.cd=1.8;
        }
      }
      break; }
  }
}

/* ==== 10. RENDERING ==== */
/* --- TUSCHESTIL --------------------------------------------------------
   Die Welt wird wie mit der Feder gezeichnet: leicht unrunde Pfade, dunkle
   Kontur mit schwankender Stärke, Schraffur statt Verlauf. Die Linien werden
   siebenmal je Sekunde neu gezogen ("kochen"), wie eine auf Dreier animierte
   Zeichnung. Das HUD bleibt davon ausgenommen — Zahlen und Herzen sollen
   ruhig stehen, deshalb schaltet drawHUD() den Stil ab.                    */
const KONTUR='#141014';
let tuscheAn=true;      // im HUD ausgeschaltet
let BOIL=0;             // Zittertakt
let formZaehler=0;      // laufende Nummer der Form im aktuellen Bild
function flaecheBeginnen(){ formZaehler=0; }
function formSchluessel(){ return (++formZaehler)*13.7+BOIL*911.3; }
function rausch(k){ const v=Math.sin(k*127.1+Math.cos(k*0.73)*311.7)*43758.5453; return v-Math.floor(v); }

// Handgezogener Ellipsenpfad
function handPfad(x,y,rx,ry,rot,k,dichte){
  const n=dichte||Math.max(10,Math.min(20,Math.round((rx+ry)*0.5)));
  rot=rot||0;
  const co=Math.cos(rot), si=Math.sin(rot);
  ctx.beginPath();
  for(let i=0;i<=n;i++){
    const a=i/n*TAU;
    const f=1+((rausch(k+i*3.11)-0.5)+(rausch(k*0.37+i*1.7)-0.5)*0.6)*0.075;
    const px=Math.cos(a)*rx*f, py=Math.sin(a)*ry*f;
    if(i===0) ctx.moveTo(x+px*co-py*si,y+px*si+py*co);
    else      ctx.lineTo(x+px*co-py*si,y+px*si+py*co);
  }
  ctx.closePath();
}
function handZug(pts,k,schliessen){
  ctx.beginPath();
  for(let i=0;i<pts.length;i++){
    const w1=(rausch(k+i*5.3)-0.5)*1.5, w2=(rausch(k+i*9.1)-0.5)*1.5;
    if(i===0) ctx.moveTo(pts[i][0]+w1,pts[i][1]+w2);
    else      ctx.lineTo(pts[i][0]+w1,pts[i][1]+w2);
  }
  if(schliessen!==false) ctx.closePath();
}
function tusche(breite,farbe,k){
  ctx.save();
  ctx.strokeStyle=farbe||KONTUR; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.lineWidth=breite; ctx.stroke();
  ctx.globalAlpha=0.5; ctx.lineWidth=breite*(0.55+rausch(k||1)*0.3); ctx.stroke();
  ctx.restore();
}
// Parallelschraffur im aktuellen Beschnitt; nur für größere Formen, sonst zu teuer
function schraffieren(x,y,radius,winkel,abstand,farbe,breite,k){
  ctx.save();
  ctx.strokeStyle=farbe; ctx.lineWidth=breite||1; ctx.lineCap='round';
  const co=Math.cos(winkel), si=Math.sin(winkel);
  let i=0;
  for(let d=-radius;d<=radius;d+=abstand){
    const zu=(rausch((k||1)+(i++)*2.9)-0.5)*abstand*0.5;
    const l=radius*(0.86+rausch((k||1)+i*7.7)*0.28);
    ctx.beginPath();
    ctx.moveTo(x+co*-l-si*(d+zu),y+si*-l+co*(d+zu));
    ctx.lineTo(x+co* l-si*(d+zu),y+si* l+co*(d+zu));
    ctx.stroke();
  }
  ctx.restore();
}

function disc(x,y,r,color){
  if(!tuscheAn||r<2.4){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();return;}
  const k=formSchluessel();
  handPfad(x,y,r,r,0,k); ctx.fillStyle=color; ctx.fill();
  if(r>3.4){ handPfad(x,y,r,r,0,k+0.9); tusche(Math.max(0.9,r*0.13),KONTUR,k); }
}
function ring(x,y,r,color,w){
  if(!tuscheAn){ctx.strokeStyle=color;ctx.lineWidth=w||2;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.stroke();return;}
  const k=formSchluessel(); handPfad(x,y,r,r,0,k); tusche(w||2,color,k);
}
function rrect(x,y,w,h,color){
  if(!tuscheAn||Math.min(Math.abs(w),Math.abs(h))<3.2){ctx.fillStyle=color;ctx.fillRect(x,y,w,h);return;}
  const k=formSchluessel();
  handZug([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],k);
  ctx.fillStyle=color; ctx.fill();
  handZug([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],k+0.9);
  tusche(Math.max(0.8,Math.min(Math.abs(w),Math.abs(h))*0.1),KONTUR,k);
}
function ellipse(x,y,rx,ry,rot,color){
  if(!tuscheAn||Math.max(rx,ry)<2.4){
    ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,TAU);ctx.fill();return;}
  const k=formSchluessel();
  handPfad(x,y,rx,ry,rot,k); ctx.fillStyle=color; ctx.fill();
  if(Math.max(rx,ry)>3.4){ handPfad(x,y,rx,ry,rot,k+0.9);
    tusche(Math.max(0.9,Math.max(rx,ry)*0.11),KONTUR,k); }
}
function vieleck(pts,color){
  if(!tuscheAn){ poly(pts,color); return; }
  const k=formSchluessel();
  handZug(pts,k); ctx.fillStyle=color; ctx.fill();
  let gr=0;
  for(let i=1;i<pts.length;i++) gr=Math.max(gr,Math.hypot(pts[i][0]-pts[0][0],pts[i][1]-pts[0][1]));
  if(gr>7){ handZug(pts,k+0.9); tusche(Math.max(0.8,gr*0.05),KONTUR,k); }
}
/* Feuchter Glanzpunkt — lässt nasse Oberflächen glänzen */
function glanz(x,y,rx,ry,rot,staerke){
  ctx.save(); ctx.globalAlpha=staerke||0.32; ctx.fillStyle='#ffffff';
  if(tuscheAn){ const k=formSchluessel(); handPfad(x,y,rx,ry,rot,k); }
  else { ctx.beginPath(); ctx.ellipse(x,y,rx,ry,rot||0,0,TAU); }
  ctx.fill(); ctx.restore();
}
/* Hohle Augenhöhle mit Glut darin */
function hohlauge(x,y,r,glutfarbe,glut){
  const k=formSchluessel();
  handPfad(x,y,r,r,0,k); ctx.fillStyle='#0d0a0c'; ctx.fill();
  handPfad(x,y,r,r,0,k+0.9); tusche(Math.max(0.7,r*0.2),KONTUR,k);
  ctx.save(); ctx.globalAlpha=0.5*(glut===undefined?1:glut);
  ctx.beginPath(); ctx.arc(x,y,r*1.5,0,TAU); ctx.fillStyle=glutfarbe; ctx.fill(); ctx.restore();
  ctx.beginPath(); ctx.arc(x,y,r*0.46,0,TAU); ctx.fillStyle=glutfarbe; ctx.fill();
}
/* Zahnreihe; runter=true lässt die Spitzen nach unten zeigen */
function zaehneSpiel(x,y,breite,anzahl,hoehe,runter,farbe){
  const schritt=breite/anzahl;
  for(let i=0;i<anzahl;i++){
    const zx=x-breite/2+schritt*i, b=schritt*0.86;
    const spitz=runter?y+hoehe:y-hoehe;
    ctx.fillStyle=farbe||'#ddd2c0'; ctx.beginPath();
    ctx.moveTo(zx,y); ctx.lineTo(zx+b,y); ctx.lineTo(zx+b/2,spitz); ctx.fill();
  }
}

/* Körper mit Lichtseite und schraffierter Schattenseite */
function fleisch(x,y,rx,ry,rot,hell,mitte,dunkel){
  if(!tuscheAn){ ctx.fillStyle=mitte; ctx.beginPath(); ctx.ellipse(x,y,rx,ry,rot||0,0,TAU); ctx.fill(); return; }
  const k=formSchluessel(), gross=Math.max(rx,ry);
  handPfad(x,y,rx,ry,rot,k); ctx.fillStyle=mitte; ctx.fill();
  ctx.save(); handPfad(x,y,rx,ry,rot,k); ctx.clip();
  ctx.beginPath(); ctx.ellipse(x-rx*0.3,y-ry*0.34,rx*0.72,ry*0.66,rot||0,0,TAU);
  ctx.fillStyle=hell; ctx.globalAlpha=0.75; ctx.fill(); ctx.restore();
  if(gross>7){ // Schraffur lohnt erst ab einer gewissen Größe
    ctx.save(); handPfad(x,y,rx,ry,rot,k); ctx.clip();
    ctx.beginPath(); ctx.ellipse(x+rx*0.46,y+ry*0.5,rx*1.02,ry*1.02,rot||0,0,TAU); ctx.clip();
    schraffieren(x,y,gross*1.4,0.85,Math.max(1.8,gross*0.2),dunkel,Math.max(0.7,gross*0.08),k);
    ctx.restore();
  }
  handPfad(x,y,rx,ry,rot,k+0.9); tusche(Math.max(0.9,gross*0.1),KONTUR,k);
}
function txt(str,x,y,color,size,align){
  ctx.fillStyle=color||'#fff';ctx.font=(size||10)+'px monospace';
  ctx.textAlign=align||'center';ctx.textBaseline='middle';
  ctx.fillText(str,x|0,y|0);
}
/* Bricht einen Text auf eine Breite um und gibt die Zeilen zurück.
   Ohne das passt keine Item-Beschreibung in eine Karte von 130 Pixeln. */
function textZeilen(str,size,breite){
  ctx.font=size+'px monospace';
  const worte=str.split(' '), zeilen=[]; let zeile='';
  for(const w of worte){
    const probe=zeile?zeile+' '+w:w;
    if(ctx.measureText(probe).width>breite&&zeile){ zeilen.push(zeile); zeile=w; }
    else zeile=probe;
  }
  if(zeile) zeilen.push(zeile);
  return zeilen;
}

/* Kleine Tafel, die sagt, was ein Item tut. Wird am Podest und an
   liegenden Items eingeblendet, sobald man nahe genug steht — gerade im
   Laden und in der Teufelskammer will man das VOR dem Zugreifen wissen. */
function itemTafel(id,x,y,preis,herzPreis){
  /* Unter dem Fluch der Blindheit steht auf der Tafel nur der Preis — was
     man kauft, erfährt man erst hinterher. */
  const it=id==='__blind__'
    ? {name:'Unbekannt',desc:'Der Fluch der Blindheit verbirgt, was hier liegt.'}
    : ITEMS[id];
  if(!it) return;
  const bw=142, size=7;
  const zeilen=textZeilen(it.desc,size,bw-14);
  const kosten=preis?preis+' Münzen':(herzPreis?(herzPreis===1?'1 Herzcontainer':herzPreis+' Herzcontainer'):null);
  const bh=17+zeilen.length*9+(kosten?10:0);
  let bx=clamp(x-bw/2,4,W-bw-4);
  let by=y-bh-16;
  if(by<4) by=y+20;                      // unten anschlagen? dann darunter
  const merk=tuscheAn; tuscheAn=false;
  ctx.globalAlpha=0.92;
  ctx.fillStyle='#12101a'; ctx.fillRect(bx,by,bw,bh);
  ctx.globalAlpha=1;
  ctx.strokeStyle=id==='__blind__'?'#6a6a76':itemColor(id); ctx.lineWidth=1;
  ctx.strokeRect(bx+0.5,by+0.5,bw-1,bh-1);
  txt(it.name,bx+bw/2,by+9,'#e8e0d0',9);
  zeilen.forEach((z,i)=>txt(z,bx+bw/2,by+20+i*9,'#a9a294',size));
  if(kosten) txt(kosten,bx+bw/2,by+22+zeilen.length*9,
                 herzPreis?'#e0798c':'#ffd75a',7);
  tuscheAn=merk;
}

function shadow(x,y,r){ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(x|0,y|0,r,r*0.45,0,0,TAU);ctx.fill();}

/* Herz zeichnen (voll/halb/leer; Typ rot/seele/schwarz) */
function drawHeart(x,y,fill,type){
  const cols={red:['#d43a4a','#8a1a2a'],soul:['#8ab4e8','#3a5a8a'],black:['#5a3a7a','#2a1a3a'],empty:['#3a3236','#241f22']};
  const c=cols[type]||cols.empty;
  ctx.fillStyle=fill==='empty'?cols.empty[0]:c[0];
  if(fill==='half'){ // linke Hälfte gefüllt, rechte leer
    ctx.fillStyle=cols.empty[0];
    heartPath(x,y);ctx.fill();
    ctx.save();ctx.beginPath();ctx.rect(x-6,y-6,6,12);ctx.clip();
    ctx.fillStyle=c[0];heartPath(x,y);ctx.fill();ctx.restore();
  } else { heartPath(x,y);ctx.fill(); }
  ctx.strokeStyle=fill==='empty'?cols.empty[1]:c[1];ctx.lineWidth=1;heartPath(x,y);ctx.stroke();
}
function heartPath(x,y){
  ctx.beginPath();
  ctx.moveTo(x,y+5);
  ctx.bezierCurveTo(x-7,y-1,x-5,y-6,x-2.5,y-4);
  ctx.bezierCurveTo(x-1,y-3,x,y-2,x,y-1.5);
  ctx.bezierCurveTo(x,y-2,x+1,y-3,x+2.5,y-4);
  ctx.bezierCurveTo(x+5,y-6,x+7,y-1,x,y+5);
}

/* Item-Icons werden prozedural aus der Item-ID erzeugt: aus dem Hash ergeben
   sich Farbton und Emblemform, sodass jedes Item ein eigenes, wiedererkennbares
   Zeichen bekommt, ohne dass Grafiken hinterlegt werden müssen. */
function itemHash(id){let h=2166136261;
  for(let i=0;i<id.length;i++){h^=id.charCodeAt(i);h=Math.imul(h,16777619);}
  return h>>>0;}
function itemColor(id){return `hsl(${itemHash(id)%360},62%,58%)`;}
const EMBLEME=8; // Anzahl der Emblemformen
/* --- SYMBOLBAUKASTEN ------------------------------------------------------
   Die Symbole müssen auf 14 Pixeln lesbar bleiben: kräftige Silhouette,
   dunkle Kontur, höchstens zwei Innendetails. Alles zeichnet um (0,0) in
   einem Feld von etwa ±6 Einheiten; drawItemIcon skaliert es hoch.        */
function symUmriss(breite){ ctx.strokeStyle='#120e12'; ctx.lineWidth=breite||1.1; ctx.stroke(); }
function symHerzPfad(x,y,r){
  ctx.beginPath();
  ctx.moveTo(x,y+r*0.95);
  ctx.bezierCurveTo(x-r*1.5,y-r*0.25,x-r*0.95,y-r*1.3,x,y-r*0.45);
  ctx.bezierCurveTo(x+r*0.95,y-r*1.3,x+r*1.5,y-r*0.25,x,y+r*0.95);
}
function symHerz(f,r,x,y){ symHerzPfad(x||0,y||0,r||5); ctx.fillStyle=f; ctx.fill(); symUmriss(); }
function symKlinge(f,griff){
  ctx.beginPath();                                   // Klinge
  ctx.moveTo(0,-6.5); ctx.lineTo(2.2,-1); ctx.lineTo(1.2,3); ctx.lineTo(-1.2,3);
  ctx.lineTo(-2.2,-1); ctx.closePath();
  ctx.fillStyle=f; ctx.fill(); symUmriss();
  ctx.fillStyle=griff||'#5a4632';                    // Parierstange und Griff
  ctx.fillRect(-4,2.6,8,1.6); symUmriss(0.9);
  ctx.fillRect(-1.1,4.2,2.2,2.6);
  ctx.beginPath(); ctx.rect(-1.1,4.2,2.2,2.6); symUmriss(0.9);
}
function symSchaedel(f){
  ctx.beginPath(); ctx.ellipse(0,-1,4.6,4.2,0,0,TAU); ctx.fillStyle=f; ctx.fill(); symUmriss();
  ctx.beginPath(); ctx.rect(-2.4,2.6,4.8,2.6); ctx.fillStyle=f; ctx.fill(); symUmriss(0.9);
  ctx.fillStyle='#161018';
  ctx.beginPath(); ctx.ellipse(-1.9,-1.2,1.5,1.7,0,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 1.9,-1.2,1.5,1.7,0,0,TAU); ctx.fill();
  ctx.fillRect(-0.5,1.2,1,1.4);
}
function symAuge(f,iris){
  ctx.beginPath(); ctx.ellipse(0,0,6,4.2,0,0,TAU); ctx.fillStyle='#efe8d8'; ctx.fill(); symUmriss();
  ctx.beginPath(); ctx.arc(0,0,2.6,0,TAU); ctx.fillStyle=iris||f; ctx.fill();
  ctx.beginPath(); ctx.arc(0,0,1.2,0,TAU); ctx.fillStyle='#161018'; ctx.fill();
  ctx.beginPath(); ctx.arc(-1,-1.2,0.7,0,TAU); ctx.fillStyle='#ffffff'; ctx.fill();
}
function symFlamme(f,hell){
  ctx.beginPath();
  ctx.moveTo(0,6); ctx.quadraticCurveTo(-4.6,2,-2.4,-2);
  ctx.quadraticCurveTo(-1.6,-5.6,0,-6.6);
  ctx.quadraticCurveTo(1.6,-5.6,2.4,-2);
  ctx.quadraticCurveTo(4.6,2,0,6);
  ctx.fillStyle=f; ctx.fill(); symUmriss();
  ctx.beginPath();
  ctx.moveTo(0,4.4); ctx.quadraticCurveTo(-2.2,1.4,-1,-1);
  ctx.quadraticCurveTo(0,-3.4,1,-1); ctx.quadraticCurveTo(2.2,1.4,0,4.4);
  ctx.fillStyle=hell||'#ffe08a'; ctx.fill();
}
function symKristall(f,hell){
  ctx.beginPath();
  ctx.moveTo(0,-6.6); ctx.lineTo(3.6,-1.4); ctx.lineTo(1.8,6); ctx.lineTo(-1.8,6);
  ctx.lineTo(-3.6,-1.4); ctx.closePath();
  ctx.fillStyle=f; ctx.fill(); symUmriss();
  ctx.beginPath();
  ctx.moveTo(0,-6.6); ctx.lineTo(-3.6,-1.4); ctx.lineTo(-0.6,6); ctx.lineTo(0,-1);
  ctx.closePath(); ctx.fillStyle=hell||'#ffffff'; ctx.globalAlpha=0.5; ctx.fill(); ctx.globalAlpha=1;
}
function symBlitz(f){
  ctx.beginPath();
  ctx.moveTo(1.6,-6.6); ctx.lineTo(-3.4,0.4); ctx.lineTo(-0.4,0.4);
  ctx.lineTo(-1.6,6.6); ctx.lineTo(3.6,-0.8); ctx.lineTo(0.6,-0.8); ctx.closePath();
  ctx.fillStyle=f; ctx.fill(); symUmriss();
}
function symTropfen(f,x,y,r){
  ctx.beginPath();
  ctx.moveTo(x||0,(y||0)-(r||4)*1.5);
  ctx.quadraticCurveTo((x||0)+(r||4),(y||0),(x||0),(y||0)+(r||4));
  ctx.quadraticCurveTo((x||0)-(r||4),(y||0),(x||0),(y||0)-(r||4)*1.5);
  ctx.fillStyle=f; ctx.fill(); symUmriss(0.9);
}
function symGlas(f,inhalt){
  ctx.fillStyle='#8a8e96'; ctx.fillRect(-1.6,-6.4,3.2,1.6);      // Deckel
  ctx.beginPath(); ctx.rect(-1.6,-6.4,3.2,1.6); symUmriss(0.9);
  ctx.beginPath(); ctx.rect(-3.6,-4.8,7.2,10.4);
  ctx.fillStyle=f||'rgba(210,230,240,0.35)'; ctx.fill(); symUmriss();
  if(inhalt){ ctx.save(); ctx.beginPath(); ctx.rect(-3.6,-4.8,7.2,10.4); ctx.clip();
    inhalt(); ctx.restore(); }
  ctx.save(); ctx.globalAlpha=0.4; ctx.fillStyle='#ffffff';
  ctx.fillRect(-2.8,-4,1,8.6); ctx.restore();
}
function symRing(f,r,breite){
  ctx.beginPath(); ctx.arc(0,0,r||5,0,TAU);
  ctx.strokeStyle=f; ctx.lineWidth=breite||2.2; ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,r||5,0,TAU); symUmriss(0.8);
}
function symFluegel(vz,f,x,y){
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.quadraticCurveTo(x+vz*5,y-3.6,x+vz*7.6,y-0.6);
  ctx.quadraticCurveTo(x+vz*4.6,y+1.2,x,y+1.4);
  ctx.closePath(); ctx.fillStyle=f; ctx.fill(); symUmriss(0.9);
}

/* Solange diese Flagge steht, zeichnen wir ein Item, das noch niemandem
   gehört — nur dort darf der Fluch der Blindheit es verhüllen. Im
   Pausenmenü, im HUD und im Auswertungsbildschirm bleibt alles lesbar. */
let blindKachel=false;
function blindGesperrt(){ return blindKachel&&fluchAktiv('blindheit'); }

function drawItemIcon(id,x,y,s){
  s=s||1;
  const h=itemHash(id), c=itemColor(id);
  const dunkel=`hsl(${h%360},55%,32%)`;
  // Kachel mit Rahmen und Lichtkante
  rrect(x-7*s,y-7*s,14*s,14*s,'#15151a');
  rrect(x-6*s,y-6*s,12*s,12*s,dunkel);
  rrect(x-6*s,y-6*s,12*s,2*s,`hsl(${h%360},55%,44%)`);
  // Emblem
  ctx.save(); ctx.translate(x,y+0.5*s); ctx.scale(s,s);
  /* Fluch der Blindheit: statt des Symbols steht ein Fragezeichen auf der
     Kachel. Erst das Aufheben verrät, was es war. */
  if(blindGesperrt(id)){
    tuscheAn=false;
    txt('?',0,4.6,'#efe4cc',13);
    tuscheAn=true; ctx.restore();
    return;
  }
  const eigen=ITEMS[id]&&ITEMS[id].icon;
  if(eigen){                       // eigenes, erkennbares Symbol
    const merk=tuscheAn; tuscheAn=false;   // Tuschekontur wäre auf 14 px Matsch
    ctx.lineJoin='round'; ctx.lineCap='round';
    /* Auf die Kachel beschneiden und leicht verkleinern: die Symbole sind
       großzügig gezeichnet, sonst stünden Flügel und Schläuche über den
       Rahmen hinaus. */
    ctx.beginPath(); ctx.rect(-6.4,-6.9,12.8,12.8); ctx.clip();
    ctx.scale(0.86,0.86);
    eigen(c,dunkel);
    tuscheAn=merk; ctx.restore();
    ctx.save(); ctx.globalAlpha=0.35; ctx.fillStyle='#ffffff';
    ctx.fillRect(x-6*s,y-6*s,12*s,1.2*s); ctx.restore();
    return;
  }
  ctx.fillStyle=c;
  const form=(h>>>11)%EMBLEME; // eigener Bitbereich, sonst häufen sich Formen
  if(form===0){ ctx.beginPath();ctx.arc(0,0,4,0,TAU);ctx.fill(); }
  else if(form===1){ ctx.beginPath();ctx.moveTo(0,-4.5);ctx.lineTo(4,3);ctx.lineTo(-4,3);ctx.closePath();ctx.fill(); }
  else if(form===2){ ctx.beginPath();ctx.moveTo(0,-5);ctx.lineTo(4.5,0);ctx.lineTo(0,5);ctx.lineTo(-4.5,0);ctx.closePath();ctx.fill(); }
  else if(form===3){ ctx.fillRect(-1.6,-5,3.2,10); ctx.fillRect(-5,-1.6,10,3.2); }
  else if(form===4){ ctx.beginPath();ctx.arc(0,0,4.5,0,TAU);ctx.fill();
    ctx.fillStyle=dunkel;ctx.beginPath();ctx.arc(0,0,2,0,TAU);ctx.fill(); }
  else if(form===5){ for(let i=0;i<5;i++){const a=-Math.PI/2+i*TAU/5;
      ctx.beginPath();ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(a)*5,Math.sin(a)*5);
      ctx.lineTo(Math.cos(a+0.6)*2,Math.sin(a+0.6)*2);ctx.fill();} }
  else if(form===6){ ctx.fillRect(-4.5,-4.5,4,4); ctx.fillRect(0.5,-4.5,4,4);
    ctx.fillRect(-4.5,0.5,4,4); ctx.fillRect(0.5,0.5,4,4); }
  else { ctx.beginPath();ctx.moveTo(-4.5,3.5);ctx.quadraticCurveTo(0,-6,4.5,3.5);ctx.closePath();ctx.fill(); }
  ctx.restore();
  // Glanzpunkt
  rrect(x-5*s,y-5*s,2*s,2*s,'rgba(255,255,255,0.45)');
}

/* --- Raum zeichnen --- */
/* --- ETAGEN-HANDSCHRIFTEN ------------------------------------------------
   FLOORS sagt, WAS auf einer Etage vorkommt (Gegnerpool, Bosse, Musik,
   Grundfarben). Hier steht, WIE sie aussieht: woraus Boden, Wände und die
   fünf Hindernisarten gemacht sind. Das ist der eigentliche Unterschied
   zwischen den Etagen — nicht die Bodenfarbe, sondern das Material.

   Eine neue Etage braucht also zwei Einträge: einen in FLOORS und einen
   hier. Fehlt der hier, greift der letzte vorhandene.

   bodenDeko(x,y,s,k)  liegt flach IM Boden: keine Kontur, kein Schatten,
                       damit man es nie mit einem Hindernis verwechselt.
                       k ist der feste Streuwert des Feldes — dieselbe
                       Kachel sieht bei jedem Betreten gleich aus.
   wandDeko(...,t)     wird jedes Bild neu gezeichnet und darf sich bewegen.
   dunst(x,y,w,h,t)    Raumstimmung über allem, ebenfalls lebendig.
   stein/loch/stachel/feuer/wuchs zeichnen je ein Rasterfeld, Mittelpunkt
   (x,y), Kantenlänge s.                                                  */
const HANDSCHRIFTEN=[
{ /* 1 — Feuchter Keller: Stein & Pfütze */
  licht:'rgba(230,186,120,0.16)', tiefe:'#0b0806', feuerschein:'rgba(232,134,42,0.38)',
  bodenDeko(x,y,s,k){
    const w=rausch(k)*4|0;
    if(w===0){ ctx.strokeStyle='rgba(20,15,10,0.6)'; ctx.lineWidth=1;      // Riss
      ctx.beginPath(); ctx.moveTo(x-s*0.3,y-s*0.2);
      ctx.lineTo(x-s*0.05,y+s*0.05); ctx.lineTo(x+s*0.28,y+s*0.24); ctx.stroke(); }
    else if(w===1){ ctx.save(); ctx.globalAlpha=0.32; ctx.fillStyle='#4a6a72'; // Pfütze
      ctx.beginPath(); ctx.ellipse(x,y,s*0.3,s*0.16,rausch(k+1)*3,0,TAU); ctx.fill();
      ctx.globalAlpha=0.2; ctx.fillStyle='#8fb4c4';
      ctx.beginPath(); ctx.ellipse(x-s*0.06,y-s*0.03,s*0.12,s*0.05,0,0,TAU); ctx.fill(); ctx.restore(); }
    else if(w===2){ /* Grünzeug, das aus der Fuge wächst: ein paar Halme mit
                       kleinen Blättern. Bringt die einzige lebendige Farbe in
                       den sonst steinernen Keller. */
      ctx.save();
      const halme=2+((rausch(k+5)*3)|0);
      for(let i=0;i<halme;i++){
        const bx=x+(rausch(k+i*11)-0.5)*s*0.5, by=y+(rausch(k+i*19)-0.5)*s*0.35;
        const h=s*(0.16+rausch(k+i*23)*0.14), neig=(rausch(k+i*29)-0.5)*0.7;
        ctx.strokeStyle='rgba(96,124,58,0.75)'; ctx.lineWidth=1.1; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(bx,by);

        ctx.fillStyle='rgba(118,150,66,0.8)';                 // zwei Blättchen

      ctx.save(); ctx.globalAlpha=0.45; ctx.fillStyle='#5c0e16';
      ctx.beginPath(); ctx.ellipse(x,y,s*0.3,s*0.18,rausch(k+1)*3,0,TAU); ctx.fill();
      ctx.globalAlpha=0.3; ctx.fillStyle='#8a1c24';
      ctx.beginPath(); ctx.ellipse(x-s*0.06,y-s*0.03,s*0.14,s*0.07,0,0,TAU); ctx.fill();

      ctx.restore();

  },
  wandDeko(ox,oy,bw,bh,rand,t){                        // Fleisch an den Wänden, im Herzschlag
    const p=1+Math.pow(Math.max(0,Math.sin(t*2.1)),6)*0.12;

  dunst(x,y,w,h,t){                                    // der ganze Raum schlägt wie ein Herz

  stein(x,y,s){ fleisch(x,y+s*0.05,s*0.4,s*0.35,0,'#b0555c','#7a3038','#2c1014');

},
{ /* 6 — Wurzel des Kellers: Wurzel & Leere */
