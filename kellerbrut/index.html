  if(moveEntity(e,Math.cos(e.wa)*sp*dt,Math.sin(e.wa)*sp*dt,mode)) e.wt=0;
}

function updateEnemyAI(e,dt,slow,mode){
  const p=G.player;
  switch(e.ai){
    case 'chase': chaseMove(e,dt,slow,mode); break;

    case 'hop': // Hüpfer: warten, dann Sprung Richtung Spieler
      if(e.state===0){ e.z=0;
        if(e.cd<=0){ e.state=1; e.t=0;
          const a=ang(e,p)+frand.range(-0.3,0.3);
          e.vx=Math.cos(a)*170; e.vy=Math.sin(a)*170; }
      } else {
        const dur=0.55;
        e.z=Math.sin(Math.PI*Math.min(1,e.t/dur))*18;
        moveEntity(e,e.vx*dt*slow,e.vy*dt*slow,'fly');
        if(e.t>=dur){ e.state=0; e.t=0; e.z=0; e.cd=frand.range(0.6,1.2); Sfx.tick(); }
      }
      break;

    case 'shoot': // Spucker
      wanderMove(e,dt,slow,mode);
      if(e.cd<=0&&dist(e,p)<260){ e.cd=e.shotCd*frand.range(0.85,1.2);
        fireEshot(e.x,e.y,ang(e,p),130); }
      break;

    case 'wall': { // Mauerkriecher: umrundet den Raum am Rand entlang.
      // Position wird als Strecke auf dem Raumumfang geführt (im Uhrzeigersinn ab
      // oben links), damit der Lauf an den Ecken sauber umknickt.
      const m=e.r+2, L=RX+m, R=RX+COLS*TILE-m, TP=RY+m, B=RY+ROWS*TILE-m;
      const w=R-L, h=B-TP, per=2*(w+h);
      if(e.perim===undefined){ // an die nächstgelegene Wand schnappen
        const dl=e.x-L, dr=R-e.x, du=e.y-TP, dd=B-e.y;
        const closest=Math.min(dl,dr,du,dd);
        if(closest===du)      e.perim=clamp(e.x-L,0,w);
        else if(closest===dr) e.perim=w+clamp(e.y-TP,0,h);
        else if(closest===dd) e.perim=w+h+clamp(R-e.x,0,w);
        else                  e.perim=2*w+h+clamp(B-e.y,0,h);
        e.dirn=frand.chance(0.5)?1:-1;
      }
      e.perim=(e.perim+e.spd*slow*e.dirn*dt+per)%per;
      const t0=e.perim;
      if(t0<w)            { e.x=L+t0;         e.y=TP; }
      else if(t0<w+h)     { e.x=R;            e.y=TP+(t0-w); }
      else if(t0<2*w+h)   { e.x=R-(t0-w-h);   e.y=B; }
      else                { e.x=L;            e.y=B-(t0-2*w-h); }
      break; }

    case 'charge': { // Rennratte
      if(e.state===0){ wanderMove(e,dt,slow,mode);
        if(e.cd<=0){
          if(Math.abs(e.x-p.x)<14){ e.state=1; e.vx=0; e.vy=Math.sign(p.y-e.y)*250; Sfx.tick(); }
          else if(Math.abs(e.y-p.y)<14){ e.state=1; e.vy=0; e.vx=Math.sign(p.x-e.x)*250; Sfx.tick(); }
        }
      } else {
        if(moveEntity(e,e.vx*dt*slow,e.vy*dt*slow,mode)){ e.state=0; e.cd=frand.range(0.8,1.4); }
      }
      break; }

    case 'creeper': // Sporling: hinterlässt Pfützen
      wanderMove(e,dt,slow,mode);
      if(e.cd<=0){ e.cd=0.55; G.creeps.push({x:e.x,y:e.y,r:13,t:3.2,feindlich:true}); }
      break;

    case 'spread': // Knochenwurf: 3er-Fächer
      wanderMove(e,dt,slow,mode);
      if(e.cd<=0&&dist(e,p)<300){ e.cd=e.shotCd*frand.range(0.9,1.15);
        const a=ang(e,p);
        for(const off of [-0.3,0,0.3]) fireEshot(e.x,e.y,a+off,120); }
      break;

    case 'spray': // Kotspritzer: lobt Klumpen im Bogen, die als Pfütze zerplatzen
      wanderMove(e,dt,slow,mode);
      if(e.cd<=0&&dist(e,p)<280){ e.cd=e.shotCd*frand.range(0.85,1.2);
        const weite=Math.max(60,dist(e,p));
        const sh=fireEshot(e.x,e.y,ang(e,p),weite/0.9,{arc:true,z:0,zt:0,zdur:0.9});
        sh.life=1.0; Sfx.splash(); }
      break;

    case 'dart': // Zuckfliege: ruckartige Sprints
      if(e.cd<=0){ e.cd=frand.range(0.25,0.6);
        const a=frand.chance(0.6)?ang(e,p)+frand.range(-0.8,0.8):frand()*TAU;
        e.vx=Math.cos(a)*e.spd; e.vy=Math.sin(a)*e.spd; }
      e.vx*=Math.pow(0.05,dt); e.vy*=Math.pow(0.05,dt);
      moveEntity(e,e.vx*dt*slow,e.vy*dt*slow,'fly');
      break;

    case 'turret': // Steinmaul: abwechselnd gezielt / 4 Richtungen
      if(e.cd<=0){ e.cd=e.shotCd;
        e.state=1-e.state;
        if(e.state){ fireEshot(e.x,e.y,ang(e,p),140); }
        else for(let i=0;i<4;i++) fireEshot(e.x,e.y,i*Math.PI/2,110);
      }
      break;

    case 'ghost': { // Schleicher: blendet sich aus
      const cyc=(e.t%2.8);
      e.ghosted=cyc>1.6;
      if(!e.ghosted) chaseMove(e,dt,slow,'fly');
      else chaseMove(e,dt,slow,'fly',1.4);
      break; }

    case 'spawner': // Brutmutter
      wanderMove(e,dt,slow,mode);
      if(e.cd<=0&&e.spawned<4&&G.enemies.length<14){
        e.cd=e.shotCd; e.spawned++;
        spawnEnemy(e.def.spawn,e.x,e.y+10,null); Sfx.tick(); }
      break;

    case 'bounce': { // Stachelkugel: Abpraller
      if(!e.bvx){ const a=frand.pick([1,3,5,7])*Math.PI/4; e.bvx=Math.cos(a)*e.spd; e.bvy=Math.sin(a)*e.spd; }
      const oldx=e.x,oldy=e.y;
      e.x+=e.bvx*dt*slow;
      if(circleHitsGrid(e.x,e.y,e.r,'walk')||e.x<RX+e.r||e.x>RX+COLS*TILE-e.r){e.x=oldx;e.bvx*=-1;}
      e.y+=e.bvy*dt*slow;
      if(circleHitsGrid(e.x,e.y,e.r,'walk')||e.y<RY+e.r||e.y>RY+ROWS*TILE-e.r){e.y=oldy;e.bvy*=-1;}
      break; }

    case 'ring': // Pulsqualle
      chaseMove(e,dt,slow,'fly',0.8);
      if(e.cd<=0){ e.cd=e.shotCd;
        for(let i=0;i<8;i++) fireEshot(e.x,e.y,i*TAU/8+e.t,95); }
      break;

    /* Talgwicht: zieht Brandspur. Unter 40% Leben erlischt die Flamme — dann
       sieht er nichts mehr und rennt blind doppelt so schnell in die zuletzt
       wahrgenommene Richtung weiter. */
    case 'talg': {
      const aus=e.hp<e.maxHp*0.4;
      if(!aus){
        e.blindA=ang(e,p);
        chaseMove(e,dt,slow,mode);
      } else {
        if(e.blindA===undefined) e.blindA=ang(e,p);
        const sp=e.spd*slow*2;
        if(moveEntity(e,Math.cos(e.blindA)*sp*dt,Math.sin(e.blindA)*sp*dt,mode))
          e.blindA=frand()*TAU;                       // an der Wand neu orientieren
      }
      e.cd-=0; e.gcd=(e.gcd||0)-dt;
      if(e.gcd<=0&&!aus){ e.gcd=0.42;
        G.creeps.push({x:e.x,y:e.y,r:10,t:2.4,feindlich:true,glut:true}); }
      break; }

    /* Spinnwirt: hängt an der Decke, bis der Spieler darunter steht. Beim
       Aufschlag bleibt ein Netz liegen, das bremst. */
    case 'decke': {
      if(e.state===0){
        e.ghosted=false; e.anDerDecke=true;
        e.z=42+Math.sin(e.t*1.6)*2;
        if(Math.abs(p.x-e.x)<44&&Math.abs(p.y-e.y)<52){ e.state=1; e.t=0; Sfx.tick(); }
      } else if(e.state===1){                         // Fall
        e.anDerDecke=false;
        e.z=Math.max(0,e.z-260*dt);
        if(e.z<=0){ e.state=2; e.t=0; G.shake=3; Sfx.splash();
          G.creeps.push({x:e.x,y:e.y,r:22,t:6,feindlich:true,netz:true});
          burst(e.x,e.y,'#d8d8e4',8); }
      } else {
        if(e.t<0.6) break;                            // kurz verharren
        chaseMove(e,dt,slow,'fly');
      }
      break; }

    /* Glockenmaul: schlägt an und schickt eine Ringwelle, die den Spieler
       zurückwirft. Bewegt sich sonst kaum. */
    case 'glocke':
      wanderMove(e,dt,slow*0.5,mode);
      if(e.cd<=0){ e.cd=e.shotCd;
        e.welle={r:0,t:0.75}; Sfx.door(); G.shake=5;
        schockwelle(e.x,e.y,190,'#d9a94e',0.7,5);
      }
      if(e.welle){
        const vorher=e.welle.r;
        e.welle.r+=300*dt; e.welle.t-=dt;
        const d=dist(e,p);
        if(d>vorher&&d<=e.welle.r&&!e.welle.traf){    // Welle überstreicht den Spieler
          e.welle.traf=true;
          const a=ang(e,p);
          p.vx+=Math.cos(a)*420; p.vy+=Math.sin(a)*420;
          p.taumeln=0.7; G.shake=Math.max(G.shake,5);
        }
        if(e.welle.t<=0) e.welle=null;
      }
      break;

    /* Schlundling: rennt zur nächsten Beute, verschluckt sie und sucht dann
       den Ausgang. Beim Tod fällt alles wieder heraus. */
    case 'dieb': {
      if(!e.beute){
        let ziel=null,bd=1e9;
        for(const q of G.pickups){ if(q.price||q.dead) continue;
          const d=dist(e,q); if(d<bd){bd=d;ziel=q;} }
        if(ziel){
          const a=ang(e,ziel);
          moveEntity(e,Math.cos(a)*e.spd*slow*dt,Math.sin(a)*e.spd*slow*dt,mode);
          if(bd<e.r+8){ e.beute=ziel.type; e.beutePille=ziel.pillId; e.beuteKarte=ziel.cardId;
            ziel.dead=true; Sfx.pickup(); burst(e.x,e.y,'#ffd75a',8); }
        } else chaseMove(e,dt,slow,mode,0.6);
      } else {
        // mit voller Beute Richtung nächster Tür
        let dp=null,bd=1e9;
        for(const d in G.room.doors){ const q=doorXY(d); const dd=dist(e,q);
          if(dd<bd){bd=dd;dp=q;} }
        if(dp){ const a=ang(e,dp);
          moveEntity(e,Math.cos(a)*e.spd*slow*1.2*dt,Math.sin(a)*e.spd*slow*1.2*dt,mode);
          if(bd<26){ e.dead=true; burst(e.x,e.y,'#6e3330',10); Sfx.error(); } }
      }
      break; }

    /* Aschgeist: schwebt heran. Stirbt er das erste Mal, sammelt er sich nach
       drei Sekunden mit halber Kraft wieder — Feuer und Frost verhindern das. */
    case 'asche':
      if(e.sammelt>0){
        e.sammelt-=dt; e.ghosted=true;
        if(e.sammelt<=0){ e.ghosted=false; e.hp=e.maxHp*0.5;
          burst(e.x,e.y,'#6e6270',12); Sfx.edeath(); }
        break;
      }
      chaseMove(e,dt,slow,'fly');
      break;

    /* Sporenwirt: rührt sich nicht. Jeder Treffer presst eine Sporenwolke
       heraus, die stehen bleibt und die Sicht nimmt. */
    case 'sporen':
      if(e.sporenSchuld>0){ e.sporenSchuld--;
        G.creeps.push({x:e.x+frand.range(-8,8),y:e.y+frand.range(-8,8),
                       r:30,t:5,feindlich:true,sporen:true});
        Sfx.splash();
      }
      break;

    /* Klingenrad: umrundet den Raum und legt mit jeder Runde zu. */
    case 'wandlauf': {
      const m=e.r+2, L=RX+m, R=RX+COLS*TILE-m, TP=RY+m, B=RY+ROWS*TILE-m;
      const w=R-L, h=B-TP, per=2*(w+h);
      if(e.perim===undefined){
        const dl=e.x-L, dr=R-e.x, du=e.y-TP, dd=B-e.y;
        const nah=Math.min(dl,dr,du,dd);
        if(nah===du)      e.perim=clamp(e.x-L,0,w);
        else if(nah===dr) e.perim=w+clamp(e.y-TP,0,h);
        else if(nah===dd) e.perim=w+h+clamp(R-e.x,0,w);
        else              e.perim=2*w+h+clamp(B-e.y,0,h);
        e.runden=0; e.tempo=e.spd;
      }
      const vor=e.perim;
      e.perim=(e.perim+e.tempo*slow*dt)%per;
      if(e.perim<vor){ e.runden++; e.tempo=Math.min(210,e.spd+e.runden*30); }
      const t0=e.perim;
      if(t0<w)          { e.x=L+t0;       e.y=TP; }
      else if(t0<w+h)   { e.x=R;          e.y=TP+(t0-w); }
      else if(t0<2*w+h) { e.x=R-(t0-w-h); e.y=B; }
      else              { e.x=L;          e.y=B-(t0-2*w-h); }
      break; }

    /* Laternenfisch: schwebt und zieht den Spieler mit seiner Lampe heran.
       Ist die Lampe aus (unter 35% Leben), hört der Sog auf. */
    case 'laterne': {
      chaseMove(e,dt,slow,'fly',0.5);
      e.lampeAn=e.hp>e.maxHp*0.35;
      if(e.lampeAn){
        const d=dist(e,p);
        if(d<170&&d>14){ const a=ang(p,e);
          p.vx+=Math.cos(a)*150*dt*60*0.02; p.vy+=Math.sin(a)*150*dt*60*0.02; }
      }
      break; }

    /* Kettenhund: an seinen Spawnpunkt gekettet, stürzt darin vor. */
    case 'kette': {
      if(e.anker===undefined){ e.ankerX=e.x; e.ankerY=e.y; e.anker=true; e.kette=86; }
      const zumAnker=Math.hypot(e.x-e.ankerX,e.y-e.ankerY);
      if(e.state===0){
        if(zumAnker>4){ const a=Math.atan2(e.ankerY-e.y,e.ankerX-e.x);  // zurückschleichen
          moveEntity(e,Math.cos(a)*50*slow*dt,Math.sin(a)*50*slow*dt,mode); }
        if(e.cd<=0&&dist(e,p)<e.kette){ e.state=1; e.t=0;
          const a=ang(e,p); e.vx=Math.cos(a)*240; e.vy=Math.sin(a)*240; Sfx.tick(); }
      } else {
        moveEntity(e,e.vx*dt*slow,e.vy*dt*slow,mode);
        if(Math.hypot(e.x-e.ankerX,e.y-e.ankerY)>e.kette||e.t>0.7){
          e.state=0; e.cd=frand.range(0.8,1.4); }
      }
      break; }

    /* Schimmelherz: heilt regelmäßig alle verletzten Gegner im Raum und
       schlägt schneller, je weniger davon übrig sind. */
    case 'heiler': {
      wanderMove(e,dt,slow*0.7,mode);
      const uebrig=Math.max(1,G.enemies.length-1);
      if(e.cd<=0){ e.cd=Math.max(1.1,3.4-(4-Math.min(4,uebrig))*0.6);
        let geheilt=0;
        for(const a of G.enemies){
          if(a===e||a.hp>=a.maxHp) continue;
          a.hp=Math.min(a.maxHp,a.hp+a.maxHp*0.18); geheilt++;
          blitz(a.x,a.y,a.r+5,'#a8c46a',0.3);
        }
        if(geheilt){ schockwelle(e.x,e.y,90,'#8ac850',0.5,3); Sfx.heart(); }
      }
      break; }

    /* Steinrücken: dreht sich stetig zum Spieler. Treffer von vorn prallen ab,
       nur die ungeschützte Rückseite nimmt Schaden. */
    /* --- Nabelkind: pendelt an der Schnur, bis man sie durchtrennt ---- */
    case 'nabel': {
      if(e.ankerX===undefined){ e.ankerX=e.x; e.ankerY=RY+8; e.schwung=frand()*TAU; }
      if(e.hp>e.maxHp*0.5){                       // hängt noch
        e.schwung+=dt*slow*1.5;
        e.x=e.ankerX+Math.sin(e.schwung)*74;
        e.y=e.ankerY+70+Math.cos(e.schwung*2)*10;
        e.fly=true;
      } else {                                    // abgerissen: kriecht weiter
        if(!e.gefallen){ e.gefallen=true; e.fly=false; e.spd=54;
          burst(e.x,e.y,'#8a3a44',10); Sfx.splash(); }
        chaseMove(e,dt,slow,mode);
      }
      break; }

    /* --- Häutling: rennt und hinterlässt eine nasse, glatte Spur ------ */
    case 'haeutling': {
      chaseMove(e,dt,slow,mode,1.0);
      e.gcd=(e.gcd||0)-dt;
      if(e.gcd<=0){ e.gcd=0.3;
        G.creeps.push({x:e.x,y:e.y,r:13,t:4,feindlich:true,glatt:true}); }
      break; }

    /* --- Vielauge: schießt dorthin, wo gerade die meisten Augen offen
       sind — für den Spieler heißt das: unvorhersehbare Fächer.        */
    case 'vielauge': {
      chaseMove(e,dt,slow,mode,0.6);
      if(e.cd<=0){
        e.cd=e.def.shotCd||1.6;
        const a=ang(e,p);
        const n=2+frand.int(3);
        for(let i=0;i<n;i++) fireEshot(e.x,e.y,a+frand.range(-0.7,0.7),120);
      }
      break; }

    /* --- Zwillingsbalg: zwei Köpfe, die sich abwechseln, nie gleichzeitig */
    case 'zwilling': {
      chaseMove(e,dt,slow,mode,0.7);
      if(e.cd<=0){
        e.cd=e.def.shotCd||1.1;
        e.kopf=e.kopf?0:1;                        // Wechsel — sichtbar am Glühen
        const a=ang(e,p), seite=(e.kopf?1:-1)*0.28;
        fireEshot(e.x+(e.kopf?7:-7),e.y-6,a+seite,140);
      }
      break; }

    /* --- Schlundmutter: der Bauch klappt auf und entlässt Spinnlinge -- */
    case 'schlundmutter': {
      chaseMove(e,dt,slow,mode,0.5);
      e.bauch=Math.max(0,(e.bauch||0)-dt);
      if(e.cd<=0){
        e.cd=frand.range(2.6,3.6); e.bauch=1.0;
        const wie=G.enemies.filter(x=>x.type==='spinnling').length;
        if(wie<6) for(let i=0;i<2;i++)
          spawnEnemy('spinnling',e.x+frand.range(-12,12),e.y+12,null);
        Sfx.splash();
      }
      break; }

    /* --- Fingerbaum: wächst fest, greift zu. Wer gepackt wird, steht --- */
    case 'finger': {
      e.greif=Math.max(0,(e.greif||0)-dt);
      if(e.cd<=0&&dist(e,p)<78){
        e.cd=3.2; e.greif=0.5;
        einschlagSetzen(p.x,p.y,26,0.5,0,'#d8c6ac');   // nur Vorwarnung, kein Schaden
        e.zielX=p.x; e.zielY=p.y;
      }
      if(e.greif>0&&e.greif<0.02&&dist(p,{x:e.zielX,y:e.zielY})<30){
        p.gepackt=2.0; p.vx*=0.2; p.vy*=0.2;
        addText(p.x,p.y-18,'gepackt!','#d8c6ac'); Sfx.hit();
      }
      break; }

    /* --- Grabhusten: wirft einen Kegel aus Sporen vor sich ------------ */
    case 'husten': {
      if(e.state===0){
        chaseMove(e,dt,slow,mode,0.8);
        if(e.cd<=0&&dist(e,p)<150){ e.state=1; e.t=0; e.hustA=ang(e,p); }
      } else {
        if(e.t>0.35){
          for(let i=-2;i<=2;i++){
            const a=e.hustA+i*0.22, d=34+Math.abs(i)*6;
            G.creeps.push({x:e.x+Math.cos(a)*d,y:e.y+Math.sin(a)*d,
                           r:22,t:3.4,feindlich:true,sporen:true});
          }
          Sfx.splash(); e.state=0; e.cd=3.0;
        }
      }
      break; }

    /* --- Nagelbraut: jeder Treffer schlägt Nägel heraus, die liegen
       bleiben. Das Ausschlagen steckt in damageEnemy.                  */
    case 'nagel': {
      chaseMove(e,dt,slow,mode,0.9);
      break; }

    /* --- Kriechkiefer: beißt im Vorbeilaufen und dreht sofort ab ------ */
    case 'kiefer': {
      if(e.state===0){                            // anschleichen
        chaseMove(e,dt,slow,mode,0.7);
        if(e.cd<=0&&dist(e,p)<120){
          e.state=1; e.t=0; const a=ang(e,p);
          e.vx=Math.cos(a)*260; e.vy=Math.sin(a)*260; Sfx.tick();
        }
      } else if(e.state===1){                     // Biss im Vorbeilauf
        moveEntity(e,e.vx*dt*slow,e.vy*dt*slow,mode);
        if(e.t>0.42){ e.state=2; e.t=0;
          const a=ang(e,p)+Math.PI+frand.range(-0.5,0.5);
          e.vx=Math.cos(a)*170; e.vy=Math.sin(a)*170; }
      } else {                                    // wegdrehen
        moveEntity(e,e.vx*dt*slow,e.vy*dt*slow,mode);
        if(e.t>0.5){ e.state=0; e.cd=frand.range(0.5,1.0); }
      }
      break; }

    /* --- Wachslicht: schmilzt im Laufen, die Pfütze brennt ----------- */
    case 'wachs': {
      chaseMove(e,dt,slow,mode,0.8);
      e.gcd=(e.gcd||0)-dt;
      if(e.gcd<=0){
        e.gcd=0.55;
        G.creeps.push({x:e.x,y:e.y,r:11,t:3.0,feindlich:true,glut:true});
        e.r=Math.max(6,e.r-0.35);                 // wird kleiner, bis nur der Docht bleibt
        e.hp=Math.max(1,e.hp-0.5);
      }
      break; }

    /* --- Ohrwurm: fährt durch die Wand, nur draußen ist er zu treffen - */
    case 'ohrwurm': {
      if(e.state===0){                            // in der Wand
        e.ghosted=true;
        e.x=lerp(e.x,clamp(p.x,RX+30,RX+COLS*TILE-30),0.9*dt);
        e.y=lerp(e.y,RY-6,2.2*dt);
        if(e.cd<=0){ e.state=1; e.t=0; e.cd=frand.range(2.4,3.4); }
      } else {                                    // herausgeschoben
        e.ghosted=false;
        const raus=Math.sin(Math.min(1,e.t/1.6)*Math.PI);
        e.y=RY-6+raus*96;
        if(e.cd<=1.8&&e.cd>1.72){
          const a=ang(e,p);
          for(const off of [-0.2,0,0.2]) fireEshot(e.x,e.y,a+off,130);
        }
        if(e.t>1.6){ e.state=0; e.ghosted=true; }
      }
      break; }

    /* --- Spiegelbalg: macht jeden Schritt spiegelverkehrt mit. Man
       bekommt ihn nur in einer Ecke zu fassen.                        */
    case 'spiegel': {
      const mx=RX+COLS*TILE/2, my=RY+ROWS*TILE/2;
      const zx=mx-(p.x-mx), zy=my-(p.y-my);
      e.x=lerp(e.x,zx,3.2*dt*slow); e.y=lerp(e.y,zy,3.2*dt*slow);
      break; }

    case 'panzer': {
      if(e.blick===undefined) e.blick=ang(e,p);
      const ziel=ang(e,p);
      let diff=ziel-e.blick; while(diff>Math.PI)diff-=TAU; while(diff<-Math.PI)diff+=TAU;
      e.blick+=clamp(diff,-1.6*dt,1.6*dt);            // langsam, aber ohne Pause
      chaseMove(e,dt,slow,mode,0.7);
      break; }

    case 'burrow': // Grabgräber
      if(e.state===0){ // unter der Erde: auf Spieler zubewegen
        e.ghosted=true;
        chaseMove(e,dt,slow,'fly',1.3);
        if(e.cd<=0){ e.state=1; e.t=0; }
      } else if(e.state===1){ // Auftauch-Telegraf
        if(e.t>0.45){ e.state=2; e.t=0; e.ghosted=false; Sfx.splash(); burst(e.x,e.y,'#8a7a66',8); }
      } else { // an der Oberfläche
        chaseMove(e,dt,slow,mode,0.5);
        if(e.t>1.4){ e.state=0; e.t=0; e.cd=frand.range(1.2,2); }
      }
      break;
  }
}

/* --- BOSS-KI: mehrere Patterns + Phasenwechsel bei 50% --- */
function updateBossAI(e,dt,slow){
  const p=G.player;
  if(e.phase===1&&e.hp<e.maxHp*0.5){ e.phase=2; e.flash=0.4; G.shake=8; Sfx.bossroar();
    burst(e.x,e.y,'#ffffff',20); }
  e.patT-=dt*slow;

  switch(e.ai){
    case 'matsch': { // Matschkönig: Sprünge + Schussfächer
      const hopSpd=e.phase===2?200:150;
      if(e.state===0){ e.z=0;
        if(e.cd<=0){ e.state=1; e.t=0;
          const a=ang(e,p);
          e.vx=Math.cos(a)*hopSpd; e.vy=Math.sin(a)*hopSpd; }
      } else if(e.state===1){
        const dur=0.6; e.z=Math.sin(Math.PI*Math.min(1,e.t/dur))*26;
        moveEntity(e,e.vx*dt*slow,e.vy*dt*slow,'fly');
        if(e.t>=dur){ e.state=0; e.t=0; e.z=0; G.shake=4; Sfx.splash();
          e.hops=(e.hops||0)+1;
          if(e.phase===2) for(let i=0;i<8;i++) fireEshot(e.x,e.y,i*TAU/8,110);
          if(e.hops%3===0){ e.state=2; e.t=0; } else e.cd=0.5; }
      } else { // Fächer spucken
        if(e.t>0.4){
          const a=ang(e,p);
          for(const off of [-0.4,-0.2,0,0.2,0.4]) fireEshot(e.x,e.y,a+off,130);
          if(e.phase===2&&G.enemies.filter(x=>x.type==='blobling').length<2)
            spawnEnemy('blobling',e.x+frand.range(-20,20),e.y+20,null);
          e.state=0; e.cd=0.8; }
      }
      break; }

    case 'auge': { // Augenwächter: Schwebeflug + Salven
      e.hovA=(e.hovA||0)+dt*1.2;
      const tx0=p.x+Math.cos(e.hovA)*90, ty0=RY+70+Math.sin(e.hovA*1.7)*30;
      e.x=lerp(e.x,tx0,1.5*dt); e.y=lerp(e.y,ty0,1.5*dt);
      if(e.phase===1){
        if(e.cd<=0){ e.cd=1.6;
          const a=ang(e,p);
          for(const off of [-0.18,0,0.18]) fireEshot(e.x,e.y,a+off,150);
          if(G.enemies.filter(x=>x.type==='wanderauge').length<3&&frand.chance(0.4))
            spawnEnemy('wanderauge',e.x,e.y,null); }
      } else { // Spiralfeuer
        e.spiral=(e.spiral||0)+dt*5;
        if(e.cd<=0){ e.cd=0.16;
          fireEshot(e.x,e.y,e.spiral,130); fireEshot(e.x,e.y,e.spiral+Math.PI,130); }
      }
      break; }

    case 'knochen': { // Knochengeneral: Würfe + Rammattacken
      if(e.state===0){
        chaseMove(e,dt,slow,'walk',0.5);
        if(e.cd<=0){
          if(Math.abs(e.x-p.x)<18||Math.abs(e.y-p.y)<18){ e.state=1;
            const a=Math.abs(e.x-p.x)<18?(p.y>e.y?Math.PI/2:-Math.PI/2):(p.x>e.x?0:Math.PI);
            e.vx=Math.cos(a)*(e.phase===2?300:230); e.vy=Math.sin(a)*(e.phase===2?300:230); Sfx.tick(); }
          else { const a=ang(e,p);
            for(const off of [-0.35,0,0.35]) fireEshot(e.x,e.y,a+off,140);
            e.cd=e.phase===2?1.0:1.6; }
        }
      } else {
        if(moveEntity(e,e.vx*dt*slow,e.vy*dt*slow,'walk')){
          e.state=0; e.cd=0.8; G.shake=5; Sfx.splash();
          if(e.phase===2) for(let i=0;i<8;i++) fireEshot(e.x,e.y,i*TAU/8+0.4,120); }
      }
      break; }

    case 'gift': { // Giftbrut: Bogenwürfe + Giftspur
      chaseMove(e,dt,slow,'walk',e.phase===2?0.85:0.55);
      if(e.gcd===undefined) e.gcd=0;
      e.gcd-=dt;
      if(e.gcd<=0){ e.gcd=0.4; G.creeps.push({x:e.x,y:e.y,r:14,t:3,feindlich:true}); }
      if(e.cd<=0){ e.cd=e.phase===2?1.1:1.8;
        for(let i=0;i<(e.phase===2?3:2);i++){
          const a=ang(e,p)+frand.range(-0.5,0.5), d0=dist(e,p);
          const sh=fireEshot(e.x,e.y,a,d0/1.1,{arc:true,z:0,zt:0,zdur:1.1});
          sh.life=1.2; }
      }
      if(e.phase===2&&e.cd<=0.2&&G.enemies.filter(x=>x.type==='sporling').length<2&&frand.chance(0.3))
        spawnEnemy('sporling',e.x,e.y,null);
      break; }

    case 'herz': { // Doppelherz: zwei Hälften, unterschiedliches Verhalten
      const twinAlive=G.enemies.some(x=>x.isBoss&&x!==e&&!x.dead);
      if(!twinAlive&&!e.enraged){ e.enraged=true; e.flash=0.4; Sfx.bossroar(); }
      const rage=e.enraged?1.6:1;
      if(e.variant===0){ // Jäger-Herz
        chaseMove(e,dt,slow,'fly',0.9*rage);
        if(e.cd<=0){ e.cd=2.2/rage;
          const a=ang(e,p);
          for(const off of [-0.25,0.25]) fireEshot(e.x,e.y,a+off,140); }
      } else { // Wächter-Herz
        e.hovA=(e.hovA||0)+dt;
        e.x=lerp(e.x,tx(9)+Math.cos(e.hovA)*40,1.2*dt);
        e.y=lerp(e.y,ty(3)+Math.sin(e.hovA*1.4)*40,1.2*dt);
        if(e.cd<=0){ e.cd=2.4/rage;
          for(let i=0;i<10;i++) fireEshot(e.x,e.y,i*TAU/10+e.t,105); }
      }
      break; }

    case 'kloake': { // Der Kloakenfürst: Sprünge, Klumpenregen, ab Phase 2 Rutschattacke
      if(e.state===0){                       // Anlauf zum Sprung
        e.z=0;
        if(e.cd<=0){ e.state=1; e.t=0;
          const a=ang(e,p), sp=e.phase===2?210:165;
          e.vx=Math.cos(a)*sp; e.vy=Math.sin(a)*sp; Sfx.tick(); }
      } else if(e.state===1){                // Sprung
        const dur=0.62;
        e.z=Math.sin(Math.PI*Math.min(1,e.t/dur))*30;
        moveEntity(e,e.vx*dt*slow,e.vy*dt*slow,'fly');
        if(e.t>=dur){                        // Aufschlag: Pfütze + Klumpenring
          e.state=0; e.t=0; e.z=0; G.shake=6; Sfx.splash();
          G.creeps.push({x:e.x,y:e.y,r:24,t:4,feindlich:true});
          const n=e.phase===2?12:8;
          for(let i=0;i<n;i++) fireEshot(e.x,e.y,i*TAU/n+frand()*0.3,120);
          e.spruenge=(e.spruenge||0)+1;
          if(e.phase===2&&e.spruenge%3===0){ // Rutschattacke quer durch den Raum
            e.state=2; e.t=0; e.cd=0;
            const a=frand.pick([0,Math.PI/2,Math.PI,-Math.PI/2]);
            e.rvx=Math.cos(a)*260; e.rvy=Math.sin(a)*260;
          } else if(e.spruenge%2===0){ e.state=3; e.t=0; e.cd=0; }
          else e.cd=frand.range(0.5,0.9);
        }
      } else if(e.state===2){                // rutscht und prallt von Wänden ab
        e.gcd=(e.gcd||0)-dt;
        if(e.gcd<=0){ e.gcd=0.12; G.creeps.push({x:e.x,y:e.y,r:16,t:3,feindlich:true}); }
        const ox=e.x, oy=e.y;
        e.x+=e.rvx*dt*slow;
        if(circleHitsGrid(e.x,e.y,e.r,'walk')||e.x<RX+e.r||e.x>RX+COLS*TILE-e.r){
          e.x=ox; e.rvx*=-1; G.shake=4; Sfx.splash(); }
        e.y+=e.rvy*dt*slow;
        if(circleHitsGrid(e.x,e.y,e.r,'walk')||e.y<RY+e.r||e.y>RY+ROWS*TILE-e.r){
          e.y=oy; e.rvy*=-1; G.shake=4; Sfx.splash(); }
        if(e.t>2.6){ e.state=0; e.t=0; e.cd=0.6; }
      } else {                               // Klumpenregen im Bogen
        if(e.cd<=0){ e.cd=0.28;
          const a=ang(e,p)+frand.range(-0.6,0.6);
          const weite=Math.max(60,dist(e,p)*frand.range(0.7,1.2));
          const sh=fireEshot(e.x,e.y,a,weite/0.9,{arc:true,z:0,zt:0,zdur:0.9});
          sh.life=1.0;
        }
        if(e.t>1.5){ e.state=0; e.t=0; e.cd=0.5;
          // In Phase 2 krabbeln Diener aus dem Dreck
          if(e.phase===2&&G.enemies.filter(x=>x.type==='kotkrabbler').length<4)
            for(let i=0;i<2;i++)
              spawnEnemy('kotkrabbler',e.x+frand.range(-24,24),e.y+frand.range(-16,16),null);
        }
      }
      break; }

    case 'vater': { // Der Kellervater: Endboss, 3 Phasen
      if(e.phase===2&&e.hp<e.maxHp*0.28) e.phase=3;
      if(e.state===0){ // schweben + Muster
        e.hovA=(e.hovA||0)+dt*0.8;
        e.x=lerp(e.x,tx(6)+Math.cos(e.hovA)*70,1.4*dt);
        e.y=lerp(e.y,ty(2)+Math.sin(e.hovA*1.3)*26,1.4*dt);
        if(e.cd<=0){
          e.pat=(e.pat+1)%4;
          if(e.pat===0){ // Radialring
            const n=e.phase>=2?14:10;
            for(let i=0;i<n;i++) fireEshot(e.x,e.y,i*TAU/n+e.t,115);
            e.cd=1.4;
          } else if(e.pat===1){ // gezielte Salve
            const a=ang(e,p);
            for(const off of [-0.3,-0.15,0,0.15,0.3]) fireEshot(e.x,e.y,a+off,160);
            e.cd=1.2;
          } else if(e.pat===2){ // Diener rufen
            const pool=FLOORS[5].pool;
            if(G.enemies.length<6) for(let i=0;i<2;i++)
              spawnEnemy(frand.pick(pool),tx(3+frand.int(7)),ty(1+frand.int(5)),null);
            e.cd=2.0;
          } else if(e.pat===3&&e.phase>=2){ // rotierende Doppelspirale
            e.state=1; e.t=0; e.spiral=frand()*TAU; e.cd=0.1;
          } else e.cd=0.6;
          if(e.phase>=3) e.cd*=0.65;
        }
      } else { // Spiralphase
        e.spiral+=dt*4.2;
        if(e.cd<=0){ e.cd=0.11;
          for(let i=0;i<(e.phase>=3?3:2);i++)
            fireEshot(e.x,e.y,e.spiral+i*TAU/3,125); }
        if(e.t>2.2){ e.state=0; e.cd=1.2; }
      }
      break; }

    /* --- Die Kammermutter: sechs Arme, die nacheinander einschlagen ----
       Sie bewegt sich kaum. Gefährlich ist nicht sie selbst, sondern der
       Ring aus Einschlägen um sie herum — und die Brut, die aus ihrem Leib
       fällt, sobald man sie trifft. */
    case 'mutter': {
      e.x=lerp(e.x,clamp(p.x,RX+70,RX+COLS*TILE-70),0.5*dt);
      e.y=lerp(e.y,ty(2),0.5*dt);
      if(e.cd<=0){
        e.pat=(e.pat+1)%3;
        if(e.pat===0){                       // Armschlag auf den Spieler
          const n=e.phase===2?3:2;
          for(let i=0;i<n;i++)
            einschlagSetzen(p.x+frand.range(-30,30)*i,p.y+frand.range(-24,24)*i,
                            38,0.85,1,'#c8705a');
          e.cd=e.phase===2?1.1:1.7;
        } else if(e.pat===1){                // Ring aus Schlägen um sie herum
          const n=e.phase===2?8:6, dreh=frand()*TAU;
          for(let i=0;i<n;i++){
            const a=dreh+i*TAU/n;
            einschlagSetzen(e.x+Math.cos(a)*88,e.y+Math.sin(a)*62,34,1.0,1,'#c8705a');
          }
          e.cd=e.phase===2?1.4:2.0;
        } else {                             // Brut aus dem Leib
          const wie=G.enemies.filter(x=>!x.isBoss).length;
          if(wie<7) for(let i=0;i<(e.phase===2?3:2);i++)
            spawnEnemy(frand.pick(['miniblob','zuckfliege']),
                       e.x+frand.range(-24,24),e.y+26,null);
          if(e.phase===2) for(let i=0;i<10;i++) fireEshot(e.x,e.y+20,i*TAU/10+e.t,105);
          e.cd=1.6;
        }
      }
      break; }

    /* --- Der Schlundvater: ein Maul im Boden, das saugt --------------
       Er steht fest. Der Sog zieht einen ständig zu ihm, die Zunge peitscht
       heraus, und wer zu nah kommt, wird gebissen. Man muss dagegen an. */
    case 'schlund': {
      e.x=tx(6); e.y=ty(3);
      const d=dist(p,e), a=ang(p,e);
      const sog=(e.phase===2?46:30)*(1-clamp(d/300,0,1));
      p.vx+=Math.cos(a)*sog*dt*60*0.06; p.vy+=Math.sin(a)*sog*dt*60*0.06;
      if(e.cd<=0){
        e.pat=(e.pat+1)%3;
        if(e.pat===0){                       // Zunge peitscht heraus
          e.state=1; e.t=0;
          e.zungeA=ang(e,p);
          einschlagSetzen(e.x+Math.cos(e.zungeA)*90,e.y+Math.sin(e.zungeA)*90,
                          30,0.7,1,'#c85a66');
          e.cd=1.3;
        } else if(e.pat===1){                // Speiring
          const n=e.phase===2?12:8;
          for(let i=0;i<n;i++) fireEshot(e.x,e.y,i*TAU/n+e.t*0.7,120);
          e.cd=1.5;
        } else {                             // Biss: alles nah am Maul
          einschlagSetzen(e.x,e.y,58,0.9,1,'#a03a48');
          if(e.phase===2){
            const wie=G.enemies.filter(x=>!x.isBoss).length;
            if(wie<6) for(let i=0;i<2;i++)
              spawnEnemy('kotkrabbler',e.x+frand.range(-40,40),e.y+40,null);
          }
          e.cd=1.8;
        }
      }
      if(e.state===1&&e.t>0.5){ e.state=0; }
      break; }

    /* --- Der Gehängte: schwingt am Strick quer durch den Raum --------
       Er lässt sich nicht verfolgen, man muss seinem Bogen ausweichen. An
       den Umkehrpunkten regnet es Finger. */
    case 'haenger': {
      e.schwung=(e.schwung||0)+dt*slow*(e.phase===2?1.5:1.0);
      const bogen=Math.sin(e.schwung);
      e.x=tx(6)+bogen*(COLS*TILE*0.34);
      e.y=ty(2)+Math.abs(bogen)*22;
      if(Math.abs(bogen)>0.985&&e.cd<=0){    // Umkehrpunkt
        e.cd=0.9;
        const n=e.phase===2?7:5;
        for(let i=0;i<n;i++)
          einschlagSetzen(e.x+(i-(n-1)/2)*34,ty(4)+frand.range(-14,14),
                          24,0.8,1,'#cfc2a4');
        Sfx.tick();
      }
      if(e.phase===2&&e.cd<=0.35&&frand.chance(0.06))
        fireEshot(e.x,e.y,ang(e,p),135);
      break; }

    /* --- Die Fleischmade: wühlt sich durch den Raum ------------------
       Unter dem Boden ist sie unverwundbar, dafür sieht man die Spur. Bei
       halber Kraft speit sie zwei Brutmaden aus, die weiterfressen. */
    case 'made': {
      if(e.phase===2&&!e.geteilt){
        e.geteilt=true;
        for(let i=0;i<2;i++) spawnEnemy('myzelwurm',e.x+(i?30:-30),e.y,null);
        G.shake=9; burst(e.x,e.y,'#c8a288',20);
      }
      if(e.state===0){                       // eingegraben
        e.ghosted=true;
        chaseMove(e,dt,slow,'fly',e.phase===2?1.5:1.1);
        if(frand.chance(0.5)) burst(e.x,e.y,'#6a5038',1);
        if(e.cd<=0){                         // auftauchen
          e.state=1; e.t=0; e.ghosted=false;
          einschlagSetzen(e.x,e.y,44,0.6,1,'#c8a288');
          e.cd=e.phase===2?2.2:2.8;
        }
      } else {                               // aufgetaucht, schießt
        if(e.t<0.2) { e.vx*=0.9; e.vy*=0.9; }
        moveEntity(e,e.vx*dt*0.3,e.vy*dt*0.3,'walk');
        if(e.cd<=0.9&&e.cd>0.85){
          const a=ang(e,p);
          for(const off of [-0.5,-0.25,0,0.25,0.5]) fireEshot(e.x,e.y,a+off,125);
        }
        if(e.t>1.6){ e.state=0; e.ghosted=true; }
      }
      break; }

    /* --- Der Bittende: wächst mit jedem Viertel, das er verliert ------
       Er kniet und rührt sich nicht vom Fleck. Mit jeder Stufe schlägt ein
       weiteres Händepaar zu — am Ende hagelt es aus vier Richtungen. */
    case 'bittend': {
      e.x=lerp(e.x,tx(6),0.6*dt); e.y=lerp(e.y,ty(3),0.6*dt);
      const stufe=Math.min(3,Math.floor((1-e.hp/e.maxHp)*4));
      if(stufe>(e.stufe||0)){
        e.stufe=stufe; e.r=44+stufe*5; e.flash=0.4;
        G.shake=8; Sfx.bossroar(); schockwelle(e.x,e.y,120,'#ffe08a',0.6,5);
      }
      if(e.cd<=0){
        e.pat=(e.pat+1)%2;
        if(e.pat===0){                       // Hände schlagen zu
          const n=1+(e.stufe||0);
          for(let i=0;i<n;i++)
            einschlagSetzen(p.x+frand.range(-40,40),p.y+frand.range(-32,32),
                            34,0.75,1,'#cfc0ae');
          e.cd=1.5-(e.stufe||0)*0.2;
        } else {                             // Gebetswelle
          const n=10+(e.stufe||0)*3;
          for(let i=0;i<n;i++) fireEshot(e.x,e.y,i*TAU/n+e.t*0.5,100+(e.stufe||0)*12);
          schockwelle(e.x,e.y,90,'#ffe08a',0.5,3);
          e.cd=1.8;
        }
      }
      break; }
  }
}

/* ==== 10. RENDERING ==== */
/* --- TUSCHESTIL --------------------------------------------------------
   Die Welt wird wie mit der Feder gezeichnet: leicht unrunde Pfade, dunkle
   Kontur mit schwankender Stärke, Schraffur statt Verlauf. Die Linien werden
   siebenmal je Sekunde neu gezogen ("kochen"), wie eine auf Dreier animierte
   Zeichnung. Das HUD bleibt davon ausgenommen — Zahlen und Herzen sollen
   ruhig stehen, deshalb schaltet drawHUD() den Stil ab.                    */
const KONTUR='#141014';
let tuscheAn=true;      // im HUD ausgeschaltet
let BOIL=0;             // Zittertakt
let formZaehler=0;      // laufende Nummer der Form im aktuellen Bild
function flaecheBeginnen(){ formZaehler=0; }
function formSchluessel(){ return (++formZaehler)*13.7+BOIL*911.3; }
function rausch(k){ const v=Math.sin(k*127.1+Math.cos(k*0.73)*311.7)*43758.5453; return v-Math.floor(v); }

// Handgezogener Ellipsenpfad
function handPfad(x,y,rx,ry,rot,k,dichte){
  const n=dichte||Math.max(10,Math.min(20,Math.round((rx+ry)*0.5)));
  rot=rot||0;
  const co=Math.cos(rot), si=Math.sin(rot);
  ctx.beginPath();
  for(let i=0;i<=n;i++){
    const a=i/n*TAU;
    const f=1+((rausch(k+i*3.11)-0.5)+(rausch(k*0.37+i*1.7)-0.5)*0.6)*0.075;
    const px=Math.cos(a)*rx*f, py=Math.sin(a)*ry*f;
    if(i===0) ctx.moveTo(x+px*co-py*si,y+px*si+py*co);
    else      ctx.lineTo(x+px*co-py*si,y+px*si+py*co);
  }
  ctx.closePath();
}
function handZug(pts,k,schliessen){
  ctx.beginPath();
  for(let i=0;i<pts.length;i++){
    const w1=(rausch(k+i*5.3)-0.5)*1.5, w2=(rausch(k+i*9.1)-0.5)*1.5;
    if(i===0) ctx.moveTo(pts[i][0]+w1,pts[i][1]+w2);
    else      ctx.lineTo(pts[i][0]+w1,pts[i][1]+w2);
  }
  if(schliessen!==false) ctx.closePath();
}
function tusche(breite,farbe,k){
  ctx.save();
  ctx.strokeStyle=farbe||KONTUR; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.lineWidth=breite; ctx.stroke();
  ctx.globalAlpha=0.5; ctx.lineWidth=breite*(0.55+rausch(k||1)*0.3); ctx.stroke();
  ctx.restore();
}
// Parallelschraffur im aktuellen Beschnitt; nur für größere Formen, sonst zu teuer
function schraffieren(x,y,radius,winkel,abstand,farbe,breite,k){
  ctx.save();
  ctx.strokeStyle=farbe; ctx.lineWidth=breite||1; ctx.lineCap='round';
  const co=Math.cos(winkel), si=Math.sin(winkel);
  let i=0;
  for(let d=-radius;d<=radius;d+=abstand){
    const zu=(rausch((k||1)+(i++)*2.9)-0.5)*abstand*0.5;
    const l=radius*(0.86+rausch((k||1)+i*7.7)*0.28);
    ctx.beginPath();
    ctx.moveTo(x+co*-l-si*(d+zu),y+si*-l+co*(d+zu));
    ctx.lineTo(x+co* l-si*(d+zu),y+si* l+co*(d+zu));
    ctx.stroke();
  }
  ctx.restore();
}

function disc(x,y,r,color){
  if(!tuscheAn||r<2.4){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();return;}
  const k=formSchluessel();
  handPfad(x,y,r,r,0,k); ctx.fillStyle=color; ctx.fill();
  if(r>3.4){ handPfad(x,y,r,r,0,k+0.9); tusche(Math.max(0.9,r*0.13),KONTUR,k); }
}
function ring(x,y,r,color,w){
  if(!tuscheAn){ctx.strokeStyle=color;ctx.lineWidth=w||2;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.stroke();return;}
  const k=formSchluessel(); handPfad(x,y,r,r,0,k); tusche(w||2,color,k);
}
function rrect(x,y,w,h,color){
  if(!tuscheAn||Math.min(Math.abs(w),Math.abs(h))<3.2){ctx.fillStyle=color;ctx.fillRect(x,y,w,h);return;}
  const k=formSchluessel();
  handZug([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],k);
  ctx.fillStyle=color; ctx.fill();
  handZug([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],k+0.9);
  tusche(Math.max(0.8,Math.min(Math.abs(w),Math.abs(h))*0.1),KONTUR,k);
}
function ellipse(x,y,rx,ry,rot,color){
  if(!tuscheAn||Math.max(rx,ry)<2.4){
    ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,TAU);ctx.fill();return;}
  const k=formSchluessel();
  handPfad(x,y,rx,ry,rot,k); ctx.fillStyle=color; ctx.fill();
  if(Math.max(rx,ry)>3.4){ handPfad(x,y,rx,ry,rot,k+0.9);
    tusche(Math.max(0.9,Math.max(rx,ry)*0.11),KONTUR,k); }
}
function vieleck(pts,color){
  if(!tuscheAn){ poly(pts,color); return; }
  const k=formSchluessel();
  handZug(pts,k); ctx.fillStyle=color; ctx.fill();
  let gr=0;
  for(let i=1;i<pts.length;i++) gr=Math.max(gr,Math.hypot(pts[i][0]-pts[0][0],pts[i][1]-pts[0][1]));
  if(gr>7){ handZug(pts,k+0.9); tusche(Math.max(0.8,gr*0.05),KONTUR,k); }
}
/* Feuchter Glanzpunkt — lässt nasse Oberflächen glänzen */
function glanz(x,y,rx,ry,rot,staerke){
  ctx.save(); ctx.globalAlpha=staerke||0.32; ctx.fillStyle='#ffffff';
  if(tuscheAn){ const k=formSchluessel(); handPfad(x,y,rx,ry,rot,k); }
  else { ctx.beginPath(); ctx.ellipse(x,y,rx,ry,rot||0,0,TAU); }
  ctx.fill(); ctx.restore();
}
/* Hohle Augenhöhle mit Glut darin */
function hohlauge(x,y,r,glutfarbe,glut){
  const k=formSchluessel();
  handPfad(x,y,r,r,0,k); ctx.fillStyle='#0d0a0c'; ctx.fill();
  handPfad(x,y,r,r,0,k+0.9); tusche(Math.max(0.7,r*0.2),KONTUR,k);
  ctx.save(); ctx.globalAlpha=0.5*(glut===undefined?1:glut);
  ctx.beginPath(); ctx.arc(x,y,r*1.5,0,TAU); ctx.fillStyle=glutfarbe; ctx.fill(); ctx.restore();
  ctx.beginPath(); ctx.arc(x,y,r*0.46,0,TAU); ctx.fillStyle=glutfarbe; ctx.fill();
}
/* Zahnreihe; runter=true lässt die Spitzen nach unten zeigen */
function zaehneSpiel(x,y,breite,anzahl,hoehe,runter,farbe){
  const schritt=breite/anzahl;
  for(let i=0;i<anzahl;i++){
    const zx=x-breite/2+schritt*i, b=schritt*0.86;
    const spitz=runter?y+hoehe:y-hoehe;
    ctx.fillStyle=farbe||'#ddd2c0'; ctx.beginPath();
    ctx.moveTo(zx,y); ctx.lineTo(zx+b,y); ctx.lineTo(zx+b/2,spitz); ctx.fill();
  }
}

/* Körper mit Lichtseite und schraffierter Schattenseite */
function fleisch(x,y,rx,ry,rot,hell,mitte,dunkel){
  if(!tuscheAn){ ctx.fillStyle=mitte; ctx.beginPath(); ctx.ellipse(x,y,rx,ry,rot||0,0,TAU); ctx.fill(); return; }
  const k=formSchluessel(), gross=Math.max(rx,ry);
  handPfad(x,y,rx,ry,rot,k); ctx.fillStyle=mitte; ctx.fill();
  ctx.save(); handPfad(x,y,rx,ry,rot,k); ctx.clip();
  ctx.beginPath(); ctx.ellipse(x-rx*0.3,y-ry*0.34,rx*0.72,ry*0.66,rot||0,0,TAU);
  ctx.fillStyle=hell; ctx.globalAlpha=0.75; ctx.fill(); ctx.restore();
  if(gross>7){ // Schraffur lohnt erst ab einer gewissen Größe
    ctx.save(); handPfad(x,y,rx,ry,rot,k); ctx.clip();
    ctx.beginPath(); ctx.ellipse(x+rx*0.46,y+ry*0.5,rx*1.02,ry*1.02,rot||0,0,TAU); ctx.clip();
    schraffieren(x,y,gross*1.4,0.85,Math.max(1.8,gross*0.2),dunkel,Math.max(0.7,gross*0.08),k);
    ctx.restore();
  }
  handPfad(x,y,rx,ry,rot,k+0.9); tusche(Math.max(0.9,gross*0.1),KONTUR,k);
}
function txt(str,x,y,color,size,align){
  ctx.fillStyle=color||'#fff';ctx.font=(size||10)+'px monospace';
  ctx.textAlign=align||'center';ctx.textBaseline='middle';
  ctx.fillText(str,x|0,y|0);
}
/* Bricht einen Text auf eine Breite um und gibt die Zeilen zurück.
   Ohne das passt keine Item-Beschreibung in eine Karte von 130 Pixeln. */
function textZeilen(str,size,breite){
  ctx.font=size+'px monospace';
  const worte=str.split(' '), zeilen=[]; let zeile='';
  for(const w of worte){
    const probe=zeile?zeile+' '+w:w;
    if(ctx.measureText(probe).width>breite&&zeile){ zeilen.push(zeile); zeile=w; }
    else zeile=probe;
  }
  if(zeile) zeilen.push(zeile);
  return zeilen;
}

/* Kleine Tafel, die sagt, was ein Item tut. Wird am Podest und an
   liegenden Items eingeblendet, sobald man nahe genug steht — gerade im
   Laden und in der Teufelskammer will man das VOR dem Zugreifen wissen. */
function itemTafel(id,x,y,preis,herzPreis){
  const it=ITEMS[id]; if(!it) return;
  const bw=142, size=7;
  const zeilen=textZeilen(it.desc,size,bw-14);
  const kosten=preis?preis+' Münzen':(herzPreis?(herzPreis===1?'1 Herzcontainer':herzPreis+' Herzcontainer'):null);
  const bh=17+zeilen.length*9+(kosten?10:0);
  let bx=clamp(x-bw/2,4,W-bw-4);
  let by=y-bh-16;
  if(by<4) by=y+20;                      // unten anschlagen? dann darunter
  const merk=tuscheAn; tuscheAn=false;
  ctx.globalAlpha=0.92;
  ctx.fillStyle='#12101a'; ctx.fillRect(bx,by,bw,bh);
  ctx.globalAlpha=1;
  ctx.strokeStyle=itemColor(id); ctx.lineWidth=1;
  ctx.strokeRect(bx+0.5,by+0.5,bw-1,bh-1);
  txt(it.name,bx+bw/2,by+9,'#e8e0d0',9);
  zeilen.forEach((z,i)=>txt(z,bx+bw/2,by+20+i*9,'#a9a294',size));
  if(kosten) txt(kosten,bx+bw/2,by+22+zeilen.length*9,
                 herzPreis?'#e0798c':'#ffd75a',7);
  tuscheAn=merk;
}

function shadow(x,y,r){ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(x|0,y|0,r,r*0.45,0,0,TAU);ctx.fill();}

/* Herz zeichnen (voll/halb/leer; Typ rot/seele/schwarz) */
function drawHeart(x,y,fill,type){
  const cols={red:['#d43a4a','#8a1a2a'],soul:['#8ab4e8','#3a5a8a'],black:['#5a3a7a','#2a1a3a'],empty:['#3a3236','#241f22']};
  const c=cols[type]||cols.empty;
  ctx.fillStyle=fill==='empty'?cols.empty[0]:c[0];
  if(fill==='half'){ // linke Hälfte gefüllt, rechte leer
    ctx.fillStyle=cols.empty[0];
    heartPath(x,y);ctx.fill();
    ctx.save();ctx.beginPath();ctx.rect(x-6,y-6,6,12);ctx.clip();
    ctx.fillStyle=c[0];heartPath(x,y);ctx.fill();ctx.restore();
  } else { heartPath(x,y);ctx.fill(); }
  ctx.strokeStyle=fill==='empty'?cols.empty[1]:c[1];ctx.lineWidth=1;heartPath(x,y);ctx.stroke();
}
function heartPath(x,y){
  ctx.beginPath();
  ctx.moveTo(x,y+5);
  ctx.bezierCurveTo(x-7,y-1,x-5,y-6,x-2.5,y-4);
  ctx.bezierCurveTo(x-1,y-3,x,y-2,x,y-1.5);
  ctx.bezierCurveTo(x,y-2,x+1,y-3,x+2.5,y-4);
  ctx.bezierCurveTo(x+5,y-6,x+7,y-1,x,y+5);
}

/* Item-Icons werden prozedural aus der Item-ID erzeugt: aus dem Hash ergeben
   sich Farbton und Emblemform, sodass jedes Item ein eigenes, wiedererkennbares
   Zeichen bekommt, ohne dass Grafiken hinterlegt werden müssen. */
function itemHash(id){let h=2166136261;
  for(let i=0;i<id.length;i++){h^=id.charCodeAt(i);h=Math.imul(h,16777619);}
  return h>>>0;}
function itemColor(id){return `hsl(${itemHash(id)%360},62%,58%)`;}
const EMBLEME=8; // Anzahl der Emblemformen
function drawItemIcon(id,x,y,s){
  s=s||1;
  const h=itemHash(id), c=itemColor(id);
  const dunkel=`hsl(${h%360},55%,32%)`;
  // Kachel mit Rahmen und Lichtkante
  rrect(x-7*s,y-7*s,14*s,14*s,'#15151a');
  rrect(x-6*s,y-6*s,12*s,12*s,dunkel);
  rrect(x-6*s,y-6*s,12*s,2*s,`hsl(${h%360},55%,44%)`);
  // Emblem
  ctx.save(); ctx.translate(x,y+0.5*s); ctx.scale(s,s);
  ctx.fillStyle=c;
  const form=(h>>>11)%EMBLEME; // eigener Bitbereich, sonst häufen sich Formen
  if(form===0){ ctx.beginPath();ctx.arc(0,0,4,0,TAU);ctx.fill(); }

  else { ctx.beginPath();ctx.moveTo(-4.5,3.5);ctx.quadraticCurveTo(0,-6,4.5,3.5);ctx.closePath();ctx.fill(); }
  ctx.restore();
  // Glanzpunkt
  rrect(x-5*s,y-5*s,2*s,2*s,'rgba(255,255,255,0.45)');
