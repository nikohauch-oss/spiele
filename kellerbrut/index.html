/* Handschrift der aktuellen Etage; tiefere Etagen als beschrieben erben die letzte. */
function handschrift(){ return HANDSCHRIFTEN[Math.min(G.depth-1,HANDSCHRIFTEN.length-1)]||HANDSCHRIFTEN[0]; }

/* Feiner Staub, der im Licht schwebt — von mehreren Handschriften benutzt */
function staub(x,y,w,h,t,farbe,anzahl){
  for(let i=0;i<anzahl;i++){
    const px=x+((i*67)%100)/100*w+Math.sin(t*0.4+i*1.3)*6;
    const py=y+((i*151)%100)/100*h+Math.cos(t*0.3+i)*4;
    ctx.save(); ctx.globalAlpha=0.3+Math.sin(t*1.5+i*2)*0.25;
    ctx.fillStyle=farbe; ctx.fillRect(px,py,1,1); ctx.restore();
  }
}

/* --- Raumhintergrund vorbacken -------------------------------------------
   Boden, Bodenhandschrift, Deckenlicht, Wandschatten, Löcher, die festen
   Hindernisse und die Wände ändern sich innerhalb eines Raumbesuchs nicht.
   Sie einmal auf zwei Nebenleinwände zu zeichnen und danach nur noch zu
   kopieren spart pro Bild hunderte Pfade — mit Schraffur und Handkontur
   wäre das sonst nicht bei 60 Bildern die Sekunde zu halten.
   BODENBILD liegt unter den Pfützen, AUFBAUBILD darüber.
   Der Preis: gebackene Formen zittern nicht mit dem Tuschetakt. Für ruhende
   Kulisse ist das sogar angenehmer — Feuer, Wände und alles Lebende zittern
   weiter.                                                                */
let bodenBild=null, aufbauBild=null, bildStand='', gitterStand=0;
function raumBildNeu(){ gitterStand++; }   // nach jeder Gitteränderung rufen

function raumBildBacken(stand){
  const F=G.floor.data, HS=handschrift(), room=G.room;
  const bw=COLS*TILE, bh=ROWS*TILE, rand=26;
  if(!bodenBild||bodenBild.width!==W*SKALA){
    bodenBild=document.createElement('canvas');
    aufbauBild=document.createElement('canvas');
    for(const b of [bodenBild,aufbauBild]){ b.width=W*SKALA; b.height=H*SKALA; }
  }
  const echterCtx=ctx, zaehlerVorher=formZaehler;
  try{

  /* ---- Lage 1: alles, was flach am Boden liegt ---- */
  ctx=bodenBild.getContext('2d');
  ctx.setTransform(SKALA,0,0,SKALA,0,0); ctx.clearRect(0,0,W,H);
  ctx.imageSmoothingEnabled=false;
  flaecheBeginnen(); tuscheAn=false;

  // Kacheln. Ohne Tusche: eine Kontur je Kachel ergäbe ein unruhiges Gitter.
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    ctx.fillStyle=(r+c)%2?F.fa:F.fb;
    ctx.fillRect(RX+c*TILE,RY+r*TILE,TILE,TILE);
  }
  /* Bodenhandschrift der Etage: liegt IM Boden, ohne Kontur und ohne
     Schlagschatten — dadurch klar von Hindernissen zu unterscheiden. Die
     Streuung hängt an der Raumkoordinate, ist also bei jedem Betreten
     dieselbe. Nur gut jedes dritte freie Feld bekommt etwas ab. */
  if(HS.bodenDeko) for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(room.grid[r][c]) continue;
    const k=Math.abs(room.gx*911+room.gy*577+r*31+c*7)+13;
    if(rausch(k)>0.42) continue;
    ctx.save(); ctx.globalAlpha=0.9;
    HS.bodenDeko(RX+c*TILE+TILE/2,RY+r*TILE+TILE/2,TILE,k);
    ctx.restore();
  }
  // Spezialraum-Bodenfärbung
  if(room.type==='treasure'){ ctx.fillStyle='rgba(212,175,55,0.05)'; ctx.fillRect(RX,RY,bw,bh); }
  if(room.type==='curse')   { ctx.fillStyle='rgba(160,30,30,0.08)';  ctx.fillRect(RX,RY,bw,bh); }
  if(room.type==='secret')  { ctx.fillStyle='rgba(120,80,200,0.06)'; ctx.fillRect(RX,RY,bw,bh); }
  if(room.type==='devil')   { ctx.fillStyle='rgba(160,20,30,0.16)';  ctx.fillRect(RX,RY,bw,bh); }
  if(room.type==='angel')   { ctx.fillStyle='rgba(240,235,205,0.10)';ctx.fillRect(RX,RY,bw,bh); }

  // Deckenlampe: heller zur Mitte, dunkel zu den Rändern
  let gr=ctx.createRadialGradient(RX+bw*0.5,RY+bh*0.34,0,RX+bw*0.5,RY+bh*0.5,bw*0.62);
  gr.addColorStop(0,HS.licht); gr.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gr; ctx.fillRect(RX,RY,bw,bh);

  /* Die Wände werfen Schatten auf den Boden. Das Licht kommt von oben
     links, deshalb ist der Schatten oben am tiefsten und unten am flachsten. */
  const wandSchatten=(x0,y0,x1,y1,w0,h0)=>{
    const lg=ctx.createLinearGradient(x0,y0,x1,y1);
    lg.addColorStop(0,'rgba(0,0,0,0.55)'); lg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=lg; ctx.fillRect(x0,y0,w0,h0);
  };
  wandSchatten(RX,RY,RX,RY+TILE*1.5,bw,TILE*1.5);
  wandSchatten(RX,RY,RX+TILE*1.1,RY,TILE*1.1,bh);
  wandSchatten(RX+bw,RY,RX+bw-TILE*0.7,RY,-TILE*0.7,bh);
  wandSchatten(RX,RY+bh,RX,RY+bh-TILE*0.55,bw,-TILE*0.55);

  /* Löcher: erst der Schlund, dann die Innenwände. Die hellen und dunklen
     Kanten sind es, die dem Loch spürbare Tiefe geben. */
  tuscheAn=true;
  const istLoch=(r,c)=>r>=0&&r<ROWS&&c>=0&&c<COLS&&!!room.grid[r][c]&&room.grid[r][c].t==='pit';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(!istLoch(r,c)) continue;
    const x=RX+c*TILE, y=RY+r*TILE;
    ctx.fillStyle=HS.tiefe; ctx.fillRect(x,y,TILE,TILE);
    ctx.save(); ctx.beginPath(); ctx.rect(x,y,TILE,TILE); ctx.clip();
    HS.loch(x+TILE/2,y+TILE/2,TILE);
    ctx.restore();
    if(!istLoch(r-1,c)){                       // Innenwand oben
      const ig=ctx.createLinearGradient(0,y,0,y+TILE*0.5);
      ig.addColorStop(0,'rgba(255,255,255,0.10)'); ig.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=ig; ctx.fillRect(x,y,TILE,TILE*0.5);
      ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(x,y,TILE,4);
    }
    if(!istLoch(r+1,c)){                       // helle Bruchkante unten
      ctx.fillStyle='rgba(255,255,255,0.07)'; ctx.fillRect(x,y+TILE-5,TILE,5);
    }
    if(!istLoch(r,c-1)){ ctx.fillStyle='rgba(0,0,0,0.35)';       ctx.fillRect(x,y,4,TILE); }
    if(!istLoch(r,c+1)){ ctx.fillStyle='rgba(255,255,255,0.05)'; ctx.fillRect(x+TILE-4,y,4,TILE); }
  }

  /* ---- Lage 2: was über den Pfützen steht ---- */
  ctx=aufbauBild.getContext('2d');
  ctx.setTransform(SKALA,0,0,SKALA,0,0); ctx.clearRect(0,0,W,H);
  ctx.imageSmoothingEnabled=false;
  flaecheBeginnen(); tuscheAn=true;

  // Schlagschatten aller stehenden Hindernisse, Licht von oben links
  ctx.save(); ctx.globalAlpha=0.42; ctx.fillStyle='#000000';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const z=room.grid[r][c]; if(!z||(z.t!=='rock'&&z.t!=='poop')) continue;
    ctx.beginPath();
    ctx.ellipse(RX+c*TILE+TILE/2+TILE*0.14,RY+r*TILE+TILE/2+TILE*0.24,TILE*0.4,TILE*0.17,0,0,TAU);
    ctx.fill();
  }
  ctx.restore();

  // Die Hindernisse selbst, in der Handschrift der Etage
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const z=room.grid[r][c]; if(!z) continue;
    const cx=RX+c*TILE+TILE/2, cy=RY+r*TILE+TILE/2;
    if(z.t==='rock')       HS.stein(cx,cy,TILE);
    else if(z.t==='spike') HS.stachel(cx,cy,TILE);
    else if(z.t==='poop'){ HS.wuchs(cx,cy,TILE);
      if(z.hp<2){ ctx.strokeStyle='rgba(20,16,20,0.8)'; ctx.lineWidth=1.4;  // angeschlagen
        ctx.beginPath(); ctx.moveTo(cx-5,cy-3); ctx.lineTo(cx-1,cy+2);
        ctx.lineTo(cx-4,cy+6); ctx.stroke(); } }
  }

  /* Wände zuletzt: Lichtkante oben und links, Schattenkante unten und
     rechts — dieselbe Lichtrichtung wie bei den Hindernissen. */
  tuscheAn=false;
  ctx.fillStyle=F.wall;
  ctx.fillRect(RX-rand,RY-rand,bw+rand*2,rand);
  ctx.fillRect(RX-rand,RY+bh,bw+rand*2,rand);
  ctx.fillRect(RX-rand,RY-rand,rand,bh+rand*2);
  ctx.fillRect(RX+bw,RY-rand,rand,bh+rand*2);
  ctx.fillStyle='rgba(255,255,255,0.14)';
  ctx.fillRect(RX-rand,RY-rand,bw+rand*2,7);
  ctx.fillRect(RX-rand,RY-rand,7,bh+rand*2);
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.fillRect(RX-rand,RY+bh+rand-8,bw+rand*2,8);
  ctx.fillRect(RX+bw+rand-8,RY-rand,8,bh+rand*2);
  ctx.strokeStyle=F.accent; ctx.lineWidth=2;
  ctx.strokeRect(RX-1,RY-1,bw+2,bh+2);
  // Ziegelfugen im Mauerwerk
  ctx.fillStyle='rgba(0,0,0,0.15)';
  for(let i=0;i<COLS+2;i+=2){
    ctx.fillRect(RX-rand+i*TILE,RY-rand,2,10);
    ctx.fillRect(RX-rand+i*TILE+TILE,RY+bh+14,2,10);
  }

  bildStand=stand;
  } finally {
    // Der Zeichenkontext MUSS zurück, sonst zeichnet das Spiel ab hier
    // unsichtbar auf die Nebenleinwand weiter.
    ctx=echterCtx; tuscheAn=true; formZaehler=zaehlerVorher;
  }
}

/* Item-Tafeln werden erst gesammelt und ganz zuletzt gezeichnet, damit sie
   nicht von Gegnern, Steinen oder dem Spieler verdeckt werden. */
let tafelWarteschlange=[], tafelnGezeichnet=0;
function tafelnZeichnen(){
  for(const [id,x,y,preis,herz] of tafelWarteschlange) itemTafel(id,x,y,preis,herz);
  tafelnGezeichnet=tafelWarteschlange.length;   // bleibt nach dem Bild ablesbar
  tafelWarteschlange.length=0;
}

function drawRoom(){
  const HS=handschrift(), t=performance.now()/1000;
  const bw=COLS*TILE, bh=ROWS*TILE;
  const stand=G.seedNum+'|'+G.depth+'|'+G.roomKey+'|'+gitterStand;
  if(bildStand!==stand) raumBildBacken(stand);

  ctx.drawImage(bodenBild,0,0,W,H);

  // Möblierung der Teufels- oder Engelskammer, direkt auf dem Boden
  const kammer=kammerBild();
  if(kammer){ ctx.save(); ctx.beginPath();
    ctx.rect(RX,RY,bw,bh); ctx.clip(); kammer.zeichnen(t); ctx.restore(); }

  // Feuerstellen leuchten den Boden aus — flackert, bleibt also lebendig
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const z=G.room.grid[r][c]; if(!z||z.t!=='fire') continue;
    const x=RX+c*TILE+TILE/2, y=RY+r*TILE+TILE/2;
    const fl=0.75+Math.sin(t*7+c*1.7+r)*0.25;
    const fg=ctx.createRadialGradient(x,y,0,x,y,TILE*1.7);
    fg.addColorStop(0,z.red?'rgba(230,50,50,0.4)':HS.feuerschein);
    fg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.save(); ctx.globalAlpha=fl; ctx.fillStyle=fg;
    ctx.fillRect(x-TILE*1.7,y-TILE*1.7,TILE*3.4,TILE*3.4); ctx.restore();
  }

  /* Pfützen. Gegnerische violett, eigene giftgrün, Glut orange, Netze silbrig.
     Sporenwolken werden erst nach den Figuren gezeichnet, weil sie die Sicht
     nehmen sollen — siehe drawSporen(). */
  tuscheAn=false;
  for(const c of G.creeps){
    if(c.sporen) continue;
    const a=clamp(c.t/2,0.15,0.5);
    if(c.netz){                                   // Netz: Fäden statt Pfütze
      ctx.strokeStyle=`rgba(216,216,228,${a*0.9})`; ctx.lineWidth=1;
      for(let i=0;i<6;i++){ const w=i*Math.PI/6;
        ctx.beginPath();
        ctx.moveTo(c.x-Math.cos(w)*c.r,c.y-Math.sin(w)*c.r*0.6);
        ctx.lineTo(c.x+Math.cos(w)*c.r,c.y+Math.sin(w)*c.r*0.6); ctx.stroke(); }
      for(const rr of [0.4,0.75]){ ctx.beginPath();
        ctx.ellipse(c.x,c.y,c.r*rr,c.r*0.6*rr,0,0,TAU); ctx.stroke(); }
      continue;
    }
    if(c.nagel){                                  // ausgeschlagener Nagel
      ctx.strokeStyle=`rgba(150,142,128,${a*1.6})`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(c.x-4,c.y+3); ctx.lineTo(c.x+4,c.y-3); ctx.stroke();
      ctx.fillStyle=`rgba(200,192,176,${a*1.6})`;
      ctx.beginPath(); ctx.arc(c.x+4,c.y-3,2,0,TAU); ctx.fill();
      continue;
    }
    if(c.glatt){                                  // nasse Spur des Häutlings
      ctx.fillStyle=`rgba(150,40,50,${a*0.8})`;
      ctx.beginPath(); ctx.ellipse(c.x,c.y,c.r,c.r*0.55,0,0,TAU); ctx.fill();
      ctx.fillStyle=`rgba(230,180,190,${a*0.5})`;
      ctx.beginPath(); ctx.ellipse(c.x-c.r*0.25,c.y-c.r*0.14,c.r*0.4,c.r*0.2,0,0,TAU); ctx.fill();
      continue;
    }
    const unten=c.feindlich?(c.glut?`rgba(190,70,20,${a})`:`rgba(120,60,160,${a})`)
                           :(c.glut?`rgba(210,90,20,${a})`:`rgba(120,200,60,${a})`);
    const oben =c.feindlich?(c.glut?`rgba(255,150,50,${a*0.8})`:`rgba(170,110,210,${a*0.7})`)
                           :(c.glut?`rgba(255,180,60,${a*0.8})`:`rgba(180,240,120,${a*0.7})`);
    ctx.fillStyle=unten;
    ctx.beginPath();ctx.ellipse(c.x,c.y,c.r,c.r*0.6,0,0,TAU);ctx.fill();
    ctx.fillStyle=oben;
    ctx.beginPath();ctx.ellipse(c.x-c.r*0.2,c.y-c.r*0.12,c.r*0.5,c.r*0.28,0,0,TAU);ctx.fill();
  }
  tuscheAn=true;

  // Steine, Stacheln, Wucherungen und die Wände in einem Zug
  ctx.drawImage(aufbauBild,0,0,W,H);

  // Feuer selbst: züngelt, muss also jedes Bild neu
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const z=G.room.grid[r][c]; if(!z||z.t!=='fire') continue;
    const cx=RX+c*TILE+TILE/2, cy=RY+r*TILE+TILE/2;
    shadow(cx,cy+10,10);
    HS.feuer(cx,cy,TILE,z.red,t);
  }

  // Wandhandschrift der Etage: Fleisch pulst, Tropfen laufen — bleibt lebendig
  if(HS.wandDeko){ ctx.save(); HS.wandDeko(RX,RY,bw,bh,26,t); ctx.restore(); }

  // Türen
  for(const d in G.room.doors) drawDoor(d,G.room.doors[d]);

  // Falltür
  if(G.room.trapdoor){
    const x=tx(8),y=ty(3);
    rrect(x-14,y-11,28,22,'#0a0a0a');
    ctx.strokeStyle='#6e675e';ctx.lineWidth=2;ctx.strokeRect(x-14,y-11,28,22);
    txt('▼',x,y,'#6e675e',10);
  }
  // Podeste
  for(const pd of G.room.pedestals){
    if(pd.taken) continue;
    shadow(pd.x,pd.y+8,12);
    rrect(pd.x-10,pd.y,20,8,'#55504a');rrect(pd.x-8,pd.y-4,16,6,'#6e675e');
    const bob=Math.sin(performance.now()/300)*2;
    drawItemIcon(pd.itemId,pd.x,pd.y-14+bob,1.2);
    if(pd.price) txt(pd.price+'¢',pd.x,pd.y+16,'#ffd75a',9);
    // Wer nah genug steht, erfährt vor dem Zugreifen, was das Ding tut
    if(dist(G.player,pd)<40) tafelWarteschlange.push([pd.itemId,pd.x,pd.y-24,pd.price,pd.herzPreis]);
    else if(pd.herzPreis){                   // Preis in Herzen statt in Münzen
      const p2=G.player;
      const bezahlbar=(p2.redMax-pd.herzPreis*2>=2&&p2.red-pd.herzPreis*2>=1)
                      ||p2.soul.length>=3;
      tuscheAn=false;
      for(let i=0;i<pd.herzPreis;i++)
        drawHeart(pd.x-pd.herzPreis*5+i*10+5,pd.y+18,bezahlbar?'full':'empty','red');
      tuscheAn=true;
    }
  }
  // Automaten
  for(const m of G.room.machines){
    shadow(m.x,m.y+14,12);
    const col=m.broken?'#4a4a4a':(m.kind==='slot'?'#b0684a':'#6a4ab0');
    rrect(m.x-12,m.y-16,24,30,col);
    rrect(m.x-9,m.y-12,18,10,'#111');
    txt(m.broken?'X':(m.kind==='slot'?'?':'★'),m.x,m.y-7,m.broken?'#666':'#ffd75a',9);
    rrect(m.x-8,m.y+2,16,4,'#222');
  }
}

/* Raumstimmung über allem: der Dunst der Etage und die Vignette, die die
   Dunkelheit von den Rändern hereindrückt. Wird nach der Spielwelt und vor
   dem HUD gezeichnet, damit das HUD lesbar bleibt. */
let vignette=null;
function raumStimmung(){
  const HS=handschrift(), t=performance.now()/1000;
  ctx.save();
  ctx.beginPath(); ctx.rect(RX,RY,COLS*TILE,ROWS*TILE); ctx.clip();
  if(HS.dunst) HS.dunst(RX,RY,COLS*TILE,ROWS*TILE,t);
  ctx.restore();
  if(!vignette){
    vignette=ctx.createRadialGradient(W/2,H*0.46,Math.min(W,H)*0.34,W/2,H*0.5,Math.max(W,H)*0.72);
    vignette.addColorStop(0,'rgba(0,0,0,0)'); vignette.addColorStop(1,'rgba(0,0,0,0.55)');
  }
  ctx.fillStyle=vignette; ctx.fillRect(0,0,W,H);
}

/* --- TÜREN ---------------------------------------------------------------
   Gezeichnet wird immer in lokalen Koordinaten, in denen -y nach außen
   (aus dem Raum heraus) zeigt; die Wandseite ergibt sich allein aus der
   Drehung. Aufbau: dunkler Durchgang, davor zwei Türblätter, die beim
   Öffnen zur Seite wegschwenken, darüber der Rahmen in leichter
   Aufsichtsperspektive (außen breiter als innen).                        */
const DOOR_ROT={u:0, d:Math.PI, l:-Math.PI/2, r:Math.PI/2};

function doorStyle(kind){
  switch(kind){
    case 'boss':   return {rahmen:'#4a4038',hell:'#6d5f52',dunkel:'#241e1a',
                           blatt:'#5c4c44',blattTief:'#33292410',schein:'#c03a5a'};
    case 'schatz': return {rahmen:'#8a6f2a',hell:'#d4af41',dunkel:'#54410f',
                           blatt:'#b08d33',blattTief:'#7a6021'};
    case 'shop':   return {rahmen:'#7a5230',hell:'#c98a4a',dunkel:'#452c17',
                           blatt:'#9a6a3c',blattTief:'#6a4726'};
    case 'devil':  return {rahmen:'#521018',hell:'#9a2030',dunkel:'#2a070c',
                           blatt:'#3a0c12',blattTief:'#1e0508',schein:true};
    case 'angel':  return {rahmen:'#8a8270',hell:'#efe8d0',dunkel:'#544e40',
                           blatt:'#d8d0b8',blattTief:'#a09880'};
    case 'curse':  return {rahmen:'#5a2424',hell:'#833636',dunkel:'#331313',
                           blatt:'#6a2a2a',blattTief:'#431a1a',schein:'#c03a5a'};
    case 'secret': return {rahmen:'#4a4a52',hell:'#65656f',dunkel:'#2b2b31',
                           blatt:'#4a4a52',blattTief:'#2b2b31'};
    default:       return {rahmen:'#6b5b47',hell:'#8d7862',dunkel:'#42382c',
                           blatt:'#7a6448',blattTief:'#4e3f2c'};
  }
}
function poly(pts,color){
  ctx.fillStyle=color; ctx.beginPath();
  ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath(); ctx.fill();
}
// Rahmen als Ring: äußeres Polygon minus Öffnung
function polyRing(aussen,innen,color){
  ctx.fillStyle=color; ctx.beginPath();
  ctx.moveTo(aussen[0][0],aussen[0][1]);
  for(let i=1;i<aussen.length;i++) ctx.lineTo(aussen[i][0],aussen[i][1]);
  ctx.closePath();
  ctx.moveTo(innen[0][0],innen[0][1]);
  for(let i=innen.length-1;i>=1;i--) ctx.lineTo(innen[i][0],innen[i][1]);
  ctx.closePath();
  ctx.fill('evenodd');
}

function drawDoor(d,door){
  const e=door.edge;
  if(!e.revealed) return;   // Geheimgang oder verborgene Kammer: noch nicht da
  const dp=doorXY(d), st=doorStyle(e.kind);
  const a=clamp(door.anim===undefined?(doorPassable(door)?1:0):door.anim,0,1);

  // Rahmenform: außen (-14) breiter als innen (+13)
  const AUSSEN=[[-24,-14],[24,-14],[20,13],[-20,13]];
  const OEFFN =[[-16,-11],[16,-11],[13,12],[-13,12]];

  ctx.save();
  ctx.translate(dp.x,dp.y);
  ctx.rotate(DOOR_ROT[d]);

  // Durchgang
  poly(OEFFN,'#07070a');
  // Bossräume glühen rot aus dem Spalt
  if(st.schein&&a>0.05){
    const g=ctx.createLinearGradient(0,-11,0,12);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(1,`rgba(192,58,90,${0.30*a})`);
    ctx.fillStyle=g; ctx.beginPath();
    ctx.moveTo(-16,-11);ctx.lineTo(16,-11);ctx.lineTo(13,12);ctx.lineTo(-13,12);
    ctx.closePath(); ctx.fill();
  }

  // Türblätter — schwenken beim Öffnen nach außen zur Seite weg
  if(a<0.98){
    const b=14*(1-a*0.88);        // sichtbare Blattbreite
    const weg=a*2.5;              // Versatz nach außen
    for(const s of [-1,1]){
      const x0=s*(0.8+weg), x1=s*(0.8+weg+b), x2=s*(0.8+weg+b*0.84);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(x0,-10.5); ctx.lineTo(x1,-11); ctx.lineTo(x2,11.5); ctx.lineTo(x0,11.5);
      ctx.closePath(); ctx.clip();
      ctx.fillStyle=st.blatt; ctx.fillRect(-30,-12,60,26);
      // Maserung / Beschläge
      ctx.fillStyle=st.blattTief;
      for(let y=-7;y<11;y+=6) ctx.fillRect(-30,y,60,1.2);
      ctx.fillStyle='rgba(255,255,255,0.10)';
      ctx.fillRect(-30,-11,60,1.5);
      ctx.restore();
      // Außenkante des Blattes betonen
      ctx.strokeStyle=st.blattTief; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x1,-11); ctx.lineTo(x2,11.5); ctx.stroke();
    }
    // Vorhängeschloss bei verschlossenen Türen
    if(e.locked){
      ctx.strokeStyle='#c8a032'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,-2.5,3.2,Math.PI,0); ctx.stroke();
      rrect(-4.5,-1,9,8,'#d4af37');
      rrect(-4.5,-1,9,2,'#f0d98a');
      disc(0,3,1.6,'#4a3a10');
      ctx.fillStyle='#4a3a10'; ctx.fillRect(-0.7,3,1.4,3);
    }
  }

  // Rahmen über die Blätter legen
  polyRing(AUSSEN,OEFFN,st.rahmen);
  // Lichtkante oben, Schattenkante unten
  poly([[-24,-14],[24,-14],[22,-11],[-22,-11]],st.hell);
  poly([[-20,11],[20,11],[20,13],[-20,13]],st.dunkel);
  // Steinfugen im Rahmen
  ctx.fillStyle=st.dunkel;
  ctx.fillRect(-21,-6,4.5,1.2); ctx.fillRect(16.5,-6,4.5,1.2);
  ctx.fillRect(-20,2,4,1.2);    ctx.fillRect(16,2,4,1.2);

  /* Typ-Verzierungen. Alles bleibt innerhalb von y >= -12: die untere
     Raumwand endet knapp am Bildrand, nach außen ragende Zierrat würde
     dort abgeschnitten. */
  if(e.kind==='boss'){                       // Schädel im Türsturz
    disc(0,-8,4.2,'#d8d0c0');
    rrect(-3,-6.5,6,2.6,'#d8d0c0');
    disc(-1.7,-8.5,1.2,'#241e1a'); disc(1.7,-8.5,1.2,'#241e1a');
    ctx.fillStyle='#241e1a';
    ctx.fillRect(-1.7,-5.2,0.9,1.8); ctx.fillRect(0.8,-5.2,0.9,1.8);
    disc(-18,-12,1.8,'#8a7a66'); disc(18,-12,1.8,'#8a7a66'); // Nieten
  } else if(e.kind==='schatz'){               // goldene Nieten
    for(const nx of [-18,-9,9,18]) disc(nx,-12,1.5,'#f0d98a');
  } else if(e.kind==='shop'){                 // Münze im Türsturz
    /* Die Münze sitzt so weit oben im Sturz, dass sie dem Vorhängeschloss
       nicht ins Gehege kommt — sonst verschwimmen beide zu einem Klecks. */
    disc(0,-9.6,4.4,'#3a2a12');
    disc(0,-9.6,3.7,'#a8862a');
    disc(0,-10,3.1,'#ffd75a');
    ctx.fillStyle='#8a6a1a';
    ctx.font='bold 6px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('¢',0,-9.4);
    for(const nx of [-18,18]) disc(nx,-12,1.5,'#d8a86a');
  } else if(e.kind==='devil'){                // zwei Hörner über dem Sturz
    ctx.fillStyle='#c8384c';
    for(const vz of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(vz*4,-6.5);
      ctx.quadraticCurveTo(vz*9,-9,vz*11,-13.5);
      ctx.quadraticCurveTo(vz*7.5,-9.5,vz*5.5,-6.5);
      ctx.closePath(); ctx.fill();
    }
    disc(0,-8.5,2.4,'#2a070c');               // Auge dazwischen
    disc(0,-8.5,1.1,'#ff5a5a');
    for(const nx of [-18,18]) disc(nx,-12,1.6,'#7a1a24');
  } else if(e.kind==='angel'){                // Heiligenschein und Federn
    for(const vz of [-1,1]){                  // angedeutete Flügel im Sturz
      ctx.fillStyle='#f2ecd8'; ctx.beginPath();
      ctx.moveTo(vz*7,-7);
      ctx.quadraticCurveTo(vz*15,-12,vz*20,-11.5);
      ctx.quadraticCurveTo(vz*14,-8,vz*8,-5.5);
      ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle='#ffe8a0'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.ellipse(0,-10,6.5,2.4,0,0,TAU); ctx.stroke();
    ctx.save(); ctx.globalAlpha=0.5;
    ctx.beginPath(); ctx.ellipse(0,-10,9,3.6,0,0,TAU); ctx.stroke(); ctx.restore();
  } else if(e.kind==='curse'){                // Zähne, die in die Öffnung ragen
    ctx.fillStyle='#b0b0b8';
    for(let i=-2;i<=2;i++){ const x=i*7;
      ctx.beginPath(); ctx.moveTo(x-2.6,-11.5); ctx.lineTo(x,-5.5); ctx.lineTo(x+2.6,-11.5);
      ctx.closePath(); ctx.fill(); }
  } else if(e.kind==='secret'){               // aufgesprengter Mauerriss
    ctx.strokeStyle='#1c1c22'; ctx.lineWidth=1.4;
    ctx.beginPath();
    ctx.moveTo(-21,-11); ctx.lineTo(-13,-7); ctx.lineTo(-17,-1); ctx.lineTo(-9,4);
    ctx.moveTo(21,-11);  ctx.lineTo(14,-6);  ctx.lineTo(18,0);   ctx.lineTo(10,5);
    ctx.stroke();
    for(const bx of [-19,-8,9,19]) disc(bx,10,1.3,'#1c1c22'); // Schutt
  }
  ctx.restore();
}

/* --- Spielfigur -----------------------------------------------------------
   Großer runder Kopf auf kleinem Körper, Beine treten im Laufen abwechselnd,
   die Pupillen folgen der Schussrichtung. Die Frisur unterscheidet die
   Charaktere und wird über `frisur` in CHARS gewählt.
   Die Funktion wird auch von der Charakterauswahl benutzt, damit Vorschau
   und Spielfigur garantiert gleich aussehen.                                */
function zeichneFrisur(c,x,ky,schritt){
  const haar=c.haar||c.hood;
  ctx.fillStyle=haar;
  if(c.frisur==='stachel'){                       // kurze Stacheln
    for(let i=-2;i<=2;i++){
      const bx=x+i*3.0;
      ctx.beginPath();
      ctx.moveTo(bx-2.3, ky-5.0);
      ctx.lineTo(bx+i*0.6, ky-11.0+Math.abs(i)*1.7);
      ctx.lineTo(bx+2.3, ky-5.0);
      ctx.closePath(); ctx.fill();
    }
    ctx.beginPath(); ctx.ellipse(x,ky-4.8,8.2,3.8,0,0,TAU); ctx.fill();
  } else if(c.frisur==='zotteln'){                // Zotteln mit wippenden Büscheln
    ctx.beginPath(); ctx.ellipse(x,ky-4.4,8.7,4.6,0,0,TAU); ctx.fill();
    for(const s of [-1,1]){
      ctx.beginPath();
      ctx.ellipse(x+s*7.8, ky-1.0+schritt*s*0.9, 2.7, 4.6, s*0.32, 0, TAU);
      ctx.fill();
    }
    ctx.fillStyle='rgba(0,0,0,0.18)';             // Ponyfransen
    for(let i=-2;i<=2;i++) ctx.fillRect(x+i*3.1-0.6, ky-7.4, 1.2, 3.2);
  } else if(c.frisur==='schleier'){               // geisterhafte Schleier
    ctx.globalAlpha=0.8;
    ctx.beginPath(); ctx.ellipse(x,ky-4.8,8.5,4.2,0,0,TAU); ctx.fill();
    for(const s of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(x+s*7.4, ky-4);
      ctx.quadraticCurveTo(x+s*11.2, ky+2, x+s*6.8, ky+7.5);
      ctx.quadraticCurveTo(x+s*5.8, ky+1, x+s*5.4, ky-3);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha=1;
  } else if(c.frisur==='struppig'){               // wirrer Schopf mit Strähnen
    ctx.beginPath(); ctx.ellipse(x,ky-4.6,9.0,5.0,0,0,TAU); ctx.fill();
    for(let i=-3;i<=3;i++){
      const bx=x+i*2.6, l=4.5+((i*7)%3)*1.8;
      ctx.beginPath();
      ctx.moveTo(bx-1.4,ky-7.4);
      ctx.quadraticCurveTo(bx+i*1.3,ky-8-l,bx+i*2.1,ky-6.4-l);
      ctx.quadraticCurveTo(bx+i*0.6,ky-8.6,bx+1.4,ky-7.4);
      ctx.fill();
    }
  } else if(c.frisur==='dornenkrone'){            // Lockenschopf unter Rosenkranz
    ctx.beginPath(); ctx.ellipse(x,ky-3.6,9.2,5.6,0,0,TAU); ctx.fill();
    for(const s of [-1,1]){                       // lange Locken seitlich
      ctx.beginPath();
      ctx.ellipse(x+s*8.0,ky+2.2+schritt*s*0.7,2.6,5.4,s*0.24,0,TAU); ctx.fill();
    }
    ctx.strokeStyle='#3f5a2e'; ctx.lineWidth=1.3; // Dornenranke
    ctx.beginPath(); ctx.arc(x,ky-4.0,8.6,Math.PI*1.06,Math.PI*1.94); ctx.stroke();
    for(let i=-2;i<=2;i++){                       // schwarze Rosen
      const a=Math.PI*1.5+i*0.34;
      const rx=x+Math.cos(a)*8.6, ry=ky-4.0+Math.sin(a)*8.6;
      disc(rx,ry,1.9,'#241820'); disc(rx,ry,0.8,'#4a2a3a');
    }
  } else if(c.frisur==='hornkapuze'){             // Kapuze mit Hörnern und Fransen
    ctx.beginPath(); ctx.arc(x,ky-0.6,8.9,Math.PI*1.00,Math.PI*2.00); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x,ky-6.0,8.5,3.8,0,0,TAU); ctx.fill();
    for(const s of [-1,1]){                       // Hörner
      ctx.beginPath();
      ctx.moveTo(x+s*6.2,ky-6.0);
      ctx.quadraticCurveTo(x+s*13.5,ky-11.5,x+s*11.0,ky-16.5);
      ctx.quadraticCurveTo(x+s*11.6,ky-10.0,x+s*5.0,ky-7.6);
      ctx.fill();
    }
    ctx.globalAlpha=0.75;                         // tropfende Fransen
    for(let i=-2;i<=2;i++){
      const bx=x+i*3.4, l=3.5+((i+2)%3)*2.4;
      ctx.fillRect(bx-0.8,ky-2.5,1.6,l);
    }
    ctx.globalAlpha=1;
  } else if(c.frisur==='moospelz'){               // Moospolster
    ctx.beginPath(); ctx.ellipse(x,ky-4.0,9.4,5.6,0,0,TAU); ctx.fill();
    ctx.fillStyle='#5f8340';
    for(let i=0;i<9;i++){
      const a=Math.PI*1.05+i*0.11;
      disc(x+Math.cos(a)*8.6,ky-4.0+Math.sin(a)*6.0,1.9,'#5f8340');
    }
    ctx.fillStyle=haar;
    for(const s of [-1,1]){                       // Moosbart seitlich
      ctx.beginPath();
      ctx.ellipse(x+s*8.2,ky+3.0+schritt*s*0.6,2.4,4.6,s*0.2,0,TAU); ctx.fill();
    }
  } else if(c.frisur==='wollhaar'){               // bunte Wollstränge
    const faerbe=['#b8503a','#c8a03a','#4a8a6a','#5a6ab0','#a04a7a'];
    ctx.beginPath(); ctx.ellipse(x,ky-4.4,8.8,4.8,0,0,TAU); ctx.fill();
    for(let i=-3;i<=3;i++){
      ctx.fillStyle=faerbe[(i+3)%faerbe.length];
      const bx=x+i*2.6, l=5.0+((i+3)%3)*2.2;
      ctx.beginPath();
      ctx.moveTo(bx-1.2,ky-6.6);
      ctx.quadraticCurveTo(bx+i*1.6,ky-8-l,bx+i*2.4,ky-6.0-l);
      ctx.quadraticCurveTo(bx+i*0.4,ky-8.4,bx+1.2,ky-6.6);
      ctx.fill();
    }
    ctx.fillStyle=haar;
  } else {                                        // Kapuze
    ctx.beginPath(); ctx.arc(x,ky-0.6,8.7,Math.PI*1.00,Math.PI*2.00); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x,ky-6.0,8.3,3.6,0,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(x,ky-4.6,8.0,2.0,0,0,TAU); ctx.fill();
  }
}

function zeichneCharakter(c,x,y,z){
  const schritt=z.schritt||0, aim=z.aim||{x:0,y:1};
  const ky=y-9-(z.hub||0);          // Kopfmitte
  const by=y+1-(z.hub||0)*0.4;      // Körpermitte

  if(!z.schwebt){                   // Beine
    ctx.fillStyle=c.hood;
    for(const s of [-1,1]){
      const versatz=(s>0?schritt:-schritt)*1.7;
      ctx.beginPath(); ctx.ellipse(x+s*3.3, y+7+versatz, 2.5, 3.1, 0,0,TAU); ctx.fill();
    }
  } else {                          // Schweif statt Beine
    ctx.fillStyle=c.hood; ctx.globalAlpha=0.55;
    ctx.beginPath();
    ctx.moveTo(x-5, by+2);
    ctx.quadraticCurveTo(x-3, y+10, x, y+8);
    ctx.quadraticCurveTo(x+3, y+10, x+5, by+2);
    ctx.closePath(); ctx.fill(); ctx.globalAlpha=1;
  }

  // Körper
  ctx.fillStyle=c.hood;
  ctx.beginPath(); ctx.ellipse(x, by+2, 5.3, 5.7, 0,0,TAU); ctx.fill();
  // Arme
  if(z.armeHoch){
    ctx.fillStyle=c.color;
    for(const s of [-1,1]){
      ctx.beginPath(); ctx.ellipse(x+s*5.4, by-4.5, 2.0, 4.2, s*0.45, 0, TAU); ctx.fill();
    }
  } else {
    disc(x-5.6, by+1.5, 2.1, c.color);
    disc(x+5.6, by+1.5, 2.1, c.color);
  }

  // Kopf mit weicher Schattierung
  disc(x, ky, 8.5, c.color);
  ctx.fillStyle='rgba(0,0,0,0.10)';
  ctx.beginPath(); ctx.ellipse(x, ky+3.6, 7.4, 4.0, 0,0,TAU); ctx.fill();

  // Augen: Pupillen folgen der Schussrichtung
  const px0=clamp(aim.x,-1,1)*1.8, py0=clamp(aim.y,-1,1)*1.5;
  if(c.zier!=='knopfaugen') for(const s of [-1,1]){
    const ex=x+s*3.5, ey=ky-0.4;
    if(z.blinzelt){ ctx.fillStyle='#2a2028'; ctx.fillRect(ex-2.3, ey-0.4, 4.6, 1.3); }
    else {
      disc(ex, ey, 2.7, '#f6f0f2');
      disc(ex+px0, ey+py0, 1.5, '#241c22');
      disc(ex+px0-0.5, ey+py0-0.6, 0.55, '#ffffff');
    }
  }
  // Mund: normal ein Strich, bei Schaden aufgerissen
  if(c.zier==='knopfaugen'){ /* Nahtmund kommt in zeichneZier */ }
  else if(z.wehklagt){ disc(x, ky+4.8, 2.0, '#2a2028'); }
  else { ctx.fillStyle='#2a2028'; ctx.fillRect(x-1.7, ky+4.5, 3.4, 1.1); }

  if(c.zier) zeichneZier(c,x,ky,by,z);
  zeichneFrisur(c,x,ky,schritt);
}

/* Was eine Figur außerdem am Leib trägt. Steht bewusst getrennt von der
   Frisur: Brille und Türbrett gehören aufs Gesicht, Haare darüber. */
function zeichneZier(c,x,ky,by,z){
  if(c.zier==='brille'){                          // dicke Schweißerbrille
    for(const s of [-1,1]){
      const ex=x+s*3.6;
      ctx.strokeStyle='#6e6a62'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.arc(ex,ky-0.4,3.6,0,TAU); ctx.stroke();
      ctx.save(); ctx.globalAlpha=0.34; disc(ex,ky-0.4,3.2,'#bfe8ff'); ctx.restore();
      ctx.save(); ctx.globalAlpha=0.6;             // Spiegelung im Glas
      ctx.strokeStyle='#ffffff'; ctx.lineWidth=0.9;
      ctx.beginPath(); ctx.moveTo(ex-2.2,ky+0.8); ctx.lineTo(ex+0.4,ky-2.4); ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle='#6e6a62'; ctx.fillRect(x-1.4,ky-1.2,2.8,1.4);
    // Blechfaust am linken Arm
    disc(x-6.4,by+1.8,2.7,'#8a8880');
    ctx.strokeStyle='#5a5850'; ctx.lineWidth=0.9;
    ctx.beginPath(); ctx.arc(x-6.4,by+1.8,1.5,0,TAU); ctx.stroke();
  }
  else if(c.zier==='tuerbrett'){                  // Brett vor der rechten Gesichtshälfte
    ctx.save();
    ctx.beginPath(); ctx.arc(x,ky,8.5,0,TAU); ctx.clip();
    ctx.fillStyle='#7a5a38'; ctx.fillRect(x+0.6,ky-9,9,18);
    ctx.fillStyle='rgba(0,0,0,0.22)';
    for(let i=0;i<3;i++) ctx.fillRect(x+2.4+i*2.6,ky-9,0.9,18);
    ctx.restore();
    ctx.strokeStyle='#4a3320'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x+0.9,ky-8.2); ctx.lineTo(x+0.9,ky+8.2); ctx.stroke();
    disc(x+5.4,ky-0.6,1.5,'#1d1410');             // Astloch als Guckloch
    // das freie Auge glüht violett
    ctx.save(); tuscheAn=false; ctx.globalAlpha=0.45;
    disc(x-3.5,ky-0.4,4.0,'#a86ad8'); tuscheAn=true; ctx.restore();
    disc(x-3.5,ky-0.4,1.7,'#c88aff');
  }
  else if(c.zier==='laterne'){                    // grüne Laterne in der Hand
    const px=x+7.6, py=by+3.2;
    ctx.save(); tuscheAn=false;
    ctx.globalAlpha=0.20; disc(px,py,9,'#7affc0');
    ctx.globalAlpha=0.34; disc(px,py,5,'#7affc0');
    tuscheAn=true; ctx.restore();
    ctx.strokeStyle='#8a8272'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(px,py-4.2,2.2,Math.PI,0); ctx.stroke();
    ctx.fillStyle='#6e6a5e'; ctx.fillRect(px-2.6,py-2.6,5.2,1.2);
    ctx.fillStyle='#7affc0'; ctx.fillRect(px-2.0,py-1.4,4.0,4.0);
    ctx.fillStyle='#e8fff0'; ctx.fillRect(px-0.9,py-0.4,1.8,1.8);
    ctx.fillStyle='#6e6a5e'; ctx.fillRect(px-2.6,py+2.6,5.2,1.2);
  }
  else if(c.zier==='pilze'){                      // leuchtende Hütchen im Moos
    for(const [dx,dy,r] of [[-5.6,-9.4,2.2],[0.4,-11.4,2.7],[5.4,-9.0,2.0]]){
      ctx.fillStyle='#e8dcc0'; ctx.fillRect(x+dx-0.6,ky+dy,1.2,2.6);
      ctx.fillStyle='#c8642a';
      ctx.beginPath(); ctx.ellipse(x+dx,ky+dy,r,r*0.72,0,Math.PI,TAU); ctx.fill();
      ctx.save(); tuscheAn=false;
      ctx.globalAlpha=0.26+Math.sin(performance.now()/420+dx)*0.14;
      disc(x+dx,ky+dy-0.6,r*1.9,'#ffd07a');
      tuscheAn=true; ctx.restore();
    }
  }
  else if(c.zier==='knopfaugen'){                 // Knöpfe statt Augen, Nähte
    for(const s of [-1,1]){
      const ex=x+s*3.5, ey=ky-0.4;
      disc(ex,ey,2.8,'#e8e2d4'); disc(ex,ey,2.1,'#c9c0ae');
      ctx.fillStyle='#4a4238';
      for(const [ox,oy] of [[-0.8,-0.8],[0.8,-0.8],[-0.8,0.8],[0.8,0.8]])
        ctx.fillRect(ex+ox-0.35,ey+oy-0.35,0.7,0.7);
      ctx.strokeStyle='#4a4238'; ctx.lineWidth=0.6;
      ctx.beginPath(); ctx.moveTo(ex-0.8,ey-0.8); ctx.lineTo(ex+0.8,ey+0.8);
      ctx.moveTo(ex+0.8,ey-0.8); ctx.lineTo(ex-0.8,ey+0.8); ctx.stroke();
    }
    ctx.strokeStyle='#6a5a48'; ctx.lineWidth=0.8; // Nahtmund
    ctx.beginPath(); ctx.moveTo(x-3.2,ky+4.8); ctx.lineTo(x+3.2,ky+4.8); ctx.stroke();
    for(let i=-2;i<=2;i++){
      ctx.beginPath(); ctx.moveTo(x+i*1.5,ky+3.7); ctx.lineTo(x+i*1.5,ky+5.9); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(x+2.0,ky-6.4); ctx.lineTo(x+5.4,ky-3.6); ctx.stroke();
    for(let i=0;i<3;i++){
      const t=i/2;
      ctx.beginPath();
      ctx.moveTo(x+2.0+t*3.4-0.9,ky-6.4+t*2.8-0.9);
      ctx.lineTo(x+2.0+t*3.4+0.9,ky-6.4+t*2.8+0.9); ctx.stroke();
    }
  }
}

function drawPlayer(p){
  if(p.dead) return;
  if(p.iframes>0&&Math.floor(p.iframes*12)%2===0&&!p.itemGet) return; // Blinken
  const c=p.char;
  const geht=Math.hypot(p.vx,p.vy)>12;
  const takt=p.anim*11;
  const schwebt=c.id==='schemen'||p.flags.has('flight');
  const hub=schwebt?Math.sin(p.anim*3)*1.6:(geht?Math.abs(Math.sin(takt))*1.3:0);
  // gelegentliches Blinzeln
  const bz=(p.anim*0.8)%5;
  shadow(p.x,p.y+10,schwebt?6:7.5);
  zeichneCharakter(c,p.x,p.y,{
    schritt:geht?Math.sin(takt):0, hub, aim:p.aimDir, schwebt,
    armeHoch:!!p.itemGet, wehklagt:p.hitFlash>0, blinzelt:bz<0.12});

  if(p.shield>0) ring(p.x,p.y-5,15,`rgba(120,200,255,${0.4+Math.sin(p.anim*12)*0.2})`,2);
  // Höllenstrahl-Ladeanzeige
  if(p.flags.has('beam')&&p.beamCharge>0){
    rrect(p.x-8,p.y-24,16,3,'#222');
    rrect(p.x-8,p.y-24,16*p.beamCharge,3,p.beamCharge>=1?'#ff5a3a':'#e8862a');
  }
  if(p.itemGet) drawItemIcon(p.itemGet.id,p.x,p.y-28,1.3);
}

function drawFamiliar(f){
  shadow(f.x,f.y+7,5);
  if(f.kind==='shadow'){ disc(f.x,f.y-3,6,'#2a2a3a'); disc(f.x-2,f.y-4,1.2,'#8ab4e8'); disc(f.x+2,f.y-4,1.2,'#8ab4e8'); }
  if(f.kind==='orbit'){ disc(f.x,f.y,5,'#8ab4e8'); ring(f.x,f.y,5,'#3a5a8a',1.5); }
  if(f.kind==='bug'){ disc(f.x,f.y,5,'#5a7a2a'); disc(f.x-2,f.y-2,1,'#111'); disc(f.x+2,f.y-2,1,'#111'); }
  if(f.kind==='rat'){ disc(f.x,f.y-2,5,'#8a8276'); disc(f.x+4,f.y-4,2,'#8a8276'); disc(f.x-2,f.y-3,1,'#111'); }
  if(f.kind==='bird'){ const fl=Math.sin(performance.now()/80)*2;
    disc(f.x,f.y+fl,5,'#b0684a'); ctx.fillStyle='#8a4a2a';
    ctx.beginPath();ctx.moveTo(f.x-5,f.y+fl);ctx.lineTo(f.x-10,f.y-3+fl);ctx.lineTo(f.x-4,f.y-3+fl);ctx.fill();
    disc(f.x+2,f.y-1+fl,1,'#111'); }
  if(f.kind==='frostgeist'){                    // schwebender Eisgeist
    const fl=Math.sin(performance.now()/300)*1.5;
    ctx.globalAlpha=0.85;
    disc(f.x,f.y-3+fl,6,'#bfe8ff');
    ctx.fillStyle='#bfe8ff';                    // ausgefranster Schweif
    ctx.beginPath(); ctx.moveTo(f.x-6,f.y-2+fl);
    ctx.lineTo(f.x-4,f.y+6+fl); ctx.lineTo(f.x,f.y+3+fl);
    ctx.lineTo(f.x+4,f.y+6+fl); ctx.lineTo(f.x+6,f.y-2+fl); ctx.fill();
    ctx.globalAlpha=1;
    disc(f.x-2,f.y-4+fl,1.1,'#2a4a6a'); disc(f.x+2,f.y-4+fl,1.1,'#2a4a6a');
  }
  if(f.kind==='motte'){                         // Glutmotte mit Flügelschlag
    const w=Math.sin(performance.now()/45)*3;
    ctx.fillStyle='rgba(255,190,110,0.55)';
    ctx.beginPath(); ctx.ellipse(f.x-5,f.y-2-w*0.3,4.5,2.6,-0.5,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(f.x+5,f.y-2+w*0.3,4.5,2.6, 0.5,0,TAU); ctx.fill();
    disc(f.x,f.y,3.6,'#c8681f'); disc(f.x,f.y-2,2.4,'#ff9a3a');
    disc(f.x-1.2,f.y-2.6,0.8,'#2a1a0a'); disc(f.x+1.2,f.y-2.6,0.8,'#2a1a0a');
  }
  if(f.kind==='panzer'){                        // Schildpanzer, blitzt beim Block
    const hell=f.blockT>0;
    disc(f.x,f.y,7.5,hell?'#ffffff':'#8a8276');
    disc(f.x,f.y-1,6,hell?'#e8e0d0':'#a9a294');
    ctx.strokeStyle=hell?'#ffffff':'#6a6459'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(f.x,f.y-1,6,0,TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(f.x,f.y-7); ctx.lineTo(f.x,f.y+5); ctx.stroke();
    disc(f.x-2.5,f.y+1,1,'#3a3630'); disc(f.x+2.5,f.y+1,1,'#3a3630');
  }
  if(f.kind==='spaeher'){                       // fliegendes Auge
    const fl=Math.sin(performance.now()/200)*1.2;
    disc(f.x,f.y+fl,6,'#e8e0d8');
    const p=G.player, a=Math.atan2(f.vy||0,f.vx||1);
    disc(f.x,f.y+fl,3.2,'#6a9ac0'); disc(f.x,f.y+fl,1.6,'#111');
    ctx.strokeStyle='rgba(200,220,240,0.6)'; ctx.lineWidth=1.2;   // Flügelchen
    const w=Math.sin(performance.now()/50)*2.5;
    ctx.beginPath(); ctx.moveTo(f.x-5,f.y-3+fl); ctx.lineTo(f.x-10,f.y-6-w+fl);
    ctx.moveTo(f.x+5,f.y-3+fl); ctx.lineTo(f.x+10,f.y-6-w+fl); ctx.stroke();
  }
}

/* Gestapelte Wülste mit Spitze — Grundform für Kotkrabbler, Kotspritzer
   und den Kloakenfürsten. r ist der Radius des untersten Wulstes. */
function drawKot(x,y,r,hell,dunkel){
  // Jeder Wulst: dunkle Grundscheibe, darüber die hellere versetzt — der
  // stehenbleibende dunkle Rand unten trennt die Wülste sichtbar voneinander.
  disc(x, y+r*0.46, r,       dunkel);
  disc(x, y+r*0.31, r*0.90,  hell);
  disc(x, y-r*0.14, r*0.74,  dunkel);
  disc(x, y-r*0.28, r*0.65,  hell);
  disc(x, y-r*0.62, r*0.48,  dunkel);
  disc(x, y-r*0.74, r*0.40,  hell);
  ctx.fillStyle=dunkel;                     // umgeknickte Spitze
  ctx.beginPath();
  ctx.moveTo(x-r*0.26, y-r*0.96);
  ctx.quadraticCurveTo(x+r*0.14, y-r*1.66, x+r*0.36, y-r*1.02);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle=hell;
  ctx.beginPath();
  ctx.moveTo(x-r*0.16, y-r*1.00);
  ctx.quadraticCurveTo(x+r*0.12, y-r*1.52, x+r*0.28, y-r*1.06);
  ctx.closePath(); ctx.fill();
  // Glanzlicht oben links
  ctx.fillStyle='rgba(255,255,255,0.16)';
  ctx.beginPath(); ctx.ellipse(x-r*0.30,y-r*0.80,r*0.16,r*0.10,-0.5,0,TAU); ctx.fill();
}

function drawEnemy(e){
  const alpha=e.ghosted?0.25:1;
  ctx.save(); ctx.globalAlpha=alpha;
  if(!e.fly&&!e.ghosted) shadow(e.x,e.y+e.r*0.8,e.r*0.8);
  else if(e.fly) shadow(e.x,e.y+e.r+6,e.r*0.6);
  const y=e.y-(e.z||0);
  let body='#a05a5a';
  const T=e.type;
  const flash=e.flash>0;
  const tint=e.champ?e.champ.tint:null;
  const col=c=>flash?'#ffffff':(tint||c);
  switch(T){
    /* --- Die zwölf Neuen ------------------------------------------- */
    case 'nabelkind': {
      if(!e.gefallen){                            // Schnur zur Decke
        ctx.strokeStyle='#6e2530'; ctx.lineWidth=2.6;
        ctx.beginPath(); ctx.moveTo(e.ankerX||e.x,RY-10);
        ctx.quadraticCurveTo((e.ankerX||e.x)+(e.x-(e.ankerX||e.x))*0.4,y-40,e.x,y-e.r);
        ctx.stroke();
      }
      fleisch(e.x,y,e.r,e.r*1.05,0,col('#d9b9a6'),col('#b98f7c'),'#4a2a26');
      hohlauge(e.x-e.r*0.34,y-e.r*0.1,e.r*0.19,'#ffd07a',0.8);
      hohlauge(e.x+e.r*0.34,y-e.r*0.16,e.r*0.19,'#ffd07a',0.8);
      zaehneSpiel(e.x,y+e.r*0.5,e.r*0.8,7,e.r*0.26,true,'#efe4cc');
      break; }
    case 'haeutling': {
      fleisch(e.x,y,e.r*0.85,e.r*1.15,0,col('#c8555c'),col('#8e2b34'),'#3a0e14');
      ctx.strokeStyle='#5e1219'; ctx.lineWidth=1.2;
      for(let i=-1;i<=1;i++){ ctx.beginPath();
        ctx.moveTo(e.x+i*4,y-e.r*0.8); ctx.lineTo(e.x+i*4.6,y+e.r*0.8); ctx.stroke(); }
      disc(e.x,y-e.r*1.05,e.r*0.68,col('#a33c44'));
      hohlauge(e.x-e.r*0.28,y-e.r*1.1,e.r*0.17,'#ff8a6a',0.9);
      hohlauge(e.x+e.r*0.28,y-e.r*1.1,e.r*0.17,'#ff8a6a',0.9);
      break; }
    case 'vielauge': {
      fleisch(e.x,y,e.r,e.r*1.06,0,col('#9a8ea8'),col('#6a5d7c'),'#241c30');
      for(let i=0;i<9;i++){
        const a=i*2.399, d=Math.sqrt(i/9)*e.r*0.72;
        const ax=e.x+Math.cos(a)*d, ay=y+Math.sin(a)*d*0.95;
        const auf=(Math.sin(performance.now()/700+i*1.7)+1)/2;
        if(auf>0.28){
          disc(ax,ay,e.r*0.2,'#efe8d8');
          disc(ax+Math.cos(performance.now()/900+i)*1.3,
               ay+Math.sin(performance.now()/900+i)*1.3,e.r*0.09,'#1a1420');
        } else { ctx.strokeStyle='#3a2f46'; ctx.lineWidth=1.6;
          ctx.beginPath(); ctx.moveTo(ax-e.r*0.18,ay); ctx.lineTo(ax+e.r*0.18,ay); ctx.stroke(); }
      }
      break; }
    case 'zwillingsbalg': {
      fleisch(e.x,y+e.r*0.3,e.r*0.95,e.r*0.82,0,col('#b9a98e'),col('#8a7a60'),'#332a1e');
      for(const [vz,gl] of [[-1,'#8affa0'],[1,'#ff8a8a']]){
        const aktiv=(vz<0)===!e.kopf;
        fleisch(e.x+vz*e.r*0.46,y-e.r*0.5,e.r*0.46,e.r*0.5,0,

        hohlauge(e.x+vz*e.r*0.28,y-e.r*0.56,e.r*0.15,gl,aktiv?1:0.3);

      }
      break; }
    case 'schlundmutter': {

    case 'fingerbaum': {

    case 'grabhusten': {

    case 'nagelbraut': {

    case 'laugenkriecher': {                 // Schnecke, die Lauge absondert

      hohlauge(e.x-e.r*0.22,y+e.r*0.05,e.r*0.15,aus?'#5a4a3a':'#ff9a2a',aus?0.3:0.9);

function drawBossSprite(e,y,col){
  const d=e.def, base=col(d.color);
  /* Alle Maße hängen an s: ein anderer Radius zieht die ganze Zeichnung
     mit, statt einen Riesen mit winzigen Augen zu ergeben. */
  const s=e.r/20;
  if(e.ai==='matsch'){
    disc(e.x,y,e.r,base);disc(e.x,y-4*s,e.r*0.75,col('#94b455'));
    disc(e.x-7*s,y-4*s,3*s,'#111');disc(e.x+7*s,y-4*s,3*s,'#111');
    ctx.fillStyle='#3a4a1f';ctx.fillRect(e.x-8*s,y+6*s,16*s,3*s); // Maul
    // Krone (eigene Erfindung: Schlammklumpen-Krone)
    ctx.fillStyle=col('#d4af37');
    ctx.beginPath();ctx.moveTo(e.x-10*s,y-e.r+2*s);ctx.lineTo(e.x-10*s,y-e.r-6*s);
    ctx.lineTo(e.x-5*s,y-e.r);ctx.lineTo(e.x,y-e.r-8*s);ctx.lineTo(e.x+5*s,y-e.r);
    ctx.lineTo(e.x+10*s,y-e.r-6*s);ctx.lineTo(e.x+10*s,y-e.r+2*s);ctx.fill();
  } else if(e.ai==='auge'){
    disc(e.x,y,e.r,col('#d8d0c8'));
    disc(e.x,y,e.r*0.55,base);disc(e.x,y,e.r*0.25,'#111');
    disc(e.x-3*s,y-3*s,2*s,'#fff');
    for(let i=0;i<6;i++){const a=i*TAU/6+performance.now()/600;

  } else if(e.ai==='gift'){

  } else if(e.ai==='herz'){

  } else if(e.ai==='kloake'){

    disc(e.x-8*s+ax*1.6*s,y-5*s+ay*1.6*s,2.1*s,'#111');
    disc(e.x+8*s+ax*1.6*s,y-5*s+ay*1.6*s,2.1*s,'#111');
    // grinsendes Maul
    ctx.strokeStyle='#2e2114'; ctx.lineWidth=2*s;
    ctx.beginPath(); ctx.arc(e.x,y+2*s,6*s,0.25,Math.PI-0.25); ctx.stroke();
    // Fliegenschwarm als Krone — hell genug, um sich vom Boden abzuheben
    for(let i=0;i<5;i++){ const a=performance.now()/280+i*TAU/5;

      }
    }
  } else if(e.ai==='vater'){
    // Endboss: vermummte Riesengestalt
    ctx.fillStyle=e.flash>0?'#fff':d.color;
    ctx.beginPath();ctx.moveTo(e.x-e.r,y+e.r*0.8);ctx.quadraticCurveTo(e.x-e.r,y-e.r,e.x,y-e.r);
    ctx.quadraticCurveTo(e.x+e.r,y-e.r,e.x+e.r,y+e.r*0.8);ctx.fill();
    disc(e.x,y-e.r*0.5,e.r*0.5,e.flash>0?'#fff':'#26263d');

    for(let i=0;i<3;i++){const sw=Math.sin(performance.now()/300+i*2)*4;
      disc(e.x-e.r*0.6+i*e.r*0.6,y+e.r*0.8+4*s,(5+sw*0.3)*s,e.flash>0?'#fff':'#26263d');}

  /* --- Die fünf Großen ---------------------------------------------- */
  } else if(e.ai==='mutter'){
    const atem=1+Math.sin(performance.now()/900)*0.04;
    for(let i=0;i<6;i++){                       // Arme rundherum
      const a=-Math.PI/2+(i-2.5)*0.92+Math.sin(performance.now()/700+i)*0.18;

    fleisch(e.x,y+e.r*0.1,e.r*atem,e.r*0.88*atem,0,col('#c49a88'),col('#8e6656'),'#2e1a16');
    ellipse(e.x,y+e.r*0.3,e.r*0.52,e.r*0.36,0,'#3a1a18');   // offener Leib
    for(let i=0;i<5;i++){

    }
    zaehneSpiel(e.x,y-e.r*0.06,e.r*1.6,13,e.r*0.17,true,'#efe4cc');
    fleisch(e.x,y-e.r*0.9,e.r*0.4,e.r*0.36,0,col('#d8b0a0'),col('#a07a6a'),'#38201c');
    hohlauge(e.x-e.r*0.17,y-e.r*0.95,e.r*0.1,'#ff9a5a',1);
    hohlauge(e.x+e.r*0.17,y-e.r*0.95,e.r*0.1,'#ff9a5a',1);
  } else if(e.ai==='schlund'){
    const saug=0.7+Math.sin(performance.now()/700)*0.3;
    ellipse(e.x,y+e.r*0.1,e.r*1.9,e.r*0.95,0,'#2a1a16');
    ellipse(e.x,y+e.r*0.16,e.r*1.5*saug,e.r*0.75*saug,0,'#120608');
    if(e.state===1){                            // Zunge
      const l=e.r*2.2, a=e.zungeA||0;
      ctx.strokeStyle=col('#a03a48'); ctx.lineWidth=e.r*0.22; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(e.x,y); ctx.lineTo(e.x+Math.cos(a)*l,y+Math.sin(a)*l);
      ctx.stroke(); ctx.lineCap='butt';
      disc(e.x+Math.cos(a)*l,y+Math.sin(a)*l,e.r*0.2,col('#c85a66'));
    }
    zaehneSpiel(e.x,y-e.r*0.5,e.r*2.7,15,e.r*0.44,true,'#efe4cc');
    zaehneSpiel(e.x,y+e.r*0.78,e.r*2.5,13,e.r*0.4,false,'#efe4cc');
    for(let i=0;i<10;i++){                       // Augenkranz rund um das Maul
      const a=i*TAU/10+0.31;
      hohlauge(e.x+Math.cos(a)*e.r*1.72,y+e.r*0.1+Math.sin(a)*e.r*0.86,e.r*0.12,
               '#ffb05a',0.6+Math.sin(performance.now()/400+i)*0.4);

  } else if(e.ai==='haenger'){

    ctx.strokeStyle='#8a7a5a'; ctx.lineWidth=e.r*0.11;   // Strick zur Decke
    ctx.beginPath(); ctx.moveTo(e.x-kip*80,RY-20); ctx.lineTo(e.x,y-e.r*1.5); ctx.stroke();

    ctx.strokeStyle=col('#6e6248'); ctx.lineWidth=e.r*0.16; ctx.lineCap='round';
    for(const vz of [-1,1]){                     // schlaffe Arme
      ctx.beginPath(); ctx.moveTo(vz*e.r*0.55,-e.r*0.35);
      ctx.quadraticCurveTo(vz*e.r*1.1,e.r*0.6,vz*e.r*0.9,e.r*1.7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(vz*e.r*0.28,e.r*1.35);
      ctx.lineTo(vz*e.r*0.46,e.r*2.3); ctx.stroke();
    }
    ctx.lineCap='butt';
    fleisch(0,e.r*0.15,e.r*0.7,e.r*1.5,0,col('#b8ac92'),col('#84785e'),'#2a2418');
    fleisch(0,-e.r*1.3,e.r*0.66,e.r*0.6,0,col('#cfc2a4'),col('#9a8c70'),'#2a2418');
    ctx.strokeStyle='#6a5c40'; ctx.lineWidth=e.r*0.12;
    ctx.beginPath(); ctx.moveTo(-e.r*0.6,-e.r*1.72); ctx.lineTo(e.r*0.6,-e.r*1.72); ctx.stroke();
    hohlauge(-e.r*0.26,-e.r*1.36,e.r*0.16,'#9affc0',0.9);
    hohlauge( e.r*0.26,-e.r*1.36,e.r*0.16,'#9affc0',0.9);
    zaehneSpiel(0,-e.r*1.02,e.r*0.62,6,e.r*0.2,true,'#e8dcc0');
    ctx.restore();
  } else if(e.ai==='made'){
    if(e.ghosted){                               // eingegraben: nur der Hügel
      ctx.save(); ctx.globalAlpha=0.7;
      ellipse(e.x,y+e.r*0.2,e.r*0.9,e.r*0.42,0,'#4a3a28');
      ellipse(e.x,y+e.r*0.05,e.r*0.6,e.r*0.26,0,'#6a5038');
      ctx.restore();
      return;
    }
    const welle=(i)=>Math.sin(performance.now()/300-i*0.6)*e.r*0.2;
    for(let i=6;i>=1;i--)
      fleisch(e.x-i*e.r*0.52,y+welle(i),e.r*0.52-i*e.r*0.026,e.r*0.44-i*e.r*0.02,0,
              col('#e8c8b0'),col('#c09a80'),'#4a3028');
    fleisch(e.x,y+welle(0),e.r*0.72,e.r*0.64,0,col('#f0d4bc'),col('#c8a288'),'#4a3028');
    ellipse(e.x+e.r*0.28,y+welle(0),e.r*0.3,e.r*0.34,0,'#2a0e12');
    zaehneSpiel(e.x+e.r*0.28,y+welle(0)-e.r*0.32,e.r*0.6,7,e.r*0.22,true,'#efe4cc');
    zaehneSpiel(e.x+e.r*0.28,y+welle(0)+e.r*0.32,e.r*0.6,7,e.r*0.22,false,'#efe4cc');
    hohlauge(e.x,y+welle(0)-e.r*0.34,e.r*0.13,'#ff8a6a',0.85);
  } else if(e.ai==='bittend'){
    const beben=Math.sin(performance.now()/320)*e.r*0.04;
    fleisch(e.x,y+e.r*0.9,e.r*1.1,e.r*0.72,0,col('#a89a8e'),col('#786a60'),'#241c18');
    fleisch(e.x,y-e.r*0.2,e.r*0.88,e.r*1.1,0,col('#c2b2a2'),col('#8e7e6e'),'#2a221c');
    for(let paar=0;paar<=(e.stufe||0);paar++){   // je Stufe ein Händepaar mehr
      const oy=y-e.r*0.85+paar*e.r*0.62, sp=Math.sin(performance.now()/750+paar)*0.16;
      for(const vz of [-1,1]){

        ctx.beginPath(); ctx.moveTo(e.x+vz*e.r*0.6,oy);

      }
    }
    fleisch(e.x,y-e.r*1.6+beben,e.r*0.66,e.r*0.6,0,col('#d8cabc'),col('#a2927e'),'#2a221c');

  } else {
    disc(e.x,y,e.r,base);
    disc(e.x-5*s,y-4*s,2.5*s,'#111');disc(e.x+5*s,y-4*s,2.5*s,'#111');

function drawPickup(q){
  const bob=Math.sin(performance.now()/300+q.x)*1.5;
  const y=q.y+bob*0.5;
  shadow(q.x,q.y+7,6);
  switch(q.type){
    case 'coin': disc(q.x,y,5,'#ffd75a');ring(q.x,y,5,'#a8862a',1);txt('¢',q.x,y+0.5,'#a8862a',7);break;
    case 'bigcoin': disc(q.x,y,7,'#ffe88a');ring(q.x,y,7,'#a8862a',1.5);txt('5',q.x,y+0.5,'#a8862a',8);break;
    case 'bomb': disc(q.x,y,6,'#2a2a2e');disc(q.x-2,y-2,1.5,'#5a5a6a');
      ctx.strokeStyle='#8a6a2a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(q.x+2,y-5);ctx.quadraticCurveTo(q.x+6,y-9,q.x+4,y-11);ctx.stroke();break;
    case 'key': rrect(q.x-1.5,y-6,3,10,'#ffd75a');disc(q.x,y-6,3.5,'#ffd75a');disc(q.x,y-6,1.5,'#3a2a0a');
      rrect(q.x+1,y+1,3,2,'#ffd75a');rrect(q.x+1,y+4,4,2,'#ffd75a');break;
    case 'container': {                       // Herzerweiterung: pochendes Herz im Ring
      const puls=1+Math.pow(Math.max(0,Math.sin(performance.now()/380)),6)*0.22;
      ctx.save(); tuscheAn=false; ctx.globalAlpha=0.28;
      disc(q.x,y,13*puls,'#d43a4a'); tuscheAn=true; ctx.restore();
      ring(q.x,y,10,'#f0d98a',1.4);
      for(let i=0;i<4;i++){ const a=performance.now()/900+i*TAU/4;
        disc(q.x+Math.cos(a)*10,y+Math.sin(a)*10,1.5,'#f0d98a'); }
      ctx.save(); ctx.translate(q.x,y); ctx.scale(puls,puls);
      drawHeart(0,0,'full','red'); ctx.restore();
      break; }
    case 'schadenshoch': {                    // Schaden hoch: glühende Faust
      const heb=Math.sin(performance.now()/300)*1.2;
      ctx.save(); tuscheAn=false; ctx.globalAlpha=0.3;
      disc(q.x,y+heb,12,'#e8862a'); tuscheAn=true; ctx.restore();
      disc(q.x,y+2+heb,5.4,'#c8682a');
      disc(q.x-1.4,y+0.6+heb,3.6,'#e8a05a');
      for(let i=-1;i<=1;i++)                  // Knöchel
        disc(q.x+i*2.6,y-2.4+heb,1.7,'#e8a05a');
      ctx.strokeStyle='#ffd07a'; ctx.lineWidth=1.4;   // Aufwärtspfeil
      ctx.beginPath(); ctx.moveTo(q.x,y-12+heb); ctx.lineTo(q.x,y-6+heb);
      ctx.moveTo(q.x-2.6,y-9.4+heb); ctx.lineTo(q.x,y-12.4+heb);
      ctx.lineTo(q.x+2.6,y-9.4+heb); ctx.stroke();
      break; }
    case 'heart': ctx.save();ctx.translate(q.x,y);drawHeart(0,0,'full','red');ctx.restore();break;
    case 'halfheart': ctx.save();ctx.translate(q.x,y);ctx.scale(0.7,0.7);drawHeart(0,0,'half','red');ctx.restore();break;
    case 'soulheart': ctx.save();ctx.translate(q.x,y);drawHeart(0,0,'full','soul');ctx.restore();break;
    case 'blackheart': ctx.save();ctx.translate(q.x,y);drawHeart(0,0,'full','black');ctx.restore();break;
    case 'pill': ctx.save();ctx.translate(q.x,y);ctx.rotate(0.5);
      rrect(-6,-3,6,6,'#e85a8a');rrect(0,-3,6,6,'#f0f0f0');ctx.restore();break;
    case 'card': rrect(q.x-5,y-7,10,14,'#e8e0d0');ctx.strokeStyle='#8a7a5a';ctx.strokeRect(q.x-5,y-7,10,14);
      txt('★',q.x,y,'#8a5aa8',8);break;
    case 'chest': drawChest(q.x,y,'#8a6a3a','#6a4a2a');break;
    case 'goldchest': drawChest(q.x,y,'#d4af37','#a8862a');break;
    case 'redchest': drawChest(q.x,y,'#a03a3a','#701a1a');break;
    case 'item': {                       // gefallenes Item, leuchtet auffällig
      if(dist(G.player,q)<40) tafelWarteschlange.push([q.itemId,q.x,y-16,0,0]);
      const f=itemColor(q.itemId), p=0.55+Math.sin(performance.now()/280)*0.25;
      ctx.save(); ctx.globalAlpha=p*0.4;
      ctx.beginPath(); ctx.arc(q.x,y,13,0,TAU); ctx.fillStyle=f; ctx.fill(); ctx.restore();
      drawItemIcon(q.itemId,q.x,y,1);
      break; }
  }
  if(q.price) txt(q.price+'¢',q.x,q.y+16,'#ffd75a',9);
}
function drawChest(x,y,c1,c2){
  rrect(x-9,y-4,18,10,c1);rrect(x-9,y-8,18,5,c2);
  rrect(x-2,y-4,4,5,'#3a2a0a');rrect(x-9,y-4,18,1,'#00000044');
}

function drawTear(t){
  shadow(t.x,t.y+t.z+4,t.r*0.7);
  const y=t.y-t.z+9;
  let c1='#9fd4ef',c2='#5a9ec4';
  if(t.poison){c1='#a8e07a';c2='#5a9a3a';}
  if(t.burn){c1='#ffb347';c2='#e8762a';}
  if(t.frost){c1='#c8f0ff';c2='#7ac4e8';}
  if(t.explosive){c1='#ffb347';c2='#a05a2a';}
  disc(t.x,y,t.r,c2);disc(t.x-t.r*0.25,y-t.r*0.25,t.r*0.6,c1);
}
function drawEshot(s){
  const y=s.y-(s.z||0);
  if(s.arc) shadow(s.x,s.y+3,4);
  disc(s.x,y,s.r,'#c04a4a');disc(s.x-1,y-1,s.r*0.5,'#e88a8a');
}
function drawBeam(b){
  const len=b.len||520;
  const grad=ctx.createLinearGradient(b.x,b.y,b.x+b.dx*len,b.y+b.dy*len);
  grad.addColorStop(0,'rgba(255,80,60,0.95)');grad.addColorStop(1,'rgba(200,30,30,0.7)');
  ctx.strokeStyle=grad;ctx.lineCap='round';
  ctx.lineWidth=b.w*(0.8+Math.sin(performance.now()/30)*0.2);
  ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+b.dx*len,b.y+b.dy*len);ctx.stroke();
  ctx.strokeStyle='rgba(255,220,200,0.9)';ctx.lineWidth=b.w*0.35;
  ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+b.dx*len,b.y+b.dy*len);ctx.stroke();
  ctx.lineCap='butt';
}
function drawLaser(l){
  ctx.strokeStyle=`rgba(120,220,255,${l.t/0.12})`;ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(l.x1,l.y1);ctx.lineTo(l.x2,l.y2);ctx.stroke();
  ctx.strokeStyle=`rgba(255,255,255,${l.t/0.12*0.8})`;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(l.x1,l.y1);ctx.lineTo(l.x2,l.y2);ctx.stroke();
}
function drawBombEnt(b){
  shadow(b.x,b.y+7,7);
  const blink=b.t<0.5&&Math.floor(b.t*10)%2===0;
  disc(b.x,b.y,8,blink?'#c05a4a':'#2a2a2e');
  disc(b.x-2,b.y-2,2,'#5a5a6a');
  ctx.strokeStyle='#8a6a2a';ctx.lineWidth=1.5;

/* --- HUD --- */
function drawHUD(){
  const p=G.player;

  // Umbruch nach 6 pro Reihe, damit sie bei vielen Containern nicht
  // quer über den Bildschirm laufen.
  const PRO_REIHE=6, MAX_REIHEN=3;
  const herzen=[];
  for(let i=0;i<p.redMax/2;i++){
    const v=p.red-i*2;
    herzen.push({fill:v>=2?'full':(v===1?'half':'empty'),type:'red'});
  }

                 type:p.soul[idx]==='B'?'black':'soul'});
  }
  const sichtbar=Math.min(herzen.length,PRO_REIHE*MAX_REIHEN);

  }

  txt(String(p.keys).padStart(2,'0'),34,cy,'#e8e0d0',10,'left');
  // Aktives Item mit Ladebalken — schließt an die Ressourcenspalte an

/* Sporenwolken des Sporenwirts. Sie liegen über den Figuren und verdecken
   sie, deshalb werden sie zuletzt gezeichnet. */
function drawSporen(){
  tuscheAn=false;
  for(const c of G.creeps){
    if(!c.sporen) continue;
    const a=clamp(c.t/5,0,1);
    for(let i=0;i<7;i++){
      const w=i*TAU/7+c.x*0.01+performance.now()/2600;
      ctx.fillStyle=`rgba(122,150,74,${0.5*a})`;
      ctx.beginPath();
      ctx.ellipse(c.x+Math.cos(w)*c.r*0.5,c.y+Math.sin(w)*c.r*0.34,
                  c.r*0.6,c.r*0.44,w,0,TAU);
      ctx.fill();
    }
  }
  tuscheAn=true;
}

/* Automap oben rechts */
function drawMinimap(){
  const cw=9,ch=7, mx=W-12, my=12;
  const cur=G.room;
  ctx.globalAlpha=0.85;
  for(const k in G.floor.rooms){
    const r=G.floor.rooms[k];
    if(!r.seen&&!r.visited) continue;
    const dx=r.gx-cur.gx, dy=r.gy-cur.gy;
    const x=mx-cw*4.5+dx*cw, y=my+ch*2+dy*ch;
    if(x<W-110||x>W-4||y<4||y>80) continue;
    let fill=r.visited?'#8a8276':'#3a3a42';
    if(k===G.roomKey) fill='#e8e0d0';
    rrect(x,y,cw-1,ch-1,fill);
    // Icons
    let icon=null,icol='#111';
    if(r.type==='treasure'){icon='◆';icol='#d4af37';}
    if(r.type==='shop'){icon='¢';icol='#d4af37';}
    if(r.type==='boss'){icon='☠';icol='#c03a5a';}
    if(r.type==='secret'){icon='?';icol='#8a5aa8';}
    if(r.type==='curse'){icon='!';icol='#c03a5a';}
    if(r.type==='sacrifice'){icon='†';icol='#555';}
    if(r.type==='arcade'){icon='★';icol='#5a5ac0';}
    if(icon) txt(icon,x+cw/2-0.5,y+ch/2,icol,7);
    /* Teufel und Engel bekommen kleine Zeichnungen statt Schriftzeichen:
       Hörner und Heiligenschein sind auf neun Pixeln besser zu erkennen als
       irgendein Sonderzeichen, und sie hängen an keiner Schriftart. */
    if(r.type==='devil'){
      ctx.fillStyle='#c03a5a'; ctx.beginPath();
      ctx.moveTo(x+2,y+ch-2);    ctx.lineTo(x+3,y+2);      ctx.lineTo(x+4.5,y+ch-2);
      ctx.moveTo(x+cw-3,y+ch-2); ctx.lineTo(x+cw-4,y+2);   ctx.lineTo(x+cw-5.5,y+ch-2);
      ctx.fill();
    }
    if(r.type==='angel'){
      ctx.strokeStyle='#ffe8a0'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.ellipse(x+cw/2-0.5,y+ch/2,2.6,1.4,0,0,TAU); ctx.stroke();
    }
  }
  ctx.globalAlpha=1;
}

/* --- Savegame (localStorage): Freischaltungen & Statistik --- */
let saveData={unlocks:[],wins:0,deaths:0,bestFloor:1,kills:0,laeufe:0,
              ton:5,musik:5,wackeln:true,lauf:null};
function loadSave(){
  try{ const s=localStorage.getItem('kellerbrut_v1');
    if(s) saveData={...saveData,...JSON.parse(s)}; }catch(e){}
}
function einstellungenAnwenden(){ Sfx.setzeLautstaerke(saveData.ton,saveData.musik); }
function saveSave(){
  try{ localStorage.setItem('kellerbrut_v1',JSON.stringify(saveData)); }catch(e){}
}
function unlock(key){
  if(saveData.unlocks.includes(key)) return;
  saveData.unlocks.push(key); saveSave();
  const c=CHARS.find(c=>c.unlock===key);
  if(c&&G.state==='game') G.banner={title:'Freigeschaltet: '+c.name,desc:c.desc,t:3};
}
function charUnlocked(c){ return !c.unlock||saveData.unlocks.includes(c.unlock); }

/* --- ZWISCHENSTAND -------------------------------------------------------
   Ein Durchlauf soll das Schließen des Tabs überleben. Gespeichert wird
   nicht die ganze Welt, sondern nur, was sich nicht aus dem Seed ergibt:
   die Etage wird beim Laden neu erzeugt (sie ist deterministisch) und
   bekommt danach den Unterschied aufgesetzt — welche Räume geräumt sind,
   welche Steine weg sind, was noch herumliegt. Das ist ein Bruchteil der
   Datenmenge und übersteht auch eine spätere Änderung an der Raumform.  */
function laufSpeichern(){
  if(!G||G.state!=='game'||!G.player||G.player.dead){ return; }
  const p=G.player;
  const raeume={};
  for(const k in G.floor.rooms){
    const r=G.floor.rooms[k];
    const felder=[];
    for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
      const z=r.grid[y][x];
      felder.push(z?[y,x,z.t,z.hp||0,z.red?1:0]:null);
    }
    raeume[k]={v:r.visited?1:0,s:r.seen?1:0,c:r.cleared?1:0,t:r.trapdoor?1:0,
      typ:r.type, kam:r.kammerId||null, opf:r.sacrificeCount||0,
      gitter:felder.filter(Boolean),
      drops:r.drops.map(q=>({x:q.x,y:q.y,type:q.type,price:q.price,
        pillId:q.pillId,cardId:q.cardId,itemId:q.itemId,garantiert:q.garantiert})),
      podeste:r.pedestals.map(q=>({x:q.x,y:q.y,itemId:q.itemId,price:q.price,
        herzPreis:q.herzPreis,taken:q.taken?1:0})),
      automaten:r.machines.map(m=>({x:m.x,y:m.y,kind:m.kind,broken:m.broken?1:0}))};
  }
  const tueren={};
  for(const ek in G.floor.doors){
    const e=G.floor.doors[ek];
    tueren[ek]={k:e.kind,l:e.locked?1:0,r:e.revealed?1:0};
  }
  saveData.lauf={
    fassung:1, seed:G.seedStr, tiefe:G.depth, charIdx:G.charIdx, roomKey:G.roomKey,
    zeit:G.time, kills:G.kills, stats:G.stats, treffer:G.floorHit?1:0, deals:G.deals,
    runItems:G.runItems, gesehen:[...G.itemsSeen], pillen:[...G.pillsKnown],
    spieler:{red:p.red,redMax:p.redMax,soul:p.soul,coins:p.coins,bombs:p.bombs,
      keys:p.keys,items:p.items,active:p.active,pocket:p.pocket,
      permDmg:p.permDmg,permSpeed:p.permSpeed,permRange:p.permRange,
      geflickt:p.geflickt?1:0},
    raeume, tueren};
  saveSave();
}
function laufVerwerfen(){ saveData.lauf=null; saveSave(); }
function laufVorhanden(){ const l=saveData.lauf; return !!(l&&l.fassung===1&&CHARS[l.charIdx]); }

function laufFortsetzen(){
  const l=saveData.lauf;
  if(!laufVorhanden()) return false;
  startRun(l.charIdx,l.seed);              // legt Spieler und Etage 1 an
  saveData.laeufe--;                       // Fortsetzen ist kein neuer Lauf
  G.depth=l.tiefe;
  G.floor=genFloor(G.depth);               // aus dem Seed exakt dieselbe Etage
  G.time=l.zeit||0; G.kills=l.kills||0;
  if(l.stats) G.stats={...G.stats,...l.stats};
  G.floorHit=!!l.treffer; G.deals=l.deals||0;
  G.runItems=l.runItems||[];
  G.itemsSeen=new Set(l.gesehen||[]);
  G.pillsKnown=new Set(l.pillen||[]);
  // Unterschied auf die frisch erzeugte Etage legen
  for(const k in l.raeume){
    const r=G.floor.rooms[k], d=l.raeume[k];
    if(!r) continue;
    r.visited=!!d.v; r.seen=!!d.s; r.cleared=!!d.c; r.trapdoor=!!d.t;
    if(d.typ) r.type=d.typ;
    if(d.kam) r.kammerId=d.kam;
    r.sacrificeCount=d.opf||0;
    for(let y=0;y<ROWS;y++) r.grid[y].fill(null);
    for(const f of d.gitter){
      const zelle={t:f[2]}; if(f[3]) zelle.hp=f[3]; if(f[4]) zelle.red=true;
      r.grid[f[0]][f[1]]=zelle;
    }
    r.drops=d.drops||[];
    r.pedestals=(d.podeste||[]).map(q=>({...q,taken:!!q.taken,cd:0}));
    r.machines=(d.automaten||[]).map(m=>({...m,broken:!!m.broken,cd:0}));
    if(r.cleared) r.spawns=[];             // geräumt bleibt geräumt
  }
  for(const ek in l.tueren){
    const e=G.floor.doors[ek], d=l.tueren[ek];
    if(!e) continue;
    e.kind=d.k; e.locked=!!d.l; e.revealed=!!d.r;
  }
  // Spieler zurückspielen
  const p=G.player, sp=l.spieler;
  p.red=sp.red; p.redMax=sp.redMax; p.soul=sp.soul||[];
  p.coins=sp.coins; p.bombs=sp.bombs; p.keys=sp.keys;
  p.items=[]; p.flags=new Set(); p.familiars=[];
  G.familiars=[];
  p.permDmg=sp.permDmg||0; p.permSpeed=sp.permSpeed||0; p.permRange=sp.permRange||0;
  p.geflickt=!!sp.geflickt;
  const char=CHARS[l.charIdx];
  if(char.flags) for(const f of char.flags) p.flags.add(f);
  for(const id of sp.items||[]){            // Items ohne Aufhebe-Anzeige neu setzen
    const it=ITEMS[id]; if(!it) continue;
    p.items.push(id);
    if(it.flags) for(const f of it.flags) p.flags.add(f);
  }
  spawnFamiliars();                         // Begleiter aus den Items neu aufstellen
  p.active=sp.active||null; p.pocket=sp.pocket||null;
  p.itemGet=null;
  recomputeStats();
  Sfx.setPattern(G.floor.data.mus);
  laterneLeuchtet();
  enterRoom(G.floor.rooms[l.roomKey]?l.roomKey:G.floor.startKey,null);
  G.banner={title:'Weiter im '+G.floor.data.name,desc:'Etage '+G.depth,t:2.4};
  return true;
}

/* --- Run starten --- */
let menu={idx:0,charIdx:0,seedInput:'',typingSeed:false,itemSeite:0};
function startRun(charIdx,seedStr){
  const char=CHARS[charIdx];
  const seed=seedStr&&seedStr.length?seedStr.toUpperCase():seedToStr((Math.random()*4294967296)>>>0);
  G={state:'game',seedStr:seed,seedNum:hashSeed(seed),depth:1,
    charIdx,itemsSeen:new Set(),runItems:[],pillsKnown:new Set(),
    kills:0,time:0,stats:{kills:0,dmgDealt:0,dmgTaken:0},
    shake:0,banner:null,bossIntro:null,trans:null,result:null,
    tears:[],eshots:[],enemies:[],bombs:[],pickups:[],fx:[],beams:[],
    lasers:[],creeps:[],familiars:[],texts:[],einschlaege:[],
    deathTimer:0,roomFresh:0,bossName:'',room:null,roomKey:null,
    floorHit:false,deals:0,        // heil durch die Etage? schon gehandelt?
    floorRooms:()=>G.floor.rooms};
  const p={char,x:0,y:0,vx:0,vy:0,r:9,
    red:char.red,redMax:char.red,soul:[...char.soul],
    coins:char.coins,bombs:char.bombs,keys:char.keys,
    items:[],flags:new Set(),active:null,pocket:null,
    permDmg:0,permSpeed:0,permRange:0,roomDmgBonus:0,
    fireTimer:0,iframes:0,shield:0,beamCharge:0,beamReady:false,
    aimDir:{x:0,y:1},anim:0,itemGet:null,dead:false,hitFlash:0,stats:{}};
  G.player=p;
  // Angeborene Fahnen der Figur (Türkind, Laterne, Moos, Flicken …)
  if(char.flags) for(const f of char.flags) p.flags.add(f);
  // Startitem ohne Animation
  if(char.item){ const it=ITEMS[char.item];
    G.itemsSeen.add(char.item); G.runItems.push(char.item);
    if(it.type==='active') p.active={id:char.item,charge:it.charge,max:it.charge};
    else { p.items.push(char.item);
      if(it.flags) for(const f of it.flags) p.flags.add(f);
      if(it.pickup) it.pickup(p); } }
  if(char.pocket) p.pocket={kind:char.pocket.kind,
    id:char.pocket.kind==='pill'?frand.int(PILLS.length):frand.int(CARDS.length)};
  recomputeStats();
  saveData.laeufe=(saveData.laeufe||0)+1; laufVerwerfen();
  G.floor=genFloor(1);
  Sfx.setPattern(G.floor.data.mus);
  laterneLeuchtet();
  enterRoom(G.floor.startKey,null);
  G.banner={title:G.floor.data.name,desc:'Etage 1  ·  Seed '+seed,t:3};
}
function winRun(){
  G.state='postrun'; G.result='win';
  saveData.wins++; laufVerwerfen(); saveSave(); unlock('win');
  Sfx.item();
}

/* --- Effekte/Partikel-Update --- */
function updateFx(dt){
  for(const f of G.fx){
    f.t-=dt;
    if(f.kind==='p'){ f.x+=f.vx*dt; f.y+=f.vy*dt; f.vx*=0.92; f.vy*=0.92; }
  }
  G.fx=G.fx.filter(f=>f.t>0);
  // Obergrenze: bei extremen Kombinationen (Vierfachschuss mit Gift, Feuer und
  // Frost) sollen die Partikel die Bildrate auch auf schwachen Rechnern nicht
  // drücken. Die ältesten fallen zuerst weg.
  if(G.fx.length>700) G.fx.splice(0,G.fx.length-700);
  for(const t of G.texts) t.t-=dt;
  G.texts=G.texts.filter(t=>t.t>0);
  if(G.banner) G.banner.t-=dt;
  G.shake=Math.max(0,G.shake-30*dt);
}

/* --- Spiel-Update (fester Timestep) --- */
function updateGame(dt){
  const p=G.player;
  if(G.bossIntro){
    G.bossIntro.t-=dt;
    if(G.bossIntro.t<=0||Input.hit('Enter')) G.bossIntro=null;
    updateFx(dt);
    return;
  }
  if(G.trans){
    G.trans.t-=dt;
    if(!G.trans.half&&G.trans.t<=0.17){ G.trans.half=true; enterRoom(G.trans.to,G.trans.dir); }
    if(G.trans.t<=0) G.trans=null;
    return;
  }
  G.time+=dt;
  G.roomFresh=Math.max(0,G.roomFresh-dt);
  if(!p.dead){
    updatePlayer(dt);
    if(Input.pause()){ G.state='pause'; return; }
  } else {
    G.deathTimer-=dt;
    if(G.deathTimer<=0){ G.state='postrun'; G.result='dead'; }
  }
  updateTears(dt);
  updateBeams(dt);
  updateFamiliars(dt);
  updateBombs(dt);
  updateEnemies(dt);
  updateEshots(dt);
  updateCreeps(dt);
  updateEinschlaege(dt);
  updateFx(dt);
  updateDoorsOpen(false);
  updateDoorAnim(dt);
  // Sieg: Endboss auf der letzten Etage besiegt (kurze Pause für den Todeseffekt)
  if(G.depth>=FLOORS.length&&G.room.type==='boss'&&G.room.cleared&&!G.winQueued){
    G.winQueued=true; G.winTimer=2.5;
  }
  if(G.winQueued){ G.winTimer-=dt; if(G.winTimer<=0) winRun(); }
}

/* --- Rendering-Verteiler --- */
function render(){
  grundTransform();
  // Zittertakt und Formzähler für den Tuschestil zurücksetzen
  BOIL=Math.floor(performance.now()/143);
  flaecheBeginnen(); tuscheAn=true;
  ctx.fillStyle=G&&G.floor?G.floor.data.bg:'#0a0a0f';
  ctx.fillRect(0,0,W,H);
  if(!G||!G.state||G.state==='menu'){ drawMenu(); return; }
  if(G.state==='charsel'){ drawCharSel(); return; }
  if(G.state==='statistik'){ drawStatistik(); return; }
  if(G.state==='optionen'){ drawOptionen(); return; }
  if(G.state==='postrun'){ drawPostRun(); return; }
  // Spielwelt (auch als Hintergrund für Pause)
  if(G.shake>0.5&&saveData.wackeln!==false)
    ctx.translate(frand.range(-G.shake,G.shake)*0.5,frand.range(-G.shake,G.shake)*0.5);
  drawRoom();
  for(const q of G.pickups) drawPickup(q);
  for(const b of G.bombs) drawBombEnt(b);
  const sorted=[...G.enemies].sort((a,b)=>a.y-b.y);
  let playerDrawn=false;
  for(const e of sorted){
    if(!playerDrawn&&G.player.y<e.y){ drawPlayer(G.player); playerDrawn=true; }
    drawEnemy(e);
  }
  if(!playerDrawn) drawPlayer(G.player);
  for(const f of G.familiars) drawFamiliar(f);
  for(const b of G.beams) drawBeam(b);
  for(const l of G.lasers) drawLaser(l);
  for(const t of G.tears) drawTear(t);
  for(const s of G.eshots) drawEshot(s);
  for(const f of G.fx){
    if(f.kind==='p'){ ctx.globalAlpha=clamp(f.t*2,0,1); rrect(f.x,f.y,f.size,f.size,f.color); ctx.globalAlpha=1; }
    else if(f.kind==='boom'){ ctx.globalAlpha=f.t/0.35;
      ring(f.x,f.y,f.r*(1-f.t/0.35+0.3),'#ffb347',4); ctx.globalAlpha=1; }
    else if(f.kind==='welle'){                 // aufziehender Ring
      const p0=1-f.t/f.max;
      ctx.globalAlpha=Math.pow(f.t/f.max,0.7);
      ring(f.x,f.y,Math.max(1,f.r*p0),f.color,f.w*(1-p0*0.7)+0.5);
      ctx.globalAlpha=1;
    } else if(f.kind==='glanz'){               // kurzer Lichtblitz
      const a=f.t/f.max;
      ctx.globalAlpha=a*0.85;
      disc(f.x,f.y,f.r*(0.5+a*0.5),f.color);
      ctx.globalAlpha=a;
      disc(f.x,f.y,f.r*0.45*a,'#ffffff');
      ctx.globalAlpha=1;
    }
  }
  drawEinschlaege();// Vorwarnungen liegen über dem Boden, unter dem Dunst
  drawSporen();     // legt sich über alles, nimmt die Sicht
  tafelnZeichnen(); // Item-Erklärungen zuoberst, aber noch im Raumbild
  grundTransform();
  raumStimmung();   // Dunst der Etage und Vignette, noch unter dem HUD
  drawHUD();
  if(G.bossIntro) drawBossIntro();
  if(G.trans){ // Übergangs-Fade
    const t=G.trans.t, a=t>0.17?(0.35-t)/0.18:t/0.17;
    ctx.fillStyle=`rgba(0,0,0,${clamp(a,0,1)})`; ctx.fillRect(0,0,W,H);
  }
  if(G.player.dead){
    ctx.fillStyle=`rgba(40,0,0,${clamp((1.2-G.deathTimer)*0.5,0,0.6)})`;
    ctx.fillRect(0,0,W,H);
  }
  if(G.state==='pause') drawPause();
}

/* --- Menü-Screens --- */
/* Einträge des Hauptmenüs. "Weiterspielen" erscheint nur, wenn wirklich ein
   Zwischenstand da ist — ein toter Eintrag wäre schlimmer als keiner. */
function menuEintraege(){
  const e=[];
  if(laufVorhanden()){
    const l=saveData.lauf;
    e.push({id:'weiter',text:'Weiterspielen',
            zusatz:CHARS[l.charIdx].name+' · Etage '+l.tiefe+' · Seed '+l.seed});
  }
  e.push({id:'neu',text:'Neuer Abstieg'});
  e.push({id:'statistik',text:'Statistik & Freischaltungen'});
  e.push({id:'optionen',text:'Einstellungen'});
  return e;
}

function drawMenu(){
  ctx.fillStyle='#0a0a0f';ctx.fillRect(0,0,W,H);
  // Titelgrafik: tropfender Schriftzug
  txt('K E L L E R B R U T',W/2,58,'#c03a5a',30);
  txt('K E L L E R B R U T',W/2+1,59,'rgba(255,255,255,0.15)',30);
  for(let i=0;i<5;i++){ const x=W/2-90+i*45, len=8+((i*37)%14);
    rrect(x,72,3,len,'#c03a5a'); disc(x+1.5,72+len,2,'#c03a5a'); }

function drawCharSel(){
  ctx.fillStyle='#0a0a0f';ctx.fillRect(0,0,W,H);
  txt('WER STEIGT HINAB?',W/2,40,'#e8e0d0',16);
  const n=CHARS.length, cw=130;
  for(let i=0;i<n;i++){
    const c=CHARS[i], x=W/2+(i-menu.charIdx)*cw, sel=i===menu.charIdx;
    if(x<-70||x>W+70) continue;
    const un=charUnlocked(c);
    ctx.globalAlpha=sel?1:0.45;
    rrect(x-52,70,104,150,sel?'#1a1a24':'#12121a');
    if(sel){ctx.strokeStyle='#8a7a5a';ctx.strokeRect(x-52.5,70.5,105,149);}
    // Portrait: dieselbe Zeichenfunktion wie im Spiel, nur vergrößert —
    // so entspricht die Vorschau immer genau der späteren Spielfigur.
    if(un){
      const t=performance.now()/1000;
      shadow(x,134,9);
      ctx.save(); ctx.translate(x,118); ctx.scale(1.5,1.5); ctx.translate(-x,-118);
      zeichneCharakter(c,x,118,{
        schritt:sel?Math.sin(t*5)*0.7:0,
        hub:sel?Math.abs(Math.sin(t*5))*0.9:0,
        aim:{x:Math.sin(t*1.3)*0.8,y:0.5},
        schwebt:c.id==='schemen',
        blinzelt:((t*0.8)%5)<0.12});
      ctx.restore();
      txt(c.name,x,150,'#e8e0d0',12);
      txt(c.desc,x,164,'#8a8276',8);
      txt(`♥${c.red/2+c.soul.length/2} Tempo ${c.speed} DMG ${c.dmg}`,x,180,'#6a6a76',7);
      if(c.item) txt('Start: '+ITEMS[c.item].name,x,192,'#6a6a76',7);
    } else {
      disc(x,110,10,'#222');txt('?',x,110,'#555',12);
      txt('Gesperrt',x,150,'#555',10);
      txt(c.unlockText||'',x,164,'#444',7);
    }
    ctx.globalAlpha=1;
  }
  /* Punktleiste: bei neun Figuren sieht man sonst nicht, wie viele es
     überhaupt gibt und wo man gerade steht. Gesperrte bleiben hohl. */
  for(let i=0;i<n;i++){
    const px=W/2-(n-1)*5+i*10, offen=charUnlocked(CHARS[i]);
    if(i===menu.charIdx) disc(px,232,3,'#e8e0d0');
    else if(offen) disc(px,232,2,'#6a6a76');
    else ring(px,232,2,'#3a3a44',1);
  }
  txt((menu.charIdx+1)+' / '+n,W/2,244,'#5a5a66',8);
  txt('◄ ► wählen · ENTER start',W/2,258,'#8a8276',10);
  if(menu.typingSeed) txt('Seed: '+menu.seedInput+'_',W/2,282,'#ffd75a',11);
  else txt(menu.seedInput?('Seed: '+menu.seedInput+'  (S ändern)'):'S — Seed eingeben (gleicher Seed = gleiche Etagen)',W/2,282,'#5a5a66',9);
}
function drawPause(){
  ctx.fillStyle='rgba(5,5,10,0.93)';ctx.fillRect(0,0,W,H);
  txt('PAUSE',W/2,50,'#e8e0d0',22);
  const p=G.player,s=p.stats;
  txt(`Seed ${G.seedStr} · Etage ${G.depth} (${G.floor.data.name})`,W/2,80,'#8a8276',10);
  const stats=[
    ['Tempo',s.speed.toFixed(2)],['Feuerrate',s.tps.toFixed(2)],['Schaden',s.dmg.toFixed(2)],
    ['Reichweite',(s.range|0)+''],['Schussgeschw.',s.shot.toFixed(1)],['Glück',s.luck+'']];
  stats.forEach((st,i)=>{
    txt(st[0],W/2-60,110+i*14,'#6a6a76',9,'right');
    txt(st[1],W/2-46,110+i*14,'#e8e0d0',9,'left');});
  /* Eingesammelte Items als Liste mit Wirkung — Symbole allein sagen einem
     nach zwanzig Fundstücken nicht mehr, was man eigentlich dabeihat.
     Geblättert wird mit ◄ ►, damit auch lange Läufe hineinpassen. */
  const proSeite=7;
  const habe=[];
  if(p.active) habe.push({id:p.active.id,marke:'aktiv'});
  for(const id of p.items) habe.push({id,marke:null});
  const seiten=Math.max(1,Math.ceil(habe.length/proSeite));
  menu.itemSeite=clamp(menu.itemSeite||0,0,seiten-1);
  const von=menu.itemSeite*proSeite;
  txt('Deine Items ('+habe.length+')',W/2+22,106,'#6a6a76',9,'left');
  if(!habe.length) txt('— noch nichts gefunden —',W/2+22,124,'#4a4a56',8,'left');
  habe.slice(von,von+proSeite).forEach((e,i)=>{
    const y=122+i*17, it=ITEMS[e.id];
    drawItemIcon(e.id,W/2+30,y,0.8);
    txt(it.name,W/2+44,y-4,e.marke?'#ffd75a':'#e8e0d0',8,'left');
    const kurz=textZeilen(it.desc,7,168)[0];
    txt(kurz,W/2+44,y+5,'#8a8276',7,'left');
    if(e.marke) txt('[Q]',W/2+240,y-4,'#ffd75a',7,'right');
  });
  if(seiten>1) txt('◄ ► Seite '+(menu.itemSeite+1)+'/'+seiten,W/2+22,246,'#6a6a76',8,'left');
  if(p.pocket){
    const t=p.pocket.kind==='pill'
      ? (G.pillsKnown.has(p.pocket.id)?PILLS[p.pocket.id].name:'unbekannte Pille')
      : CARDS[p.pocket.id].name;
    txt('In der Tasche: '+t+'  [E]',W/2,H-58,'#8a8276',9);
  }
  txt('ESC/P weiter · X Run aufgeben',W/2,H-40,'#8a8276',10);
}
function drawPostRun(){
  ctx.fillStyle='#0a0a0f';ctx.fillRect(0,0,W,H);
  const win=G.result==='win';
  txt(win?'DU HAST ÜBERLEBT':'GESTORBEN',W/2,46,win?'#5ad75a':'#c03a5a',24);
  txt(win?'Die Wurzel des Kellers ist bezwungen.':('Etage '+G.depth+' — '+G.floor.data.name),W/2,72,'#8a8276',10);
  const mm=Math.floor(G.time/60),ss=Math.floor(G.time%60);
  const lines=[
    ['Zeit',`${mm}:${String(ss).padStart(2,'0')}`],
    ['Kills',G.stats.kills+''],
    ['Schaden ausgeteilt',(G.stats.dmgDealt|0)+''],
    ['Schaden erlitten',(G.stats.dmgTaken/2)+' Herzen'],
    ['Items gefunden',G.runItems.length+''],
    ['Seed',G.seedStr]];
  lines.forEach((l,i)=>{
    txt(l[0],W/2-16,104+i*16,'#6a6a76',10,'right');
    txt(l[1],W/2,104+i*16,'#e8e0d0',10,'left');});
  txt('Gesammelte Items:',W/2,206,'#6a6a76',9);
  G.runItems.slice(0,32).forEach((id,i)=>{
    drawItemIcon(id,W/2-((Math.min(G.runItems.length,16))*10)+10+(i%16)*20,224+Math.floor(i/16)*22,1);});
  /* Die Namen dazu: nach einem Lauf weiß man sonst nicht mehr, welches
     Symbol was war. Was nicht mehr hinpasst, wird gezählt statt genannt. */
  const reihen=Math.min(2,Math.ceil(G.runItems.length/16));
  const namen=G.runItems.map(id=>ITEMS[id]?ITEMS[id].name:id);
  const zeilen=textZeilen(namen.join(' · '),7,520);
  const platz=Math.max(0,Math.floor((316-(224+reihen*22+8))/9));
  const sichtbar=zeilen.slice(0,Math.max(0,platz-(zeilen.length>platz?1:0)));
  sichtbar.forEach((z,i)=>txt(z,W/2,224+reihen*22+10+i*9,'#8a8276',7));
  if(zeilen.length>sichtbar.length)
    txt('… und '+(namen.length-sichtbar.join(' · ').split(' · ').length)+' weitere',
        W/2,224+reihen*22+10+sichtbar.length*9,'#6a6a76',7);
  txt('ENTER — zurück ins Menü',W/2,H-28,'#e8e0d0',11);
}

/* --- Menü-Steuerung --- */
function updateMenu(){
  if(G.state==='menu'){
    const eintraege=menuEintraege();
    if(Input.hit('ArrowUp')||Input.hit('KeyW')){ menu.idx=(menu.idx+eintraege.length-1)%eintraege.length; Sfx.tick(); }
    if(Input.hit('ArrowDown')||Input.hit('KeyS')){ menu.idx=(menu.idx+1)%eintraege.length; Sfx.tick(); }
    if(Input.confirm()){
      const wahl=eintraege[clamp(menu.idx,0,eintraege.length-1)];
      if(wahl.id==='weiter'){ if(laufFortsetzen()) Sfx.doorOpen(); else Sfx.error(); }
      else if(wahl.id==='neu'){ G.state='charsel'; Sfx.pickup(); }
      else if(wahl.id==='statistik'){ G.state='statistik'; Sfx.pickup(); }
      else { G.state='optionen'; menu.optIdx=0; Sfx.pickup(); }
    }
  } else if(G.state==='statistik'){
    if(Input.hit('Escape')||Input.confirm()){ G.state='menu'; Sfx.tick(); }
  } else if(G.state==='optionen'){
    const liste=optionenListe();
    if(Input.hit('ArrowUp')||Input.hit('KeyW')){ menu.optIdx=(menu.optIdx+liste.length-1)%liste.length; Sfx.tick(); }
    if(Input.hit('ArrowDown')||Input.hit('KeyS')){ menu.optIdx=(menu.optIdx+1)%liste.length; Sfx.tick(); }
    const o=liste[clamp(menu.optIdx||0,0,liste.length-1)];
    const links=Input.hit('ArrowLeft')||Input.hit('KeyA');
    const rechts=Input.hit('ArrowRight')||Input.hit('KeyD');
    if(links||rechts){
      if(o.schalter) saveData.wackeln=!(saveData.wackeln!==false);
      else saveData[o.id]=clamp((saveData[o.id]||0)+(rechts?1:-1),0,10);
      einstellungenAnwenden(); saveSave(); Sfx.tick();
    }
    if(Input.hit('Escape')){ G.state='menu'; Sfx.tick(); }
  } else if(G.state==='charsel'){
    if(menu.typingSeed) return;
    if(Input.hit('ArrowLeft')||Input.hit('KeyA')){ menu.charIdx=(menu.charIdx+CHARS.length-1)%CHARS.length; Sfx.tick(); }
    if(Input.hit('ArrowRight')||Input.hit('KeyD')){ menu.charIdx=(menu.charIdx+1)%CHARS.length; Sfx.tick(); }
    if(Input.hit('KeyS')){
      menu.typingSeed=true; Input.clear();
      Input.setTyping(e=>{
        if(e.code==='Enter'||e.code==='Escape'){ menu.typingSeed=false; Input.setTyping(null); }
        else if(e.code==='Backspace') menu.seedInput=menu.seedInput.slice(0,-1);
        else if(/^[a-zA-Z0-9]$/.test(e.key)&&menu.seedInput.length<10) menu.seedInput+=e.key.toUpperCase();
      });
    }
    if(Input.confirm()){
      const c=CHARS[menu.charIdx];
      if(charUnlocked(c)){ startRun(menu.charIdx,menu.seedInput); Sfx.doorOpen(); }
      else Sfx.error();
    }
    if(Input.hit('Escape')) G.state='menu';
  } else if(G.state==='pause'){
    if(Input.pause()||Input.hit('Escape')) G.state='game';
    if(Input.hit('KeyX')){ G.state='postrun'; G.result='dead';
      saveData.deaths++; laufVerwerfen(); saveSave(); }
    // in der Itemliste blättern
    if(Input.hit('ArrowLeft')||Input.hit('KeyA')){ menu.itemSeite=(menu.itemSeite||0)-1; Sfx.tick(); }
    if(Input.hit('ArrowRight')||Input.hit('KeyD')){ menu.itemSeite=(menu.itemSeite||0)+1; Sfx.tick(); }
  } else if(G.state==='postrun'){
    if(Input.confirm()){ G.state='menu'; menu.seedInput=''; }
  }
}

/* Auflösung beim Start festlegen und bei Fenstergrößenänderung nachziehen.
   Ändert sich SKALA, sind die vorgebackenen Raumbilder in der falschen
   Auflösung — sie werden deshalb verworfen. */
leinwandAnpassen();
window.addEventListener('resize',()=>{ if(leinwandAnpassen()) raumBildNeu(); });

/* --- Hauptschleife: fester 60-Hz-Timestep --- */
const DT=1/60;
let acc=0, last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  acc+=Math.min(0.1,(now-last)/1000); last=now;
  Input.pollPad();
  while(acc>=DT){
    acc-=DT;
    if(Input.hit('KeyM')) Sfx.toggleMusic();
    if(Input.hit('KeyN')) Sfx.toggleMute();
    if(G.state==='game') updateGame(DT);
    else updateMenu();
    // Tastendrücke gelten genau einen Tick lang, sonst würde z.B. ein im Spiel
    // gedrücktes Enter den danach erscheinenden Post-Run-Screen sofort wegklicken.
    Input.clear();
  }
  Sfx.updateMusic(DT,G.state==='game'||G.state==='pause');
  render();
}

/* --- Boot --- */
loadSave();
einstellungenAnwenden();
G={state:'menu',floor:null};
requestAnimationFrame(frame);

/* Test-Hooks (für automatisierte Smoke-Tests) */
window.KB={ get G(){return G;}, startRun, genFloor, hashSeed, Input, Sfx,
  CHARS, ITEMS, ENEMY_TYPES, BOSS_TYPES, PILLS, CARDS, FLOORS, TEMPLATES,
  HANDSCHRIFTEN, MAX_HERZEN, KAMMERN, laufSpeichern, laufFortsetzen,
  laufVerwerfen, laufVorhanden, get saveData(){return saveData;},
  get raumBildStand(){return bildStand;},
  get tafelnGezeichnet(){return tafelnGezeichnet;} };
</script>
