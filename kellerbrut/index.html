/* Handschrift der aktuellen Etage; tiefere Etagen als beschrieben erben die letzte. */
function handschrift(){ return HANDSCHRIFTEN[Math.min(G.depth-1,HANDSCHRIFTEN.length-1)]||HANDSCHRIFTEN[0]; }

/* Feiner Staub, der im Licht schwebt — von mehreren Handschriften benutzt */
function staub(x,y,w,h,t,farbe,anzahl){
  for(let i=0;i<anzahl;i++){
    const px=x+((i*67)%100)/100*w+Math.sin(t*0.4+i*1.3)*6;
    const py=y+((i*151)%100)/100*h+Math.cos(t*0.3+i)*4;
    ctx.save(); ctx.globalAlpha=0.3+Math.sin(t*1.5+i*2)*0.25;
    ctx.fillStyle=farbe; ctx.fillRect(px,py,1,1); ctx.restore();
  }
}

/* --- Raumhintergrund vorbacken -------------------------------------------
   Boden, Bodenhandschrift, Deckenlicht, Wandschatten, Löcher, die festen
   Hindernisse und die Wände ändern sich innerhalb eines Raumbesuchs nicht.
   Sie einmal auf zwei Nebenleinwände zu zeichnen und danach nur noch zu
   kopieren spart pro Bild hunderte Pfade — mit Schraffur und Handkontur
   wäre das sonst nicht bei 60 Bildern die Sekunde zu halten.
   BODENBILD liegt unter den Pfützen, AUFBAUBILD darüber.
   Der Preis: gebackene Formen zittern nicht mit dem Tuschetakt. Für ruhende
   Kulisse ist das sogar angenehmer — Feuer, Wände und alles Lebende zittern
   weiter.                                                                */
let bodenBild=null, aufbauBild=null, bildStand='', gitterStand=0;
function raumBildNeu(){ gitterStand++; }   // nach jeder Gitteränderung rufen

/* --- MAUERWERK, BODENPLATTEN, WANDLAMPEN --------------------------------
   Der Raum bekommt echtes Gemäuer statt einer Füllfläche und einen Boden
   aus Platten statt eines Schachbretts. Alles gebacken, kostet zur Laufzeit
   also nichts. Die Farben kommen aus der Etagenpalette (F.wall, F.accent,
   F.fa, F.fb), damit jede Etage ihr eigenes Gestein behält.            */

/* Boden aus grossen Steinplatten im Läuferverband. Jede Platte ist zwei
   Kacheln breit und eine hoch; jede zweite Reihe ist um eine halbe Platte
   versetzt, sonst entstünde wieder ein Gitter. Die Fuge ist dunkel, die
   Oberkante jeder Platte fängt etwas Licht. */
function bodenPlatten(bw,bh,room,F){
  const pw=TILE*2, ph=TILE;
  const basis=Math.abs(room.gx*1237+room.gy*7919)+5;
  ctx.fillStyle=F.fb; ctx.fillRect(RX,RY,bw,bh);      // Fugenfarbe als Grund
  ctx.save();
  ctx.beginPath(); ctx.rect(RX,RY,bw,bh); ctx.clip();
  for(let r=0;r<ROWS;r++){
    const versatz=(r%2)?pw*0.5:0;
    for(let x=RX-pw; x<RX+bw+pw; x+=pw){
      const px=x+versatz, py=RY+r*ph;
      const k=basis+Math.abs(Math.round(px))*13+r*97;
      ctx.fillStyle=F.fa;
      ctx.fillRect(px+1,py+1,pw-2,ph-2);
      /* Jede Platte etwas anders hell — sonst wirkt der Boden gegossen. */
      const v=rausch(k);
      ctx.fillStyle=v>0.5?`rgba(255,248,232,${(v-0.5)*0.13})`
                         :`rgba(0,0,0,${(0.5-v)*0.17})`;
      ctx.fillRect(px+1,py+1,pw-2,ph-2);
      ctx.fillStyle='rgba(255,248,232,0.085)';        // Lichtkante oben
      ctx.fillRect(px+1,py+1,pw-2,1.2);
      ctx.fillStyle='rgba(0,0,0,0.30)';                // Schattenkante unten
      ctx.fillRect(px+1,py+ph-2.2,pw-2,1.4);
      ctx.fillStyle='rgba(0,0,0,0.22)';                // Fuge rechts
      ctx.fillRect(px+pw-2,py+1,1.2,ph-2);
    }
  }
  ctx.restore();
}

/* Mauerwerk in der Wandbande: waagerechte Schichten mit versetzten Fugen.
   Oben und links fangen die Steine Licht, unten und rechts liegen sie im
   Schatten — dieselbe Lichtrichtung wie überall sonst. */
function mauerwerk(bw,bh,rand,F,room){
  const sh=9;                                    // Schichthöhe
  const basis=Math.abs(room.gx*3319+room.gy*2621)+3;
  const stein=(x,y,w,h,k,hell)=>{
    const v=rausch(k);
    ctx.fillStyle=v>0.5?`rgba(255,246,228,${0.05+(v-0.5)*0.10})`
                       :`rgba(0,0,0,${0.05+(0.5-v)*0.16})`;
    ctx.fillRect(x,y,w,h);
    ctx.fillStyle='rgba(0,0,0,0.34)';             // Fuge rechts und unten
    ctx.fillRect(x+w-1,y,1,h);
    ctx.fillRect(x,y+h-1,w,1);
    if(hell){ ctx.fillStyle='rgba(255,246,228,0.10)'; ctx.fillRect(x,y,w,1); }
  };
  const bande=(x0,y0,w,h,hell)=>{
    ctx.save(); ctx.beginPath(); ctx.rect(x0,y0,w,h); ctx.clip();
    let reihe=0;
    for(let y=y0; y<y0+h; y+=sh, reihe++){
      const sw=rand, versatz=(reihe%2)?sw*0.5:0;
      for(let x=x0-sw; x<x0+w+sw; x+=sw)
        stein(x+versatz,y,sw,sh,basis+Math.abs(Math.round(x))*7+reihe*53,hell);
    }
    ctx.restore();
  };
  bande(RX-rand,RY-rand,bw+rand*2,rand,true);           // oben, im Licht
  bande(RX-rand,RY+bh,bw+rand*2,rand,false);            // unten, im Schatten
  bande(RX-rand,RY-rand,rand,bh+rand*2,true);           // links
  bande(RX+bw,RY-rand,rand,bh+rand*2,false);            // rechts
}

/* Eckplatten: an den vier Ecken sitzt ein grösserer, dunklerer Block, der
   das Gemäuer sichtbar zusammenhält. */
function eckPlatten(bw,bh,rand,F){
  const s=rand;
  const platte=(x,y)=>{
    ctx.fillStyle='rgba(0,0,0,0.30)'; ctx.fillRect(x,y,s,s);
    ctx.fillStyle='rgba(255,246,228,0.09)'; ctx.fillRect(x,y,s,1.5);
    ctx.fillRect(x,y,1.5,s);
    ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(x,y+s-1.5,s,1.5);
    ctx.fillRect(x+s-1.5,y,1.5,s);
  };
  platte(RX-rand,RY-rand); platte(RX+bw,RY-rand);
  platte(RX-rand,RY+bh);   platte(RX+bw,RY+bh);
}

/* Zwei Lampen an der oberen Wandbande. `teil` trennt die beiden Lagen: die
   Fassung gehört auf die Wand, der Lichtkegel auf den Boden darunter. */
function wandLampen(bw,bh,rand,HS,F,teil){
  const stellen=[RX+bw*0.24, RX+bw*0.76];
  const y=RY-rand*0.45;
  for(const x of stellen){
    if(teil==='schein'){
      const g=ctx.createRadialGradient(x,RY,0,x,RY,TILE*2.6);
      g.addColorStop(0,HS.feuerschein||'rgba(232,134,42,0.30)');
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.save(); ctx.beginPath(); ctx.rect(RX,RY,bw,bh); ctx.clip();
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,RY,TILE*2.6,0,TAU); ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle='rgba(0,0,0,0.45)';                 // Halterung
      ctx.fillRect(x-4,y-5,8,10);
      ctx.fillStyle=F.accent||'#5a442f';
      ctx.fillRect(x-3,y-4,6,8);
      const g=ctx.createRadialGradient(x,y,0,x,y,9);    // Schein an der Wand
      g.addColorStop(0,'rgba(255,214,140,0.85)');
      g.addColorStop(1,'rgba(255,180,90,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,9,0,TAU); ctx.fill();
      ctx.fillStyle='#ffe6a8';
      ctx.beginPath(); ctx.ellipse(x,y,2.1,2.8,0,0,TAU); ctx.fill();
    }
  }
}

/* --- TIEFE IM RAUM ----------------------------------------------------
   Vier gebackene Lagen, die aus der flachen Kachelfläche einen Raum mit
   Boden, Kante und Ecken machen. Alle sind bewusst zurückhaltend: der
   Auftrag ist Tiefe, nicht Dunkelheit — Gegner und Geschosse müssen im
   Gefecht lesbar bleiben.                                              */

/* Grosse weiche Flecken über dem Schachbrett. Heller und dunkler wechseln
   sich ab, damit der Boden nicht wie eine Tapete wirkt. */
/* Grosse weiche Flecken über dem Schachbrett. Heller und dunkler wechseln
   sich ab, damit der Boden nicht wie eine Tapete wirkt.

   Gezeichnet wird auf einer kleinen Hilfsflaeche und danach hochskaliert:
   weiche Verlaeufe brauchen keine volle Aufloesung, und in voller Groesse
   kostete diese eine Lage 6,3 der 26,6 ms eines Raumwechsels. Klein
   gezeichnet sind es 0,3 ms — bei gleichem Ergebnis, weil das Hochziehen
   die Flecken ohnehin weichzeichnet.                                     */
let struktBild=null, struktCtx=null;
function bodenStruktur(bw,bh,room){
  const kb=Math.max(8,bw>>2), kh=Math.max(8,bh>>2);   // Viertelaufloesung
  if(!struktBild||struktBild.width!==kb||struktBild.height!==kh){
    struktBild=document.createElement('canvas');
    struktBild.width=kb; struktBild.height=kh;
    struktCtx=struktBild.getContext('2d');
  }
  const q=struktCtx;
  q.setTransform(1,0,0,1,0,0);
  q.clearRect(0,0,kb,kh);
  const basis=Math.abs(room.gx*7919+room.gy*104729)+7;
  for(let i=0;i<14;i++){
    const k=basis+i*37;
    const x=rausch(k)*kb, y=rausch(k+11)*kh;
    const r=(TILE>>2)*(1.4+rausch(k+23)*2.6);
    const hell=rausch(k+31)>0.5;
    const g=q.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0, hell?'rgba(255,240,215,0.055)':'rgba(0,0,0,0.075)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    q.fillStyle=g; q.beginPath(); q.arc(x,y,r,0,TAU); q.fill();
  }
  const merk=ctx.imageSmoothingEnabled;
  ctx.imageSmoothingEnabled=true;                     // weich hochziehen
  ctx.drawImage(struktBild,RX,RY,bw,bh);
  ctx.imageSmoothingEnabled=merk;
}

/* Die Lippe: ein heller Grat direkt an der Wand, darunter der bereits
   vorhandene Schatten. Erst dieses Paar aus hell und dunkel liest sich als
   Kante statt als aufgemalter Streifen. Das Licht kommt von oben links,
   deshalb sind oben und links der helle, unten und rechts der dunkle Grat. */
function wandKante(bw,bh,HS){
  ctx.save();
  ctx.globalAlpha=0.5;
  ctx.fillStyle='rgba(255,238,208,0.22)';
  ctx.fillRect(RX,RY,bw,2);                 // Oberkante faengt das Licht
  ctx.fillRect(RX,RY,2,bh);                 // linke Kante ebenso
  ctx.fillStyle='rgba(0,0,0,0.30)';
  ctx.fillRect(RX,RY+bh-2,bw,2);            // Unterkante liegt im Schatten
  ctx.fillRect(RX+bw-2,RY,2,bh);
  ctx.restore();
}

/* Ausgebrochene Stellen entlang der Wandkante: kleine Kerben im Boden, die
   den geraden Abschluss brechen. Nutzt die Tiefenfarbe der Etage, sieht auf
   jeder Etage also anders aus. */
function randSchaden(bw,bh,room,HS){
  const basis=Math.abs(room.gx*3571+room.gy*6733)+29;
  ctx.save();
  ctx.beginPath(); ctx.rect(RX,RY,bw,bh); ctx.clip();
  for(let i=0;i<10;i++){
    const k=basis+i*53;
    const seite=(rausch(k)*4)|0;
    const laenge=TILE*(0.6+rausch(k+7)*1.3);
    const tiefe =TILE*(0.10+rausch(k+13)*0.20);
    const n=7;
    /* Aussen buendig an der Wand, innen ausgefranst — so liest es sich als
       ausgebrochene Kante und nicht als aufgemalter Zacken. */
    const punkte=[];
    if(seite<2){                                  // oben oder unten
      const x0=RX+rausch(k+3)*(bw-laenge);
      const y =seite===0?RY:RY+bh, vz=seite===0?1:-1;
      punkte.push([x0,y],[x0+laenge,y]);
      for(let q=n;q>=0;q--){
        const t=q/n;
        const ein=tiefe*(0.35+rausch(k+q*17)*0.65)*Math.sin(Math.PI*t);
        punkte.push([x0+t*laenge, y+vz*ein]);
      }
    } else {                                      // links oder rechts
      const y0=RY+rausch(k+3)*(bh-laenge);
      const x =seite===2?RX:RX+bw, vz=seite===2?1:-1;
      punkte.push([x,y0],[x,y0+laenge]);
      for(let q=n;q>=0;q--){
        const t=q/n;
        const ein=tiefe*(0.35+rausch(k+q*17)*0.65)*Math.sin(Math.PI*t);
        punkte.push([x+vz*ein, y0+t*laenge]);
      }
    }
    ctx.beginPath();
    punkte.forEach(([px,py],q)=>q?ctx.lineTo(px,py):ctx.moveTo(px,py));
    ctx.closePath();
    ctx.fillStyle=HS.tiefe||'#0b0806';
    ctx.globalAlpha=0.34; ctx.fill();
    ctx.globalAlpha=0.16; ctx.strokeStyle='rgba(255,236,205,0.55)';
    ctx.lineWidth=0.8; ctx.stroke();
  }
  ctx.restore();
}

/* Dunkle Ecken. Anders als die bildschirmweite Vignette folgt das hier der
   Raumform, sackt also genau dort ab, wo der Raum endet. Die Mitte bleibt
   voellig unangetastet, damit die Spielflaeche lesbar bleibt. */
let eckenBild=null;
function raumEcken(bw,bh){
  const kb=Math.max(8,bw>>2), kh=Math.max(8,bh>>2);
  if(!eckenBild||eckenBild.width!==kb||eckenBild.height!==kh){
    eckenBild=document.createElement('canvas');
    eckenBild.width=kb; eckenBild.height=kh;
    const q=eckenBild.getContext('2d');
    const g=q.createRadialGradient(kb/2,kh/2,kh*0.34,kb/2,kh/2,kb*0.60);
    g.addColorStop(0,   'rgba(0,0,0,0)');
    g.addColorStop(0.66,'rgba(0,0,0,0.055)');
    g.addColorStop(1,   'rgba(0,0,0,0.21)');
    q.fillStyle=g; q.fillRect(0,0,kb,kh);
  }
  const merk=ctx.imageSmoothingEnabled;
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(eckenBild,RX,RY,bw,bh);
  ctx.imageSmoothingEnabled=merk;
}

function raumBildBacken(stand){
  const F=G.floor.data, HS=handschrift(), room=G.room;
  const bw=COLS*TILE, bh=ROWS*TILE, rand=26;
  if(!bodenBild||bodenBild.width!==W*SKALA){
    bodenBild=document.createElement('canvas');
    aufbauBild=document.createElement('canvas');
    for(const b of [bodenBild,aufbauBild]){ b.width=W*SKALA; b.height=H*SKALA; }
  }
  const echterCtx=ctx, zaehlerVorher=formZaehler;
  try{

  /* ---- Lage 1: alles, was flach am Boden liegt ---- */
  ctx=bodenBild.getContext('2d');
  ctx.setTransform(SKALA,0,0,SKALA,0,0); ctx.clearRect(0,0,W,H);
  ctx.imageSmoothingEnabled=false;
  flaecheBeginnen(); tuscheAn=false;

  // Boden: grosse Steinplatten im Laeuferverband statt Schachbrett.
  bodenPlatten(bw,bh,room,F);
  /* Bodenhandschrift der Etage: liegt IM Boden, ohne Kontur und ohne
     Schlagschatten — dadurch klar von Hindernissen zu unterscheiden. Die
     Streuung hängt an der Raumkoordinate, ist also bei jedem Betreten
     dieselbe. Nur gut jedes dritte freie Feld bekommt etwas ab. */
  if(HS.bodenDeko) for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(room.grid[r][c]) continue;
    const k=Math.abs(room.gx*911+room.gy*577+r*31+c*7)+13;
    if(rausch(k)>0.42) continue;
    ctx.save(); ctx.globalAlpha=0.9;
    /* Der Deko-Schluessel muss ein anderer sein als der, der oben ueber das
       OB entscheidet. Sonst waehlt jede bodenDeko ihre Variante mit
       (rausch(k)*4)|0 aus einem Wert, der hier schon auf hoechstens 0,42
       eingegrenzt wurde — 0,42*4 = 1,68, also kamen die Varianten 2 und 3
       auf keiner Etage jemals vor. */
    HS.bodenDeko(RX+c*TILE+TILE/2,RY+r*TILE+TILE/2,TILE,k+101);
    ctx.restore();
  }
  // Spezialraum-Bodenfärbung
  if(room.type==='treasure'){ ctx.fillStyle='rgba(212,175,55,0.05)'; ctx.fillRect(RX,RY,bw,bh); }
  if(room.type==='curse')   { ctx.fillStyle='rgba(160,30,30,0.08)';  ctx.fillRect(RX,RY,bw,bh); }
  if(room.type==='secret')  { ctx.fillStyle='rgba(120,80,200,0.06)'; ctx.fillRect(RX,RY,bw,bh); }
  if(room.type==='devil')   { ctx.fillStyle='rgba(160,20,30,0.16)';  ctx.fillRect(RX,RY,bw,bh); }
  if(room.type==='angel')   { ctx.fillStyle='rgba(240,235,205,0.10)';ctx.fillRect(RX,RY,bw,bh); }

  /* Bodenstruktur: grosse, weiche Flecken über dem Schachbrett. Ohne sie
     liest sich der Boden als flache Kachelfläche. Die Flecken sind an die
     Raumkoordinate geknüpft, sehen bei jedem Betreten also gleich aus, und
     bleiben mit höchstens 6 % Deckkraft weit unter allem, was Gegner oder
     Geschosse verdecken könnte. */
  bodenStruktur(bw,bh,room);
  wandLampen(bw,bh,rand,HS,F,'schein');   // Lichtkegel der Wandlampen

  // Deckenlampe: heller zur Mitte, dunkel zu den Rändern
  let gr=ctx.createRadialGradient(RX+bw*0.5,RY+bh*0.34,0,RX+bw*0.5,RY+bh*0.5,bw*0.62);
  gr.addColorStop(0,HS.licht); gr.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gr; ctx.fillRect(RX,RY,bw,bh);

  /* Die Wände werfen Schatten auf den Boden. Das Licht kommt von oben
     links, deshalb ist der Schatten oben am tiefsten und unten am flachsten. */
  const wandSchatten=(x0,y0,x1,y1,w0,h0)=>{
    const lg=ctx.createLinearGradient(x0,y0,x1,y1);
    lg.addColorStop(0,'rgba(0,0,0,0.38)'); lg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=lg; ctx.fillRect(x0,y0,w0,h0);
  };
  wandSchatten(RX,RY,RX,RY+TILE*1.5,bw,TILE*1.5);
  wandSchatten(RX,RY,RX+TILE*1.1,RY,TILE*1.1,bh);
  wandSchatten(RX+bw,RY,RX+bw-TILE*0.7,RY,-TILE*0.7,bh);
  wandSchatten(RX,RY+bh,RX,RY+bh-TILE*0.55,bw,-TILE*0.55);

  /* Tiefe: erst die Lippe, an der die Wand auf den Boden trifft, dann
     ausgebrochene Stellen an dieser Kante, zuletzt die dunklen Ecken.
     Alles gebacken — zur Laufzeit kostet es nichts. */
  wandKante(bw,bh,HS);
  randSchaden(bw,bh,room,HS);
  raumEcken(bw,bh);

  /* Löcher: erst der Schlund, dann die Innenwände. Die hellen und dunklen
     Kanten sind es, die dem Loch spürbare Tiefe geben. */
  tuscheAn=true;
  const istLoch=(r,c)=>r>=0&&r<ROWS&&c>=0&&c<COLS&&!!room.grid[r][c]&&room.grid[r][c].t==='pit';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(!istLoch(r,c)) continue;
    const x=RX+c*TILE, y=RY+r*TILE;
    ctx.fillStyle=HS.tiefe; ctx.fillRect(x,y,TILE,TILE);
    ctx.save(); ctx.beginPath(); ctx.rect(x,y,TILE,TILE); ctx.clip();
    HS.loch(x+TILE/2,y+TILE/2,TILE);
    ctx.restore();
    if(!istLoch(r-1,c)){                       // Innenwand oben
      const ig=ctx.createLinearGradient(0,y,0,y+TILE*0.5);
      ig.addColorStop(0,'rgba(255,255,255,0.10)'); ig.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=ig; ctx.fillRect(x,y,TILE,TILE*0.5);
      ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(x,y,TILE,4);
    }
    if(!istLoch(r+1,c)){                       // helle Bruchkante unten
      ctx.fillStyle='rgba(255,255,255,0.07)'; ctx.fillRect(x,y+TILE-5,TILE,5);
    }
    if(!istLoch(r,c-1)){ ctx.fillStyle='rgba(0,0,0,0.35)';       ctx.fillRect(x,y,4,TILE); }
    if(!istLoch(r,c+1)){ ctx.fillStyle='rgba(255,255,255,0.05)'; ctx.fillRect(x+TILE-4,y,4,TILE); }
  }

  /* ---- Lage 2: was über den Pfützen steht ---- */
  ctx=aufbauBild.getContext('2d');
  ctx.setTransform(SKALA,0,0,SKALA,0,0); ctx.clearRect(0,0,W,H);
  ctx.imageSmoothingEnabled=false;
  flaecheBeginnen(); tuscheAn=true;

  // Schlagschatten aller stehenden Hindernisse, Licht von oben links
  ctx.save(); ctx.globalAlpha=0.42; ctx.fillStyle='#000000';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const z=room.grid[r][c]; if(!z||(z.t!=='rock'&&z.t!=='poop')) continue;
    ctx.beginPath();
    ctx.ellipse(RX+c*TILE+TILE/2+TILE*0.14,RY+r*TILE+TILE/2+TILE*0.24,TILE*0.4,TILE*0.17,0,0,TAU);
    ctx.fill();
  }
  ctx.restore();

  // Die Hindernisse selbst, in der Handschrift der Etage
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const z=room.grid[r][c]; if(!z) continue;
    const cx=RX+c*TILE+TILE/2, cy=RY+r*TILE+TILE/2;
    if(z.t==='rock')       HS.stein(cx,cy,TILE);
    else if(z.t==='spike') HS.stachel(cx,cy,TILE);
    else if(z.t==='poop'){ HS.wuchs(cx,cy,TILE);
      if(z.hp<2){ ctx.strokeStyle='rgba(20,16,20,0.8)'; ctx.lineWidth=1.4;  // angeschlagen
        ctx.beginPath(); ctx.moveTo(cx-5,cy-3); ctx.lineTo(cx-1,cy+2);
        ctx.lineTo(cx-4,cy+6); ctx.stroke(); } }
  }

  /* Wände zuletzt: Lichtkante oben und links, Schattenkante unten und
     rechts — dieselbe Lichtrichtung wie bei den Hindernissen. */
  tuscheAn=false;
  ctx.fillStyle=F.wall;
  ctx.fillRect(RX-rand,RY-rand,bw+rand*2,rand);
  ctx.fillRect(RX-rand,RY+bh,bw+rand*2,rand);
  ctx.fillRect(RX-rand,RY-rand,rand,bh+rand*2);
  ctx.fillRect(RX+bw,RY-rand,rand,bh+rand*2);
  // Mauerwerk in die Bande, danach Eckplatten und Wandlampen
  mauerwerk(bw,bh,rand,F,room);
  eckPlatten(bw,bh,rand,F);
  wandLampen(bw,bh,rand,HS,F,'fassung');
  ctx.fillStyle='rgba(255,255,255,0.14)';
  ctx.fillRect(RX-rand,RY-rand,bw+rand*2,7);
  ctx.fillRect(RX-rand,RY-rand,7,bh+rand*2);
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.fillRect(RX-rand,RY+bh+rand-8,bw+rand*2,8);
  ctx.fillRect(RX+bw+rand-8,RY-rand,8,bh+rand*2);
  ctx.strokeStyle=F.accent; ctx.lineWidth=2;
  ctx.strokeRect(RX-1,RY-1,bw+2,bh+2);
  // Ziegelfugen im Mauerwerk
  ctx.fillStyle='rgba(0,0,0,0.15)';
  for(let i=0;i<COLS+2;i+=2){
    ctx.fillRect(RX-rand+i*TILE,RY-rand,2,10);
    ctx.fillRect(RX-rand+i*TILE+TILE,RY+bh+14,2,10);
  }

  bildStand=stand;
  } finally {
    // Der Zeichenkontext MUSS zurück, sonst zeichnet das Spiel ab hier
    // unsichtbar auf die Nebenleinwand weiter.
    ctx=echterCtx; tuscheAn=true; formZaehler=zaehlerVorher;
  }
}

/* Item-Tafeln werden erst gesammelt und ganz zuletzt gezeichnet, damit sie
   nicht von Gegnern, Steinen oder dem Spieler verdeckt werden. */
let tafelWarteschlange=[], tafelnGezeichnet=0;
function tafelnZeichnen(){
  for(const [id,x,y,preis,herz] of tafelWarteschlange) itemTafel(id,x,y,preis,herz);
  tafelnGezeichnet=tafelWarteschlange.length;   // bleibt nach dem Bild ablesbar
  tafelWarteschlange.length=0;
}

function drawRoom(){
  const HS=handschrift(), t=performance.now()/1000;
  const bw=COLS*TILE, bh=ROWS*TILE;
  const stand=G.seedNum+'|'+G.depth+'|'+G.roomKey+'|'+gitterStand;
  if(bildStand!==stand) raumBildBacken(stand);

  ctx.drawImage(bodenBild,0,0,W,H);

  // Möblierung der Teufels- oder Engelskammer, direkt auf dem Boden
  const kammer=kammerBild();
  if(kammer){ ctx.save(); ctx.beginPath();
    ctx.rect(RX,RY,bw,bh); ctx.clip(); kammer.zeichnen(t); ctx.restore(); }

  // Feuerstellen leuchten den Boden aus — flackert, bleibt also lebendig
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const z=G.room.grid[r][c]; if(!z||z.t!=='fire') continue;
    const x=RX+c*TILE+TILE/2, y=RY+r*TILE+TILE/2;
    const fl=0.75+Math.sin(t*7+c*1.7+r)*0.25;
    const fg=ctx.createRadialGradient(x,y,0,x,y,TILE*1.7);
    fg.addColorStop(0,z.red?'rgba(230,50,50,0.4)':HS.feuerschein);
    fg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.save(); ctx.globalAlpha=fl; ctx.fillStyle=fg;
    ctx.fillRect(x-TILE*1.7,y-TILE*1.7,TILE*3.4,TILE*3.4); ctx.restore();
  }

  /* Pfützen. Gegnerische violett, eigene giftgrün, Glut orange, Netze silbrig.
     Sporenwolken werden erst nach den Figuren gezeichnet, weil sie die Sicht
     nehmen sollen — siehe drawSporen(). */
  tuscheAn=false;
  for(const c of G.creeps){
    if(c.sporen) continue;
    const a=clamp(c.t/2,0.15,0.5);
    if(c.netz){                                   // Netz: Fäden statt Pfütze
      ctx.strokeStyle=`rgba(216,216,228,${a*0.9})`; ctx.lineWidth=1;
      for(let i=0;i<6;i++){ const w=i*Math.PI/6;
        ctx.beginPath();
        ctx.moveTo(c.x-Math.cos(w)*c.r,c.y-Math.sin(w)*c.r*0.6);
        ctx.lineTo(c.x+Math.cos(w)*c.r,c.y+Math.sin(w)*c.r*0.6); ctx.stroke(); }
      for(const rr of [0.4,0.75]){ ctx.beginPath();
        ctx.ellipse(c.x,c.y,c.r*rr,c.r*0.6*rr,0,0,TAU); ctx.stroke(); }
      continue;
    }
    if(c.nagel){                                  // ausgeschlagener Nagel
      ctx.strokeStyle=`rgba(150,142,128,${a*1.6})`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(c.x-4,c.y+3); ctx.lineTo(c.x+4,c.y-3); ctx.stroke();
      ctx.fillStyle=`rgba(200,192,176,${a*1.6})`;
      ctx.beginPath(); ctx.arc(c.x+4,c.y-3,2,0,TAU); ctx.fill();
      continue;
    }
    if(c.glatt){                                  // nasse Spur des Häutlings
      ctx.fillStyle=`rgba(150,40,50,${a*0.8})`;
      ctx.beginPath(); ctx.ellipse(c.x,c.y,c.r,c.r*0.55,0,0,TAU); ctx.fill();
      ctx.fillStyle=`rgba(230,180,190,${a*0.5})`;
      ctx.beginPath(); ctx.ellipse(c.x-c.r*0.25,c.y-c.r*0.14,c.r*0.4,c.r*0.2,0,0,TAU); ctx.fill();
      continue;
    }
    const unten=c.feindlich?(c.glut?`rgba(190,70,20,${a})`:`rgba(120,60,160,${a})`)
                           :(c.glut?`rgba(210,90,20,${a})`:`rgba(120,200,60,${a})`);
    const oben =c.feindlich?(c.glut?`rgba(255,150,50,${a*0.8})`:`rgba(170,110,210,${a*0.7})`)
                           :(c.glut?`rgba(255,180,60,${a*0.8})`:`rgba(180,240,120,${a*0.7})`);
    ctx.fillStyle=unten;
    ctx.beginPath();ctx.ellipse(c.x,c.y,c.r,c.r*0.6,0,0,TAU);ctx.fill();
    ctx.fillStyle=oben;
    ctx.beginPath();ctx.ellipse(c.x-c.r*0.2,c.y-c.r*0.12,c.r*0.5,c.r*0.28,0,0,TAU);ctx.fill();
  }
  tuscheAn=true;

  // Steine, Stacheln, Wucherungen und die Wände in einem Zug
  ctx.drawImage(aufbauBild,0,0,W,H);

  // Feuer selbst: züngelt, muss also jedes Bild neu
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const z=G.room.grid[r][c]; if(!z||z.t!=='fire') continue;
    const cx=RX+c*TILE+TILE/2, cy=RY+r*TILE+TILE/2;
    shadow(cx,cy+10,10);
    HS.feuer(cx,cy,TILE,z.red,t);
  }

  // Wandhandschrift der Etage: Fleisch pulst, Tropfen laufen — bleibt lebendig
  if(HS.wandDeko){ ctx.save(); HS.wandDeko(RX,RY,bw,bh,26,t); ctx.restore(); }

  // Türen
  for(const d in G.room.doors) drawDoor(d,G.room.doors[d]);

  // Falltür
  if(G.room.trapdoor){
    const x=tx(8),y=ty(3);
    rrect(x-14,y-11,28,22,'#0a0a0a');
    ctx.strokeStyle='#6e675e';ctx.lineWidth=2;ctx.strokeRect(x-14,y-11,28,22);
    txt('▼',x,y,'#6e675e',10);
  }
  // Podeste
  for(const pd of G.room.pedestals){
    if(pd.taken) continue;
    shadow(pd.x,pd.y+8,12);
    rrect(pd.x-10,pd.y,20,8,'#55504a');rrect(pd.x-8,pd.y-4,16,6,'#6e675e');
    const bob=Math.sin(performance.now()/300)*2;
    blindKachel=true; drawItemIcon(pd.itemId,pd.x,pd.y-14+bob,1.2); blindKachel=false;
    if(pd.price) txt(pd.price+'¢',pd.x,pd.y+16,'#ffd75a',9);
    // Wer nah genug steht, erfährt vor dem Zugreifen, was das Ding tut
    if(dist(G.player,pd)<40){
      if(fluchAktiv('blindheit')) tafelWarteschlange.push(['__blind__',pd.x,pd.y-24,pd.price,pd.herzPreis]);
      else tafelWarteschlange.push([pd.itemId,pd.x,pd.y-24,pd.price,pd.herzPreis]);
    }
    else if(pd.herzPreis){                   // Preis in Herzen statt in Münzen
      const p2=G.player;
      const bezahlbar=(p2.redMax-pd.herzPreis*2>=2&&p2.red-pd.herzPreis*2>=1)
                      ||p2.soul.length>=3;
      tuscheAn=false;
      for(let i=0;i<pd.herzPreis;i++)
        drawHeart(pd.x-pd.herzPreis*5+i*10+5,pd.y+18,bezahlbar?'full':'empty','red');
      tuscheAn=true;
    }
  }
  // Automaten
  for(const m of G.room.machines){
    shadow(m.x,m.y+14,12);
    const col=m.broken?'#4a4a4a':(m.kind==='slot'?'#b0684a':'#6a4ab0');
    rrect(m.x-12,m.y-16,24,30,col);
    rrect(m.x-9,m.y-12,18,10,'#111');
    txt(m.broken?'X':(m.kind==='slot'?'?':'★'),m.x,m.y-7,m.broken?'#666':'#ffd75a',9);
    rrect(m.x-8,m.y+2,16,4,'#222');
  }
}

/* Druckplatte im Herausforderungsraum: eine eiserne Scheibe im Boden, die
   pocht, solange sie unberührt ist, und beim Auslösen eingedrückt wird.
   Ist der Raum bestanden, bleibt nur die kalte Platte übrig.            */
function drawArenaPlatte(){
  const room=G.room; if(!room||room.type!=='arena') return;
  const mitte={x:tx(6),y:ty(3)};
  const gedrueckt=!room.platte;
  const puls=gedrueckt?0:(Math.sin(performance.now()/420)+1)/2;
  ctx.save();
  ctx.globalAlpha=0.9;
  ctx.beginPath(); ctx.ellipse(mitte.x,mitte.y+2,20,13,0,0,TAU);
  ctx.fillStyle='#2a2f35'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(mitte.x,mitte.y-(gedrueckt?0:1.5),17,11,0,0,TAU);
  ctx.fillStyle=gedrueckt?'#3e464e':'#4e5a64'; ctx.fill();
  ctx.strokeStyle='#1c2026'; ctx.lineWidth=1.2; ctx.stroke();
  /* Vier Nieten und ein Ring, der im Takt aufglüht. */
  ctx.fillStyle='#78848e';
  for(let i=0;i<4;i++){ const a=i*TAU/4+0.79;
    ctx.beginPath(); ctx.arc(mitte.x+Math.cos(a)*12,mitte.y-1+Math.sin(a)*7.6,1.4,0,TAU);
    ctx.fill(); }
  if(!gedrueckt){
    ctx.strokeStyle=`rgba(200,130,58,${0.35+puls*0.5})`; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.ellipse(mitte.x,mitte.y-1.5,10+puls*2.5,6.5+puls*1.6,0,0,TAU);
    ctx.stroke();
  }
  ctx.restore();
  /* Zählwerk über der Platte, solange die Wellen laufen. */
  if(G.arena&&G.arena.laeuft){
    const merk=tuscheAn; tuscheAn=false;
    txt('Welle '+G.arena.welle+' / '+G.arena.max,mitte.x,RY+14,'#ffd75a',9);
    tuscheAn=merk;
  }
}

/* Bibliothek: unter jedem noch liegenden Wahlstück steht ein Lesepult. */
function drawPulte(){
  const room=G.room; if(!room||room.type!=='library') return;
  for(const q of G.pickups){
    if(!q.wahl||q.dead) continue;
    shadow(q.x,q.y+10,11);
    ctx.fillStyle='#4a3a28'; ctx.fillRect(q.x-2.5,q.y+1,5,9);      // Ständer
    ctx.fillStyle='#6a5238';                                        // schräge Ablage
    ctx.beginPath(); ctx.moveTo(q.x-11,q.y+3); ctx.lineTo(q.x+11,q.y+3);
    ctx.lineTo(q.x+9,q.y-3); ctx.lineTo(q.x-9,q.y-3); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#2e2418'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle='#8a76a0'; ctx.fillRect(q.x-9,q.y-3.6,18,1.4);   // Messingkante
  }
}

/* Raumstimmung über allem: der Dunst der Etage und die Vignette, die die
   Dunkelheit von den Rändern hereindrückt. Wird nach der Spielwelt und vor
   dem HUD gezeichnet, damit das HUD lesbar bleibt. */
let vignette=null;
function raumStimmung(){
  const HS=handschrift(), t=performance.now()/1000;
  ctx.save();
  ctx.beginPath(); ctx.rect(RX,RY,COLS*TILE,ROWS*TILE); ctx.clip();
  if(HS.dunst) HS.dunst(RX,RY,COLS*TILE,ROWS*TILE,t);
  ctx.restore();
  if(!vignette){
    vignette=ctx.createRadialGradient(W/2,H*0.46,Math.min(W,H)*0.34,W/2,H*0.5,Math.max(W,H)*0.72);
    vignette.addColorStop(0,'rgba(0,0,0,0)'); vignette.addColorStop(1,'rgba(0,0,0,0.55)');
  }
  ctx.fillStyle=vignette; ctx.fillRect(0,0,W,H);
  if(fluchAktiv('finsternis')) finsternisSchleier();
}

/* Fluch der Finsternis: über den Raum legt sich Schwarz, in das nur der
   Spieler ein Loch brennt. Feuerstellen und brennende Gegner leuchten
   mit — man kann sich also Licht schaffen.

   Der Schleier entsteht auf einer eigenen Ebene: 'destination-out' würde
   sonst nicht bloß das Schwarz, sondern auch die Spielwelt darunter
   wegradieren. Erst das fertige Bild wird über den Raum gelegt.        */
let finsterBild=null, finsterCtx=null;
function finsternisSchleier(){
  const p=G.player; if(!p||!G.room) return;
  if(!finsterBild){
    finsterBild=document.createElement('canvas');
    finsterBild.width=COLS*TILE; finsterBild.height=ROWS*TILE;
    finsterCtx=finsterBild.getContext('2d');
  }
  const g=finsterCtx;
  g.setTransform(1,0,0,1,0,0);
  g.globalCompositeOperation='source-over';
  g.clearRect(0,0,finsterBild.width,finsterBild.height);
  g.fillStyle='rgba(0,0,0,0.93)';
  g.fillRect(0,0,finsterBild.width,finsterBild.height);
  g.globalCompositeOperation='destination-out';
  /* Löcher werden in Raumkoordinaten gestanzt (Raumecke = 0,0). */
  const loch=(x,y,r,staerke)=>{
    const lx=x-RX, ly=y-RY;
    const grad=g.createRadialGradient(lx,ly,0,lx,ly,r);
    grad.addColorStop(0,`rgba(0,0,0,${staerke})`);
    grad.addColorStop(0.5,`rgba(0,0,0,${staerke*0.8})`);
    grad.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=grad; g.beginPath(); g.arc(lx,ly,r,0,TAU); g.fill();
  };
  /* Das eigene Licht flackert leicht, sonst wirkt es wie ein Loch im Bild. */
  const flacker=1+Math.sin(performance.now()/170)*0.04+Math.sin(performance.now()/61)*0.02;
  loch(p.x,p.y-4,68*flacker,1);
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const z=G.room.grid[r][c];
    if(z&&z.t==='fire') loch(tx(c),ty(r),50,0.95);
  }
  for(const e of G.enemies) if(e.burn>0) loch(e.x,e.y,36,0.8);
  for(const b of G.bombs) loch(b.x,b.y,28,0.6);
  for(const c of G.creeps) if(c.glut) loch(c.x,c.y,32,0.6);
  g.globalCompositeOperation='source-over';
  ctx.drawImage(finsterBild,RX,RY);
}

/* --- TÜREN ---------------------------------------------------------------
   Gezeichnet wird immer in lokalen Koordinaten, in denen -y nach außen
   (aus dem Raum heraus) zeigt; die Wandseite ergibt sich allein aus der
   Drehung. Aufbau: dunkler Durchgang, davor zwei Türblätter, die beim
   Öffnen zur Seite wegschwenken, darüber der Rahmen in leichter
   Aufsichtsperspektive (außen breiter als innen).                        */
const DOOR_ROT={u:0, d:Math.PI, l:-Math.PI/2, r:Math.PI/2};

function doorStyle(kind){
  switch(kind){
    case 'boss':   return {rahmen:'#4a4038',hell:'#6d5f52',dunkel:'#241e1a',
                           blatt:'#5c4c44',blattTief:'#33292410',schein:'#c03a5a'};
    case 'schatz': return {rahmen:'#8a6f2a',hell:'#d4af41',dunkel:'#54410f',
                           blatt:'#b08d33',blattTief:'#7a6021'};
    case 'shop':   return {rahmen:'#7a5230',hell:'#c98a4a',dunkel:'#452c17',
                           blatt:'#9a6a3c',blattTief:'#6a4726'};
    case 'devil':  return {rahmen:'#521018',hell:'#9a2030',dunkel:'#2a070c',
                           blatt:'#3a0c12',blattTief:'#1e0508',schein:true};
    case 'angel':  return {rahmen:'#8a8270',hell:'#efe8d0',dunkel:'#544e40',
                           blatt:'#d8d0b8',blattTief:'#a09880'};
    case 'curse':  return {rahmen:'#5a2424',hell:'#833636',dunkel:'#331313',
                           blatt:'#6a2a2a',blattTief:'#431a1a',schein:'#c03a5a'};
    case 'secret': return {rahmen:'#4a4a52',hell:'#65656f',dunkel:'#2b2b31',
                           blatt:'#4a4a52',blattTief:'#2b2b31'};
    /* Arena: Eisenbeschlag, damit man den Kampfraum von außen erkennt. */
    case 'arena':  return {rahmen:'#3e4650',hell:'#66727e',dunkel:'#20262c',
                           blatt:'#4a545e',blattTief:'#2a3138',schein:'#c8823a'};
    /* Bibliothek: helles Holz mit Messington. */
    case 'bibliothek': return {rahmen:'#5a4a6a',hell:'#8a76a0',dunkel:'#2e2438',
                           blatt:'#6a5880',blattTief:'#3e3250'};
    default:       return {rahmen:'#6b5b47',hell:'#8d7862',dunkel:'#42382c',
                           blatt:'#7a6448',blattTief:'#4e3f2c'};
  }
}
function poly(pts,color){
  ctx.fillStyle=color; ctx.beginPath();
  ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath(); ctx.fill();
}
// Rahmen als Ring: äußeres Polygon minus Öffnung
function polyRing(aussen,innen,color){
  ctx.fillStyle=color; ctx.beginPath();
  ctx.moveTo(aussen[0][0],aussen[0][1]);
  for(let i=1;i<aussen.length;i++) ctx.lineTo(aussen[i][0],aussen[i][1]);
  ctx.closePath();
  ctx.moveTo(innen[0][0],innen[0][1]);
  for(let i=innen.length-1;i>=1;i--) ctx.lineTo(innen[i][0],innen[i][1]);
  ctx.closePath();
  ctx.fill('evenodd');
}

function drawDoor(d,door){
  const e=door.edge;
  if(!e.revealed) return;   // Geheimgang oder verborgene Kammer: noch nicht da
  const dp=doorXY(d), st=doorStyle(e.kind);
  const a=clamp(door.anim===undefined?(doorPassable(door)?1:0):door.anim,0,1);

  // Rahmenform: außen (-14) breiter als innen (+13)
  const AUSSEN=[[-24,-14],[24,-14],[20,13],[-20,13]];
  const OEFFN =[[-16,-11],[16,-11],[13,12],[-13,12]];

  ctx.save();
  ctx.translate(dp.x,dp.y);
  ctx.rotate(DOOR_ROT[d]);

  // Durchgang
  poly(OEFFN,'#07070a');
  // Bossräume glühen rot aus dem Spalt
  if(st.schein&&a>0.05){
    const g=ctx.createLinearGradient(0,-11,0,12);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(1,`rgba(192,58,90,${0.30*a})`);
    ctx.fillStyle=g; ctx.beginPath();
    ctx.moveTo(-16,-11);ctx.lineTo(16,-11);ctx.lineTo(13,12);ctx.lineTo(-13,12);
    ctx.closePath(); ctx.fill();
  }

  // Türblätter — schwenken beim Öffnen nach außen zur Seite weg
  if(a<0.98){
    const b=14*(1-a*0.88);        // sichtbare Blattbreite
    const weg=a*2.5;              // Versatz nach außen
    for(const s of [-1,1]){
      const x0=s*(0.8+weg), x1=s*(0.8+weg+b), x2=s*(0.8+weg+b*0.84);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(x0,-10.5); ctx.lineTo(x1,-11); ctx.lineTo(x2,11.5); ctx.lineTo(x0,11.5);
      ctx.closePath(); ctx.clip();
      ctx.fillStyle=st.blatt; ctx.fillRect(-30,-12,60,26);
      // Maserung / Beschläge
      ctx.fillStyle=st.blattTief;
      for(let y=-7;y<11;y+=6) ctx.fillRect(-30,y,60,1.2);
      ctx.fillStyle='rgba(255,255,255,0.10)';
      ctx.fillRect(-30,-11,60,1.5);
      ctx.restore();
      // Außenkante des Blattes betonen
      ctx.strokeStyle=st.blattTief; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x1,-11); ctx.lineTo(x2,11.5); ctx.stroke();
    }
    // Vorhängeschloss bei verschlossenen Türen
    if(e.locked){
      ctx.strokeStyle='#c8a032'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,-2.5,3.2,Math.PI,0); ctx.stroke();
      rrect(-4.5,-1,9,8,'#d4af37');
      rrect(-4.5,-1,9,2,'#f0d98a');
      disc(0,3,1.6,'#4a3a10');
      ctx.fillStyle='#4a3a10'; ctx.fillRect(-0.7,3,1.4,3);
    }
  }

  // Rahmen über die Blätter legen
  polyRing(AUSSEN,OEFFN,st.rahmen);
  // Lichtkante oben, Schattenkante unten
  poly([[-24,-14],[24,-14],[22,-11],[-22,-11]],st.hell);
  poly([[-20,11],[20,11],[20,13],[-20,13]],st.dunkel);
  // Steinfugen im Rahmen
  ctx.fillStyle=st.dunkel;
  ctx.fillRect(-21,-6,4.5,1.2); ctx.fillRect(16.5,-6,4.5,1.2);
  ctx.fillRect(-20,2,4,1.2);    ctx.fillRect(16,2,4,1.2);

  /* Typ-Verzierungen. Alles bleibt innerhalb von y >= -12: die untere
     Raumwand endet knapp am Bildrand, nach außen ragende Zierrat würde
     dort abgeschnitten. */
  if(e.kind==='boss'){                       // Schädel im Türsturz
    disc(0,-8,4.2,'#d8d0c0');
    rrect(-3,-6.5,6,2.6,'#d8d0c0');
    disc(-1.7,-8.5,1.2,'#241e1a'); disc(1.7,-8.5,1.2,'#241e1a');
    ctx.fillStyle='#241e1a';
    ctx.fillRect(-1.7,-5.2,0.9,1.8); ctx.fillRect(0.8,-5.2,0.9,1.8);
    disc(-18,-12,1.8,'#8a7a66'); disc(18,-12,1.8,'#8a7a66'); // Nieten
  } else if(e.kind==='schatz'){               // goldene Nieten
    for(const nx of [-18,-9,9,18]) disc(nx,-12,1.5,'#f0d98a');
  } else if(e.kind==='shop'){                 // Münze im Türsturz
    /* Die Münze sitzt so weit oben im Sturz, dass sie dem Vorhängeschloss
       nicht ins Gehege kommt — sonst verschwimmen beide zu einem Klecks. */
    disc(0,-9.6,4.4,'#3a2a12');
    disc(0,-9.6,3.7,'#a8862a');
    disc(0,-10,3.1,'#ffd75a');
    ctx.fillStyle='#8a6a1a';
    ctx.font='bold 6px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('¢',0,-9.4);
    for(const nx of [-18,18]) disc(nx,-12,1.5,'#d8a86a');
  } else if(e.kind==='devil'){                // zwei Hörner über dem Sturz
    ctx.fillStyle='#c8384c';
    for(const vz of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(vz*4,-6.5);
      ctx.quadraticCurveTo(vz*9,-9,vz*11,-13.5);
      ctx.quadraticCurveTo(vz*7.5,-9.5,vz*5.5,-6.5);
      ctx.closePath(); ctx.fill();
    }
    disc(0,-8.5,2.4,'#2a070c');               // Auge dazwischen
    disc(0,-8.5,1.1,'#ff5a5a');
    for(const nx of [-18,18]) disc(nx,-12,1.6,'#7a1a24');
  } else if(e.kind==='angel'){                // Heiligenschein und Federn
    for(const vz of [-1,1]){                  // angedeutete Flügel im Sturz
      ctx.fillStyle='#f2ecd8'; ctx.beginPath();
      ctx.moveTo(vz*7,-7);
      ctx.quadraticCurveTo(vz*15,-12,vz*20,-11.5);
      ctx.quadraticCurveTo(vz*14,-8,vz*8,-5.5);
      ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle='#ffe8a0'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.ellipse(0,-10,6.5,2.4,0,0,TAU); ctx.stroke();
    ctx.save(); ctx.globalAlpha=0.5;
    ctx.beginPath(); ctx.ellipse(0,-10,9,3.6,0,0,TAU); ctx.stroke(); ctx.restore();
  } else if(e.kind==='curse'){                // Zähne, die in die Öffnung ragen
    ctx.fillStyle='#b0b0b8';
    for(let i=-2;i<=2;i++){ const x=i*7;
      ctx.beginPath(); ctx.moveTo(x-2.6,-11.5); ctx.lineTo(x,-5.5); ctx.lineTo(x+2.6,-11.5);
      ctx.closePath(); ctx.fill(); }
  } else if(e.kind==='secret'){               // aufgesprengter Mauerriss
    ctx.strokeStyle='#1c1c22'; ctx.lineWidth=1.4;
    ctx.beginPath();
    ctx.moveTo(-21,-11); ctx.lineTo(-13,-7); ctx.lineTo(-17,-1); ctx.lineTo(-9,4);
    ctx.moveTo(21,-11);  ctx.lineTo(14,-6);  ctx.lineTo(18,0);   ctx.lineTo(10,5);
    ctx.stroke();
    for(const bx of [-19,-8,9,19]) disc(bx,10,1.3,'#1c1c22'); // Schutt
  }
  ctx.restore();
}

/* --- Spielfigur -----------------------------------------------------------
   Großer runder Kopf auf kleinem Körper, Beine treten im Laufen abwechselnd,
   die Pupillen folgen der Schussrichtung. Die Frisur unterscheidet die
   Charaktere und wird über `frisur` in CHARS gewählt.
   Die Funktion wird auch von der Charakterauswahl benutzt, damit Vorschau
   und Spielfigur garantiert gleich aussehen.                                */
function zeichneFrisur(c,x,ky,schritt){
  const haar=c.haar||c.hood;
  ctx.fillStyle=haar;
  if(c.frisur==='stachel'){                       // kurze Stacheln
    for(let i=-2;i<=2;i++){
      const bx=x+i*3.0;
      ctx.beginPath();
      ctx.moveTo(bx-2.3, ky-5.0);
      ctx.lineTo(bx+i*0.6, ky-11.0+Math.abs(i)*1.7);
      ctx.lineTo(bx+2.3, ky-5.0);
      ctx.closePath(); ctx.fill();
    }
    ctx.beginPath(); ctx.ellipse(x,ky-4.8,8.2,3.8,0,0,TAU); ctx.fill();
  } else if(c.frisur==='zotteln'){                // Zotteln mit wippenden Büscheln
    ctx.beginPath(); ctx.ellipse(x,ky-4.4,8.7,4.6,0,0,TAU); ctx.fill();
    for(const s of [-1,1]){
      ctx.beginPath();
      ctx.ellipse(x+s*7.8, ky-1.0+schritt*s*0.9, 2.7, 4.6, s*0.32, 0, TAU);
      ctx.fill();
    }
    ctx.fillStyle='rgba(0,0,0,0.18)';             // Ponyfransen
    for(let i=-2;i<=2;i++) ctx.fillRect(x+i*3.1-0.6, ky-7.4, 1.2, 3.2);
  } else if(c.frisur==='schleier'){               // geisterhafte Schleier
    ctx.globalAlpha=0.8;
    ctx.beginPath(); ctx.ellipse(x,ky-4.8,8.5,4.2,0,0,TAU); ctx.fill();
    for(const s of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(x+s*7.4, ky-4);
      ctx.quadraticCurveTo(x+s*11.2, ky+2, x+s*6.8, ky+7.5);
      ctx.quadraticCurveTo(x+s*5.8, ky+1, x+s*5.4, ky-3);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha=1;
  } else if(c.frisur==='struppig'){               // wirrer Schopf mit Strähnen
    ctx.beginPath(); ctx.ellipse(x,ky-4.6,9.0,5.0,0,0,TAU); ctx.fill();
    for(let i=-3;i<=3;i++){
      const bx=x+i*2.6, l=4.5+((i*7)%3)*1.8;
      ctx.beginPath();
      ctx.moveTo(bx-1.4,ky-7.4);
      ctx.quadraticCurveTo(bx+i*1.3,ky-8-l,bx+i*2.1,ky-6.4-l);
      ctx.quadraticCurveTo(bx+i*0.6,ky-8.6,bx+1.4,ky-7.4);
      ctx.fill();
    }
  } else if(c.frisur==='dornenkrone'){            // Lockenschopf unter Rosenkranz
    ctx.beginPath(); ctx.ellipse(x,ky-3.6,9.2,5.6,0,0,TAU); ctx.fill();
    for(const s of [-1,1]){                       // lange Locken seitlich
      ctx.beginPath();
      ctx.ellipse(x+s*8.0,ky+2.2+schritt*s*0.7,2.6,5.4,s*0.24,0,TAU); ctx.fill();
    }
    ctx.strokeStyle='#3f5a2e'; ctx.lineWidth=1.3; // Dornenranke
    ctx.beginPath(); ctx.arc(x,ky-4.0,8.6,Math.PI*1.06,Math.PI*1.94); ctx.stroke();
    for(let i=-2;i<=2;i++){                       // schwarze Rosen
      const a=Math.PI*1.5+i*0.34;
      const rx=x+Math.cos(a)*8.6, ry=ky-4.0+Math.sin(a)*8.6;
      disc(rx,ry,1.9,'#241820'); disc(rx,ry,0.8,'#4a2a3a');
    }
  } else if(c.frisur==='hornkapuze'){             // Kapuze mit Hörnern und Fransen
    ctx.beginPath(); ctx.arc(x,ky-0.6,8.9,Math.PI*1.00,Math.PI*2.00); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x,ky-6.0,8.5,3.8,0,0,TAU); ctx.fill();
    for(const s of [-1,1]){                       // Hörner
      ctx.beginPath();
      ctx.moveTo(x+s*6.2,ky-6.0);
      ctx.quadraticCurveTo(x+s*13.5,ky-11.5,x+s*11.0,ky-16.5);
      ctx.quadraticCurveTo(x+s*11.6,ky-10.0,x+s*5.0,ky-7.6);
      ctx.fill();
    }
    ctx.globalAlpha=0.75;                         // tropfende Fransen
    for(let i=-2;i<=2;i++){
      const bx=x+i*3.4, l=3.5+((i+2)%3)*2.4;
      ctx.fillRect(bx-0.8,ky-2.5,1.6,l);
    }
    ctx.globalAlpha=1;
  } else if(c.frisur==='moospelz'){               // Moospolster
    ctx.beginPath(); ctx.ellipse(x,ky-4.0,9.4,5.6,0,0,TAU); ctx.fill();
    ctx.fillStyle='#5f8340';
    for(let i=0;i<9;i++){
      const a=Math.PI*1.05+i*0.11;
      disc(x+Math.cos(a)*8.6,ky-4.0+Math.sin(a)*6.0,1.9,'#5f8340');
    }
    ctx.fillStyle=haar;
    for(const s of [-1,1]){                       // Moosbart seitlich
      ctx.beginPath();
      ctx.ellipse(x+s*8.2,ky+3.0+schritt*s*0.6,2.4,4.6,s*0.2,0,TAU); ctx.fill();
    }
  } else if(c.frisur==='wollhaar'){               // bunte Wollstränge
    const faerbe=['#b8503a','#c8a03a','#4a8a6a','#5a6ab0','#a04a7a'];
    ctx.beginPath(); ctx.ellipse(x,ky-4.4,8.8,4.8,0,0,TAU); ctx.fill();
    for(let i=-3;i<=3;i++){
      ctx.fillStyle=faerbe[(i+3)%faerbe.length];
      const bx=x+i*2.6, l=5.0+((i+3)%3)*2.2;
      ctx.beginPath();
      ctx.moveTo(bx-1.2,ky-6.6);
      ctx.quadraticCurveTo(bx+i*1.6,ky-8-l,bx+i*2.4,ky-6.0-l);
      ctx.quadraticCurveTo(bx+i*0.4,ky-8.4,bx+1.2,ky-6.6);
      ctx.fill();
    }
    ctx.fillStyle=haar;
  } else {                                        // Kapuze
    ctx.beginPath(); ctx.arc(x,ky-0.6,8.7,Math.PI*1.00,Math.PI*2.00); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x,ky-6.0,8.3,3.6,0,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(x,ky-4.6,8.0,2.0,0,0,TAU); ctx.fill();
  }
}

function zeichneCharakter(c,x,y,z){
  const schritt=z.schritt||0, aim=z.aim||{x:0,y:1};
  const ky=y-9-(z.hub||0);          // Kopfmitte
  const by=y+1-(z.hub||0)*0.4;      // Körpermitte

  if(!z.schwebt){                   // Beine
    ctx.fillStyle=c.hood;
    for(const s of [-1,1]){
      const versatz=(s>0?schritt:-schritt)*1.7;
      ctx.beginPath(); ctx.ellipse(x+s*3.3, y+7+versatz, 2.5, 3.1, 0,0,TAU); ctx.fill();
    }
  } else {                          // Schweif statt Beine
    ctx.fillStyle=c.hood; ctx.globalAlpha=0.55;
    ctx.beginPath();
    ctx.moveTo(x-5, by+2);
    ctx.quadraticCurveTo(x-3, y+10, x, y+8);
    ctx.quadraticCurveTo(x+3, y+10, x+5, by+2);
    ctx.closePath(); ctx.fill(); ctx.globalAlpha=1;
  }

  // Körper
  ctx.fillStyle=c.hood;
  ctx.beginPath(); ctx.ellipse(x, by+2, 5.3, 5.7, 0,0,TAU); ctx.fill();
  // Arme
  if(z.armeHoch){
    ctx.fillStyle=c.color;
    for(const s of [-1,1]){
      ctx.beginPath(); ctx.ellipse(x+s*5.4, by-4.5, 2.0, 4.2, s*0.45, 0, TAU); ctx.fill();
    }
  } else {
    disc(x-5.6, by+1.5, 2.1, c.color);
    disc(x+5.6, by+1.5, 2.1, c.color);
  }

  // Kopf mit weicher Schattierung
  disc(x, ky, 8.5, c.color);
  ctx.fillStyle='rgba(0,0,0,0.10)';
  ctx.beginPath(); ctx.ellipse(x, ky+3.6, 7.4, 4.0, 0,0,TAU); ctx.fill();

  // Augen: Pupillen folgen der Schussrichtung
  const px0=clamp(aim.x,-1,1)*1.8, py0=clamp(aim.y,-1,1)*1.5;
  if(c.zier!=='knopfaugen') for(const s of [-1,1]){
    const ex=x+s*3.5, ey=ky-0.4;
    if(z.blinzelt){ ctx.fillStyle='#2a2028'; ctx.fillRect(ex-2.3, ey-0.4, 4.6, 1.3); }
    else {
      disc(ex, ey, 2.7, '#f6f0f2');
      disc(ex+px0, ey+py0, 1.5, '#241c22');
      disc(ex+px0-0.5, ey+py0-0.6, 0.55, '#ffffff');
    }
  }
  // Mund: normal ein Strich, bei Schaden aufgerissen
  if(c.zier==='knopfaugen'){ /* Nahtmund kommt in zeichneZier */ }
  else if(z.wehklagt){ disc(x, ky+4.8, 2.0, '#2a2028'); }
  else { ctx.fillStyle='#2a2028'; ctx.fillRect(x-1.7, ky+4.5, 3.4, 1.1); }

  if(c.zier) zeichneZier(c,x,ky,by,z);
  zeichneFrisur(c,x,ky,schritt);
}

/* Was eine Figur außerdem am Leib trägt. Steht bewusst getrennt von der
   Frisur: Brille und Türbrett gehören aufs Gesicht, Haare darüber. */
function zeichneZier(c,x,ky,by,z){
  if(c.zier==='brille'){                          // dicke Schweißerbrille
    for(const s of [-1,1]){
      const ex=x+s*3.6;
      ctx.strokeStyle='#6e6a62'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.arc(ex,ky-0.4,3.6,0,TAU); ctx.stroke();
      ctx.save(); ctx.globalAlpha=0.34; disc(ex,ky-0.4,3.2,'#bfe8ff'); ctx.restore();
      ctx.save(); ctx.globalAlpha=0.6;             // Spiegelung im Glas
      ctx.strokeStyle='#ffffff'; ctx.lineWidth=0.9;
      ctx.beginPath(); ctx.moveTo(ex-2.2,ky+0.8); ctx.lineTo(ex+0.4,ky-2.4); ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle='#6e6a62'; ctx.fillRect(x-1.4,ky-1.2,2.8,1.4);
    // Blechfaust am linken Arm
    disc(x-6.4,by+1.8,2.7,'#8a8880');
    ctx.strokeStyle='#5a5850'; ctx.lineWidth=0.9;
    ctx.beginPath(); ctx.arc(x-6.4,by+1.8,1.5,0,TAU); ctx.stroke();
  }
  else if(c.zier==='tuerbrett'){                  // Brett vor der rechten Gesichtshälfte
    ctx.save();
    ctx.beginPath(); ctx.arc(x,ky,8.5,0,TAU); ctx.clip();
    ctx.fillStyle='#7a5a38'; ctx.fillRect(x+0.6,ky-9,9,18);
    ctx.fillStyle='rgba(0,0,0,0.22)';
    for(let i=0;i<3;i++) ctx.fillRect(x+2.4+i*2.6,ky-9,0.9,18);
    ctx.restore();
    ctx.strokeStyle='#4a3320'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x+0.9,ky-8.2); ctx.lineTo(x+0.9,ky+8.2); ctx.stroke();
    disc(x+5.4,ky-0.6,1.5,'#1d1410');             // Astloch als Guckloch
    // das freie Auge glüht violett
    ctx.save(); tuscheAn=false; ctx.globalAlpha=0.45;
    disc(x-3.5,ky-0.4,4.0,'#a86ad8'); tuscheAn=true; ctx.restore();
    disc(x-3.5,ky-0.4,1.7,'#c88aff');
  }
  else if(c.zier==='laterne'){                    // grüne Laterne in der Hand
    const px=x+7.6, py=by+3.2;
    ctx.save(); tuscheAn=false;
    ctx.globalAlpha=0.20; disc(px,py,9,'#7affc0');
    ctx.globalAlpha=0.34; disc(px,py,5,'#7affc0');
    tuscheAn=true; ctx.restore();
    ctx.strokeStyle='#8a8272'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(px,py-4.2,2.2,Math.PI,0); ctx.stroke();
    ctx.fillStyle='#6e6a5e'; ctx.fillRect(px-2.6,py-2.6,5.2,1.2);
    ctx.fillStyle='#7affc0'; ctx.fillRect(px-2.0,py-1.4,4.0,4.0);
    ctx.fillStyle='#e8fff0'; ctx.fillRect(px-0.9,py-0.4,1.8,1.8);
    ctx.fillStyle='#6e6a5e'; ctx.fillRect(px-2.6,py+2.6,5.2,1.2);
  }
  else if(c.zier==='pilze'){                      // leuchtende Hütchen im Moos
    for(const [dx,dy,r] of [[-5.6,-9.4,2.2],[0.4,-11.4,2.7],[5.4,-9.0,2.0]]){
      ctx.fillStyle='#e8dcc0'; ctx.fillRect(x+dx-0.6,ky+dy,1.2,2.6);
      ctx.fillStyle='#c8642a';
      ctx.beginPath(); ctx.ellipse(x+dx,ky+dy,r,r*0.72,0,Math.PI,TAU); ctx.fill();
      ctx.save(); tuscheAn=false;
      ctx.globalAlpha=0.26+Math.sin(performance.now()/420+dx)*0.14;
      disc(x+dx,ky+dy-0.6,r*1.9,'#ffd07a');
      tuscheAn=true; ctx.restore();
    }
  }
  else if(c.zier==='knopfaugen'){                 // Knöpfe statt Augen, Nähte
    for(const s of [-1,1]){
      const ex=x+s*3.5, ey=ky-0.4;
      disc(ex,ey,2.8,'#e8e2d4'); disc(ex,ey,2.1,'#c9c0ae');
      ctx.fillStyle='#4a4238';
      for(const [ox,oy] of [[-0.8,-0.8],[0.8,-0.8],[-0.8,0.8],[0.8,0.8]])
        ctx.fillRect(ex+ox-0.35,ey+oy-0.35,0.7,0.7);
      ctx.strokeStyle='#4a4238'; ctx.lineWidth=0.6;
      ctx.beginPath(); ctx.moveTo(ex-0.8,ey-0.8); ctx.lineTo(ex+0.8,ey+0.8);
      ctx.moveTo(ex+0.8,ey-0.8); ctx.lineTo(ex-0.8,ey+0.8); ctx.stroke();
    }
    ctx.strokeStyle='#6a5a48'; ctx.lineWidth=0.8; // Nahtmund
    ctx.beginPath(); ctx.moveTo(x-3.2,ky+4.8); ctx.lineTo(x+3.2,ky+4.8); ctx.stroke();
    for(let i=-2;i<=2;i++){
      ctx.beginPath(); ctx.moveTo(x+i*1.5,ky+3.7); ctx.lineTo(x+i*1.5,ky+5.9); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(x+2.0,ky-6.4); ctx.lineTo(x+5.4,ky-3.6); ctx.stroke();
    for(let i=0;i<3;i++){
      const t=i/2;
      ctx.beginPath();
      ctx.moveTo(x+2.0+t*3.4-0.9,ky-6.4+t*2.8-0.9);
      ctx.lineTo(x+2.0+t*3.4+0.9,ky-6.4+t*2.8+0.9); ctx.stroke();
    }
  }
}

function drawPlayer(p){
  if(p.dead) return;
  if(p.iframes>0&&Math.floor(p.iframes*12)%2===0&&!p.itemGet) return; // Blinken
  const c=p.char;
  const geht=Math.hypot(p.vx,p.vy)>12;
  const takt=p.anim*11;
  const schwebt=c.id==='schemen'||p.flags.has('flight');
  const hub=schwebt?Math.sin(p.anim*3)*1.6:(geht?Math.abs(Math.sin(takt))*1.3:0);
  // gelegentliches Blinzeln
  const bz=(p.anim*0.8)%5;
  shadow(p.x,p.y+10,schwebt?6:7.5);
  zeichneCharakter(c,p.x,p.y,{
    schritt:geht?Math.sin(takt):0, hub, aim:p.aimDir, schwebt,
    armeHoch:!!p.itemGet, wehklagt:p.hitFlash>0, blinzelt:bz<0.12});

  if(p.shield>0) ring(p.x,p.y-5,15,`rgba(120,200,255,${0.4+Math.sin(p.anim*12)*0.2})`,2);
  // Höllenstrahl-Ladeanzeige
  if(p.flags.has('beam')&&p.beamCharge>0){
    rrect(p.x-8,p.y-24,16,3,'#222');
    rrect(p.x-8,p.y-24,16*p.beamCharge,3,p.beamCharge>=1?'#ff5a3a':'#e8862a');
  }
  if(p.itemGet) drawItemIcon(p.itemGet.id,p.x,p.y-28,1.3);
}

function drawFamiliar(f){
  shadow(f.x,f.y+7,5);
  if(f.kind==='shadow'){ disc(f.x,f.y-3,6,'#2a2a3a'); disc(f.x-2,f.y-4,1.2,'#8ab4e8'); disc(f.x+2,f.y-4,1.2,'#8ab4e8'); }
  if(f.kind==='orbit'){ disc(f.x,f.y,5,'#8ab4e8'); ring(f.x,f.y,5,'#3a5a8a',1.5); }
  if(f.kind==='bug'){ disc(f.x,f.y,5,'#5a7a2a'); disc(f.x-2,f.y-2,1,'#111'); disc(f.x+2,f.y-2,1,'#111'); }
  if(f.kind==='rat'){ disc(f.x,f.y-2,5,'#8a8276'); disc(f.x+4,f.y-4,2,'#8a8276'); disc(f.x-2,f.y-3,1,'#111'); }
  if(f.kind==='bird'){ const fl=Math.sin(performance.now()/80)*2;
    disc(f.x,f.y+fl,5,'#b0684a'); ctx.fillStyle='#8a4a2a';
    ctx.beginPath();ctx.moveTo(f.x-5,f.y+fl);ctx.lineTo(f.x-10,f.y-3+fl);ctx.lineTo(f.x-4,f.y-3+fl);ctx.fill();
    disc(f.x+2,f.y-1+fl,1,'#111'); }
  if(f.kind==='frostgeist'){                    // schwebender Eisgeist
    const fl=Math.sin(performance.now()/300)*1.5;
    ctx.globalAlpha=0.85;
    disc(f.x,f.y-3+fl,6,'#bfe8ff');
    ctx.fillStyle='#bfe8ff';                    // ausgefranster Schweif
    ctx.beginPath(); ctx.moveTo(f.x-6,f.y-2+fl);
    ctx.lineTo(f.x-4,f.y+6+fl); ctx.lineTo(f.x,f.y+3+fl);
    ctx.lineTo(f.x+4,f.y+6+fl); ctx.lineTo(f.x+6,f.y-2+fl); ctx.fill();
    ctx.globalAlpha=1;
    disc(f.x-2,f.y-4+fl,1.1,'#2a4a6a'); disc(f.x+2,f.y-4+fl,1.1,'#2a4a6a');
  }
  if(f.kind==='motte'){                         // Glutmotte mit Flügelschlag
    const w=Math.sin(performance.now()/45)*3;
    ctx.fillStyle='rgba(255,190,110,0.55)';
    ctx.beginPath(); ctx.ellipse(f.x-5,f.y-2-w*0.3,4.5,2.6,-0.5,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(f.x+5,f.y-2+w*0.3,4.5,2.6, 0.5,0,TAU); ctx.fill();
    disc(f.x,f.y,3.6,'#c8681f'); disc(f.x,f.y-2,2.4,'#ff9a3a');
    disc(f.x-1.2,f.y-2.6,0.8,'#2a1a0a'); disc(f.x+1.2,f.y-2.6,0.8,'#2a1a0a');
  }
  if(f.kind==='panzer'){                        // Schildpanzer, blitzt beim Block
    const hell=f.blockT>0;
    disc(f.x,f.y,7.5,hell?'#ffffff':'#8a8276');
    disc(f.x,f.y-1,6,hell?'#e8e0d0':'#a9a294');
    ctx.strokeStyle=hell?'#ffffff':'#6a6459'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(f.x,f.y-1,6,0,TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(f.x,f.y-7); ctx.lineTo(f.x,f.y+5); ctx.stroke();
    disc(f.x-2.5,f.y+1,1,'#3a3630'); disc(f.x+2.5,f.y+1,1,'#3a3630');
  }
  if(f.kind==='spaeher'){                       // fliegendes Auge
    const fl=Math.sin(performance.now()/200)*1.2;
    disc(f.x,f.y+fl,6,'#e8e0d8');
    const p=G.player, a=Math.atan2(f.vy||0,f.vx||1);
    disc(f.x,f.y+fl,3.2,'#6a9ac0'); disc(f.x,f.y+fl,1.6,'#111');
    ctx.strokeStyle='rgba(200,220,240,0.6)'; ctx.lineWidth=1.2;   // Flügelchen
    const w=Math.sin(performance.now()/50)*2.5;
    ctx.beginPath(); ctx.moveTo(f.x-5,f.y-3+fl); ctx.lineTo(f.x-10,f.y-6-w+fl);
    ctx.moveTo(f.x+5,f.y-3+fl); ctx.lineTo(f.x+10,f.y-6-w+fl); ctx.stroke();
  }

  /* ---- Die zehn Begleiter ---------------------------------------------- */

  if(f.kind==='messerfliege'){                  // Klinge mit Insektenflügeln
    const w=Math.sin(performance.now()/40)*2.6;
    const a=(f.sturz>0?f.zielA||0:Math.sin(performance.now()/300)*0.3)+Math.PI/2;
    ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(a);
    ctx.fillStyle='rgba(215,235,255,0.5)';
    ctx.beginPath(); ctx.ellipse(-5,-1-w*0.3,4.5,2.2,-0.6,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 5,-1+w*0.3,4.5,2.2, 0.6,0,TAU); ctx.fill();
    ctx.fillStyle=f.sturz>0?'#ffffff':'#cfd8e2';        // Klinge
    ctx.beginPath(); ctx.moveTo(0,-9); ctx.lineTo(2.2,-1); ctx.lineTo(0,3);
    ctx.lineTo(-2.2,-1); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#4a3a2a'; ctx.fillRect(-1.4,2.6,2.8,3.4);
    ctx.restore();
    if(f.sturz>0){ ctx.strokeStyle='rgba(230,245,255,0.5)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(f.x,f.y);
      ctx.lineTo(f.x-Math.cos(f.zielA||0)*16,f.y-Math.sin(f.zielA||0)*16); ctx.stroke(); }
  }
  if(f.kind==='feuerschaedel'){                 // brennender Schädel
    const fl=Math.sin(performance.now()/280)*1.6;
    const y=f.y+fl;
    for(let i=0;i<4;i++){                        // Flammenkranz
      const a=-2.4+i*0.55+Math.sin(performance.now()/120+i)*0.2;
      const h=6+Math.sin(performance.now()/90+i*2)*2;
      ctx.fillStyle=i%2?'#ff9a3a':'#ffd07a';
      ctx.beginPath(); ctx.moveTo(f.x+Math.cos(a)*5,y+Math.sin(a)*5-1);
      ctx.lineTo(f.x+Math.cos(a)*h,y+Math.sin(a)*h-3);
      ctx.lineTo(f.x+Math.cos(a+0.4)*5,y+Math.sin(a+0.4)*5-1);
      ctx.closePath(); ctx.fill();
    }
    disc(f.x,y,6,'#efe4cc'); disc(f.x,y+4,3.4,'#e0d4bc');
    disc(f.x-2.2,y-1,1.6,'#2a1408'); disc(f.x+2.2,y-1,1.6,'#2a1408');
    if(f.spuck>0){ disc(f.x-2.2,y-1,1.6,'#ffb84a'); disc(f.x+2.2,y-1,1.6,'#ffb84a'); }
    ctx.fillStyle='#2a1408'; ctx.fillRect(f.x-0.6,y+1.6,1.2,1.6);
  }
  if(f.kind==='engelsfluegel'){                 // Federpaar über dem Kopf
    const fl=Math.sin(performance.now()/340)*1.4;
    const w=Math.sin(performance.now()/220)*2.4;
    const y=f.y+fl, hell=f.blitzT>0;
    ctx.globalAlpha=f.frei===false?0.4:1;
    ctx.fillStyle=hell?'#ffffff':'#f4f0e4';
    for(const vz of [-1,1]){
      ctx.beginPath(); ctx.moveTo(f.x+vz*1.5,y);
      ctx.quadraticCurveTo(f.x+vz*9,y-6-w,f.x+vz*12,y+1-w*0.5);
      ctx.quadraticCurveTo(f.x+vz*7,y+3,f.x+vz*1.5,y+2.5);
      ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle=hell?'#ffffff':'#e8c85a'; ctx.lineWidth=1.4;   // Heiligenschein
    ctx.beginPath(); ctx.ellipse(f.x,y-6,4.4,1.6,0,0,TAU); ctx.stroke();
    ctx.globalAlpha=1;
    f.blitzT=Math.max(0,(f.blitzT||0)-1/60);
  }
  if(f.kind==='schattenorb'){                   // dunkle Kugel mit Kernglut
    const puls=1+Math.sin(performance.now()/240)*0.08;
    ctx.globalAlpha=0.35; disc(f.x,f.y,9*puls,'#4a3a72'); ctx.globalAlpha=1;
    disc(f.x,f.y,6*puls,'#241e34');
    disc(f.x-1.6,f.y-1.8,2.2,f.blitzT>0?'#efe8ff':'#6a5a9a');
    disc(f.x-1.4,f.y-2,0.9,'#efe8ff');
    f.blitzT=Math.max(0,(f.blitzT||0)-1/60);
  }
  if(f.kind==='stichling'){                     // Stachelkugel, rollt beim Rammen
    const r=f.rammt>0?7:6;
    ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.roll||0);
    ctx.fillStyle='#dfe4c8';
    for(let i=0;i<8;i++){ const a=i*TAU/8;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a-0.28)*r*0.8,Math.sin(a-0.28)*r*0.8);
      ctx.lineTo(Math.cos(a)*(r+4),Math.sin(a)*(r+4));
      ctx.lineTo(Math.cos(a+0.28)*r*0.8,Math.sin(a+0.28)*r*0.8);
      ctx.closePath(); ctx.fill(); }
    ctx.restore();
    disc(f.x,f.y,r,f.rammt>0?'#a8bc6a':'#8a9a5a');
    disc(f.x-1.8,f.y-1.4,1.1,'#161018'); disc(f.x+1.8,f.y-1.4,1.1,'#161018');
  }
  if(f.kind==='augapfel'){                      // fleischiges Auge am Sehnerv
    const fl=Math.sin(performance.now()/260)*1.3;
    const y=f.y+fl, a=f.blickA||0;
    ctx.strokeStyle='#a03a4a'; ctx.lineWidth=2.2;          // Sehnerv
    ctx.beginPath(); ctx.moveTo(f.x,y+3);
    ctx.quadraticCurveTo(f.x+3,y+9,f.x-1,y+11); ctx.stroke();
    disc(f.x,y,6.5,'#efe8d8');
    ctx.strokeStyle='#c85a5a'; ctx.lineWidth=0.8;          // Äderchen
    for(let i=0;i<3;i++){ const b=1.4+i*1.9;
      ctx.beginPath(); ctx.moveTo(f.x+Math.cos(b)*2.5,y+Math.sin(b)*2.5);
      ctx.lineTo(f.x+Math.cos(b)*6,y+Math.sin(b)*6); ctx.stroke(); }
    disc(f.x+Math.cos(a)*2,y+Math.sin(a)*2,3.2,'#6a9ac0');
    disc(f.x+Math.cos(a)*2.6,y+Math.sin(a)*2.6,1.6,'#111');
  }
  if(f.kind==='bombenfreund'){                  // kleiner Bombenleger
    const wack=Math.sin(performance.now()/160)*0.12;
    ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(wack);
    disc(0,0,7,'#2e2a30'); disc(-1.8,-2.2,2.2,'#4a4450');
    ctx.fillStyle='#4a4450'; ctx.fillRect(-2,-8.4,4,2.4);   // Zünderkragen
    ctx.strokeStyle='#a08050'; ctx.lineWidth=1.4;           // Lunte
    ctx.beginPath(); ctx.moveTo(0.6,-8.4); ctx.quadraticCurveTo(4,-11,2.6,-12); ctx.stroke();
    const gl=f.cd<1.2?1.6+Math.sin(performance.now()/50)*0.8:1.2;
    disc(2.6,-12,gl,f.cd<1.2?'#ffe08a':'#ffb84a');
    disc(-2.4,1.4,1.2,'#efe4cc'); disc(2.4,1.4,1.2,'#efe4cc');
    disc(-2.4,1.6,0.6,'#161018'); disc(2.4,1.6,0.6,'#161018');
    ctx.restore();
  }
  if(f.kind==='kreuzbot'){                       // Kreuz aus Blech mit Läufen
    ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.dreh||0);
    ctx.fillStyle='#7a8a96';
    ctx.fillRect(-9,-2.6,18,5.2); ctx.fillRect(-2.6,-9,5.2,18);
    ctx.fillStyle='#5a6a76';                     // Mündungen
    for(let i=0;i<4;i++){ const a=i*Math.PI/2;
      ctx.beginPath(); ctx.arc(Math.cos(a)*8.5,Math.sin(a)*8.5,2.2,0,TAU); ctx.fill(); }
    ctx.restore();
    disc(f.x,f.y,3.4,'#8a9aa6');
    disc(f.x,f.y,2,f.fireT<0.3?'#ffe08a':'#ff7a4a');
  }
  if(f.kind==='klingenring'){                    // drei Klingen auf der Bahn
    ctx.strokeStyle='rgba(200,220,240,0.18)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(f.x,f.y,38,0,TAU); ctx.stroke();
    for(let i=0;i<3;i++){
      const a=(f.angle||0)+i*TAU/3;
      const kx=f.x+Math.cos(a)*38, ky=f.y+Math.sin(a)*38;
      ctx.save(); ctx.translate(kx,ky); ctx.rotate(a+Math.PI/2);
      ctx.fillStyle='rgba(220,235,250,0.25)';    // Schleppe
      ctx.beginPath(); ctx.moveTo(-1.5,0); ctx.lineTo(-9,5); ctx.lineTo(1.5,2); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#d8dfe8';
      ctx.beginPath(); ctx.moveTo(0,-7); ctx.lineTo(2.6,1.6); ctx.lineTo(-2.6,1.6);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle='#5a4632'; ctx.fillRect(-2,1.6,4,2.2);
      ctx.restore();
    }
  }
  if(f.kind==='geist'){                          // gerufener Kampfgeist
    const fl=Math.sin(performance.now()/240+f.angle)*1.5;
    const y=f.y+fl;
    ctx.globalAlpha=f.leben<2?0.3+Math.sin(performance.now()/60)*0.2:0.85;
    disc(f.x,y-2,6,'#c8d8ff');
    ctx.fillStyle='#c8d8ff';                     // ausgefranster Schweif
    ctx.beginPath(); ctx.moveTo(f.x-6,y-1);
    ctx.quadraticCurveTo(f.x-5,y+6,f.x-2.4,y+5);
    ctx.quadraticCurveTo(f.x,y+7,f.x+2.4,y+5);
    ctx.quadraticCurveTo(f.x+5,y+6,f.x+6,y-1); ctx.fill();
    ctx.globalAlpha=1;
    disc(f.x-2.2,y-3,1.3,'#2a2440'); disc(f.x+2.2,y-3,1.3,'#2a2440');
  }
  if(f.kind==='seelenvogel'){                    // Vogel mit Seelenperlen
    const w=Math.sin(performance.now()/110)*3.4;
    ctx.globalAlpha=0.9;
    ctx.fillStyle='#bfe0f4';
    for(const vz of [-1,1]){
      ctx.beginPath(); ctx.moveTo(f.x+vz*2,f.y-1);
      ctx.quadraticCurveTo(f.x+vz*9,f.y-4-w,f.x+vz*11,f.y+2-w*0.4);
      ctx.quadraticCurveTo(f.x+vz*6,f.y+3,f.x+vz*2,f.y+2);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.fillStyle='#e8f4ff';
    ctx.beginPath(); ctx.ellipse(f.x,f.y,4,5,0,0,TAU); ctx.fill();
    ctx.fillStyle='#ffc84a';                      // Schnabel
    ctx.beginPath(); ctx.moveTo(f.x+1,f.y-4); ctx.lineTo(f.x+4.4,f.y-6);
    ctx.lineTo(f.x+1.4,f.y-6.4); ctx.closePath(); ctx.fill();
    disc(f.x+0.6,f.y-3.4,1,'#161018');
    const n=Math.min(8,G.seelen||0);              // gesammelte Seelen als Perlen
    for(let i=0;i<n;i++){
      const a=-1.57+i*TAU/8+performance.now()/900;
      ctx.globalAlpha=0.75;
      disc(f.x+Math.cos(a)*11,f.y+Math.sin(a)*11,1.6,'#bfe0f4');
      ctx.globalAlpha=1;
    }
  }
}

/* Gestapelte Wülste mit Spitze — Grundform für Kotkrabbler, Kotspritzer
   und den Kloakenfürsten. r ist der Radius des untersten Wulstes. */
function drawKot(x,y,r,hell,dunkel){
  // Jeder Wulst: dunkle Grundscheibe, darüber die hellere versetzt — der
  // stehenbleibende dunkle Rand unten trennt die Wülste sichtbar voneinander.
  disc(x, y+r*0.46, r,       dunkel);
  disc(x, y+r*0.31, r*0.90,  hell);
  disc(x, y-r*0.14, r*0.74,  dunkel);
  disc(x, y-r*0.28, r*0.65,  hell);
  disc(x, y-r*0.62, r*0.48,  dunkel);
  disc(x, y-r*0.74, r*0.40,  hell);
  ctx.fillStyle=dunkel;                     // umgeknickte Spitze
  ctx.beginPath();
  ctx.moveTo(x-r*0.26, y-r*0.96);
  ctx.quadraticCurveTo(x+r*0.14, y-r*1.66, x+r*0.36, y-r*1.02);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle=hell;
  ctx.beginPath();
  ctx.moveTo(x-r*0.16, y-r*1.00);
  ctx.quadraticCurveTo(x+r*0.12, y-r*1.52, x+r*0.28, y-r*1.06);
  ctx.closePath(); ctx.fill();
  // Glanzlicht oben links
  ctx.fillStyle='rgba(255,255,255,0.16)';
  ctx.beginPath(); ctx.ellipse(x-r*0.30,y-r*0.80,r*0.16,r*0.10,-0.5,0,TAU); ctx.fill();
}

function drawEnemy(e){
  const alpha=e.ghosted?0.25:1;
  ctx.save(); ctx.globalAlpha=alpha;
  if(!e.fly&&!e.ghosted) shadow(e.x,e.y+e.r*0.8,e.r*0.8);
  else if(e.fly) shadow(e.x,e.y+e.r+6,e.r*0.6);
  const y=e.y-(e.z||0);
  let body='#a05a5a';
  const T=e.type;
  const flash=e.flash>0;
  const tint=e.champ?e.champ.tint:null;
  const col=c=>flash?'#ffffff':(tint||c);
  switch(T){
    /* --- Die zwölf Neuen ------------------------------------------- */
    case 'nabelkind': {
      if(!e.gefallen){                            // Schnur zur Decke
        ctx.strokeStyle='#6e2530'; ctx.lineWidth=2.6;
        ctx.beginPath(); ctx.moveTo(e.ankerX||e.x,RY-10);
        ctx.quadraticCurveTo((e.ankerX||e.x)+(e.x-(e.ankerX||e.x))*0.4,y-40,e.x,y-e.r);
        ctx.stroke();
      }
      fleisch(e.x,y,e.r,e.r*1.05,0,col('#d9b9a6'),col('#b98f7c'),'#4a2a26');
      hohlauge(e.x-e.r*0.34,y-e.r*0.1,e.r*0.19,'#ffd07a',0.8);
      hohlauge(e.x+e.r*0.34,y-e.r*0.16,e.r*0.19,'#ffd07a',0.8);
      zaehneSpiel(e.x,y+e.r*0.5,e.r*0.8,7,e.r*0.26,true,'#efe4cc');
      break; }
    case 'haeutling': {
      fleisch(e.x,y,e.r*0.85,e.r*1.15,0,col('#c8555c'),col('#8e2b34'),'#3a0e14');
      ctx.strokeStyle='#5e1219'; ctx.lineWidth=1.2;
      for(let i=-1;i<=1;i++){ ctx.beginPath();
        ctx.moveTo(e.x+i*4,y-e.r*0.8); ctx.lineTo(e.x+i*4.6,y+e.r*0.8); ctx.stroke(); }
      disc(e.x,y-e.r*1.05,e.r*0.68,col('#a33c44'));
      hohlauge(e.x-e.r*0.28,y-e.r*1.1,e.r*0.17,'#ff8a6a',0.9);
      hohlauge(e.x+e.r*0.28,y-e.r*1.1,e.r*0.17,'#ff8a6a',0.9);
      break; }
    case 'vielauge': {
      fleisch(e.x,y,e.r,e.r*1.06,0,col('#9a8ea8'),col('#6a5d7c'),'#241c30');
      for(let i=0;i<9;i++){
        const a=i*2.399, d=Math.sqrt(i/9)*e.r*0.72;
        const ax=e.x+Math.cos(a)*d, ay=y+Math.sin(a)*d*0.95;
        const auf=(Math.sin(performance.now()/700+i*1.7)+1)/2;
        if(auf>0.28){
          disc(ax,ay,e.r*0.2,'#efe8d8');
          disc(ax+Math.cos(performance.now()/900+i)*1.3,
               ay+Math.sin(performance.now()/900+i)*1.3,e.r*0.09,'#1a1420');
        } else { ctx.strokeStyle='#3a2f46'; ctx.lineWidth=1.6;
          ctx.beginPath(); ctx.moveTo(ax-e.r*0.18,ay); ctx.lineTo(ax+e.r*0.18,ay); ctx.stroke(); }
      }
      break; }
    case 'zwillingsbalg': {
      fleisch(e.x,y+e.r*0.3,e.r*0.95,e.r*0.82,0,col('#b9a98e'),col('#8a7a60'),'#332a1e');
      for(const [vz,gl] of [[-1,'#8affa0'],[1,'#ff8a8a']]){
        const aktiv=(vz<0)===!e.kopf;
        fleisch(e.x+vz*e.r*0.46,y-e.r*0.5,e.r*0.46,e.r*0.5,0,
                col('#c8b89c'),col('#98886c'),'#3a3122');
        hohlauge(e.x+vz*e.r*0.72,y-e.r*0.6,e.r*0.15,gl,aktiv?1:0.3);
        hohlauge(e.x+vz*e.r*0.28,y-e.r*0.56,e.r*0.15,gl,aktiv?1:0.3);
        zaehneSpiel(e.x+vz*e.r*0.46,y-e.r*0.2,e.r*0.44,5,e.r*0.16,true,'#efe4cc');
      }
      break; }
    case 'schlundmutter': {
      fleisch(e.x,y,e.r*1.1,e.r*0.9,0,col('#a89a72'),col('#786a48'),'#2a2414');
      const auf=e.bauch||0;
      if(auf>0.05) ellipse(e.x,y+e.r*0.15,e.r*0.6*auf+3,e.r*0.45*auf+2,0,'#170d10');
      zaehneSpiel(e.x,y-e.r*0.45,e.r*1.25,11,e.r*0.22,true,'#e8dcc0');
      zaehneSpiel(e.x,y+e.r*0.7,e.r*1.25,11,e.r*0.22,false,'#e8dcc0');
      hohlauge(e.x-e.r*0.6,y-e.r*0.55,e.r*0.17,'#ffb060',0.9);
      hohlauge(e.x+e.r*0.6,y-e.r*0.55,e.r*0.17,'#ffb060',0.9);
      break; }
    case 'fingerbaum': {
      ellipse(e.x,y+e.r*0.9,e.r*1.1,e.r*0.32,0,'#3a2f22');
      fleisch(e.x,y+e.r*0.3,e.r*0.42,e.r*0.75,0,col('#c2ae92'),col('#8f7c60'),'#332a1c');
      const gr=Math.max(0,Math.sin((1-(e.greif||0)/0.5)*Math.PI));
      ctx.strokeStyle=col('#a89076'); ctx.lineWidth=e.r*0.2; ctx.lineCap='round';
      for(let i=0;i<5;i++){
        const a=-Math.PI/2+(i-2)*0.4+gr*0.4*(i%2?1:-1), l=e.r*1.5;
        ctx.beginPath(); ctx.moveTo(e.x,y-e.r*0.1);
        ctx.lineTo(e.x+Math.cos(a)*l,y-e.r*0.1+Math.sin(a)*l); ctx.stroke();
        disc(e.x+Math.cos(a)*l,y-e.r*0.1+Math.sin(a)*l,e.r*0.15,col('#d8c6ac'));
      }
      ctx.lineCap='butt';
      break; }
    case 'grabhusten': {
      fleisch(e.x-e.r*0.15,y+e.r*0.3,e.r*0.95,e.r*0.85,0.2,
              col('#8e8878'),col('#5e594c'),'#221f18');
      fleisch(e.x-e.r*0.35,y-e.r*0.55,e.r*0.5,e.r*0.44,0.3,
              col('#a49a86'),col('#6e6656'),'#221f18');
      hohlauge(e.x-e.r*0.55,y-e.r*0.6,e.r*0.17,'#b0ff8a',0.75);
      zaehneSpiel(e.x-e.r*0.28,y-e.r*0.28,e.r*0.5,5,e.r*0.18,true,'#d8cdb4');
      break; }
    case 'nagelbraut': {
      fleisch(e.x,y+e.r*0.2,e.r*0.8,e.r*1.1,0,col('#cfc6b4'),col('#9a917e'),'#332e26');
      ctx.save(); ctx.globalAlpha=0.72;                 // Schleier
      vieleck([[e.x-e.r*0.85,y-e.r*0.45],[e.x+e.r*0.85,y-e.r*0.45],
               [e.x+e.r*1.05,y+e.r*1.2],[e.x-e.r*1.05,y+e.r*1.2]],col('#ded5c0'));
      ctx.restore();
      for(let i=0;i<7;i++){                              // Nägel
        const a=rausch(i*17+Math.floor(e.x))*TAU, d=e.r*(0.5+rausch(i*5)*0.5);
        const nx=e.x+Math.cos(a)*d, ny=y+e.r*0.2+Math.sin(a)*d*0.9;
        ctx.strokeStyle='#6a6156'; ctx.lineWidth=1.8;
        ctx.beginPath(); ctx.moveTo(nx,ny);
        ctx.lineTo(nx+Math.cos(a)*5,ny+Math.sin(a)*5); ctx.stroke();
      }
      hohlauge(e.x-e.r*0.28,y-e.r*0.12,e.r*0.18,'#e8e0ff',0.8);
      hohlauge(e.x+e.r*0.28,y-e.r*0.12,e.r*0.18,'#e8e0ff',0.8);
      break; }
    case 'kriechkiefer': {
      const k=formSchluessel();
      handZug([[e.x-e.r*1.3,y-e.r*0.5],[e.x+e.r*1.3,y-e.r*0.5],
               [e.x+e.r,y+e.r*0.6],[e.x-e.r,y+e.r*0.6]],k);
      ctx.fillStyle=col('#cfc6ae'); ctx.fill();
      handZug([[e.x-e.r*1.3,y-e.r*0.5],[e.x+e.r*1.3,y-e.r*0.5],
               [e.x+e.r,y+e.r*0.6],[e.x-e.r,y+e.r*0.6]],k+0.9);
      tusche(1.8,KONTUR,k);
      for(let i=0;i<6;i++){
        const zx=e.x-e.r+i*e.r*0.4, l=e.r*0.5+Math.sin(performance.now()/90+i)*e.r*0.16;
        vieleck([[zx-e.r*0.11,y+e.r*0.55],[zx+e.r*0.11,y+e.r*0.55],[zx,y+e.r*0.55+l]],'#efe4cc');
      }
      hohlauge(e.x-e.r*0.45,y-e.r*0.18,e.r*0.16,'#ff6a5a',0.85);
      hohlauge(e.x+e.r*0.45,y-e.r*0.18,e.r*0.16,'#ff6a5a',0.85);
      break; }
    case 'wachslicht': {
      const fl=Math.sin(performance.now()/110)*2;
      fleisch(e.x,y+e.r*0.25,e.r*0.8,e.r*1.05,0,col('#f4e9c4'),col('#cdbc8e'),'#5a4c2a');
      disc(e.x,y-e.r*0.75,e.r*0.6,col('#e8dcb0'));
      hohlauge(e.x-e.r*0.25,y-e.r*0.8,e.r*0.16,'#ffb03a',0.9);
      hohlauge(e.x+e.r*0.25,y-e.r*0.8,e.r*0.16,'#ffb03a',0.9);
      ctx.strokeStyle='#3a2f1a'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(e.x,y-e.r*1.3); ctx.lineTo(e.x,y-e.r*1.65); ctx.stroke();
      ctx.save(); tuscheAn=false; ctx.globalAlpha=0.28;
      disc(e.x,y-e.r*1.9,e.r*1.1,'#ffb03a'); tuscheAn=true; ctx.restore();
      ellipse(e.x,y-e.r*1.9+fl*0.2,e.r*0.22,e.r*0.42,0,'#e8862a');
      ellipse(e.x,y-e.r*2.0+fl*0.3,e.r*0.11,e.r*0.22,0,'#ffe08a');
      break; }
    case 'ohrwurm': {
      for(let i=4;i>=1;i--){                        // Segmente hinter dem Kopf
        const sy=y-i*e.r*0.62;
        if(sy<RY-10) continue;
        fleisch(e.x+Math.sin(performance.now()/300+i)*3,sy,
                e.r*0.72-i*0.05*e.r,e.r*0.5,0,col('#b09a72'),col('#7e6a48'),'#2a2214');
      }
      fleisch(e.x,y,e.r,e.r*0.85,0,col('#c2ac82'),col('#8e7a54'),'#2a2214');
      zaehneSpiel(e.x,y+e.r*0.4,e.r*1.25,7,e.r*0.36,true,'#efe4cc');
      zaehneSpiel(e.x,y-e.r*0.4,e.r*1.25,7,e.r*0.36,false,'#efe4cc');
      hohlauge(e.x-e.r*0.4,y-e.r*0.08,e.r*0.16,'#ffd07a',0.9);
      hohlauge(e.x+e.r*0.4,y-e.r*0.08,e.r*0.16,'#ffd07a',0.9);
      break; }
    case 'spiegelbalg': {
      ctx.save(); ctx.globalAlpha=0.85;
      fleisch(e.x,y+e.r*0.25,e.r*0.78,e.r*0.95,0,col('#cfd6e4'),col('#96a0b8'),'#2a3040');
      disc(e.x,y-e.r*0.8,e.r*0.72,col('#b6c0d4'));
      hohlauge(e.x-e.r*0.3,y-e.r*0.85,e.r*0.18,'#ffffff',0.5);
      hohlauge(e.x+e.r*0.3,y-e.r*0.85,e.r*0.18,'#ffffff',0.5);
      ctx.restore();
      break; }
    case 'spinnling': {
      disc(e.x,y,e.r,col('#c8b070'));
      ctx.strokeStyle='#7a6640'; ctx.lineWidth=1;
      for(let i=0;i<6;i++){ const a=i*TAU/6+performance.now()/400;
        ctx.beginPath(); ctx.moveTo(e.x,y);
        ctx.lineTo(e.x+Math.cos(a)*e.r*1.7,y+Math.sin(a)*e.r*1.5); ctx.stroke(); }
      disc(e.x-e.r*0.3,y-e.r*0.2,1,'#111'); disc(e.x+e.r*0.3,y-e.r*0.2,1,'#111');
      break; }

    case 'blobling': case 'miniblob':
      disc(e.x,y,e.r,col('#7a9a3f'));disc(e.x,y-2,e.r*0.7,col('#94b455'));
      disc(e.x-e.r*0.35,y-2,1.5,'#111');disc(e.x+e.r*0.35,y-2,1.5,'#111');break;
    case 'huepfer':
      disc(e.x,y,e.r,col('#5a7a9a'));
      rrect(e.x-e.r,y+2,4,5,col('#4a6a8a'));rrect(e.x+e.r-4,y+2,4,5,col('#4a6a8a'));
      disc(e.x-3,y-3,1.8,'#111');disc(e.x+3,y-3,1.8,'#111');break;
    case 'spucker':
      disc(e.x,y,e.r,col('#9a6a4a'));
      disc(e.x,y+2,4,'#3a1a1a'); // offenes Maul
      disc(e.x-4,y-4,1.8,'#111');disc(e.x+4,y-4,1.8,'#111');break;
    case 'wanderauge':
      disc(e.x,y,e.r,col('#d8d0c8'));disc(e.x,y,5,'#8a2a2a');disc(e.x,y,2.5,'#111');
      ring(e.x,y,e.r,'#8a8276',1);break;
