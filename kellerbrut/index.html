<!-- Grafik-Overhaul Phase 4: Items, Pickups, Kampfeffekte -->
<script>
/* ================================================================
   KELLERBRUT — GRAFIK-OVERHAUL PHASE 4
   ITEMS + PICKUPS + KAMPFEFFEKTE

   Einbau hier: direkt hinter Phase 3 eingebettet. Der Pack liefert die Datei
   als phase4.js zum Nachladen aus; KELLERBRUT ist aber bewusst eine einzige
   HTML-Datei ohne Build-Schritt, deshalb steht der Code inline. Bis auf
   diese Kommentarzeilen ist er unveraendert uebernommen.

   Rein visuell:
   - keine Itemwerte / Dropchancen
   - kein Schaden / HP-Balancing
   - keine Hitboxen / Kollisionen
   - kein RNG / Savegame / Raumaufbau
   ================================================================ */
(() => {
  'use strict';

  if (window.__KB_PHASE4_VISUALS__) return;
  window.__KB_PHASE4_VISUALS__ = true;

  const P4 = window.KBPhase4 = {
    enabled: true,
    quality: 1,
    trails: true,
    bloom: true,
    pickupSparkles: true,
    hitFx: true,
    version: '4.0'
  };

  const TWO_PI = Math.PI * 2;
  const localFx = [];
  let lastNow = performance.now();

  const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
  const sat = v => clamp(v,0,1);
  const nowS = () => performance.now()/1000;

  function wrap(name, factory){
    const old = window[name];
    if(typeof old !== 'function'){
      console.warn('[KELLERBRUT Phase 4] Funktion nicht gefunden:', name);
      return false;
    }
    window[name] = factory(old);
    return true;
  }

  function hashText(s){
    let h=2166136261>>>0;
    s=String(s||'');
    for(let i=0;i<s.length;i++){
      h^=s.charCodeAt(i);
      h=Math.imul(h,16777619);
    }
    return h>>>0;
  }

  function rnd01(key,i=0){
    let x=(hashText(key)+Math.imul(i+1,0x9e3779b1))>>>0;
    x^=x>>>16; x=Math.imul(x,0x7feb352d);
    x^=x>>>15; x=Math.imul(x,0x846ca68b);
    x^=x>>>16;
    return (x>>>0)/4294967296;
  }

  function hexAlpha(hex,a){
    if(typeof hex!=='string'||hex[0]!=='#') return `rgba(230,190,120,${a})`;
    let s=hex.slice(1);
    if(s.length===3) s=s.split('').map(x=>x+x).join('');
    const n=parseInt(s,16);
    return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
  }

  function ellipse(x,y,rx,ry,color,a=1,rot=0){
    ctx.save();
    ctx.globalAlpha*=a;
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot,0,TWO_PI);
    ctx.fill();
    ctx.restore();
  }

  function ellipseStroke(x,y,rx,ry,color,w=1,a=1,rot=0){
    ctx.save();
    ctx.globalAlpha*=a;
    ctx.strokeStyle=color;
    ctx.lineWidth=w;
    ctx.beginPath();
    ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot,0,TWO_PI);
    ctx.stroke();
    ctx.restore();
  }

  function line(x1,y1,x2,y2,color,w=1,a=1){
    ctx.save();
    ctx.globalAlpha*=a;
    ctx.strokeStyle=color;
    ctx.lineWidth=w;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.restore();
  }

  function glow(x,y,r,color,a=1){
    if(!P4.bloom) return;
    ctx.save();
    ctx.globalAlpha*=a;
    const g=ctx.createRadialGradient(x,y,0,x,y,Math.max(1,r));
    g.addColorStop(0,color);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(x,y,Math.max(1,r),0,TWO_PI); ctx.fill();
    ctx.restore();
  }

  function ring(x,y,r,color,w=1,a=1){
    ctx.save();
    ctx.globalAlpha*=a;
    ctx.strokeStyle=color;
    ctx.lineWidth=w;
    ctx.beginPath(); ctx.arc(x,y,Math.max(.1,r),0,TWO_PI); ctx.stroke();
    ctx.restore();
  }

  function pushFx(f){
    if(!P4.enabled) return;
    localFx.push(f);
    const max=P4.quality<.75?80:160;
    if(localFx.length>max) localFx.splice(0,localFx.length-max);
  }

  function pickupProfile(q){
    const type=String(q?.type||'');
    switch(type){
      case 'coin':       return {c:'#ffd75a',g:'rgba(255,210,65,.25)',rare:false};
      case 'bigcoin':    return {c:'#fff0a0',g:'rgba(255,220,75,.34)',rare:true};
      case 'bomb':       return {c:'#ffb35a',g:'rgba(255,115,50,.20)',rare:false};
      case 'key':        return {c:'#ffe28a',g:'rgba(255,218,100,.22)',rare:false};
      case 'heart':      return {c:'#e64a5c',g:'rgba(235,65,85,.25)',rare:false};
      case 'halfheart':  return {c:'#db4253',g:'rgba(225,60,80,.20)',rare:false};
      case 'soulheart':  return {c:'#a8ddff',g:'rgba(130,205,255,.30)',rare:true};
      case 'blackheart': return {c:'#8c67bc',g:'rgba(115,75,170,.29)',rare:true};
      case 'pill':       return {c:'#f29ac2',g:'rgba(240,125,185,.20)',rare:false};
      case 'card':       return {c:'#d6b8ef',g:'rgba(185,135,225,.23)',rare:false};
      case 'chest':      return {c:'#c69b61',g:'rgba(185,130,70,.15)',rare:false};
      case 'goldchest':  return {c:'#ffde75',g:'rgba(255,205,70,.30)',rare:true};
      case 'redchest':   return {c:'#e15661',g:'rgba(220,55,70,.28)',rare:true};
      case 'container':  return {c:'#f05a66',g:'rgba(240,65,80,.32)',rare:true};
      case 'schadenshoch':return {c:'#ffad62',g:'rgba(245,125,45,.30)',rare:true};
      case 'item': {
        let c='#e4ca82';
        try{ if(q.itemId!==undefined && typeof window.itemColor==='function') c=itemColor(q.itemId); }catch(_e){}
        return {c,g:hexAlpha(c,.28),rare:true};
      }
      default:return {c:'#ddd2c2',g:'rgba(220,210,195,.14)',rare:false};
    }
  }

  function pickupPre(q){
    if(!q) return;
    const p=pickupProfile(q);
    const t=nowS();
    const bob=Math.sin(t*3.2+(q.x||0)*.03)*.5;

    ellipse(q.x,q.y+8,6.5,1.9,'#030305',.24);
    glow(q.x,q.y+bob,p.rare?19:13,p.g,p.rare?.80:.48);

    if(p.rare && P4.pickupSparkles){
      const count=P4.quality<.75?2:4;
      for(let i=0;i<count;i++){
        const a=t*(.7+i*.11)+i*TWO_PI/count+(q.x||0)*.01;
        const rr=11+i%2*3;
        const sx=q.x+Math.cos(a)*rr;
        const sy=q.y+bob+Math.sin(a)*rr*.62;
        ellipse(sx,sy,1.1,1.1,p.c,.23+.12*Math.sin(t*4+i));
      }
    }
  }

  function pickupPost(q){
    if(!q) return;
    const p=pickupProfile(q), t=nowS();

    // Material-Glanz für leicht lesbare Kleinteile.
    if(['coin','bigcoin','key','goldchest'].includes(q.type)){
      const pulse=.35+.25*Math.sin(t*4+(q.x||0));
      line(q.x-3,q.y-5,q.x+1,q.y-7,'rgba(255,255,235,.9)',.8,pulse);
    }
    if(q.type==='soulheart')
      ring(q.x,q.y,8+Math.sin(t*3)*.6,'rgba(190,235,255,.75)',.8,.25);
    if(q.type==='blackheart')
      ring(q.x,q.y,8+Math.sin(t*2.7)*.7,'rgba(170,130,220,.7)',.8,.22);
    if(q.type==='bomb'){
      const pulse=.5+.5*Math.sin(t*7);
      glow(q.x+4,q.y-10,7,'rgba(255,170,70,.28)',.35+.25*pulse);
    }
    if(q.price){
      ellipse(q.x,q.y+16,12,6,'rgba(5,5,8,.75)',.42);
    }
  }

  function projectileColor(t){
    if(t?.poison) return {core:'#c8ef85',glow:'rgba(145,220,85,.34)'};
    if(t?.burn) return {core:'#ffd076',glow:'rgba(255,115,40,.38)'};
    if(t?.frost) return {core:'#e4f7ff',glow:'rgba(125,210,255,.38)'};
    if(t?.explosive) return {core:'#ffd080',glow:'rgba(255,115,45,.38)'};
    return {core:'#d8f1ff',glow:'rgba(110,195,240,.28)'};
  }

  function velocity(o){
    const vx=Number(o?.vx)||0, vy=Number(o?.vy)||0;
    const d=Math.hypot(vx,vy);
    return {vx,vy,d};
  }

  function drawTrail(o,x,y,color,width=1.4,length=10){
    if(!P4.trails) return;
    const v=velocity(o);
    if(v.d<5) return;
    const nx=v.vx/v.d, ny=v.vy/v.d;
    const l=clamp(v.d/18,5,length);
    const g=ctx.createLinearGradient(x,y,x-nx*l,y-ny*l);
    g.addColorStop(0,color);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.save();
    ctx.strokeStyle=g;
    ctx.lineWidth=width;
    ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-nx*l,y-ny*l); ctx.stroke();
    ctx.restore();
  }

  function emitHit(x,y,color,dirX=0,dirY=0,strong=false){
    if(!P4.hitFx) return;
    const n=P4.quality<.75?(strong?6:3):(strong?11:6);
    for(let i=0;i<n;i++){
      const a=(Math.atan2(dirY,dirX)||0)+Math.PI+(rnd01(color,i)-.5)*2.4;
      const sp=(strong?55:35)+rnd01(color+'s',i)*(strong?85:55);
      pushFx({kind:'spark',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
        t:strong?.42:.28,max:strong?.42:.28,color,size:1+rnd01(color+'z',i)*1.8});
    }
    pushFx({kind:'hitRing',x,y,t:.22,max:.22,r:strong?18:11,color});
  }

  function emitPickup(q){
    const p=pickupProfile(q);
    const n=P4.quality<.75?6:12;
    for(let i=0;i<n;i++){
      const a=i*TWO_PI/n+rnd01(q.type,i)*.3;
      const sp=30+rnd01(q.type+'p',i)*55;
      pushFx({kind:'spark',x:q.x,y:q.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
        t:.55,max:.55,color:p.c,size:1+rnd01(q.type+'q',i)*1.6});
    }
    pushFx({kind:'pickupRing',x:q.x,y:q.y,t:.50,max:.50,r:q.type==='item'?28:18,color:p.c});
  }

  function emitExplosion(x,y,r=40){
    const n=P4.quality<.75?10:20;
    for(let i=0;i<n;i++){
      const a=i*TWO_PI/n+rnd01('boom',i)*.22;
      const sp=80+rnd01('booms',i)*150;
      const hot=i%3!==0;
      pushFx({kind:'debris',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
        t:.52+rnd01('bt',i)*.28,max:.8,color:hot?'#ffb45d':'#5a4c48',
        size:hot?1.7:2.4,grav:75});
    }
    pushFx({kind:'blast',x,y,t:.45,max:.45,r:Math.max(28,r),color:'#ff9d4c'});
  }

  function updateFx(dt){
    for(const f of localFx){
      f.t-=dt;
      if(f.vx!==undefined){
        f.x+=f.vx*dt; f.y+=f.vy*dt;
        if(f.grav) f.vy+=f.grav*dt;
        f.vx*=Math.pow(.90,dt*60);
        f.vy*=Math.pow(.90,dt*60);
      }
    }
    for(let i=localFx.length-1;i>=0;i--) if(localFx[i].t<=0) localFx.splice(i,1);
  }

  function drawLocalFx(){
    if(!P4.enabled||!localFx.length) return;
    ctx.save();
    for(const f of localFx){
      const a=sat(f.t/f.max), q=1-a;
      if(f.kind==='spark'){
        const sp=Math.hypot(f.vx||0,f.vy||0)||1;
        const nx=(f.vx||0)/sp, ny=(f.vy||0)/sp;
        line(f.x,f.y,f.x-nx*(3+f.size*2),f.y-ny*(3+f.size*2),f.color,
             Math.max(.6,f.size*.65),.7*a);
        ellipse(f.x,f.y,f.size,f.size,f.color,.65*a);
      } else if(f.kind==='debris'){
        ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(q*5);
        ctx.globalAlpha=.72*a; ctx.fillStyle=f.color;
        ctx.fillRect(-f.size/2,-f.size/2,f.size,f.size*.7);
        ctx.restore();
      } else if(f.kind==='hitRing'){
        ring(f.x,f.y,f.r*(.5+q*.8),f.color,1.6-q*.8,.55*a);
      } else if(f.kind==='pickupRing'){
        ring(f.x,f.y,f.r*(.4+q*.9),f.color,1.5-q*.7,.50*a);
        glow(f.x,f.y,f.r*(.65+q*.7),hexAlpha(f.color,.24),.36*a);
      } else if(f.kind==='blast'){
        glow(f.x,f.y,f.r*(.45+q*.95),'rgba(255,135,55,.30)',.62*a);
        ring(f.x,f.y,f.r*(.2+q*.95),'rgba(255,195,105,.9)',3-q*2,.55*a);
        ring(f.x,f.y,f.r*(.1+q*.62),'rgba(255,245,220,.95)',1.2,.38*a);
      } else if(f.kind==='itemRise'){
        glow(f.x,f.y-q*10,f.r*(.75+q*.45),hexAlpha(f.color,.28),.40*a);
        ring(f.x,f.y-q*10,f.r*(.45+q*.55),f.color,1.1,.34*a);
      } else if(f.kind==='hurt'){
        ring(f.x,f.y,f.r*(.55+q*.75),'rgba(255,85,100,.9)',2-q,.44*a);
      }
    }
    ctx.restore();
  }

  // ------------------------------------------------------------
  // PICKUPS / ITEMS / TRUHEN / HERZEN
  // ------------------------------------------------------------
  wrap('drawPickup', old => function(q,...rest){
    if(P4.enabled) pickupPre(q);
    const r=old.call(this,q,...rest);
    if(P4.enabled) pickupPost(q);
    return r;
  });

  wrap('drawHeart', old => function(x,y,fill,type,...rest){
    const r=old.call(this,x,y,fill,type,...rest);
    if(!P4.enabled) return r;

    let c='rgba(255,218,220,.62)';
    if(type==='soul') c='rgba(225,248,255,.78)';
    if(type==='black') c='rgba(205,175,235,.70)';
    ellipse(x-2.2,y-2.6,1.45,.75,c,fill==='empty'?.18:.46,-.45);
    if(type==='soul') glow(x,y,8,'rgba(130,205,255,.15)',.48);
    if(type==='black') glow(x,y,8,'rgba(110,75,165,.16)',.46);
    return r;
  });

  wrap('drawItemIcon', old => function(id,x,y,s=1,...rest){
    const r=old.call(this,id,x,y,s,...rest);
    if(!P4.enabled) return r;

    let c='#e6cf8b';
    try{ if(typeof window.itemColor==='function') c=itemColor(id); }catch(_e){}
    const t=nowS(), ph=(hashText(id)%100)/31;
    const rr=8.8*s;
    ellipse(x-rr*.25,y-rr*.32,rr*.22,rr*.08,'rgba(255,255,245,.62)',.20+.10*Math.sin(t*2+ph),-.45);
    if(P4.quality>=.75 && s>=1){
      const a=t*.45+ph;
      ellipse(x+Math.cos(a)*rr*1.12,y+Math.sin(a)*rr*.72,1.0*s,1.0*s,c,.18);
    }
    return r;
  });

  wrap('drawChest', old => function(x,y,c1,c2,...rest){
    const r=old.call(this,x,y,c1,c2,...rest);
    if(!P4.enabled) return r;
    line(x-7,y-6,x-1,y-7,'rgba(255,244,210,.75)',.8,.30);
    ellipse(x+6,y+3,1.1,.7,'rgba(255,220,130,.75)',.30);
    return r;
  });

  // Pedestals werden im Original separat gezeichnet. Wir ergänzen nur Licht.
  wrap('drawPulte', old => function(...a){
    if(P4.enabled && window.G?.room?.pedestals){
      for(const p of G.room.pedestals){
        if(p.taken) continue;
        let c='#d8bd72';
        try{ if(typeof window.itemColor==='function') c=itemColor(p.itemId); }catch(_e){}
        glow(p.x,p.y-4,22,hexAlpha(c,.20),.58);
        ellipse(p.x,p.y+7,9,2.2,'#030305',.20);
      }
    }
    return old.apply(this,a);
  });

  // ------------------------------------------------------------
  // PROJEKTILE / LASER / STRAHLEN / BOMBEN
  // ------------------------------------------------------------
  wrap('drawTear', old => function(t,...rest){
    if(P4.enabled && t){
      const y=t.y-(t.z||0)+9;
      const c=projectileColor(t);
      drawTrail(t,t.x,y,c.glow,Math.max(1,t.r*.60),16);
      glow(t.x,y,Math.max(7,t.r*3.2),c.glow,.62);
    }
    const r=old.call(this,t,...rest);
    if(P4.enabled && t){
      const y=t.y-(t.z||0)+9;
      const c=projectileColor(t);
      ellipse(t.x-t.r*.22,y-t.r*.28,Math.max(.6,t.r*.34),Math.max(.4,t.r*.18),'#ffffff',.36);
      if(t.explosive) ring(t.x,y,t.r*1.35,'rgba(255,190,90,.75)',.8,.22);
      if(t.poison) ring(t.x,y,t.r*1.25,'rgba(180,240,105,.70)',.7,.18);
      if(t.frost) ring(t.x,y,t.r*1.25,'rgba(205,245,255,.80)',.7,.18);
    }
    return r;
  });

  wrap('drawEshot', old => function(s,...rest){
    if(P4.enabled && s){
      const y=s.y-(s.z||0);
      drawTrail(s,s.x,y,'rgba(245,65,80,.28)',Math.max(1,s.r*.55),13);
      glow(s.x,y,Math.max(7,s.r*3),'rgba(230,55,70,.30)',.56);
    }
    const r=old.call(this,s,...rest);
    if(P4.enabled && s){
      const y=s.y-(s.z||0);
      ellipse(s.x-s.r*.20,y-s.r*.25,Math.max(.5,s.r*.30),Math.max(.4,s.r*.16),'#fff2ee',.28);
      if(s.arc) ring(s.x,y,s.r*1.35,'rgba(255,125,115,.62)',.7,.16);
    }
    return r;
  });

  wrap('drawBeam', old => function(b,...rest){
    if(!P4.enabled) return old.call(this,b,...rest);
    ctx.save();
    ctx.shadowColor='rgba(255,75,55,.72)';
    ctx.shadowBlur=12;
    const r=old.call(this,b,...rest);
    ctx.restore();
    if(b){
      const len=b.len||520;
      line(b.x,b.y,b.x+b.dx*len,b.y+b.dy*len,'rgba(255,245,225,.65)',Math.max(.8,(b.w||3)*.16),.42);
    }
    return r;
  });

  wrap('drawLaser', old => function(l,...rest){
    if(!P4.enabled) return old.call(this,l,...rest);
    ctx.save();
    ctx.shadowColor='rgba(100,220,255,.78)';
    ctx.shadowBlur=9;
    const r=old.call(this,l,...rest);
    ctx.restore();
    if(l){
      line(l.x1,l.y1,l.x2,l.y2,'rgba(235,252,255,.92)',.65,sat((l.t||.1)/.12)*.55);
    }
    return r;
  });

  wrap('drawBombEnt', old => function(b,...rest){
    if(P4.enabled && b){
      const danger=sat(1-(Number(b.t)||1)/.8);
      ellipse(b.x,b.y+8,8.5,2.3,'#020204',.28);
      glow(b.x,b.y,16+danger*10,`rgba(235,65,55,${.08+.18*danger})`,.70);
      if(danger>.05) ring(b.x,b.y,10+danger*5,'rgba(255,100,75,.75)',1,.12+.18*danger);
    }
    const r=old.call(this,b,...rest);
    if(P4.enabled && b){
      const t=nowS(), danger=sat(1-(Number(b.t)||1)/.8);
      const sx=b.x+5+Math.sin(t*35)*1.1, sy=b.y-14+Math.cos(t*27)*.8;
      glow(sx,sy,7,'rgba(255,185,70,.35)',.40+.35*danger);
      ellipse(sx,sy,1.2+danger*.8,1.2+danger*.8,'#fff0a5',.72);
    }
    return r;
  });

  // ------------------------------------------------------------
  // EREIGNISSE: Treffer, Aufheben, Truhe, Explosion
  // ------------------------------------------------------------
  wrap('damageEnemy', old => function(e,d,winkel,...rest){
    if(!P4.enabled || !e) return old.call(this,e,d,winkel,...rest);
    const before=Number(e.hp)||0;
    const x=e.x, y=e.y-(e.z||0);
    const r=old.call(this,e,d,winkel,...rest);
    const after=Number(e.hp)||0;
    if(after<before){
      let c='#f2b0a8';
      if(e.poison>0) c='#b8e978';
      else if(e.burn>0) c='#ffad62';
      else if(e.frost>0) c='#c9edff';
      const a=Number.isFinite(winkel)?winkel:0;
      emitHit(x,y,c,Math.cos(a),Math.sin(a),after<=0||d>=20);
    }
    return r;
  });

  wrap('hurtPlayer', old => function(halves,force,...rest){
    if(!P4.enabled) return old.call(this,halves,force,...rest);
    const p=window.G?.player;
    const x=p?.x||0,y=p?.y||0;
    const r=old.call(this,halves,force,...rest);
    if(r===true){
      emitHit(x,y-5,'#ff8b98',0,1,true);
      pushFx({kind:'hurt',x,y:y-5,t:.38,max:.38,r:23});
    }
    return r;
  });

  wrap('collectPickup', old => function(q,...rest){
    if(!P4.enabled || !q) return old.call(this,q,...rest);
    const wasDead=!!q.dead;
    const r=old.call(this,q,...rest);
    if(!wasDead && q.dead) emitPickup(q);
    return r;
  });

  wrap('openChest', old => function(q,kind,...rest){
    const x=q?.x||0,y=q?.y||0;
    const r=old.call(this,q,kind,...rest);
    if(P4.enabled && q){
      const c=kind==='gold'?'#ffd85e':kind==='red'?'#e35a64':'#c7a36f';
      emitHit(x,y,c,0,-1,true);
      pushFx({kind:'pickupRing',x,y,t:.55,max:.55,r:25,color:c});
    }
    return r;
  });

  wrap('acquireItem', old => function(id,pedestal,...rest){
    const p=window.G?.player;
    const x=p?.x||0,y=(p?.y||0)-16;
    const r=old.call(this,id,pedestal,...rest);
    if(P4.enabled){
      let c='#e6cd80';
      try{ if(typeof window.itemColor==='function') c=itemColor(id); }catch(_e){}
      pushFx({kind:'itemRise',x,y,t:.85,max:.85,r:34,color:c});
      const n=P4.quality<.75?8:16;
      for(let i=0;i<n;i++){
        const a=i*TWO_PI/n+rnd01(id,i)*.2;
        const sp=45+rnd01(id+'is',i)*75;
        pushFx({kind:'spark',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-25,
          t:.62,max:.62,color:c,size:1+rnd01(id+'iz',i)*1.8});
      }
    }
    return r;
  });

  wrap('explode', old => function(x,y,radius,...rest){
    const result=old.call(this,x,y,radius,...rest);
    if(P4.enabled) emitExplosion(x,y,radius||40);
    return result;
  });

  // ------------------------------------------------------------
  // STATUS-FX AUF GEGNERN: nur Ergänzung zum Original
  // ------------------------------------------------------------
  wrap('drawEnemy', old => function(e,...rest){
    const r=old.call(this,e,...rest);
    if(!P4.enabled || !e || e.dead) return r;
    const y=e.y-(e.z||0), rr=Math.max(5,e.r||8), t=nowS();

    if(e.poison>0){
      glow(e.x,y,rr*1.35,'rgba(120,210,70,.12)',.45);
      if(P4.quality>=.75){
        const a=t*1.6+(e.x||0)*.01;
        ring(e.x+Math.cos(a)*rr*.7,y+Math.sin(a)*rr*.5,1.3,'rgba(195,245,120,.7)',.7,.20);
      }
    }
    if(e.burn>0){
      glow(e.x,y-rr*.25,rr*1.45,'rgba(255,105,35,.14)',.50);
    }
    if(e.frost>0){
      ellipseStroke(e.x,y,rr*1.04,rr*.94,'rgba(210,245,255,.65)',.8,.16);
    }
    return r;
  });

  // ------------------------------------------------------------
  // FRAME-FX: immer ganz zum Schluss zeichnen
  // ------------------------------------------------------------
  wrap('render', old => function(...a){
    const n=performance.now();
    const dt=Math.min(.1,(n-lastNow)/1000);
    lastNow=n;
    updateFx(dt);

    const r=old.apply(this,a);

    if(typeof window.grundTransform==='function') grundTransform();
    drawLocalFx();
    return r;
  });

  console.info('[KELLERBRUT] Grafik-Overhaul Phase 4 aktiv — Items, Pickups und Kampfeffekte');
})();
</script>

<!-- Grafik-Overhaul Phase 5: HUD, Menue, Charakterauswahl, Pause, Post-Run -->
<script>
/* =================================================================
   KELLERBRUT — GRAFIK-OVERHAUL PHASE 5
   HUD + MENÜ + CHARAKTERAUSWAHL + PAUSE + POST-RUN + BOSS-INTRO

   Einbau hier: direkt hinter Phase 4 eingebettet. Der Pack liefert die Datei
   als phase5.js zum Nachladen aus; KELLERBRUT ist aber bewusst eine einzige
   HTML-Datei ohne Build-Schritt, deshalb steht der Code inline. Bis auf
   diese Kommentarzeilen ist er unveraendert uebernommen.

   WICHTIG:
   Diese Datei ändert ausschließlich die Darstellung.
   Menülogik, Savegame, Charakterwerte, Input und Gameplay bleiben unverändert.
   ================================================================= */
(() => {
  'use strict';

  if (window.__KB_PHASE5_VISUALS__) return;
  window.__KB_PHASE5_VISUALS__ = true;

  const P5 = window.KBPhase5 = {
    enabled: true,
    ambient: true,
    compactHud: false,
    cinematicBossIntro: true,
    version: '5.0'
  };

  const PI2 = Math.PI * 2;
  const original = {};
  const clamp5 = (v,a,b) => Math.max(a,Math.min(b,v));
  const sat5 = v => clamp5(v,0,1);
  const now5 = () => performance.now()/1000;

  function wrapReplace(name, replacement) {
    if (typeof window[name] !== 'function') {
      console.warn('[KELLERBRUT Phase 5] Funktion nicht gefunden:', name);
      return false;
    }
    original[name] = window[name];
    window[name] = replacement;
    return true;
  }

  function safe(fn, fallback=null) {
    try { return fn(); } catch (_) { return fallback; }
  }

  function roundedPath(x,y,w,h,r=8) {
    const rr=Math.max(0,Math.min(r,Math.min(w,h)/2));
    ctx.beginPath();
    if (typeof ctx.roundRect === 'function') {
      ctx.roundRect(x,y,w,h,rr);
    } else {
      ctx.moveTo(x+rr,y);
      ctx.lineTo(x+w-rr,y);
      ctx.quadraticCurveTo(x+w,y,x+w,y+rr);
      ctx.lineTo(x+w,y+h-rr);
      ctx.quadraticCurveTo(x+w,y+h,x+w-rr,y+h);
      ctx.lineTo(x+rr,y+h);
      ctx.quadraticCurveTo(x,y+h,x,y+h-rr);
      ctx.lineTo(x,y+rr);
      ctx.quadraticCurveTo(x,y,x+rr,y);
    }
  }

  function panel(x,y,w,h,opts={}) {
    const {
      fill='rgba(8,9,14,.78)',
      stroke='rgba(236,222,205,.12)',
      radius=9,
      shadow=true,
      glow=null
    }=opts;

    ctx.save();
    if(shadow){
      ctx.shadowColor='rgba(0,0,0,.48)';
      ctx.shadowBlur=14;
      ctx.shadowOffsetY=4;
    }
    if(glow){
      ctx.shadowColor=glow;
      ctx.shadowBlur=18;
    }
    roundedPath(x,y,w,h,radius);
    ctx.fillStyle=fill;
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.shadowOffsetY=0;
    ctx.strokeStyle=stroke;
    ctx.lineWidth=1;
    ctx.stroke();
    ctx.restore();
  }

  function glassLine(x,y,w,color='rgba(255,255,255,.07)') {
    ctx.save();
    ctx.fillStyle=color;
    ctx.fillRect(x,y,w,1);
    ctx.restore();
  }

  function text(str,x,y,size=10,color='#e8e0d0',align='center',weight='600',alpha=1) {
    ctx.save();
    ctx.globalAlpha*=alpha;
    ctx.font=`${weight} ${size}px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif`;
    ctx.textAlign=align;
    ctx.textBaseline='middle';
    ctx.fillStyle=color;
    ctx.fillText(String(str),x,y);
    ctx.restore();
  }

  function mono(str,x,y,size=8,color='#a29aa1',align='center',alpha=1) {
    ctx.save();
    ctx.globalAlpha*=alpha;
    ctx.font=`600 ${size}px ui-monospace,SFMono-Regular,Consolas,monospace`;
    ctx.textAlign=align;
    ctx.textBaseline='middle';
    ctx.fillStyle=color;
    ctx.fillText(String(str),x,y);
    ctx.restore();
  }

  function glowDisc(x,y,r,color='rgba(200,55,90,.18)',alpha=1) {
    ctx.save();
    ctx.globalAlpha*=alpha;
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,color);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(x,y,r,0,PI2);ctx.fill();
    ctx.restore();
  }

  function progress(x,y,w,h,value,fill='#c03a5a',track='rgba(255,255,255,.07)') {
    value=sat5(value);
    ctx.save();
    roundedPath(x,y,w,h,h/2);
    ctx.fillStyle=track;ctx.fill();
    if(value>0){
      roundedPath(x,y,w*value,h,h/2);
      ctx.fillStyle=fill;ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.15)';
      roundedPath(x+1,y+1,Math.max(0,w*value-2),1.2,1);
      ctx.fill();
    }
    ctx.restore();
  }

  function chip(x,y,label,opts={}) {
    const {
      color='#e8e0d0',
      fill='rgba(16,17,24,.78)',
      stroke='rgba(238,222,204,.12)',
      width=null
    }=opts;
    const w=width||Math.max(38,12+String(label).length*5.4);
    panel(x,y,w,18,{fill,stroke,radius:6,shadow:false});
    text(label,x+w/2,y+9,7,color,'center','700');
    return w;
  }

  function ambientBackground(accent='#c03a5a') {
    const t=now5();
    ctx.save();

    const g=ctx.createRadialGradient(W*.5,H*.31,24,W*.5,H*.5,W*.68);
    g.addColorStop(0,'#21141c');
    g.addColorStop(.38,'#100e15');
    g.addColorStop(1,'#060609');
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

    // Kellerwand-Struktur
    ctx.globalAlpha=.12;
    ctx.strokeStyle='#b7a99c';
    ctx.lineWidth=.6;
    const brickH=26, brickW=56;
    for(let row=0;row<Math.ceil(H/brickH)+1;row++){
      const yy=row*brickH+6;
      ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy);ctx.stroke();
      const off=(row%2)*brickW*.5;
      for(let x=-brickW;x<W+brickW;x+=brickW){
        ctx.beginPath();ctx.moveTo(x+off,yy-brickH);ctx.lineTo(x+off,yy);ctx.stroke();
      }
    }

    // Feuchte Schatten von oben/unten
    ctx.globalAlpha=1;
    const v=ctx.createLinearGradient(0,0,0,H);
    v.addColorStop(0,'rgba(0,0,0,.38)');
    v.addColorStop(.32,'rgba(0,0,0,0)');
    v.addColorStop(.74,'rgba(0,0,0,.05)');
    v.addColorStop(1,'rgba(0,0,0,.52)');
    ctx.fillStyle=v;ctx.fillRect(0,0,W,H);

    glowDisc(W*.5,72,180,'rgba(205,45,75,.13)',1);

    if(P5.ambient){
      // Staubpartikel: rein visuell, deterministisch aus Index + Zeit.
      for(let i=0;i<24;i++){
        const speed=.018+(i%5)*.006;
        const ph=(t*speed+i*.137)%1;
        const x=(i*137.27 + Math.sin(t*.18+i)*18)%W;
        const y=H-(ph*H);
        const a=.06+(i%4)*.018;
        ctx.fillStyle=`rgba(238,225,205,${a})`;
        ctx.fillRect(x,y,(i%3===0)?1.2:.7,(i%3===0)?1.2:.7);
      }

      // Sehr langsamer Kellernebel.
      for(let i=0;i<3;i++){
        const x=W*(.2+i*.32)+Math.sin(t*.12+i)*34;
        const y=H*(.72+i*.04);
        glowDisc(x,y,115,'rgba(100,88,112,.055)',1);
      }
    }

    ctx.restore();
  }

  function titleBlock(title,subtitle=null,accent='#d84b69') {
    const t=now5();
    ctx.save();
    glowDisc(W/2,55,150,'rgba(214,55,87,.15)',1);
    ctx.shadowColor='rgba(220,58,88,.35)';
    ctx.shadowBlur=16;
    text(title,W/2,49,25,accent,'center','800');
    ctx.shadowBlur=0;
    if(subtitle) text(subtitle,W/2,73,8,'#8d8583','center','500');

    // Unterstrich/Metallkante
    const pulse=.64+.18*Math.sin(t*1.1);
    const grad=ctx.createLinearGradient(W/2-105,0,W/2+105,0);
    grad.addColorStop(0,'rgba(210,65,90,0)');
    grad.addColorStop(.5,`rgba(220,75,100,${pulse})`);
    grad.addColorStop(1,'rgba(210,65,90,0)');
    ctx.fillStyle=grad;
    ctx.fillRect(W/2-110,84,220,1);
    ctx.restore();
  }

  function menuArrow(x,y,dir=1,a=1) {
    ctx.save();
    ctx.globalAlpha=a;
    ctx.fillStyle='#d94c69';
    ctx.beginPath();
    ctx.moveTo(x+dir*5,y);
    ctx.lineTo(x-dir*3,y-4);
    ctx.lineTo(x-dir*3,y+4);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawMenu5() {
    if(!P5.enabled) return original.drawMenu();

    ambientBackground();
    titleBlock('K E L L E R B R U T','ETWAS ATMET UNTER DEM HAUS');

    const entries=safe(()=>menuEintraege(),[])||[];
    menu.idx=clamp5(menu.idx||0,0,Math.max(0,entries.length-1));

    const boxW=300;
    const rowH=38;
    const boxH=Math.max(82,entries.length*rowH+24);
    const bx=W/2-boxW/2, by=103;
    panel(bx,by,boxW,boxH,{
      fill:'rgba(7,8,13,.72)',
      stroke:'rgba(228,208,190,.11)',
      radius:11
    });
    glassLine(bx+10,by+1,boxW-20);

    entries.forEach((e,i)=>{
      const y=by+15+i*rowH;
      const selected=i===menu.idx;
      if(selected){
        const pulse=.78+.12*Math.sin(now5()*4);
        panel(bx+10,y,boxW-20,30,{
          fill:`rgba(56,25,38,${pulse})`,
          stroke:'rgba(221,82,108,.34)',
          radius:7,
          shadow:false,
          glow:'rgba(205,45,75,.13)'
        });
        menuArrow(bx+20,y+15,1,.95);
      }

      const ty=y+12-(e.zusatz?4:0);
      text(e.text,W/2,ty,selected?11:10,
           selected?'#f1e7dd':'#8d8589','center',selected?'750':'600');

      if(e.zusatz){
        mono(e.zusatz,W/2,y+22,6.5,selected?'#b2a49b':'#5b565c');
      }
    });

    const hintY=by+boxH+22;
    chip(W/2-93,hintY-9,'▲▼ AUSWAHL',{width:88,color:'#a99da0'});
    chip(W/2+5,hintY-9,'ENTER BESTÄTIGEN',{width:106,color:'#d8cfc8'});

    panel(30,H-50,W-60,31,{
      fill:'rgba(6,7,11,.62)',
      stroke:'rgba(225,210,195,.07)',
      radius:8,
      shadow:false
    });
    text('WASD Bewegung   ·   Pfeile Schießen   ·   SPACE Bombe   ·   E Aktivitem   ·   Q Tasche',
         W/2,H-39,7,'#787176');
    text('P Pause   ·   M Musik   ·   N Ton   ·   Gamepad unterstützt',
         W/2,H-28,6.5,'#565158');

    mono('KELLERBRUT // GRAPHIC PASS 05',W-10,H-8,5.5,'#3f3b42','right');
  }

  function drawStatistik5() {
    if(!P5.enabled) return original.drawStatistik();

    ambientBackground('#b58b69');
    titleBlock('STATISTIK & FREISCHALTUNGEN','DEINE SPUREN IM KELLER','#e0d0bd');

    const cards=[
      ['LÄUFE',saveData.laeufe||0],
      ['SIEGE',saveData.wins||0],
      ['TODE',saveData.deaths||0],
      ['BESTE ETAGE',saveData.bestFloor||1],
      ['KILLS',saveData.kills||0],
    ];

    const totalW=520,gap=8,cw=(totalW-gap*4)/5;
    const startX=W/2-totalW/2;
    cards.forEach((c,i)=>{
      const x=startX+i*(cw+gap);
      panel(x,98,cw,58,{
        fill:'rgba(9,10,15,.78)',
        stroke:i===1?'rgba(103,198,119,.20)':'rgba(232,216,198,.10)',
        radius:8
      });
      text(c[0],x+cw/2,113,6.2,'#756e73','center','700');
      text(c[1],x+cw/2,136,18,i===1?'#83d58f':'#eee3d7','center','800');
    });

    const unlockX=74, unlockY=178, unlockW=W-148, unlockH=132;
    panel(unlockX,unlockY,unlockW,unlockH,{
      fill:'rgba(8,9,14,.74)',
      stroke:'rgba(235,219,199,.10)',
      radius:10
    });
    text('FIGUREN',unlockX+16,unlockY+17,7,'#8d827c','left','800');
    text('Status',unlockX+unlockW-16,unlockY+17,6,'#5f5960','right','700');
    glassLine(unlockX+12,unlockY+30,unlockW-24);

    const chars=typeof CHARS!=='undefined'?CHARS:[];
    const cols=2;
    const rowH=20;
    chars.forEach((c,i)=>{
      const col=i%cols,row=Math.floor(i/cols);
      const cellW=(unlockW-28)/2;
      const x=unlockX+14+col*cellW;
      const y=unlockY+41+row*rowH;
      if(y>unlockY+unlockH-12) return;
      const open=safe(()=>charUnlocked(c),false);
      const dot=open?'#75cc83':'#544b50';
      ctx.save();ctx.fillStyle=dot;ctx.beginPath();ctx.arc(x+4,y,2.4,0,PI2);ctx.fill();ctx.restore();
      text(c.name,x+12,y,7,open?'#ddd3ca':'#686167','left',open?'650':'550');
      const label=open?'FREI':(c.unlockText||'GESPERRT');
      text(label,x+cellW-12,y,5.5,open?'#6fb97a':'#555057','right','650');
    });

    chip(W/2-45,H-29,'ESC ZURÜCK',{width:90,color:'#a99da0'});
  }

  function drawOptionen5() {
    if(!P5.enabled) return original.drawOptionen();

    ambientBackground('#d4af37');
    titleBlock('EINSTELLUNGEN','SOFORT GESPEICHERT','#e8dfcf');

    const list=safe(()=>optionenListe(),[])||[];
    menu.optIdx=clamp5(menu.optIdx||0,0,Math.max(0,list.length-1));

    const bx=120,by=100,bw=W-240,bh=152;
    panel(bx,by,bw,bh,{
      fill:'rgba(8,9,14,.78)',
      stroke:'rgba(232,217,197,.11)',
      radius:10
    });

    list.forEach((o,i)=>{
      const y=by+23+i*38;
      const selected=i===menu.optIdx;

      if(selected){
        panel(bx+10,y-13,bw-20,28,{
          fill:'rgba(49,39,28,.50)',
          stroke:'rgba(221,184,90,.24)',
          radius:7,
          shadow:false
        });

  function heartsData(p) {
    const hearts=[];
    for(let i=0;i<(p.redMax||0)/2;i++){
      const v=(p.red||0)-i*2;
      hearts.push({fill:v>=2?'full':(v===1?'half':'empty'),type:'red'});
    }
    const soul=p.soul||[];
    for(let i=0;i<Math.ceil(soul.length/2);i++){
      const idx=i*2;
      hearts.push({
        fill:soul.length-idx===1?'half':'full',
        type:soul[idx]==='B'?'black':'soul'
      });
    }
    return hearts;
  }

  function hudIconCoin(x,y) {
    ctx.beginPath();ctx.arc(x,y,4.6,0,PI2);
    ctx.fillStyle='#e7bb47';ctx.fill();
    ctx.strokeStyle='#8b6e25';ctx.lineWidth=1;ctx.stroke();
    ctx.beginPath();ctx.arc(x-1,y-1,1.2,0,PI2);
    ctx.fillStyle='rgba(255,245,185,.46)';ctx.fill();
  }

  function hudIconBomb(x,y) {
    ctx.beginPath();ctx.arc(x,y,4.8,0,PI2);
    ctx.fillStyle='#292a30';ctx.fill();
    ctx.beginPath();ctx.arc(x-1.5,y-1.5,1.3,0,PI2);
    ctx.fillStyle='#5d6068';ctx.fill();
    ctx.strokeStyle='#9a752d';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x+2,y-4);ctx.quadraticCurveTo(x+6,y-8,x+5,y-10);ctx.stroke();
  }

  function hudIconKey(x,y) {
    ctx.strokeStyle='#e2bb49';ctx.lineWidth=2.1;ctx.lineCap='round';
    ctx.beginPath();ctx.arc(x,y-3,2.5,0,PI2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,y-1);ctx.lineTo(x,y+6);ctx.lineTo(x+4,y+6);ctx.stroke();
    ctx.lineCap='butt';
  }

      const max=Math.min(24,items.length);
      const iconGap=21;
      const total=(Math.min(12,max)-1)*iconGap;
      for(let i=0;i<max;i++){
        const row=Math.floor(i/12),col=i%12;
        const x=W/2-total/2+col*iconGap;
        const y=boxY+36+row*23;
        drawItemIcon(items[i],x,y,.75);
      }
      if(items.length>24) mono('+'+(items.length-24),W-86,boxY+56,6,'#81797d','right');
    }

    chip(W/2-82,H-34,'ENTER ZURÜCK INS MENÜ',{
      width:164,
      color:win?'#bfe5c6':'#e2cfd2',
      fill:'rgba(10,11,16,.78)'
    });
  }

  function drawBossIntro5() {
    if(!P5.enabled) return original.drawBossIntro();

    const bi=G.bossIntro;
    if(!bi) return;

    const t=Number(bi.t)||0;
    const alpha=sat5(Math.min(t/.35,(2.4-t)/.25+1));

    ctx.save();
    ctx.fillStyle=`rgba(4,4,8,${.86*sat5(t/.28)})`;
    ctx.fillRect(0,0,W,H);

    // Cinematic Bars
    if(P5.cinematicBossIntro){
      const barA=sat5((2.4-t)/.25);
      ctx.fillStyle=`rgba(0,0,0,${.92*barA})`;
      ctx.fillRect(0,0,W,25*barA);
      ctx.fillRect(0,H-25*barA,W,25*barA);
    }

    const boss=(G.enemies||[]).find(e=>e.isBoss);
    const accent=boss?.def?.color||'#c03a5a';

    glowDisc(W/2,H/2+42,105,
      accent.startsWith?.('#')?hexToRgba5(accent,.17):'rgba(190,50,75,.17)',1);

    text(safe(()=>G.floor.data.name,'KELLER'),W/2,86,6.5,'#777075','center','750');
    text(bi.name||G.bossName||'BOSS',W/2,116,23,'#eee3d9','center','850');

    const g=ctx.createLinearGradient(W/2-120,0,W/2+120,0);
    g.addColorStop(0,'rgba(195,55,78,0)');
    g.addColorStop(.5,'rgba(208,67,91,.85)');
    g.addColorStop(1,'rgba(195,55,78,0)');
    ctx.fillStyle=g;ctx.fillRect(W/2-120,137,240,2);

    if(boss && t<2.05){
      const tmp={...boss,x:W/2,y:218,flash:0};
      ctx.save();
      ctx.shadowColor='rgba(0,0,0,.70)';
      ctx.shadowBlur=20;
      drawBossSprite(tmp,218,c=>c);
      ctx.restore();
    }

    text('BOSS',W/2,294,5.5,'#665f64','center','800');
    mono('ENTER ÜBERSPRINGEN',W/2,317,5.5,'#4e494f');

    // leichter Fokusrahmen
    ctx.strokeStyle='rgba(235,220,205,.055)';
    ctx.strokeRect(18.5,18.5,W-37,H-37);
    ctx.restore();
  }

  function hexToRgba5(hex,a) {
    if(typeof hex!=='string'||hex[0]!=='#') return `rgba(195,55,80,${a})`;
    let s=hex.slice(1);
    if(s.length===3) s=s.split('').map(c=>c+c).join('');
    const n=parseInt(s,16);
    return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
  }

  // --------------------------------------------------------------
  // Aktiviere die neuen Screens.
  // --------------------------------------------------------------
  wrapReplace('drawMenu',drawMenu5);
  wrapReplace('drawStatistik',drawStatistik5);
  wrapReplace('drawOptionen',drawOptionen5);
  wrapReplace('drawCharSel',drawCharSel5);
  wrapReplace('drawHUD',drawHUD5);
  wrapReplace('drawPause',drawPause5);
  wrapReplace('drawPostRun',drawPostRun5);
  wrapReplace('drawBossIntro',drawBossIntro5);

  console.info(
    '[KELLERBRUT] Grafik-Overhaul Phase 5 aktiv — HUD, Menüs, Auswahl, Pause und Boss-Intro'
  );
})();
</script>

<!-- Grafik-Overhaul Phase 6: Final Polish und adaptive Qualitaet -->
<script>
/* =====================================================================
   KELLERBRUT — GRAFIK-OVERHAUL PHASE 6
   FINAL POLISH + ÜBERGÄNGE + SCREEN-FX + ADAPTIVE PERFORMANCE

   Empfohlene Reihenfolge:
     Einbau hier: als letzter Block inline eingebettet. Der Pack liefert die
     Datei als phase6.js zum Nachladen aus; KELLERBRUT ist aber bewusst eine
     einzige HTML-Datei ohne Build-Schritt, deshalb steht der Code inline.
     Bis auf diese Kommentarzeilen ist er unveraendert uebernommen.

   Diese Datei ist ein visueller Abschluss-Pass.
   Sie verändert NICHT:
   - Schaden / HP / Balancing
   - Gegner- oder Boss-KI
   - Hitboxen / Kollisionen
   - RNG / Raumgenerierung / Savegame

   Phase 6 verbessert:
   - Raum- und Etagenübergänge
   - Treffer-/Low-HP-Screenfeedback
   - Item-Aufhebe-Polish
   - Bewegung / Kamera-Atmosphäre
   - Death-/Win-Fades
   - Filmkorn / Vignette als gecachte Overlays
   - adaptive Effektqualität bei schwächerer Framerate
   ===================================================================== */
(() => {
  'use strict';

  if (window.__KB_PHASE6_VISUALS__) return;
  window.__KB_PHASE6_VISUALS__ = true;

  const P6 = window.KBPhase6 = {
    enabled: true,
    adaptiveQuality: true,
    quality: 1,
    grain: true,
    vignette: true,
    lowHealthFx: true,
    transitions: true,
    floorCards: true,
    motionAccents: true,
    debugFps: false,
    version: '6.0'
  };

  const TWO_PI = Math.PI * 2;
  const clamp6 = (v,a,b) => Math.max(a,Math.min(b,v));
  const sat6 = v => clamp6(v,0,1);
  const now6 = () => performance.now()/1000;

  const state = {
    lastRender: performance.now(),
    smoothDt: 1/60,
    fps: 60,
    lowFpsTime: 0,
    highFpsTime: 0,
    autoLow: false,

    hitFlash: 0,
    itemFlash: 0,
    reviveFlash: 0,
    roomPulse: 0,
    roomDir: null,

    floorCard: 0,
    floorCardDepth: null,
    floorCardName: '',

    lastRoomKey: null,
    lastDepth: null,
    lastPlayerDead: false,
    lastResult: null,

    grainTick: -1,
    grainCanvas: null,
    vignetteCanvas: null,
    cachedW: 0,
    cachedH: 0,

    localFx: [],
  };

  const originals = {};
  const externalQuality = new Map();

  function wrap(name,factory){
    const old=window[name];
    if(typeof old!=='function'){
      console.warn('[KELLERBRUT Phase 6] Funktion nicht gefunden:',name);
      return false;
    }
    originals[name]=old;
    window[name]=factory(old);
    return true;
  }

  function safe(fn,fallback=null){
    try{return fn();}catch(_){return fallback;}
  }

  function rgba(hex,a){
    if(typeof hex!=='string'||hex[0]!=='#') return `rgba(210,65,90,${a})`;
    let s=hex.slice(1);
    if(s.length===3) s=s.split('').map(c=>c+c).join('');
    const n=parseInt(s,16);
    return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
  }

  function rounded(x,y,w,h,r){
    ctx.beginPath();
    if(typeof ctx.roundRect==='function'){
      ctx.roundRect(x,y,w,h,r);
    }else{
      r=Math.min(r,w/2,h/2);
      ctx.moveTo(x+r,y);
      ctx.lineTo(x+w-r,y);
      ctx.quadraticCurveTo(x+w,y,x+w,y+r);
      ctx.lineTo(x+w,y+h-r);
      ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
      ctx.lineTo(x+r,y+h);
      ctx.quadraticCurveTo(x,y+h,x,y+h-r);
      ctx.lineTo(x,y+r);
      ctx.quadraticCurveTo(x,y,x+r,y);
    }
  }

  function text6(str,x,y,size=9,color='#e8e0d0',align='center',weight='700',alpha=1){
    ctx.save();
    ctx.globalAlpha*=alpha;
    ctx.font=`${weight} ${size}px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif`;
    ctx.textAlign=align;
    ctx.textBaseline='middle';
    ctx.fillStyle=color;
    ctx.fillText(String(str),x,y);
    ctx.restore();
  }

  function mono6(str,x,y,size=6,color='#777078',align='center',alpha=1){
    ctx.save();
    ctx.globalAlpha*=alpha;
    ctx.font=`600 ${size}px ui-monospace,SFMono-Regular,Consolas,monospace`;
    ctx.textAlign=align;
    ctx.textBaseline='middle';
    ctx.fillStyle=color;
    ctx.fillText(String(str),x,y);
    ctx.restore();
  }

  function glow(x,y,r,color,a=1){
    ctx.save();
    ctx.globalAlpha*=a;
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,color);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(x,y,r,0,TWO_PI);
    ctx.fill();
    ctx.restore();
  }

  function ring(x,y,r,color,w=1,a=1){
    ctx.save();
    ctx.globalAlpha*=a;
    ctx.strokeStyle=color;
    ctx.lineWidth=w;
    ctx.beginPath();
    ctx.arc(x,y,r,0,TWO_PI);
    ctx.stroke();
    ctx.restore();
  }

  function makeCanvas(w,h){
    if(typeof OffscreenCanvas!=='undefined') return new OffscreenCanvas(w,h);
    const c=document.createElement('canvas');
    c.width=w;c.height=h;
    return c;
  }

  function ensureCaches(){
    const w=640,h=360;
    if(state.cachedW===w && state.cachedH===h &&
       state.vignetteCanvas && state.grainCanvas) return;

    state.cachedW=w;state.cachedH=h;

    // Vignette wird nur einmal berechnet und danach pro Frame kopiert.
    const vc=makeCanvas(w,h);
    const vx=vc.getContext('2d');
    const vg=vx.createRadialGradient(w/2,h*.48,h*.16,w/2,h*.5,w*.61);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(.64,'rgba(0,0,0,.015)');
    vg.addColorStop(.84,'rgba(0,0,0,.10)');
    vg.addColorStop(1,'rgba(0,0,0,.28)');
    vx.fillStyle=vg;
    vx.fillRect(0,0,w,h);
    state.vignetteCanvas=vc;

    const gc=makeCanvas(w,h);
    state.grainCanvas=gc;
    rebuildGrain(0);
  }

  function rebuildGrain(tick){
    if(!state.grainCanvas) return;
    if(tick===state.grainTick) return;
    state.grainTick=tick;

    const gctx=state.grainCanvas.getContext('2d');
    gctx.clearRect(0,0,640,360);

    // Wenige große Körner statt pixelweises Noise: sehr billig.
    const count=P6.quality<.8?34:62;
    for(let i=0;i<count;i++){
      const x=(i*137 + tick*47 + (i*i*13))%640;
      const y=(i*83 + tick*29 + (i*i*7))%360;
      const light=((i+tick)%3)!==0;
      gctx.fillStyle=light?'rgba(255,245,235,.030)':'rgba(0,0,0,.035)';
      const s=(i%7===0)?1.2:.65;
      gctx.fillRect(x,y,s,s);
    }
  }

  function totalHalfHearts(){
    const p=safe(()=>G.player,null);
    if(!p) return 99;
    return Math.max(0,(Number(p.red)||0)+(p.soul?.length||0));
  }

  function lowHealthOverlay(){
    if(!P6.lowHealthFx || !window.G || G.state!=='game') return;
    const p=G.player;
    if(!p || p.dead) return;

    const hp=totalHalfHearts();
    if(hp>3) return;

    const severity=hp<=1?1:(hp===2?.72:.42);
    const pulse=.5+.5*Math.sin(now6()*(hp<=1?4.5:3.0));
    const alpha=(.035+.055*pulse)*severity;

    ctx.save();
    const g=ctx.createRadialGradient(W/2,H/2,H*.20,W/2,H/2,W*.60);
    g.addColorStop(0,'rgba(80,0,10,0)');
    g.addColorStop(.70,'rgba(90,8,18,0)');
    g.addColorStop(1,`rgba(130,8,24,${alpha})`);
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  function hitOverlay(){
    if(state.hitFlash<=0) return;
    const a=sat6(state.hitFlash/.28);
    ctx.save();
    const g=ctx.createRadialGradient(W/2,H/2,22,W/2,H/2,W*.62);
    g.addColorStop(0,`rgba(255,115,120,${.015*a})`);
    g.addColorStop(.65,`rgba(180,25,45,${.02*a})`);
    g.addColorStop(1,`rgba(165,12,30,${.26*a})`);
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

    // Kurze weiße Innenkante, damit Schaden sofort lesbar ist.
    ctx.strokeStyle=`rgba(255,230,225,${.10*a})`;
    ctx.lineWidth=1;
    ctx.strokeRect(5.5,5.5,W-11,H-11);
    ctx.restore();
  }

  function itemOverlay(){
    if(state.itemFlash<=0) return;
    const a=sat6(state.itemFlash/.55);
    const p=safe(()=>G.player,null);
    const x=p?.x??W/2,y=(p?.y??H/2)-8;

    ctx.save();
    glow(x,y,65,'rgba(255,222,135,.12)',a);
    ring(x,y,18+(1-a)*40,'rgba(255,229,160,.65)',1.2,.34*a);
    ctx.restore();
  }

  function reviveOverlay(){
    if(state.reviveFlash<=0) return;
    const a=sat6(state.reviveFlash/.75);
    ctx.save();
    ctx.fillStyle=`rgba(245,225,165,${.055*a})`;
    ctx.fillRect(0,0,W,H);
    const p=safe(()=>G.player,null);
    if(p){
      ring(p.x,p.y,16+(1-a)*55,'rgba(255,236,185,.80)',1.4,.40*a);
      glow(p.x,p.y,70,'rgba(255,222,145,.16)',.7*a);
    }
    ctx.restore();
  }

  function roomRevealOverlay(){
    if(state.roomPulse<=0 || !P6.transitions) return;
    const a=sat6(state.roomPulse/.34);
    const p=safe(()=>G.player,null);
    const x=p?.x??W/2,y=p?.y??H/2;

    ctx.save();
    const g=ctx.createRadialGradient(x,y,22,x,y,W*.62);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(.48,`rgba(0,0,0,${.02*a})`);
    g.addColorStop(1,`rgba(0,0,0,${.30*a})`);
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  function transitionOverlay(){
    if(!P6.transitions || !window.G || !G.trans) return;

    const tr=G.trans;
    const remaining=Number(tr.t)||0;
    const peak=1-Math.abs(remaining-.175)/.175;
    const a=sat6(peak);
    if(a<=0) return;

    const dir=String(tr.dir||state.roomDir||'');
    let g;

    ctx.save();
    if(dir==='left'||dir==='west'||dir==='w'){
      g=ctx.createLinearGradient(0,0,W,0);
      g.addColorStop(0,`rgba(0,0,0,${.46*a})`);
      g.addColorStop(.42,`rgba(35,18,28,${.13*a})`);
      g.addColorStop(1,'rgba(0,0,0,0)');
    }else if(dir==='right'||dir==='east'||dir==='e'){
      g=ctx.createLinearGradient(W,0,0,0);
      g.addColorStop(0,`rgba(0,0,0,${.46*a})`);
      g.addColorStop(.42,`rgba(35,18,28,${.13*a})`);
      g.addColorStop(1,'rgba(0,0,0,0)');
    }else if(dir==='up'||dir==='north'||dir==='n'){
      g=ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,`rgba(0,0,0,${.46*a})`);
      g.addColorStop(.45,`rgba(35,18,28,${.13*a})`);
      g.addColorStop(1,'rgba(0,0,0,0)');
    }else{
      g=ctx.createLinearGradient(0,H,0,0);
      g.addColorStop(0,`rgba(0,0,0,${.46*a})`);
      g.addColorStop(.45,`rgba(35,18,28,${.13*a})`);
      g.addColorStop(1,'rgba(0,0,0,0)');
    }
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

    // Kleine Lichtkante am Übergangsmittelpunkt.
    ctx.globalAlpha=.18*a;
    ctx.fillStyle='#d08a9c';
    if(dir==='left'||dir==='right'||dir==='west'||dir==='east'||dir==='w'||dir==='e'){
      ctx.fillRect(W/2-1,0,2,H);
    }else{
      ctx.fillRect(0,H/2-1,W,2);
    }
    ctx.restore();
  }

  function motionAccents(){
    if(!P6.motionAccents || P6.quality<.75 || !window.G || G.state!=='game') return;
    const p=G.player;
    if(!p || p.dead) return;

    const vx=Number(p.vx)||0,vy=Number(p.vy)||0;
    const sp=Math.hypot(vx,vy);
    if(sp<155) return;

    const d=sp||1,dx=vx/d,dy=vy/d;
    const a=sat6((sp-155)/170)*.09;

    ctx.save();
    ctx.strokeStyle=`rgba(230,224,220,${a})`;
    ctx.lineWidth=.7;
    ctx.lineCap='round';

    for(let i=0;i<5;i++){
      const side=(i-2)*32;
      const x=W/2-dy*side-dx*(70+i*11);
      const y=H/2+dx*side-dy*(70+i*11);
      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.lineTo(x-dx*(11+i*2),y-dy*(11+i*2));
      ctx.stroke();
    }
    ctx.restore();
  }

  function floorCardOverlay(){
    if(!P6.floorCards || state.floorCard<=0) return;

    const age=2.15-state.floorCard;
    const fadeIn=sat6(age/.22);
    const fadeOut=sat6(state.floorCard/.42);
    const a=Math.min(fadeIn,fadeOut);
    const y=105-(1-a)*8;

    ctx.save();
    ctx.globalAlpha=a;

    rounded(W/2-132,y-27,264,54,9);
    ctx.fillStyle='rgba(6,7,11,.82)';
    ctx.fill();
    ctx.strokeStyle='rgba(234,218,200,.11)';
    ctx.lineWidth=1;
    ctx.stroke();

    const g=ctx.createLinearGradient(W/2-95,0,W/2+95,0);
    g.addColorStop(0,'rgba(205,65,90,0)');
    g.addColorStop(.5,'rgba(215,78,100,.58)');
    g.addColorStop(1,'rgba(205,65,90,0)');
    ctx.fillStyle=g;
    ctx.fillRect(W/2-100,y+10,200,1);

    text6(`ETAGE ${state.floorCardDepth}`,W/2,y-10,6,'#82797d','center','800');
    text6(state.floorCardName,W/2,y+1,13,'#eee2d8','center','800');
    ctx.restore();
  }

  function deathAndWinOverlay(){
    if(!window.G) return;

    if(G.player?.dead){
      const d=sat6(1-(Number(G.deathTimer)||0)/1.2);
      ctx.save();
      const g=ctx.createRadialGradient(G.player.x,G.player.y,12,G.player.x,G.player.y,W*.60);
      g.addColorStop(0,`rgba(35,0,6,${.05*d})`);
      g.addColorStop(.55,`rgba(45,0,7,${.10*d})`);
      g.addColorStop(1,`rgba(18,0,4,${.42*d})`);
      ctx.fillStyle=g;
      ctx.fillRect(0,0,W,H);
      ctx.restore();
    }

    if(G.winQueued){
      const remain=Number(G.winTimer)||0;
      const p=sat6((2.5-remain)/2.5);
      ctx.save();
      const g=ctx.createRadialGradient(W/2,H/2,20,W/2,H/2,W*.60);
      g.addColorStop(0,`rgba(235,220,165,${.035*p})`);
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;
      ctx.fillRect(0,0,W,H);
      ctx.restore();
    }
  }

  function subtleGlobalOverlay(){
    if(!P6.enabled) return;
    ensureCaches();

    ctx.save();

    if(P6.vignette && state.vignetteCanvas){
      ctx.globalAlpha=.78;
      ctx.drawImage(state.vignetteCanvas,0,0,W,H);
    }

    if(P6.grain && state.grainCanvas && P6.quality>=.55){
      const tick=Math.floor(performance.now()/180);
      rebuildGrain(tick);
      ctx.globalAlpha=P6.quality<.8?.38:.55;
      ctx.drawImage(state.grainCanvas,0,0,W,H);
    }

    ctx.restore();
  }

  function debugOverlay(){
    if(!P6.debugFps) return;
    ctx.save();
    rounded(W-74,H-43,66,28,5);
    ctx.fillStyle='rgba(0,0,0,.62)';
    ctx.fill();
    mono6(`${Math.round(state.fps)} FPS`,W-41,H-32,6.5,
          state.fps<50?'#e48080':'#9bcf9f');
    mono6(`FX ${P6.quality.toFixed(2)}`,W-41,H-20,5.5,'#777078');
    ctx.restore();
  }

  function addLocalFx(kind,x,y,color='#fff'){
    const max=P6.quality<.8?18:36;
    state.localFx.push({kind,x,y,color,t:.55,max:.55});
    if(state.localFx.length>max)
      state.localFx.splice(0,state.localFx.length-max);
  }

  function updateLocal(dt){
    state.hitFlash=Math.max(0,state.hitFlash-dt);
    state.itemFlash=Math.max(0,state.itemFlash-dt);
    state.reviveFlash=Math.max(0,state.reviveFlash-dt);
    state.roomPulse=Math.max(0,state.roomPulse-dt);
    state.floorCard=Math.max(0,state.floorCard-dt);

    for(const f of state.localFx) f.t-=dt;
    state.localFx=state.localFx.filter(f=>f.t>0);
  }

  function drawLocalFx(){
    if(!state.localFx.length) return;
    ctx.save();
    for(const f of state.localFx){
      const a=sat6(f.t/f.max);
      const p=1-a;
      if(f.kind==='impact'){
        ring(f.x,f.y,5+p*13,f.color,1,.28*a);
      }else if(f.kind==='room'){
        ring(f.x,f.y,12+p*34,'rgba(235,220,200,.65)',1,.15*a);
      }
    }
    ctx.restore();
  }

  function measurePerformance(now){
    let dt=(now-state.lastRender)/1000;
    state.lastRender=now;
    dt=clamp6(dt,.001,.12);
    state.smoothDt=state.smoothDt*.94+dt*.06;
    state.fps=1/state.smoothDt;

    if(!P6.adaptiveQuality) return;

    if(state.fps<48){
      state.lowFpsTime+=dt;
      state.highFpsTime=0;
    }else if(state.fps>56){
      state.highFpsTime+=dt;
      state.lowFpsTime=Math.max(0,state.lowFpsTime-dt*.5);
    }else{
      state.lowFpsTime=Math.max(0,state.lowFpsTime-dt*.25);
      state.highFpsTime=Math.max(0,state.highFpsTime-dt*.25);
    }

    if(!state.autoLow && state.lowFpsTime>2.2){
      state.autoLow=true;
      P6.quality=.62;
      applyExternalQuality(.65);
    }

    if(state.autoLow && state.highFpsTime>5.0){
      state.autoLow=false;
      P6.quality=1;
      restoreExternalQuality();
      state.lowFpsTime=0;
      state.highFpsTime=0;
    }
  }

  function applyExternalQuality(q){
    for(const key of ['KBPhase2','KBPhase3','KBPhase4']){
      const obj=window[key];
      if(!obj || typeof obj.quality!=='number') continue;
      if(!externalQuality.has(key)) externalQuality.set(key,obj.quality);
      obj.quality=Math.min(externalQuality.get(key),q);
    }

    // G.fx enthält nur visuelle Effekte. Bei schwacher Framerate werden
    // lediglich die ältesten überschüssigen Partikel entfernt.
    if(window.G?.fx && G.fx.length>520) G.fx.splice(0,G.fx.length-520);
  }

  function restoreExternalQuality(){
    for(const [key,value] of externalQuality){
      const obj=window[key];
      if(obj && typeof obj.quality==='number') obj.quality=value;
    }
    externalQuality.clear();
  }

  function detectWorldChanges(){
    if(!window.G) return;

    const roomKey=safe(()=>G.roomKey,null);
    const depth=safe(()=>G.depth,null);

    if(state.lastRoomKey===null && roomKey!=null) state.lastRoomKey=roomKey;
    else if(roomKey!=null && roomKey!==state.lastRoomKey){
      state.lastRoomKey=roomKey;
      state.roomPulse=.34;
      const p=G.player;
      if(p) addLocalFx('room',p.x,p.y,'#eee0cf');
    }

    if(state.lastDepth===null && depth!=null){
      state.lastDepth=depth;
      if(G.state==='game' && P6.floorCards){
        state.floorCard=2.15;
        state.floorCardDepth=depth;
        state.floorCardName=safe(()=>G.floor.data.name,'KELLER');
      }
    }else if(depth!=null && depth!==state.lastDepth){
      state.lastDepth=depth;
      state.floorCard=2.15;
      state.floorCardDepth=depth;
      state.floorCardName=safe(()=>G.floor.data.name,'KELLER');
    }

    const dead=!!safe(()=>G.player.dead,false);
    if(state.lastPlayerDead && !dead){
      state.reviveFlash=.75;
    }
    state.lastPlayerDead=dead;
  }

  // ------------------------------------------------------------------
  // Ereignis-Hooks: Original-Gameplay läuft unverändert weiter.
  // ------------------------------------------------------------------

  wrap('hurtPlayer',old=>function(...args){
    const before=totalHalfHearts();
    const result=old.apply(this,args);
    const after=totalHalfHearts();

    if(result===true || after<before){
      state.hitFlash=.28;
    }
    return result;
  });

  wrap('damageEnemy',old=>function(e,d,winkel,...rest){
    const before=Number(e?.hp);
    const result=old.call(this,e,d,winkel,...rest);
    const after=Number(e?.hp);
    if(e && Number.isFinite(before) && Number.isFinite(after) && after<before){
      addLocalFx('impact',e.x,e.y-(e.z||0),
                 e.isBoss?'rgba(255,210,190,.75)':'rgba(245,230,215,.62)');
    }
    return result;
  });

  wrap('acquireItem',old=>function(...args){
    const result=old.apply(this,args);
    state.itemFlash=.55;
    return result;
  });

  wrap('enterRoom',old=>function(...args){
    state.roomDir=args[1]??null;
    const result=old.apply(this,args);
    state.roomPulse=.34;
    return result;
  });

  // playerDie kann durch Wiederbelebungsitems zurückkehren, ohne wirklich zu
  // sterben. Deshalb wird der Zustand nach dem Original geprüft.
  wrap('playerDie',old=>function(...args){
    const wasDead=!!safe(()=>G.player.dead,false);
    const result=old.apply(this,args);
    const isDead=!!safe(()=>G.player.dead,false);
    if(!wasDead && !isDead) state.reviveFlash=.75;
    return result;
  });

  // ------------------------------------------------------------------
  // Finaler Render-Wrapper: alle Phase-6-Overlays kommen nach den bisherigen
  // Grafikphasen und können deshalb nichts aus deren Logik überschreiben.
  // ------------------------------------------------------------------
  wrap('render',old=>function(...args){
    const now=performance.now();
    measurePerformance(now);
    const dt=clamp6((now-(state._lastUpdate||now))/1000,0,.10);
    state._lastUpdate=now;
    updateLocal(dt);

    const result=old.apply(this,args);

    if(!P6.enabled) return result;

    // Nach allen vorhandenen Renderern wieder auf Basis-Koordinaten wechseln.
    if(typeof window.grundTransform==='function') grundTransform();

    detectWorldChanges();

    // Weltbezogene Effekte zuerst, globale Körnung/Vignette zuletzt.
    if(window.G){
      roomRevealOverlay();
      transitionOverlay();
      motionAccents();
      itemOverlay();
      reviveOverlay();
      hitOverlay();
      lowHealthOverlay();
      deathAndWinOverlay();
      drawLocalFx();
      floorCardOverlay();
    }

    subtleGlobalOverlay();
    debugOverlay();

    return result;
  });

  console.info(
    '[KELLERBRUT] Grafik-Overhaul Phase 6 aktiv — Final Polish + adaptive Performance'
  );
})();
</script>

<script>

   KELLERBRUT — PHASE 7

   Einbau hier: als siebter Block inline hinter Phase 6. Der Pack liefert die
   Datei als phase7.js zum Nachladen aus; KELLERBRUT ist aber bewusst eine
   einzige HTML-Datei ohne Build-Schritt, deshalb steht der Code inline. Bis
   auf diese Kommentarzeilen ist er unveraendert uebernommen.

   Phase 7 ist der erste große Gameplay-Erweiterungspass nach dem
   Grafik-Overhaul. Er benutzt ausschließlich bereits vorhandene KELLERBRUT-

   Enthalten:
   - 12 echte Item-Synergien

   ===================================================================== */
(() => {
  'use strict';

  if (window.__KB_PHASE7_GAMEPLAY__) return;
  window.__KB_PHASE7_GAMEPLAY__ = true;

  const P7 = window.KBPhase7 = {
    enabled: true,

    hudBadge: true,
    version: '7.0',
    activeSynergies: [],
    activeTransformations: [],
    synergyCatalog: [],
    transformationCatalog: []
  };

  const TAU7 = Math.PI * 2;
  const clamp7 = (v,a,b) => Math.max(a,Math.min(b,v));
  const sat7 = v => clamp7(v,0,1);
  const now7 = () => performance.now()/1000;

  const state = {
    player: null,
    synergies: new Set(),
    transformations: new Set(),
    notices: [],
    scanCd: 0,
    swarmCd: 1.6,
    heartWardRoom: null,

  };

  function game(){
    return window.KB?.G || window.G || null;
  }

  function itemsDb(){
    return window.KB?.ITEMS || window.ITEMS || {};
  }

  function currentPlayer(){
    return game()?.player || null;
  }

  function flagsOf(p=currentPlayer()){
    return p?.flags || new Set();
  }

  function hasFlag(flag,p=currentPlayer()){
    return !!p?.flags?.has?.(flag);
  }

  function hasItem(id,p=currentPlayer()){
    return !!p?.items?.includes?.(id);
  }

  function safe(fn,fallback=null){
    try { return fn(); } catch (_) { return fallback; }
  }

  function wrap(name,factory){
    const old=window[name];
    if(typeof old!=='function'){
      console.warn('[KELLERBRUT Phase 7] Funktion nicht gefunden:',name);
      return false;
    }
    window[name]=factory(old);
    return true;
  }

  function addTextSafe(x,y,str,color){
    if(typeof window.addText==='function') addText(x,y,str,color);
  }

  function fxBurst(x,y,color,n=8){
    if(typeof window.burst==='function') burst(x,y,color,n);
  }

  function fxWave(x,y,r,color){
    if(typeof window.schockwelle==='function') schockwelle(x,y,r,color,.42,2.5);
  }

  function fxFlash(x,y,r,color){
    if(typeof window.blitz==='function') blitz(x,y,r,color,.22);
  }

  function directDamage(e,d){
    if(!e || e.dead || d<=0) return;
    if(typeof window.damageEnemy==='function') damageEnemy(e,d);
  }

  function randomChance(p){
    // Der existierende Effekt-RNG ist nicht zwingend als Window-Property
    // exportiert. Für diese nicht-seedrelevanten Kampfboni reicht Math.random.
    return Math.random()<p;
  }

  /* ---------------------------------------------------------------------
     12 SYNERGIEN
     --------------------------------------------------------------------- */
  const SYNERGIES = [
    {
      id:'siedegift',
      name:'Siedegift',
      desc:'Gift + Feuer: jeder 4. Treffer löst eine giftige Feuerwelle aus.',

    {

      test:p=>hasFlag('burn',p)&&hasFlag('frost',p)
    },
    {
      id:'seuchenfrost',
      name:'Seuchenfrost',
      desc:'Gift + Frost: besiegte Gegner stecken Feinde in der Nähe an.',

      test:p=>hasFlag('poison',p)&&hasFlag('frost',p)
    },
    {
      id:'sechsfach',

      desc:'Drei- + Vierklang: zwei zusätzliche schwächere Außenschüsse.',
